"All of the above"],"key":2,"official":true,"keySrc":"official","topic":"communication","concept":"common-info","diff":"H","exp":"Official key: distributed partial overlap. In this case some information is held by several members and some by one, so the group tends to discuss the commonly known information and the unique pieces never surface - the problem to avoid. In the fully shared case everyone already has everything; in the non-overlapping case each member must contribute unique information. (This item was marked incorrect on your portal attempt - study it.)","tip":"Partial overlap -> shared info dominates.","type":"mcq","flag":"You answered this incorrectly on the portal; official key retained."},{"id":"W8G-10","week":8,"kind":"G","n":10,"q":"Most eastern cultures are comfortable with silence between conversations.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"communication","concept":"nonverbal","diff":"E","exp":"True. Most eastern cultures are comfortable with silence in conversation, whereas in western cultures it is often read as non-comprehension.","tip":"East = comfortable with silence.","type":"tf","flag":""},{"id":"W9G-1","week":9,"kind":"G","n":1,"q":"The step in team decision making where the problem is defined and a consensus is arrived about what the problem is:","opts":["Discussion","Implementation","Representativeness","Orientation"],"key":3,"official":true,"keySrc":"official","topic":"decision","concept":"group-dm","diff":"E","exp":"Orientation is the first step in team decision making: define the problem, set goals and plan the process. Then discussion, decision making and implementation. Representativeness is a bias, not a step.","tip":"Orientation first: define the problem.","type":"mcq","flag":""},{"id":"W9G-2","week":9,"kind":"G","n":2,"q":"Making the smallest response possible that will reduce the problem to at least a tolerable level is called __________ to decision making.","opts":["Satisficing approach","Rational Approach","Incremental approach","Garbage-can approach"],"key":2,"official":true,"keySrc":"official","topic":"decision","concept":"dm-approaches","diff":"H","exp":"The incremental approach makes the smallest possible response that reduces the problem to a tolerable level. Satisficing seeks a satisfactory (good enough) solution; rational seeks the optimal one; garbage-can is random. (Marked incorrect on your portal attempt.)","tip":"Incremental = smallest tolerable step.","type":"mcq","flag":"You answered this incorrectly on the portal; official key retained."},{"id":"W9G-3","week":9,"kind":"G","n":3,"q":"Having a false sense of satisfaction even when problems start to show up is called:","opts":["Complacency","Procrastination","Defensive avoidance","Panic"],"key":0,"official":true,"keySrc":"official","topic":"decision","concept":"dm-barriers","diff":"E","exp":"Complacency is a false sense of satisfaction even as problems begin to show up. Defensive avoidance includes rationalization, procrastination and buck passing; panic is an emotional overreaction.","tip":"Complacent = ignoring warning signs.","type":"mcq","flag":""},{"id":"W9G-4","week":9,"kind":"G","n":4,"q":"Trying to put the responsibility for decision making on somebody else is called buck passing.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"decision","concept":"dm-barriers","diff":"E","exp":"True. Buck passing is trying to put the responsibility for the decision on somebody else (a form of defensive avoidance).","tip":"Buck passing = pass the decision on.","type":"tf","flag":""},{"id":"W9G-5","week":9,"kind":"G","n":5,"q":"The tendency to be influenced by an initial figure, even when the information is largely irrelevant is called:","opts":["Availability bias","Overconfidence","Anchoring and adjustment bias","Representativeness"],"key":2,"official":true,"keySrc":"official","topic":"decision","concept":"dm-biases","diff":"E","exp":"Anchoring and adjustment: being influenced by an initial figure even when it is largely irrelevant. Availability = ease of recall, representativeness = stereotypes, overconfidence = excess certainty.","tip":"Anchor = first number sticks.","type":"mcq","flag":""},{"id":"W9G-6","week":9,"kind":"G","n":6,"q":"The group’s emphasis on harmony and conformity leading to a wrong decision is called:","opts":["Majority rule","Synergy","Risk taking in groups","Groupthink"],"key":3,"official":true,"keySrc":"official","topic":"decision","concept":"groupthink","diff":"E","exp":"Groupthink is the group's emphasis on harmony and conformity leading to poor decisions. Majority rule is a voting method; synergy is combined effect; risk taking in groups is a different group-decision issue.","tip":"Groupthink = harmony over thinking.","type":"mcq","flag":""},{"id":"W9G-7","week":9,"kind":"G","n":7,"q":"Sunk costs can be recovered.","opts":["True","False"],"key":1,"official":true,"keySrc":"official","topic":"decision","concept":"escalation","diff":"E","exp":"False. Sunk costs are costs that CANNOT be recovered once incurred.","tip":"Sunk = gone forever.","type":"tf","flag":""},{"id":"W9G-8","week":9,"kind":"G","n":8,"q":"Tendency to invest additional resources in an apparently losing proposition, influenced by effort, money and time already invested:","opts":["Abilene Paradox","Delphi method","Escalation of commitment","Groupthink"],"key":2,"official":true,"keySrc":"official","topic":"decision","concept":"escalation","diff":"E","exp":"Escalation of commitment is investing additional resources in an apparently losing proposition because of effort, money and time already invested.","tip":"Escalation = throwing good money after bad.","type":"mcq","flag":""},{"id":"W9G-9","week":9,"kind":"G","n":9,"q":"The tendency to make different decisions depending on how a problem is presented:","opts":["Framing","Prospect theory","Representativeness","Bounded rationality"],"key":0,"official":true,"keySrc":"official","topic":"decision","concept":"dm-biases","diff":"E","exp":"Framing is making different decisions depending on how the problem is presented. Prospect theory says losses hurt more than equivalent gains please.","tip":"Framing = presentation changes choice.","type":"mcq","flag":""},{"id":"W9G-10","week":9,"kind":"G","n":10,"q":"Finding a solution which is satisfactory than optimal is called satisficing approach to decision making.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"decision","concept":"dm-approaches","diff":"E","exp":"True. Satisficing means finding a solution that is satisfactory rather than optimal (a non-rational approach under bounded rationality).","tip":"Satisficing = good enough.","type":"tf","flag":""},{"id":"W10G-1","week":10,"kind":"G","n":1,"q":"_________ is the ability to persuade others to seek defined objectives enthusiastically.","opts":["Coercion","Behavioural change","Leadership","Authority"],"key":2,"official":true,"keySrc":"official","topic":"power","concept":"leadership-def","diff":"E","exp":"Leadership is the ability to persuade others to seek defined objectives enthusiastically; it uses non-coercive influence. Coercion and authority rely on force or position.","tip":"Leadership = enthusiastic persuasion.","type":"mcq","flag":""},{"id":"W10G-2","week":10,"kind":"G","n":2,"q":"The theory which states that the subordinates will be motivated to follow the leader only when they perceive that the leader can help them to fulfil their goals:","opts":["Path-goal theory","Fiedler’s model","Hersey and Blanchard’s situational leadership theory","Trait theory"],"key":0,"official":true,"keySrc":"official","topic":"power","concept":"path-goal","diff":"E","exp":"Path-goal theory: subordinates are motivated by a leader only to the extent they perceive the leader as helping them attain their goals. Fiedler = task structure, leader-member relations, position power; Hersey-Blanchard = telling, selling, participating, delegating.","tip":"Path-goal = leader helps me reach my goals.","type":"mcq","flag":""},{"id":"W10G-3","week":10,"kind":"G","n":3,"q":"The source of power which is based on the capacity to administer punishment to others:","opts":["Legitimate","Reward","Coercive","Expert"],"key":2,"official":true,"keySrc":"official","topic":"power","concept":"power-sources","diff":"E","exp":"Coercive power is based on the capacity to administer punishment. Reward power - capacity to give rewards; legitimate - formal position; expert - skills.","tip":"Coercive = punish.","type":"mcq","flag":""},{"id":"W10G-4","week":10,"kind":"G","n":4,"q":"Expert power is when you have certain abilities which nobody else has or is very rare.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"power","concept":"power-sources","diff":"E","exp":"True. Expert power rests on skills and abilities that are scarce or valued.","tip":"Expert = rare skills.","type":"tf","flag":""},{"id":"W10G-5","week":10,"kind":"G","n":5,"q":"Information or skills one possesses, which cannot be recorded or measured is called:","opts":["Empowerment","Referent power","Gossiping","Tacit knowledge"],"key":3,"official":true,"keySrc":"official","topic":"power","concept":"tacit-knowledge","diff":"M","exp":"Tacit knowledge is the information or skill one possesses that cannot be easily recorded or measured (know-how). Referent power is based on being liked/admired; empowerment is sharing power.","tip":"Tacit = cannot be written down.","type":"mcq","flag":""},{"id":"W10G-6","week":10,"kind":"G","n":6,"q":"The form of political behaviour exhibited when employees try to form a group based on common language they speak is:","opts":["Impression management","Building coalitions","Blaming","Manipulating information flow"],"key":1,"official":true,"keySrc":"official","topic":"power","concept":"politics","diff":"E","exp":"Forming a group around a common language is building coalitions - one of the forms of political behaviour (others: manipulating information, impression management, blaming, reciprocity).","tip":"Coalition = join forces.","type":"mcq","flag":""},{"id":"W10G-7","week":10,"kind":"G","n":7,"q":"While managers rely on control, leaders _________.","opts":["Ask how and when","Focus on systems and structure","Accept status quo","Inspire trust"],"key":3,"official":true,"keySrc":"official","topic":"power","concept":"leader-vs-manager","diff":"E","exp":"Managers rely on control; leaders inspire trust. The other options (ask how and when, systems and structure, accept status quo) describe managers.","tip":"Managers control; leaders inspire.","type":"mcq","flag":""},{"id":"W10G-8","week":10,"kind":"G","n":8,"q":"The leadership style where the responsibilities are shared by all and can be very useful in businesses where creative ideas are very important:","opts":["Autocratic","Laissez-Faire","Charismatic","Paternalistic"],"key":1,"official":true,"keySrc":"official","topic":"power","concept":"leadership-styles","diff":"E","exp":"Laissez-faire ('let it be'): leadership responsibilities shared by all; very useful where creative ideas matter but can cause coordination problems.","tip":"Laissez-faire = let it be.","type":"mcq","flag":""},{"id":"W10G-9","week":10,"kind":"G","n":9,"q":"Democratic leadership style encourages decision making from different perspectives.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"power","concept":"leadership-styles","diff":"E","exp":"True. Democratic leadership encourages decision making from different perspectives (consultative, persuasive); it improves involvement but can delay decisions.","tip":"Democratic = many perspectives.","type":"tf","flag":""},{"id":"W10G-10","week":10,"kind":"G","n":10,"q":"The ideal case in Blake Mouton Managerial Grid of Leadership style is:","opts":["Country club","Impoverished","Produce or perish","Team Leader"],"key":3,"official":true,"keySrc":"official","topic":"power","concept":"grid","diff":"E","exp":"In the Blake-Mouton Managerial Grid the ideal is Team Leader (9,9) - high concern for both production and people. Country club (1,9), impoverished (1,1), produce-or-perish/authority (9,1).","tip":"Team leader = 9,9.","type":"mcq","flag":""},{"id":"W11G-1","week":11,"kind":"G","n":1,"q":"A type of thought exhibited by group members who try to minimize conflict and reach consensus without critically testing, analyzing and evaluating ideas.","opts":["Groupthink","Instrumentality","Mundane task","Team cohesion"],"key":0,"official":true,"keySrc":"official","topic":"groups","concept":"groupthink","diff":"E","exp":"Groupthink is group members minimizing conflict and reaching consensus without critically testing, analysing and evaluating ideas.","tip":"Groupthink = no critical testing.","type":"mcq","flag":""},{"id":"W11G-2","week":11,"kind":"G","n":2,"q":"Airline attendant teams are an example of:","opts":["Production teams","Service teams","Advisory teams","Management teams"],"key":1,"official":true,"keySrc":"official","topic":"groups","concept":"team-types","diff":"E","exp":"Airline attendant teams are service teams (also maintenance groups, customer service/sales teams). Production groups make goods; management and advisory teams do management/advice work.","tip":"Cabin crew = service team.","type":"mcq","flag":""},{"id":"W11G-3","week":11,"kind":"G","n":3,"q":"Groups are more cohesive than teams and groups are a subset of teams.","opts":["True","False"],"key":1,"official":true,"keySrc":"official","topic":"groups","concept":"group-vs-team","diff":"E","exp":"False. Teams are structured groups with more accountability, synergy and specific roles - a team is a special type of group, so groups are not more cohesive subsets of teams.","tip":"Team = special kind of group.","type":"tf","flag":""},{"id":"W11G-4","week":11,"kind":"G","n":4,"q":"Which of the following is the source of organizational culture?","opts":["Selection practices","Actions of top management","Socialization methods","Founder’s vision/mission/attitudes"],"key":3,"official":true,"keySrc":"official","topic":"culture","concept":"culture-source","diff":"E","exp":"Source of organizational culture: the founders' vision, mission and attitudes. Selection, top management actions and socialization methods KEEP the culture alive (sustaining), they are not the original source.","tip":"Founder creates; practices sustain.","type":"mcq","flag":""},{"id":"W11G-5","week":11,"kind":"G","n":5,"q":"The stage of group development at which unwritten rules for teams are established:","opts":["Norming","Storming","Forming","Adjourning"],"key":0,"official":true,"keySrc":"official","topic":"groups","concept":"tuckman","diff":"E","exp":"Norming is when structure emerges: rules and social relationships (unwritten norms) are established. Storming = conflict, forming = orientation, adjourning = dissolution.","tip":"Norming = norms.","type":"mcq","flag":""},{"id":"W11G-6","week":11,"kind":"G","n":6,"q":"Taking advantage of other members in a group and claiming ownership for their work is called:","opts":["Altruism","Groupthink","Freeriding","Synergy"],"key":2,"official":true,"keySrc":"official","topic":"groups","concept":"free-riding","diff":"E","exp":"Free riding is taking advantage of other members' work and claiming ownership. Social loafing is reduced effort; synergy is combined output.","tip":"Free rider = lets others work, takes credit.","type":"mcq","flag":""},{"id":"W11G-7","week":11,"kind":"G","n":7,"q":"Sometimes in teams, people may think that if they work more, other people will take advantage of them and give all the responsibilities to them. So it is better to decrease their performance. This phenomenon is called:","opts":["De-individualization","Social loafing","Freeriding","Sucker aversion"],"key":3,"official":true,"keySrc":"official","topic":"groups","concept":"free-riding","diff":"M","exp":"Sucker aversion is reducing one's own effort to avoid being exploited ('the sucker') by others. Deindividuation is losing identity in the group; social loafing is the general effort reduction; free riding is exploiting others.","tip":"Sucker aversion = avoid being a sucker.","type":"mcq","flag":""},{"id":"W11G-8","week":11,"kind":"G","n":8,"q":"Low trust among the team members can often lead to social loafing.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"groups","concept":"social-loafing","diff":"E","exp":"True. Low trust among members is a condition for social loafing (others: large team size, low perceived instrumentality, mundane tasks, eager beaver).","tip":"Low trust -> loafing.","type":"tf","flag":""},{"id":"W11G-9","week":11,"kind":"G","n":9,"q":"Culture influences both the conscious and unconscious level of the mind.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"culture","concept":"culture-def","diff":"E","exp":"True. Culture influences both the conscious and unconscious levels of the mind; cultural norms strongly influence behaviour and values.","tip":"Culture works consciously and unconsciously.","type":"tf","flag":""},{"id":"W11G-10","week":11,"kind":"G","n":10,"q":"An organization in which its culture is driven by the motive for affiliation:","opts":["Bureaucracy","Industrial Organization","Clubs","Educational Institutions"],"key":2,"official":true,"keySrc":"official","topic":"culture","concept":"culture-types","diff":"M","exp":"Official key: Clubs - the culture driven by the affiliation motive (belonging, networking). This question draws on organization-type classification from the lecture (not detailed on the slides).","tip":"Clubs = affiliation.","type":"mcq","flag":""},{"id":"W12N-1","week":12,"kind":"N","n":1,"q":"An important feature of life-cycle perspective is that it sees organization as an organism","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"structure","concept":"life-cycle","diff":"E","exp":"True. The life-cycle perspective views organizations as organisms that are born, grow, mature and decline (key unofficial, same as graded item).","tip":"Org life cycle = organism.","type":"tf","flag":""},{"id":"W12G-1","week":12,"kind":"G","n":1,"q":"A set of interrelated and interdependent parts arranged in a manner that produces a unified whole is called:","opts":["System","Training","Rituals","Span of control"],"key":0,"official":true,"keySrc":"official","topic":"structure","concept":"systems","diff":"E","exp":"A system is a set of interrelated and interdependent parts arranged to produce a unified whole (societies, automobiles, plants, human bodies).","tip":"System = interdependent parts -> whole.","type":"mcq","flag":""},{"id":"W12G-2","week":12,"kind":"G","n":2,"q":"Revolutionary change happens slowly in an organization and on its own.","opts":["True","False"],"key":1,"official":true,"keySrc":"official","topic":"change","concept":"change-types","diff":"E","exp":"False. Revolutionary change is sudden and drastic; evolutionary change is slow and gradual.","tip":"Revolution = fast; evolution = slow.","type":"tf","flag":""},{"id":"W12G-3","week":12,"kind":"G","n":3,"q":"The formal system of task and authority relationships that control how people coordinate their actions and use resources to achieve organizational goals is called:","opts":["Organizational structure","Organizational change","Cognitive biases","Resource allocation"],"key":0,"official":true,"keySrc":"official","topic":"structure","concept":"structure-def","diff":"E","exp":"Organizational structure is the formal system of task and authority relationships controlling how people coordinate actions and use resources to achieve goals.","tip":"Structure = tasks + authority + coordination.","type":"mcq","flag":""},{"id":"W12G-4","week":12,"kind":"G","n":4,"q":"Indian Railways having different zones of operation like Southern Railways, Central Railway etc. is an example of:","opts":["Horizontal differentiation","Vertical differentiation","Spatial differentiation","None of the above"],"key":2,"official":true,"keySrc":"official","topic":"structure","concept":"complexity","diff":"E","exp":"Zones spread geographically illustrate spatial differentiation (geographical dispersion of offices, plants, personnel). Horizontal differentiation is between units by tasks/orientation; vertical is depth of hierarchy.","tip":"Spatial = geography.","type":"mcq","flag":""},{"id":"W12G-5","week":12,"kind":"G","n":5,"q":"Defining employees’ roles through formal documentation is a part of formalization.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"structure","concept":"formalization","diff":"E","exp":"True. Formalization is the degree to which jobs are standardized, through written policies, rules, procedures and job descriptions that define roles.","tip":"Formalization = documents + rules.","type":"tf","flag":""},{"id":"W12G-6","week":12,"kind":"G","n":6,"q":"___________ can provide more inputs into decision making and will help in reducing information overload.","opts":["Centralization","Decentralization","Environmental uncertainty","None of the above"],"key":1,"official":true,"keySrc":"official","topic":"structure","concept":"centralization","diff":"E","exp":"Decentralization provides more input into decisions, counters information overload, speeds response, motivates employees and trains lower-level managers.","tip":"Decentralization = less overload.","type":"mcq","flag":""},{"id":"W12G-7","week":12,"kind":"G","n":7,"q":"According to life-cycle perspective, the stage of organizational life cycle where the goals are ambiguous but there is a lot of creativity is called:","opts":["Formalization-and-control stage","Collectivity stage","Elaboration-of-structure stage","Entrepreneurial stage"],"key":3,"official":true,"keySrc":"official","topic":"structure","concept":"life-cycle","diff":"E","exp":"The entrepreneurial stage: formation, ambiguous goals, high creativity, need for steady resources. Collectivity = clarified mission and informal structure; formalization-and-control = rules; elaboration = diversification.","tip":"Entrepreneurial = creative but ambiguous.","type":"mcq","flag":""},{"id":"W12G-8","week":12,"kind":"G","n":8,"q":"The life-cycle perspective sees the organization as an organism.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"structure","concept":"life-cycle","diff":"E","exp":"True. The life-cycle perspective sees the organization as an organism passing through stages.","tip":"Life cycle = organism.","type":"tf","flag":""},{"id":"W12G-9","week":12,"kind":"G","n":9,"q":"Redesigning business processes to increase organizational effectiveness is called:","opts":["Restructuring","Reengineering","Organizational Ethics","Downsizing"],"key":1,"official":true,"keySrc":"official","topic":"change","concept":"change-types","diff":"E","exp":"Reengineering is redesigning business processes to increase organizational effectiveness (e.g. TQM). Restructuring changes the structure (e.g. downsizing).","tip":"Reengineering = redesign processes.","type":"mcq","flag":""},{"id":"W12G-10","week":12,"kind":"G","n":10,"q":"Closed systems differentiate too much from the larger system and have their own identity.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"structure","concept":"systems","diff":"M","exp":"True. Closed systems isolate themselves from the larger system with their own identity (too much differentiation, too little integration); open systems interact with their environment.","tip":"Closed = isolated; open = interacts.","type":"tf","flag":""}],"qs":[{"id":"n28ff4163","sec":1,"type":"mcq","topic":"intro","concept":"ob-def","diff":"E","cat":"B","beyond":false,"q":"Which statement best describes Organizational Behaviour (OB)?","exp":"OB is the systematic, multidisciplinary study of human behaviour at work (individual, interpersonal, group and organizational levels). Legal, financial and rule-based descriptions cover only slices of an organization.","tip":"OB = people + work + systematic study.","opts":["The study of financial performance of firms","The systematic study of human behaviour in organizational settings","The study of only the formal rules of an organization","The study of how organizations are legally registered and governed"],"ans":[1]},{"id":"need4e38b","sec":1,"type":"mcq","topic":"intro","concept":"ob-assumptions","diff":"M","cat":"B","beyond":false,"q":"Which of the following is NOT one of the basic assumptions of OB listed in the course?","exp":"The basic assumptions acknowledge a DISPARITY between organizational and individual goals; goals are not assumed to be perfectly aligned.","tip":"Assumption 3 = disparity of goals.","opts":["Organizational and individual goals are always perfectly aligned","Motivated people work effectively","The impact of policies and procedures on people is not always predictable","Organizations consist of people"],"ans":[0]},{"id":"n5c2ccf1f","sec":1,"type":"mcq","topic":"intro","concept":"ob-levels","diff":"M","cat":"A","beyond":false,"q":"Team dynamics, conflict, leadership, power and politics are studied at which level of OB?","exp":"Group processes cover team dynamics, conflict, leadership, power and politics. Individual processes include perception, personality, attitudes and motivation; organizational processes include change management, culture and climate.","tip":"Individual -> Group -> Organization.","opts":["Organizational processes","Individual processes","Group processes","Societal processes"],"ans":[2]},{"id":"n2a21f516","sec":1,"type":"mcq","topic":"intro","concept":"sci-mgmt","diff":"M","cat":"A","beyond":false,"q":"Which is NOT one of Taylor's four principles of scientific management?","exp":"Taylor wanted the scientifically developed 'one best way' to be followed; workers cooperate with management in using the proper method, not choose freely.","tip":"Taylor = one best way, scientifically.","opts":["Divide work and responsibility among management and workers","Select and train workers using scientifically developed methods","Scientifically study each part of the job to find the best method","Give workers complete freedom to choose their own work methods"],"ans":[3]},{"id":"n0e433eaf","sec":1,"type":"mcq","topic":"intro","concept":"hawthorne","diff":"M","cat":"A","beyond":false,"q":"The Hawthorne studies are conducted in which chronological order?","exp":"Hawthorne: illumination (1924-27), relay assembly (1927-32), bank wiring observation room (1931-32).","tip":"Light - Relay - Bank.","opts":["Illumination studies, relay assembly test room, bank wiring observation room","Bank wiring room, relay assembly room, illumination studies","Illumination studies, bank wiring observation room, relay assembly test room","Relay assembly test room, illumination studies, bank wiring observation room"],"ans":[0]},{"id":"nd2783466","sec":1,"type":"mcq","topic":"intro","concept":"hist-industrial-psych","diff":"M","cat":"A","beyond":false,"q":"Which researcher wrote 'Psychology and Industrial Efficiency' and studied industrial accidents?","exp":"Munsterberg (1863-1916) researched industrial accidents and wrote the book. Scott applied psychology to advertising/selling; Strong worked on vocational guidance (Strong-Campbell interest inventory); Taylor founded scientific management.","tip":"Munsterberg = accidents + efficiency book.","opts":["Edward K. Strong Jr.","Frederick W. Taylor","Hugo Munsterberg","Walter Dill Scott"],"ans":[2]},{"id":"n7937efc9","sec":1,"type":"mcq","topic":"perception","concept":"perceptual-selection","diff":"E","cat":"A","beyond":false,"q":"Which of the following is an EXTERNAL factor of perceptual selection?","exp":"External factors: intensity, size, contrast, repetition, motion, novelty/familiarity. Habit, learning, motivation/interest and organizational role are internal.","tip":"External = properties of the stimulus.","opts":["Habit","Novelty and familiarity","Learning","Motivation and interest"],"ans":[1]},{"id":"nbbd3b1e5","sec":1,"type":"mcq","topic":"perception","concept":"perceptual-organization","diff":"M","cat":"A","beyond":false,"q":"Seeing an incomplete circle as a complete circle illustrates which perceptual organization principle?","exp":"Closure is filling in gaps to perceive a complete figure. Proximity groups nearby items; figure-ground separates object from background; constancy keeps objects stable despite changing views.","tip":"Closure = close the gap.","opts":["Perceptual constancy","Grouping by proximity","Figure-ground","Closure"],"ans":[3]},{"id":"ncb36a119","sec":1,"type":"mcq","topic":"perception","concept":"attribution-kelley","diff":"M","cat":"A","beyond":false,"q":"In Kelley's attribution theory, 'how consistently the person exhibits the behaviour in similar contexts over time' is called:","exp":"Consistency is about the person repeating the behaviour in similar contexts. Consensus compares with other people; distinctiveness compares across different situations.","tip":"Consistency = same context, over time.","opts":["Consistency","Distinctiveness","Identity","Consensus"],"ans":[0]},{"id":"nfd563fe2","sec":1,"type":"mcq","topic":"perception","concept":"attribution-kelley","diff":"H","cat":"A","beyond":false,"q":"Kelley's theory predicts a PERSONAL (internal) attribution when the behaviour shows:","exp":"Personal attribution = low consensus + low distinctiveness + high consistency (only this person, in every situation, repeatedly). High-high-high gives stimulus attribution and high consensus/low distinctiveness/low consistency gives circumstance attribution.","tip":"Personal = Lonely behaviour (L-L-H).","opts":["High consensus, high distinctiveness, high consistency","High consensus, low distinctiveness, low consistency","Low consensus, low distinctiveness, high consistency","High consensus, high distinctiveness, low consistency"],"ans":[2]},{"id":"n869a8c39","sec":1,"type":"mcq","topic":"perception","concept":"halo-effect","diff":"M","cat":"B","beyond":false,"q":"A manager rates an employee highly on every dimension because the employee is exceptionally punctual. This is the:","exp":"The halo effect is a single overall impression (here punctuality) influencing specific judgments. FAE concerns causes of behaviour; similar-to-me concerns similarity; Golem is low expectations producing poor performance.","tip":"Halo = one trait lights up everything.","opts":["Golem effect","Fundamental attribution error","Similar-to-me effect","Halo effect"],"ans":[3]},{"id":"nfb9810a1","sec":1,"type":"mcq","topic":"perception","concept":"self-fulfilling","diff":"M","cat":"B","beyond":false,"q":"When high expectations from a manager lead an employee to perform better, the phenomenon is called the:","exp":"Pygmalion = positive self-fulfilling prophecy. Golem = low expectations lead to poor performance. Hawthorne effect is about behaviour changing due to being observed.","tip":"Pygmalion = positive; Golem = negative.","opts":["Hawthorne effect","Pygmalion effect","Halo effect","Golem effect"],"ans":[1]},{"id":"ndf199c81","sec":1,"type":"mcq","topic":"learning","concept":"classical","diff":"M","cat":"A","beyond":false,"q":"In classical conditioning, the learned response to the previously neutral stimulus is the:","exp":"After pairing, the neutral stimulus becomes the conditioned stimulus, and the response it produces is the conditioned response. The unconditioned pair (US, UR) occurs naturally.","tip":"CS -> CR (learned); US -> UR (natural).","opts":["Conditioned stimulus","Conditioned response","Unconditioned stimulus","Unconditioned response"],"ans":[1]},{"id":"ne2672b0c","sec":1,"type":"mcq","topic":"learning","concept":"operant","diff":"M","cat":"B","beyond":false,"q":"The 'law of effect' that behaviours followed by desirable consequences are strengthened is associated with:","exp":"Thorndike's law of effect underlies operant conditioning. Pavlov = classical conditioning; Bandura = social/observational learning; Rogers = self theory.","tip":"Thorndike = Law of Effect.","opts":["Pavlov","Bandura","Thorndike","Rogers"],"ans":[2]},{"id":"nb7aed888","sec":1,"type":"mcq","topic":"learning","concept":"reinforcement","diff":"M","cat":"A","beyond":false,"q":"An employee starts coming on time to avoid his supervisor's reprimand. This is an example of:","exp":"Behaviour (punctuality) is strengthened by avoiding an undesirable consequence = negative reinforcement. Punishment would be the reprimand applied after lateness to weaken it.","tip":"Avoid bad -> negative reinforcement.","opts":["Negative reinforcement","Punishment","Extinction","Positive reinforcement"],"ans":[0]},{"id":"n59113184","sec":1,"type":"mcq","topic":"learning","concept":"schedules","diff":"M","cat":"B","beyond":false,"q":"Which of the following is a PARTIAL reinforcement schedule?","exp":"Partial schedules: fixed interval, variable interval, fixed ratio, variable ratio. Continuous reinforcement rewards every desired behaviour.","tip":"Partial = Fixed/Variable x Interval/Ratio.","opts":["Continuous reinforcement","Extinction schedule","Law of effect","Variable ratio schedule"],"ans":[3]},{"id":"n8605e277","sec":1,"type":"mcq","topic":"learning","concept":"cognitive-learning","diff":"M","cat":"A","beyond":false,"q":"Learning that is not apparent at the time but shows up later when motivation and circumstances arise is called:","exp":"Latent learning is hidden learning that manifests later. Observational learning is learning from others; extinction is fading of unreinforced responses.","tip":"Latent = hidden until needed.","opts":["Operant learning","Latent learning","Observational learning","Extinction"],"ans":[1]},{"id":"n5f8f7731","sec":1,"type":"mcq","topic":"learning","concept":"observational","diff":"M","cat":"A","beyond":false,"q":"Which is NOT a step in observational learning?","exp":"Steps: attention, retention, behavioural reproduction, motivation. Punishment of the model is not a step.","tip":"A-R-R-M.","opts":["Paying attention","Good retention","Punishment of the model","Behavioural reproduction"],"ans":[2]},{"id":"n01cc8c80","sec":1,"type":"mcq","topic":"personality","concept":"personality-def","diff":"E","cat":"A","beyond":false,"q":"Who is considered the pioneer of personality theory and research (1937)?","exp":"The course names Gordon Allport (1937) as the pioneer in personality theory and research.","tip":"Allport = pioneer.","opts":["Albert Bandura","Carl Rogers","Sigmund Freud","Gordon Allport"],"ans":[3]},{"id":"nb3c40c3e","sec":1,"type":"mcq","topic":"personality","concept":"freud","diff":"M","cat":"A","beyond":false,"q":"In Freud's psychoanalytic theory, which element follows the pleasure principle?","exp":"The Id seeks immediate gratification (pleasure principle); Ego follows the reality principle; Superego the morality principle.","tip":"Id = I want it now.","opts":["Id","Ego","Conscious mind","Super ego"],"ans":[0]},{"id":"n8f68b47b","sec":1,"type":"mcq","topic":"personality","concept":"johari","diff":"M","cat":"A","beyond":false,"q":"The Johari Window area that is known to oneself but NOT to others is:","exp":"Hidden (façade) = known to self, unknown to others. Blind = unknown to self, known to others; Unknown = unknown to both.","tip":"Hidden = I hide it.","opts":["Blind","Open","Unknown","Hidden"],"ans":[3]},{"id":"ndb7d0536","sec":1,"type":"mcq","topic":"personality","concept":"bigfive","diff":"M","cat":"A","beyond":false,"q":"Which of these is NOT one of the five traits listed in the course's trait-theory slide?","exp":"The slide lists adjustment, sociability, conscientiousness, agreeableness and intellectual openness.","tip":"ASCAI: Adjustment, Sociability, Conscientiousness, Agreeableness, Intellectual openness.","opts":["Conscientiousness","Sociability","Hostility","Adjustment"],"ans":[2]},{"id":"nab1beb6b","sec":1,"type":"mcq","topic":"personality","concept":"mach","diff":"M","cat":"A","beyond":false,"q":"Which characteristic is associated with a high Machiavellian personality?","exp":"Machs are low in trust, closed-minded, power-centred and willing to manipulate others.","tip":"Mach = manipulates.","opts":["High trust in others and a strong belief in fairness","Willingness to manipulate others for own purpose","Unconditional acceptance of every colleague's views","Open-mindedness and flexibility in views"],"ans":[1]},{"id":"n32333aaa","sec":1,"type":"mcq","topic":"personality","concept":"locus","diff":"E","cat":"A","beyond":false,"q":"A person who believes that his career outcomes depend on his own efforts has a(n):","exp":"Believing one controls one's outcomes = internal locus of control.","tip":"Internal = I control.","opts":["Internal locus of control","Low self-esteem","External locus of control","Authoritarian personality"],"ans":[0]},{"id":"n55943d8b","sec":1,"type":"mcq","topic":"personality","concept":"abilities","diff":"M","cat":"B","beyond":false,"q":"An ability that has been learned through training or experience is called a(n):","exp":"Skill is a learned ability. Aptitude is acquired or natural ability for learning in a specific area (measurable by aptitude tests).","tip":"Skill = trained ability.","opts":["Trait","Aptitude","Skill","Instinct"],"ans":[2]},{"id":"nf3f5b9ce","sec":1,"type":"mcq","topic":"attitudes","concept":"attitude-components","diff":"M","cat":"B","beyond":false,"q":"Which component of attitude refers to emotions or feelings toward an object?","exp":"Attitude components: cognitive (beliefs), affective (feelings), behavioural (intentions).","tip":"ABC: Affective = feelings.","opts":["Evaluative","Affective","Cognitive","Behavioural"],"ans":[1]},{"id":"n7d3ddef3","sec":1,"type":"mcq","topic":"attitudes","concept":"values-vs-attitudes","diff":"M","cat":"A","beyond":false,"q":"Compared with attitudes, values are:","exp":"Values are fewer, transcend objects and situations, are relatively permanent and central to the person.","tip":"Values = few and deep.","opts":["Specific to objects and situations","Primarily cognitive opinions","More numerous and easily changed","Fewer in number and relatively permanent"],"ans":[3]},{"id":"nb5109606","sec":1,"type":"mcq","topic":"attitudes","concept":"attitude-measure","diff":"M","cat":"A","beyond":false,"q":"Which of the following is a scale used for attitude measurement in the course?","exp":"Thurstone, Likert, Bogardus social distance and Guttman scales are attitude scales.","tip":"Likert = agree/disagree scale.","opts":["Likert scale","Johari scale","Tuckman scale","Kelley scale"],"ans":[0]},{"id":"nc26c08cd","sec":1,"type":"mcq","topic":"attitudes","concept":"commitment","diff":"M","cat":"B","beyond":false,"q":"Which of the following is NOT part of the definition of organizational commitment given in the course?","exp":"Commitment = belief/acceptance of goals + willingness to exert effort + desire to stay.","tip":"Believe - Work hard - Stay.","opts":["Desire to remain within the organization","Preference for a higher salary elsewhere","Belief in and acceptance of the organization's goals","Willingness to exert considerable effort for the organization"],"ans":[1]},{"id":"n9a53ea43","sec":1,"type":"mcq","topic":"attitudes","concept":"prejudice","diff":"M","cat":"B","beyond":false,"q":"Prejudice is best described as:","exp":"Prejudice = prejudgment; when acted upon it becomes discrimination.","tip":"Pre-judge.","opts":["A skill acquired through training","A type of motivation","A well-researched conclusion","A prejudgment about a person or group"],"ans":[3]},{"id":"nbf90a79a","sec":1,"type":"mcq","topic":"emotions","concept":"emotion-basics","diff":"M","cat":"A","beyond":false,"q":"Which of these is a SELF-CONSCIOUS emotion?","exp":"Self-conscious emotions: shame, guilt, embarrassment, pride. Social emotions: pity, envy, jealousy.","tip":"Self-conscious = inside (shame, guilt).","opts":["Guilt","Pity","Envy","Jealousy"],"ans":[0]},{"id":"n07f9c1c3","sec":1,"type":"mcq","topic":"emotions","concept":"emotional-labor","diff":"M","cat":"A","beyond":false,"q":"The inconsistency between felt emotions and expressed emotions is called:","exp":"Emotional dissonance = felt vs expressed mismatch; emotional labour is the effort of holding back true emotions.","tip":"Dissonance = mismatch.","opts":["Emotional attachment","Mood congruence","Emotional dissonance","Emotional labour"],"ans":[2]},{"id":"n569bc2ac","sec":1,"type":"mcq","topic":"emotions","concept":"stress","diff":"M","cat":"A","beyond":false,"q":"The three stages of the General Adaptation Syndrome are, in order:","exp":"GAS: alarm reaction (adrenaline, increased heart rate) -> stage of resistance -> stage of exhaustion (collapse).","tip":"A-R-E.","opts":["Exhaustion, resistance, alarm","Alarm reaction, exhaustion, resistance","Resistance, alarm, exhaustion","Alarm reaction, resistance, exhaustion"],"ans":[3]},{"id":"n55927501","sec":1,"type":"mcq","topic":"emotions","concept":"stressors","diff":"M","cat":"B","beyond":false,"q":"Which of the following is a PERSONAL stressor according to the course?","exp":"Types: organizational stressors (job/organization related), life stressors (life changes, daily stressors, life trauma) and personal stressors (ageing).","tip":"Personal stressor = ageing.","opts":["Daily hassles","Life trauma","Ageing","Job and organizational factors"],"ans":[2]},{"id":"n1217bbb3","sec":1,"type":"mcq","topic":"emotions","concept":"stress-symptoms","diff":"M","cat":"A","beyond":false,"q":"Which of the following is a PSYCHOSOMATIC symptom of stress?","exp":"Psychosomatic: sleep disturbance, high blood pressure, stress diabetes, back ache, bowel irritation, sexual dysfunction. Absenteeism, conflict and isolation are behavioural.","tip":"Body symptoms = psychosomatic.","opts":["High blood pressure","Isolation","Absenteeism","Interpersonal conflict"],"ans":[0]},{"id":"n669dbc48","sec":1,"type":"mcq","topic":"emotions","concept":"stress-management","diff":"E","cat":"B","beyond":false,"q":"Which is a strategy for managing stress mentioned in the course?","exp":"Stress management: self awareness, mindfulness, lifestyle changes, exercise and meditation.","tip":"Aware-Mindful-Lifestyle-Exercise.","opts":["Suppressing emotions completely","Mindfulness","Working longer hours","Avoiding all feedback"],"ans":[1]},{"id":"nae7f1471","sec":1,"type":"mcq","topic":"motivation","concept":"maslow","diff":"M","cat":"A","beyond":false,"q":"In Maslow's hierarchy, which need lies immediately above safety needs?","exp":"Order: physiological -> safety -> social -> esteem -> self-actualization.","tip":"P-S-S-E-S.","opts":["Physiological","Social (belongingness)","Esteem","Self-actualization"],"ans":[1]},{"id":"n67682056","sec":1,"type":"mcq","topic":"motivation","concept":"herzberg","diff":"M","cat":"A","beyond":false,"q":"Which of the following is a MOTIVATOR (not a hygiene factor) in Herzberg's two-factor theory?","exp":"Motivators: interesting job, recognition, advancement, responsibility, growth, achievement. Hygiene: policies, working conditions, security, pay, personal life, status, relations.","tip":"Motivators come from the work itself.","opts":["Company policies and administration","Good working conditions and equipment","Job security and a stable salary","Recognition and appreciation for the work"],"ans":[3]},{"id":"nec2219ab","sec":1,"type":"mcq","topic":"motivation","concept":"expectancy","diff":"M","cat":"B","beyond":false,"q":"The three components of Vroom's expectancy theory are:","exp":"Vroom = expectancy (effort->performance), instrumentality (performance->reward), valence (value of reward). The other options are ERG, justice types and job characteristics.","tip":"E-I-V.","opts":["Distributive, procedural, interactional","Existence, relatedness, growth","Expectancy, instrumentality, valence","Autonomy, feedback, task identity"],"ans":[2]},{"id":"n8a483f17","sec":1,"type":"mcq","topic":"motivation","concept":"justice","diff":"M","cat":"B","beyond":false,"q":"Perceived fairness in the procedures used to decide outcomes is called:","exp":"Distributive = fairness of outcomes; procedural = fairness of process; interactional = fairness in treatment during implementation.","tip":"Procedural = process.","opts":["Procedural justice","Relational justice","Interactional justice","Distributive justice"],"ans":[0]},{"id":"n06ba23cf","sec":1,"type":"mcq","topic":"motivation","concept":"motives","diff":"M","cat":"A","beyond":false,"q":"A person who prefers moderate risks, wants immediate feedback and is preoccupied with the task is high in:","exp":"Achievement motive: moderate risk taking, need for immediate feedback, satisfaction, preoccupation with the task.","tip":"Achievement = moderate risk + feedback.","opts":["Security motive","Affiliation motive","Power motive","Achievement motive"],"ans":[3]},{"id":"nad441c4b","sec":1,"type":"mcq","topic":"motivation","concept":"money","diff":"M","cat":"A","beyond":false,"q":"Which statement about money as a motivator is consistent with the course?","exp":"The course notes money is not always the first choice, can restrict extra-role performance, and that nature of work matters; profit sharing and performance bonuses can help.","tip":"Money narrows effort to the paid role.","opts":["Money motivates equally in all jobs","Money can restrict extra-role performance","Money is always the first choice of employees","Money has no effect on motivation"],"ans":[1]},{"id":"n10fa8e99","sec":1,"type":"mcq","topic":"motivation","concept":"jcm","diff":"M","cat":"B","beyond":false,"q":"Which theory proposes that the job itself can be the motivator through its design?","exp":"The course summary stresses 'Job as the motivator' and 'role of job enrichment' - the job characteristics model.","tip":"JCM = design the job to motivate.","opts":["Job characteristics model","Equity theory","Maslow's hierarchy","Path-goal theory"],"ans":[0]},{"id":"n5f2afbde","sec":1,"type":"mcq","topic":"interpersonal","concept":"ocb","diff":"M","cat":"A","beyond":false,"q":"Organizational citizenship behaviour (OCB) is best described as:","exp":"OCB = discretionary prosocial behaviour beyond formal duties; dimensions: altruism, conscientiousness, civic virtue, sportsmanship, courtesy.","tip":"OCB = extra mile.","opts":["Behaviour following the psychological contract's economic terms","Deviant behaviour at work","Going beyond the formal job description, acting as a social lubricant","Behaviour required by the job description"],"ans":[2]},{"id":"n220fe755","sec":1,"type":"mcq","topic":"interpersonal","concept":"psych-contract","diff":"M","cat":"A","beyond":false,"q":"A psychological contract is:","exp":"Psychological contract = perceptions and expectations about mutual obligations; it is unwritten.","tip":"Psychological = unwritten.","opts":["A written employment contract signed at joining","A legal agreement between organizations","A trade union agreement on pay and hours","Unwritten expectations and obligations in a relationship"],"ans":[3]},{"id":"n1cdb8ccb","sec":1,"type":"mcq","topic":"interpersonal","concept":"conflict-styles","diff":"M","cat":"A","beyond":false,"q":"Which is NOT one of the five basic conflict handling styles?","exp":"The five: competing, accommodating, collaborating, compromising, avoiding.","tip":"Five styles; retaliating is not one.","opts":["Competing","Retaliating","Avoiding","Compromising"],"ans":[1]},{"id":"nf3579cbf","sec":1,"type":"mcq","topic":"interpersonal","concept":"conflict-levels","diff":"M","cat":"B","beyond":false,"q":"Conflict between two departments is classified as:","exp":"Levels: intrapersonal, interpersonal, intra-group, inter-group.","tip":"Between groups = inter-group.","opts":["Intra-group conflict","Interpersonal conflict","Inter-group conflict","Intrapersonal conflict"],"ans":[2]},{"id":"ne6dff88c","sec":1,"type":"mcq","topic":"interpersonal","concept":"trust","diff":"M","cat":"A","beyond":false,"q":"Which type of trust arises from shared background and traits?","exp":"Similarity-based trust comes from perceived likeness; familiarity-based from repeated interaction; incentive-based from contracts/bonuses.","tip":"Similarity = alike.","opts":["Trust based on similarity","Incentive-based trust","Trust based on familiarity","Swift trust"],"ans":[0]},{"id":"nd628f2bd","sec":1,"type":"mcq","topic":"communication","concept":"comm-process","diff":"E","cat":"A","beyond":false,"q":"The medium through which a message travels is the:","exp":"Channel = medium. Encoding converts the message to symbols, decoding translates it, noise disrupts it.","tip":"Channel = path.","opts":["Decoder","Channel","Noise","Encoder"],"ans":[1]},{"id":"nadb104b8","sec":1,"type":"mcq","topic":"communication","concept":"comm-styles","diff":"M","cat":"A","beyond":false,"q":"A communicator who is direct and task-oriented has which style?","exp":"Driver = direct, task-oriented; animated = enthusiastic, relationship-oriented; amiable = supportive; analytical = accurate, detail-oriented.","tip":"Driver drives the task.","opts":["Driver","Analytical","Animated","Amiable"],"ans":[0]},{"id":"nf53e0d2f","sec":1,"type":"mcq","topic":"communication","concept":"nonverbal","diff":"M","cat":"A","beyond":false,"q":"Winking and shrugging are studied under:","exp":"Kinesics = body movements. Proxemics = spatial relationships. Paralinguistics = vocal cues (tone, pauses).","tip":"Kinesics = Kinetic = movement.","opts":["Hidden profile","Paralinguistics","Proxemics","Kinesics"],"ans":[3]},{"id":"n98f2dc2e","sec":1,"type":"mcq","topic":"communication","concept":"hidden-profile","diff":"M","cat":"A","beyond":false,"q":"In the hidden profile paradigm, groups typically:","exp":"Groups rarely find the hidden profile; shared information is discussed more and exchanged earlier.","tip":"Shared dominates.","opts":["Quickly discover the hidden profile","Discuss more unshared than shared information","Discuss more shared than unshared information","Avoid all information sharing"],"ans":[2]},{"id":"n7f558236","sec":1,"type":"mcq","topic":"communication","concept":"meetings","diff":"E","cat":"A","beyond":false,"q":"Which of the following helps manage team meetings effectively?","exp":"Course tips: attendance as a team value, punctuality, recording/distributing information, building next agenda.","tip":"Minutes + agenda.","opts":["Treating attendance as optional for most members","Keeping no agenda to save preparation time","Recording and distributing meeting information","Discouraging punctuality to keep things relaxed"],"ans":[2]},{"id":"ne9ae4dc4","sec":1,"type":"mcq","topic":"decision","concept":"dm-approaches","diff":"M","cat":"A","beyond":false,"q":"Making decisions by gathering all possible information and analysing it to find the optimal choice is the:","exp":"Rational approach = optimal decision with full analysis. Others are non-rational approaches (satisficing, incremental, garbage can).","tip":"Rational = optimal.","opts":["Garbage-can approach","Incremental approach","Satisficing approach","Rational approach"],"ans":[3]},{"id":"n31dc6f44","sec":1,"type":"mcq","topic":"decision","concept":"dm-barriers","diff":"M","cat":"A","beyond":false,"q":"Which of these is a form of DEFENSIVE AVOIDANCE?","exp":"Defensive avoidance includes rationalization, procrastination and buck passing.","tip":"Defensive avoidance = R-P-B.","opts":["Procrastination","Complacency","Not accepting the problem","Panic"],"ans":[0]},{"id":"n329b4361","sec":1,"type":"mcq","topic":"decision","concept":"dm-biases","diff":"M","cat":"A","beyond":false,"q":"Judging the likelihood of an event by how easily similar instances can be recalled is the:","exp":"Availability = ease of recall. Representativeness = stereotype-driven judgment; anchoring = initial figure.","tip":"Available in memory.","opts":["Overconfidence bias","Availability bias","Anchoring bias","Representativeness bias"],"ans":[1]},{"id":"ndf2a8d1b","sec":1,"type":"mcq","topic":"decision","concept":"group-dm","diff":"M","cat":"A","beyond":true,"q":"Which group decision technique collects anonymous expert opinions through successive questionnaire rounds?","exp":"The Delphi method gathers anonymous opinions over rounds. (The course lists NGT, Delphi and Ringi; Delphi detail is standard OB knowledge.)","tip":"Delphi = oracle experts.","opts":["Nominal group technique","Delphi method","Majority rule","Ringi technique"],"ans":[1]},{"id":"na2b2a37f","sec":1,"type":"mcq","topic":"decision","concept":"polarization","diff":"M","cat":"B","beyond":false,"q":"The tendency of a group to make more extreme judgments than the average of individuals' views is:","exp":"Group polarization = more extreme group judgment. Groupthink = harmony over critical thinking; Abilene = agreeing to something nobody wants.","tip":"Polarize = extremes.","opts":["Satisficing","Groupthink","Group polarization","Abilene paradox"],"ans":[2]},{"id":"n70574c68","sec":1,"type":"mcq","topic":"power","concept":"power-sources","diff":"M","cat":"A","beyond":false,"q":"A manager's power derived from her formal position is:","exp":"Legitimate power = formal position. Referent = being liked and admired; expert = skills; reward = ability to give rewards.","tip":"Legit = title.","opts":["Legitimate","Reward","Referent","Expert"],"ans":[0]},{"id":"n40e78377","sec":1,"type":"mcq","topic":"power","concept":"power-sources","diff":"M","cat":"A","beyond":false,"q":"Referent power is based on:","exp":"Referent power = liking/admiration.","tip":"Referent = respect and admiration.","opts":["The ability to administer punishment","Formal authority attached to a position","Rare skills and abilities that others lack","The degree to which one is liked and admired"],"ans":[3]},{"id":"nb81831f3","sec":1,"type":"mcq","topic":"power","concept":"politics","diff":"M","cat":"A","beyond":false,"q":"Organizational politics is best defined as:","exp":"Politics = unauthorized use of power to enhance or protect self-interest.","tip":"Politics = self-interest.","opts":["Unauthorized use of power to enhance or protect self-interest","Formal decision making through proper channels","A leadership style based on trust","Authorized use of power for organizational goals"],"ans":[0]},{"id":"n1362ed98","sec":1,"type":"mcq","topic":"power","concept":"leader-vs-manager","diff":"M","cat":"A","beyond":false,"q":"Which statement describes a LEADER (rather than a manager)?","exp":"Leaders do the right things, challenge the status quo, focus on people and ask what and why.","tip":"Manager = right way; Leader = right thing.","opts":["Accepts the status quo","Does things right","Relies on control","Does the right things"],"ans":[3]},{"id":"nc774e42d","sec":1,"type":"mcq","topic":"power","concept":"leadership-styles","diff":"M","cat":"A","beyond":false,"q":"A leader who makes the decision himself and then tries to persuade others that it is correct is using which sub-style?","exp":"Within democratic leadership: consultative = consult before deciding; persuasive = leader decides then persuades.","tip":"Persuasive = decide, then sell.","opts":["Laissez-faire","Servant","Persuasive democratic","Consultative democratic"],"ans":[2]},{"id":"n25201057","sec":1,"type":"mcq","topic":"power","concept":"contingency","diff":"M","cat":"B","beyond":false,"q":"Which of these are the four styles of Hersey and Blanchard's situational leadership?","exp":"Situational leadership: telling, selling, participating, delegating.","tip":"T-S-P-D.","opts":["Task, relations, position, power","Telling, selling, participating, delegating","Country club, impoverished, authority, team","Autocratic, democratic, laissez-faire, paternalistic"],"ans":[1]},{"id":"n4533f587","sec":1,"type":"mcq","topic":"power","concept":"fiedler","diff":"M","cat":"B","beyond":false,"q":"Which are the three situational variables in Fiedler's model?","exp":"Fiedler's situational favourableness depends on task structure, leader-member relations and positional power.","tip":"TLP.","opts":["Task, people, structure","Consensus, consistency, distinctiveness","Expectancy, instrumentality, valence","Task structure, leader-member relations, positional power"],"ans":[3]},{"id":"nf3627157","sec":1,"type":"mcq","topic":"culture","concept":"culture-def","diff":"M","cat":"A","beyond":false,"q":"Hofstede (1991) defined organizational culture as:","exp":"The course quotes Hofstede's definition.","tip":"Culture = collective programming of the mind.","opts":["A set of written rules and policies that employees must follow","The total number of employees working at all locations","The collective programming of the mind distinguishing one organization's members from another's","The physical layout and decor of its offices"],"ans":[2]},{"id":"n0e6cbaba","sec":1,"type":"mcq","topic":"culture","concept":"culture-dimensions","diff":"M","cat":"B","beyond":false,"q":"Which is NOT one of Hofstede's cultural dimensions listed in the course?","exp":"Hofstede dimensions: power distance, uncertainty avoidance, individualism-collectivism, masculinity-femininity, long-term orientation. Outcome orientation is an organizational culture dimension.","tip":"National dims vs organizational dims.","opts":["Power distance","Outcome orientation","Individualism-Collectivism","Uncertainty avoidance"],"ans":[1]},{"id":"nf8afe693","sec":1,"type":"mcq","topic":"culture","concept":"culture-expression","diff":"M","cat":"B","beyond":false,"q":"Staff meetings, appraisal forms and picnics are examples of:","exp":"Routines, rites and rituals include meetings, training programmes, appraisal forms and annual visits.","tip":"Routine = repeated events.","opts":["Routines, rites and rituals","Stories and myths","Physical artifacts","Basic assumptions"],"ans":[0]},{"id":"nfaad39ba","sec":1,"type":"mcq","topic":"culture","concept":"strong-culture","diff":"M","cat":"B","beyond":false,"q":"A strong culture is one in which key values are:","exp":"Strong cultures = key values intensely held and widely shared.","tip":"Strong = deep + wide.","opts":["Held only by top management","Different in every department","Written but rarely followed","Intensely held and widely shared"],"ans":[3]},{"id":"neb1da311","sec":1,"type":"mcq","topic":"culture","concept":"culture-sustain","diff":"M","cat":"B","beyond":false,"q":"Which is a way of keeping a culture alive?","exp":"Culture is sustained through selection (fit), top management actions and socialization methods.","tip":"Select - Signal - Socialize.","opts":["Selection practices","Ignoring top management signals","Frequent random hiring","Eliminating socialization"],"ans":[0]},{"id":"na2b982eb","sec":1,"type":"mcq","topic":"groups","concept":"group-def","diff":"M","cat":"B","beyond":false,"q":"Which statement distinguishes a team from a general group?","exp":"Teams are a special type of group with interdependence, accountability, synergy, assigned roles and limited size.","tip":"Team = interdependence + accountability.","opts":["Teams never exceed two people in any organization","Teams have no assigned roles and no common goal","Teams work interdependently with more accountability and synergy","Teams have no common goal but share an office"],"ans":[2]},{"id":"naef888e9","sec":1,"type":"mcq","topic":"groups","concept":"tuckman","diff":"M","cat":"A","beyond":false,"q":"In Tuckman and Jensen's model, the stage characterized by conflict over roles and procedures is:","exp":"Storming = conflict; forming = orientation; norming = structure; performing = work; adjourning = dissolution.","tip":"Storm = fight.","opts":["Forming","Storming","Performing","Norming"],"ans":[1]},{"id":"n23e82409","sec":1,"type":"mcq","topic":"groups","concept":"team-types","diff":"M","cat":"A","beyond":false,"q":"A cross-functional team formed for a specific assignment is typically a:","exp":"Project teams are usually cross-functional.","tip":"Project = cross-functional.","opts":["Project team","Production group","Service group","Advisory team"],"ans":[0]},{"id":"n5e9416c2","sec":1,"type":"mcq","topic":"groups","concept":"social-loafing","diff":"M","cat":"A","beyond":false,"q":"Which is a recommended way to tackle social loafing?","exp":"Increase identifiability, involvement, rewards, cohesion, personal responsibility, team contracts, feedback, right size.","tip":"Make contribution visible.","opts":["Remove individual goals and report only team output","Assign only mundane tasks to keep things simple","Increase identifiability, for example through weekly reporting","Increase team size so that the work is spread out"],"ans":[2]},{"id":"nfe11da3a","sec":1,"type":"mcq","topic":"groups","concept":"groupthink","diff":"M","cat":"A","beyond":false,"q":"Which of the following is a characteristic of groupthink?","exp":"Characteristics: illusions of invulnerability, collective rationalization, unquestioned belief, stereotypical views, direct pressure, self-censorship, shared illusion of unanimity.","tip":"Groupthink = invulnerable + unanimous.","opts":["Free flow of critical ideas","Devil's advocate","Use of outside experts","Illusions of invulnerability"],"ans":[3]},{"id":"n8dceac9b","sec":1,"type":"mcq","topic":"structure","concept":"complexity","diff":"M","cat":"A","beyond":false,"q":"The number of levels in the authority hierarchy is the focus of which kind of differentiation?","exp":"Vertical differentiation = depth of hierarchy; horizontal = between units by task; spatial = geographic dispersion.","tip":"Vertical = height.","opts":["Cultural","Vertical","Horizontal","Spatial"],"ans":[1]},{"id":"nf7a17c55","sec":1,"type":"mcq","topic":"structure","concept":"coordination","diff":"M","cat":"B","beyond":false,"q":"Which is a method of HORIZONTAL coordination?","exp":"Horizontal: common resources, information systems, lateral relations (direct contact, liaison, task forces, integrators). The others are vertical methods.","tip":"Horizontal = across departments.","opts":["Centralization of power","Delegation","Liaison roles","Formalization"],"ans":[2]},{"id":"na2cfe673","sec":1,"type":"mcq","topic":"structure","concept":"centralization","diff":"M","cat":"A","beyond":false,"q":"Which factor affects centralization?","exp":"Factors: size, geographical dispersion, technological complexity, environmental uncertainty.","tip":"SGTE.","opts":["Colour of the logo","Environmental uncertainty","Brand name","Number of holidays"],"ans":[1]},{"id":"nbdd78ca9","sec":1,"type":"mcq","topic":"structure","concept":"life-cycle","diff":"M","cat":"A","beyond":false,"q":"Which life-cycle stage involves product diversification and more complex, decentralized structure?","exp":"Elaboration of structure: diversification, growth opportunities, complex structure and decentralization.","tip":"Elaboration = expand.","opts":["Collectivity","Entrepreneurial","Formalization-and-control","Elaboration-of-structure"],"ans":[3]},{"id":"n8408180c","sec":1,"type":"mcq","topic":"change","concept":"change-def","diff":"E","cat":"B","beyond":false,"q":"Organizational change is defined as:","exp":"Both statements appear in the course's definition of organizational change.","tip":"Change = alter status quo.","opts":["Any alteration of the status quo","The process by which organizations move from present state to desired future state to increase effectiveness","Both of the above","None of the above"],"ans":[2]},{"id":"nceac3cd6","sec":1,"type":"mcq","topic":"change","concept":"lewin","diff":"M","cat":"B","beyond":false,"q":"The three steps in the change process are:","exp":"Lewin's change process: unfreezing -> moving -> refreezing.","tip":"U-M-R.","opts":["Unfreezing, moving, refreezing","Alarm, resistance, exhaustion","Forming, storming, norming","Planning, doing, checking"],"ans":[0]},{"id":"n2ad9f367","sec":1,"type":"mcq","topic":"change","concept":"force-field","diff":"M","cat":"B","beyond":false,"q":"Force-field analysis examines:","exp":"Force-field analysis analyses driving (for change) and restraining (against change) forces.","tip":"Driving vs restraining.","opts":["Driving and restraining forces","Only employee attitudes","Leadership traits","Only the costs of change"],"ans":[0]},{"id":"n6d3929cd","sec":1,"type":"mcq","topic":"change","concept":"resistance","diff":"M","cat":"B","beyond":false,"q":"Cognitive biases, uncertainty, selective perception and habit belong to which level of resistance to change?","exp":"Individual-level resistance: cognitive biases, uncertainty and insecurity, selective perception, habit.","tip":"Individual = habits and biases.","opts":["Functional","Group","Organizational","Individual"],"ans":[3]},{"id":"nf5c2d08e","sec":1,"type":"mcq","topic":"intro","concept":"emerging-concerns","diff":"E","cat":"B","beyond":false,"q":"Which is an emerging concern for OB mentioned in the course?","exp":"Emerging concerns: technological changes, globalization, cultural diversity and teamwork, ethical management/CSR.","tip":"TGCE.","opts":["Reduction of research","Elimination of all technology","Globalization and cultural diversity","Return to scientific management"],"ans":[2]},{"id":"n35e28ccd","sec":1,"type":"mcq","topic":"learning","concept":"punishment","diff":"M","cat":"B","beyond":false,"q":"The 'red-hot-stove' approach to punishment advises that it be:","exp":"Hot stove: warn, prompt, consistent, impersonal.","tip":"Hot stove = no surprise, no delay, no favourites.","opts":["Delayed and tailored to each person's feelings","Warned, prompt, consistent and impersonal","Random in timing and severe in size","Public, loud and emotional"],"ans":[1]},{"id":"n64de130f","sec":1,"type":"mcq","topic":"attitudes","concept":"attitude-formation","diff":"M","cat":"B","beyond":false,"q":"Which is NOT a source of attitude formation in the course?","exp":"Sources: personal experiences, association, family, peer group/society, models, institutional factors.","tip":"Attitudes learned, not inherited.","opts":["Peer group and society","Personal experience","Family","Genetic code"],"ans":[3]},{"id":"n5a9fb7ad","sec":1,"type":"mcq","topic":"emotions","concept":"aggression","diff":"M","cat":"A","beyond":false,"q":"A response to pain or irritation is which pattern of aggression?","exp":"Irritable aggression = response to pain/irritation.","tip":"Irritable = irritation.","opts":["Irritable","Threat-based","Frustration-based","Instrumental"],"ans":[0]},{"id":"ne953be29","sec":1,"type":"mcq","topic":"motivation","concept":"conflict-goal","diff":"M","cat":"B","beyond":false,"q":"Choosing between two undesirable options is a(n):","exp":"Avoidance-avoidance = both options unattractive.","tip":"Two bads.","opts":["Role conflict","Avoidance-avoidance conflict","Approach-avoidance conflict","Approach-approach conflict"],"ans":[1]},{"id":"n4e3c366f","sec":1,"type":"mcq","topic":"interpersonal","concept":"cooperation-competition","diff":"M","cat":"A","beyond":false,"q":"A situation in which both competition and cooperation prevail is called a:","exp":"Mixed-motive situations combine competition and cooperation.","tip":"Mixed motives = both.","opts":["Deviant situation","Free-rider situation","Mixed-motive situation","Zero-sum situation"],"ans":[2]},{"id":"nbbaa755b","sec":1,"type":"mcq","topic":"power","concept":"empowerment","diff":"M","cat":"B","beyond":false,"q":"The course describes empowerment as treating power as:","exp":"Empowerment: power as a cooperative concept with benefits.","tip":"Empowerment = shared power.","opts":["An individual possession only","A source of coercion","A fixed quantity","A cooperative concept"],"ans":[3]},{"id":"nbac8297d","sec":2,"type":"mcq","topic":"perception","concept":"attribution-kelley","diff":"H","cat":"A","beyond":false,"q":"Ravi was late to the meeting. Colleagues note that nobody else was late today (low consensus), Ravi is late for most other meetings too (low distinctiveness) and he has been late every week this year (high consistency). The manager will most likely attribute the lateness to:","exp":"Low consensus + low distinctiveness + high consistency = personal (internal) attribution. Stimulus attribution needs high distinctiveness and consensus; circumstance attribution needs low consistency.","tip":"Alone, everywhere, always = personal.","opts":["The nature of the meeting (stimulus)","Ravi's own disposition (personal)","Random chance","The traffic situation (circumstance)"],"ans":[1]},{"id":"nc0e98167","sec":2,"type":"mcq","topic":"perception","concept":"fae","diff":"H","cat":"A","beyond":false,"q":"A sales manager blames a colleague's missed target on 'laziness' without checking the supply disruption that affected the whole region. When his own target is missed he cites the supply issue. The bias in judging the colleague is best described as:","exp":"FAE: overweighting internal causes (laziness) and underweighting external causes (supply disruption) when judging OTHERS. (The self-serving contrast is a related bias, but the one named in the course for the colleague is FAE.)","tip":"FAE = other people's behaviour -> personality.","opts":["Halo effect","Selective perception","Fundamental attribution error","Team halo effect"],"ans":[2]},{"id":"n6bc63693","sec":2,"type":"mcq","topic":"perception","concept":"halo-effect","diff":"H","cat":"B","beyond":false,"q":"Which scenario is the clearest example of the TEAM halo effect rather than the individual halo effect?","exp":"Team halo = crediting teams for success but not holding them accountable for failures. The handshake case = halo; same alma mater = similar-to-me; the last = Golem effect.","tip":"Team halo: share the glory, avoid the blame.","opts":["A company credits the project team for a success but does not hold it accountable for a failure","A supervisor expects a new employee to fail, treats him coldly, and the employee eventually does","A manager gives a better appraisal to a subordinate who shares her alma mater and hobbies","An interviewer rates a candidate high on every trait because of one impressive first answer"],"ans":[0]},{"id":"na4d9b86c","sec":2,"type":"mcq","topic":"perception","concept":"self-fulfilling","diff":"H","cat":"B","beyond":false,"q":"A principal tells teachers that a randomly chosen group of pupils are 'late bloomers'. Teachers give them more attention and the pupils indeed improve. Which statement is MOST accurate?","exp":"Expectations changed behaviour, which changed performance - Pygmalion effect. Because the pupils were random, ability does not explain the improvement.","tip":"Expectations -> behaviour -> outcome.","opts":["The pupils' improvement proves that they had higher innate ability than other pupils all along","The Hawthorne effect, because the pupils knew they were studied, is the only explanation","The Golem effect has operated, because the teachers expected poor performance from this group","A Pygmalion (self-fulfilling prophecy) effect operating through teacher expectations"],"ans":[3]},{"id":"nd0a0a93e","sec":2,"type":"mcq","topic":"perception","concept":"glass-ceiling","diff":"M","cat":"A","beyond":false,"q":"A bank has 55% women at junior level but only 4% on its board. Interviews show that decision makers see 'leadership' as a masculine trait. Which pair of concepts BEST explains the pattern?","exp":"Gender stereotypes about leadership operate during selection/appraisal, producing the glass-ceiling effect (invisible barrier to the top).","tip":"Stereotype -> invisible barrier.","opts":["Closure and perceptual constancy","Stereotyping and the glass-ceiling effect","Halo effect and Pygmalion effect","Consensus and distinctiveness"],"ans":[1]},{"id":"n8c2f4073","sec":2,"type":"mcq","topic":"perception","concept":"perceptual-selection","diff":"H","cat":"A","beyond":false,"q":"A newly hired accountant notices every typo in documents, while a new designer in the same office notices layout flaws first. Which factor of perceptual selection MOST directly explains the difference?","exp":"Internal factor: organizational role and specialization shapes what people select. Intensity, repetition and motion are external properties of the stimulus, which are the same for both.","tip":"Role decides what you notice.","opts":["Organizational role and specialization","Motion","Intensity of stimulus","Repetition"],"ans":[0]},{"id":"n395b4c4f","sec":2,"type":"mcq","topic":"perception","concept":"perceptual-organization","diff":"H","cat":"A","beyond":false,"q":"Which statement is INCORRECT?","exp":"Figure-ground can reverse (e.g. vase/faces illusions); what is figure and what is ground depends on the perceiver. The other statements are correct.","tip":"Figure and ground can flip.","opts":["Perceptual constancy lets us see a closing door as still rectangular","Proximity groups nearby items together","Figure-ground perception means that we always see the same object as the figure","Closure lets us read a partially hidden word"],"ans":[2]},{"id":"nf5043ca1","sec":2,"type":"mcq","topic":"perception","concept":"stereotype","diff":"H","cat":"A","beyond":false,"q":"An HR manager rejects a 52-year-old candidate because 'older people cannot learn new software', ignoring the candidate's recent certifications. This is best described as:","exp":"A group-level belief (older people) is applied to an individual and contradicting information (certifications) is ignored: stereotyping with selective perception.","tip":"Stereotype blinds you to disconfirming info.","opts":["Self-fulfilling prophecy","Stereotyping combined with selective perception","Halo effect","Similar-to-me effect"],"ans":[1]},{"id":"na1372325","sec":2,"type":"mcq","topic":"learning","concept":"reinforcement","diff":"H","cat":"A","beyond":false,"q":"A manager stops criticizing an employee once the employee submits reports on time; the employee therefore continues to submit on time. This is:","exp":"Removing an aversive stimulus (criticism) after the desired behaviour strengthens it = negative reinforcement. Punishment would apply criticism to reduce a behaviour.","tip":"Remove the bad thing -> behaviour increases.","opts":["Punishment","Extinction","Positive reinforcement","Negative reinforcement"],"ans":[3]},{"id":"neaeda033","sec":2,"type":"mcq","topic":"learning","concept":"reinforcement","diff":"H","cat":"A","beyond":false,"q":"Which scenario is an example of PUNISHMENT (as defined in the course)?","exp":"Punishment = presenting an aversive consequence in response to an unwanted behaviour (loss of pay). Helmet to avoid fine = negative reinforcement; praise = positive reinforcement; ignoring = extinction.","tip":"Punishment follows the unwanted act.","opts":["A manager ignores a joke told in a meeting until the employee stops","A worker wears a helmet to avoid a fine","A worker is docked a day's pay for leaving a machine unattended","A supervisor praises a worker for safe behaviour"],"ans":[2]},{"id":"nfc175849","sec":2,"type":"mcq","topic":"learning","concept":"schedules","diff":"H","cat":"B","beyond":false,"q":"Which reinforcement schedule is operating when a sales rep receives a bonus after every fifth sale?","exp":"A reward after a fixed NUMBER of responses = fixed ratio. Fixed interval depends on elapsed time; variable ratio varies the count; continuous rewards every response.","tip":"Ratio = count; Interval = time.","opts":["Fixed ratio","Continuous","Fixed interval","Variable ratio"],"ans":[0]},{"id":"n7785ac8d","sec":2,"type":"mcq","topic":"learning","concept":"schedules","diff":"H","cat":"B","beyond":true,"q":"Which reinforcement schedule typically generates the highest and most persistent response rates, as in slot machines?","exp":"Variable ratio is unpredictable, producing high steady responding and resistance to extinction (standard OB/psychology knowledge).","tip":"Slot machine = variable ratio.","opts":["Fixed ratio","Variable ratio","Continuous","Fixed interval"],"ans":[1]},{"id":"nc8a97a2b","sec":2,"type":"mcq","topic":"learning","concept":"operant","diff":"H","cat":"B","beyond":false,"q":"Why is punishment described in the course as 'a lose-lose approach'?","exp":"The slides warn punishment is most used, least understood, badly administered, can increase negative behaviour by drawing attention and produces negative emotions.","tip":"Punishment hurts both.","opts":["It rests on threat and fear and can cause anxiety, aggression and resentment","It reliably increases performance and builds loyalty among employees","It is cheap to administer and is therefore the preferred tool of good managers","It is the only method that changes behaviour without any side effects"],"ans":[0]},{"id":"nc1d087b2","sec":2,"type":"mcq","topic":"learning","concept":"observational","diff":"H","cat":"A","beyond":false,"q":"A junior engineer carefully watches how a mentor handles an angry client but does not try it for months. When she finally has a similar client, she reproduces the mentor's approach perfectly. Which concept(s) BEST explain this?","exp":"She learned by observing (modelling); the learning stayed hidden until suitable motivation and circumstances arose = latent learning.","tip":"Learned now, shown later.","opts":["Classical conditioning","Negative reinforcement only","Operant extinction","Observational learning with latent learning"],"ans":[3]},{"id":"n9d3a8f11","sec":2,"type":"mcq","topic":"learning","concept":"cognitive-learning","diff":"H","cat":"A","beyond":false,"q":"Which statement correctly contrasts behaviouristic and cognitive learning theories?","exp":"Behaviouristic (classical, operant) = observable behaviour and consequences; cognitive = internal expectations, cognitive maps, latent learning.","tip":"Behaviourist = outside; Cognitive = inside.","opts":["Behaviourists emphasise internal mental maps; cognitive theorists emphasise stimulus-response links","Behaviourists emphasise stimulus-response links and consequences; cognitive theorists emphasise internal representations such as cognitive maps","Both reject any role of experience and treat behaviour as purely inherited, differing only in method","Cognitive theories deny that learning changes behaviour and argue that only unobservable thoughts matter"],"ans":[1]},{"id":"n2f28fd5a","sec":2,"type":"mcq","topic":"personality","concept":"freud","diff":"H","cat":"A","beyond":false,"q":"An employee knows he should report a colleague's fraud (moral duty) and also wants to keep a peaceful relationship, so he decides to raise it with the manager privately. Which Freudian element is primarily making this practical compromise?","exp":"The Ego mediates between the Id and Superego using reality (practical constraints). The superego provides moral demand; the id impulses.","tip":"Ego = referee.","opts":["Id","Superego","Ego","Unconscious"],"ans":[2]},{"id":"n58fb8ee4","sec":2,"type":"mcq","topic":"personality","concept":"self-theory","diff":"H","cat":"A","beyond":false,"q":"Which approach would a Carl Rogers-inspired manager MOST likely adopt?","exp":"Rogers' self theory: self-concept, free will, self-esteem and unconditional acceptance.","tip":"Rogers = acceptance + self-concept.","opts":["Use rewards and punishments to shape behaviour","Analyse employees' unconscious conflicts","Classify employees into fixed personality types","Offer unconditional acceptance and support employees' self-concept"],"ans":[3]},{"id":"nc762477d","sec":2,"type":"mcq","topic":"personality","concept":"mach","diff":"H","cat":"A","beyond":false,"q":"Which of these combinations best characterizes a high Mach?","exp":"Mach profile in the course: lack of trust, closed minded, power centred and willing to manipulate others for one's own purpose. Moderate risk and need for feedback are features of the achievement motive.","tip":"Mach = manipulate for power.","opts":["Unconditional acceptance and strong morality","High trust, open-minded, cooperative","Lack of trust, closed minded, power-centred and manipulative","Moderate risk-taking and need for feedback"],"ans":[2]},{"id":"nca2c2c9a","sec":
