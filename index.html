<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nptel</title>
<meta property="og:title" content="nptel">
<meta property="og:description" content="NPTEL Organizational Behaviour practice quiz">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1c2433;--mut:#5b6678;--line:#dde3ee;--pri:#2b4fd8;--pri-ink:#fff;--pri-soft:#e8edff;--ok:#157347;--ok-bg:#e3f5ea;--bad:#b42318;--bad-bg:#fdeceb;--warn:#8a5a00;--warn-bg:#fff4d6;--info-bg:#e6f0ff;--focus:#ff9f1a;--shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--card:#181e2a;--ink:#e8ecf4;--mut:#9aa6bb;--line:#2a3345;--pri:#6f8bff;--pri-ink:#0b1020;--pri-soft:#222c4d;--ok:#4cc38a;--ok-bg:#12301f;--bad:#ff8a80;--bad-bg:#3a1a19;--warn:#f2c14e;--warn-bg:#3a2e10;--info-bg:#16284a;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:clamp(17px,.5vw + 12px,24px)}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1{font-size:1.6rem;margin:.2em 0 .5em;line-height:1.25}h2{font-size:1.2rem;margin:.2em 0 .5em}h3{font-size:1rem;margin:1em 0 .4em}h4{margin:.8em 0 .3em;font-size:.9rem;color:var(--mut)}
p{margin:.5em 0}code{background:var(--pri-soft);padding:1px 5px;border-radius:4px}
a{color:var(--pri)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#hdr{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.hwrap{max-width:min(1560px,96vw);margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;color:var(--ink);text-decoration:none;font-size:1.02rem}.brand span{color:var(--pri);font-weight:600}
nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
.navb{background:none;border:0;padding:7px 10px;border-radius:8px;color:var(--mut);cursor:pointer;font:inherit;font-size:.9rem}.navb:hover{background:var(--pri-soft);color:var(--ink)}.navb.on{background:var(--pri-soft);color:var(--pri);font-weight:600}
main{max-width:min(1560px,96vw);margin:0 auto;padding:18px 16px 60px}
.card,.tile,.stage,.qcard,.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);margin:0 0 16px}
.narrow{max-width:760px;margin:20px auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:9px;font:inherit;font-size:.93rem;cursor:pointer;text-decoration:none}
.btn:hover:not(:disabled){border-color:var(--pri)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:600}.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}.btn.danger-soft{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.82rem}.btn.lg{padding:11px 20px;font-size:1rem}.btn.active{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.linkbtn{background:none;border:0;color:var(--pri);cursor:pointer;font:inherit;text-decoration:underline;padding:0 3px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}.row.end{justify-content:flex-end}.wrap{flex-wrap:wrap}.spacer{flex:1}
.small{font-size:.85rem;color:var(--mut)}.foot{margin-top:24px}
.banner{border-radius:10px;padding:10px 14px;margin:10px 0;border:1px solid var(--line);font-size:.95rem}
.banner.info{background:var(--info-bg)}.banner.good{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}.banner.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}.banner.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.hero{margin:6px 0 16px}.hero p{color:var(--mut);max-width:780px}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:6px}
.stage{display:flex;flex-direction:column;gap:6px;position:relative}.stage .btn{margin-top:auto;align-self:flex-start}
.stage.rec{border:2px solid var(--pri)}.badge{position:absolute;top:-11px;left:14px;background:var(--pri);color:var(--pri-ink);font-size:.74rem;font-weight:700;padding:2px 10px;border-radius:99px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile h3{margin:0 0 4px;font-size:.85rem;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}.tile b{display:block;font-size:1.7rem;line-height:1.2}.tile b.b2{margin-top:6px}.tile span{display:block;font-size:.85rem;color:var(--mut)}
.plain{list-style:none;padding:0;margin:0}.plain li{padding:3px 0;font-size:.92rem}
.quick{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--pri)}.bar.ok i{background:var(--ok)}.bar.low i{background:var(--bad)}.bar.thin{height:6px;flex:1}
.tscroll{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:.92rem}.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.tbl th{color:var(--mut);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.76rem;font-weight:600;border:1px solid var(--line);white-space:nowrap}
.st-new{color:var(--mut)}.st-correct{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}.st-incorrect{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}.st-improving{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}.st-mastered{background:var(--pri-soft);color:var(--pri);border-color:var(--pri)}
.rs-good{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}.rs-bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}.rs-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}.rs-none{color:var(--mut)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:6px;margin-left:8px;background:var(--line);color:var(--ink)}.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.warn{background:var(--warn-bg);color:var(--warn)}
.pill{display:inline-block;font-size:.76rem;background:var(--pri-soft);color:var(--pri);padding:2px 10px;border-radius:99px;margin:0 6px 4px 0;font-weight:600}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill-multi{background:var(--warn-bg);color:var(--warn)}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 12px;padding:8px 14px}legend{font-weight:600;font-size:.88rem;padding:0 6px}
.cb{display:inline-flex;align-items:center;gap:6px;margin:3px 14px 3px 0;font-size:.93rem}.cbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.numin{width:84px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink);max-width:100%}
/* player */
.ptop{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.ptitle{font-weight:700;font-size:1.05rem}.psub{font-size:.85rem;color:var(--mut)}.pright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem;background:var(--pri-soft);color:var(--pri);padding:5px 12px;border-radius:9px}.timer.low{background:var(--bad-bg);color:var(--bad)}
.progress{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.qtext{font-size:1.3rem;line-height:1.5;margin:.4em 0 .3em;font-weight:600}.hint{font-size:.85rem;color:var(--mut);margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;font:inherit;color:var(--ink);cursor:pointer}
.opt:hover:not([data-locked]){border-color:var(--pri);background:var(--pri-soft)}.opt[data-locked]{cursor:default}
.opt .ltr{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--mut);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--mut)}.opt.chk .ltr{border-radius:6px}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}.opt.sel .ltr{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.ok .ltr{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.bad{border-color:var(--bad);background:var(--bad-bg)}.opt.bad .ltr{background:var(--bad);color:#fff;border-color:var(--bad)}
.otxt{flex:1}
.match{display:flex;flex-direction:column;gap:10px}.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px}.ml{font-weight:600}
.txt{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}textarea.txt{resize:vertical}
.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.explain{margin-top:16px;border-top:2px dashed var(--line);padding-top:12px;background:linear-gradient(var(--card),var(--card))}.explain .meta{margin-bottom:6px}.memo{background:var(--info-bg);padding:7px 11px;border-radius:8px}.note{font-size:.88rem;color:var(--warn);background:var(--warn-bg);padding:6px 10px;border-radius:8px}.src{font-size:.82rem;color:var(--mut)}
.expect{background:var(--info-bg);padding:8px 12px;border-radius:8px}.why{background:var(--bad-bg);padding:8px 12px;border-radius:8px}
.rubric{margin-top:12px}.rub{list-style:none;padding:0}.rub li{padding:3px 0}
.side h3{margin-top:0}.side .pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px;margin-bottom:6px}
.pb{display:inline-block;min-width:36px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.82rem;cursor:pointer;text-align:center;padding:0}
.pb.ans{background:var(--pri-soft);border-color:var(--pri)}.pb.good{background:var(--ok-bg);border-color:var(--ok)}.pb.badd{background:var(--bad-bg);border-color:var(--bad)}.pb.mk{box-shadow:inset 0 -4px 0 var(--focus)}.pb.cur{outline:3px solid var(--pri);outline-offset:1px}
.legend{font-size:.8rem;color:var(--mut)}.legend .pb{min-width:14px;height:14px;vertical-align:middle;cursor:default;border-radius:4px}
/* results */
.scoreboard{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin:10px 0}.big span{font-size:2.6rem;font-weight:800}.big small{font-size:1.2rem;color:var(--mut)}.big em{display:block;font-style:normal;font-size:1.3rem;color:var(--pri);font-weight:700}
.stats{display:flex;gap:22px;flex-wrap:wrap}.stats div{text-align:center;font-size:.85rem;color:var(--mut)}.stats b{display:block;font-size:1.6rem;color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:.86rem}.tab.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
details.qrow{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--card)}details.qrow>summary{cursor:pointer;padding:9px 12px;display:flex;gap:10px;align-items:center;list-style:none}.qrow .no{font-weight:700;min-width:28px}.qrow .qs{flex:1;font-size:.93rem}.qbody{padding:4px 16px 14px}.qfull{font-weight:600}
details.qrow.st-w{border-left:5px solid var(--bad)}details.qrow.st-c{border-left:5px solid var(--ok)}details.qrow.st-u{border-left:5px solid var(--line)}details.qrow.st-r,details.qrow.st-p{border-left:5px solid var(--warn)}
details.card>summary{cursor:pointer;list-style:none}.inl{display:inline;font-size:1.1rem}dl dt{font-weight:700;margin-top:6px}dl dd{margin:0 0 4px 14px}
.spark{width:100%;max-width:560px;height:110px}.spark .sb{fill:var(--pri)}.spark text{fill:var(--mut)}
.dlg{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:18px 22px;max-width:480px}.dlg::backdrop{background:rgba(10,14,24,.55)}
.danger-zone{border-color:var(--bad)}
.rv{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
@media (max-width:900px){.stages,.grid4,.tiles3{grid-template-columns:1fr}.pgrid{grid-template-columns:1fr}.mrow{grid-template-columns:1fr}nav{margin-left:0}.qtext{font-size:1.08rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.burger{background:none;border:1px solid var(--line);color:var(--ink);font-size:1.4rem;line-height:1;padding:4px 12px;border-radius:9px;cursor:pointer}
.hwrap{padding:6px 16px}
#hdr nav{position:absolute;left:12px;top:100%;margin:4px 0 0;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:230px;box-shadow:0 8px 28px rgba(0,0,0,.35);z-index:20}
#hdr nav .navb{text-align:left;padding:10px 14px}
#hdr{position:sticky}

.qimg{max-width:min(100%,380px);background:#fff;border-radius:8px;display:block;margin:6px 0}figure{margin:8px 0}

</style>
</head>

<script>
const DATA={"topics":[{"id":"intro","title":"Introduction to OB","week":"Week 1"},{"id":"perception","title":"Perception","week":"Week 2"},{"id":"learning","title":"Learning","week":"Week 4"},{"id":"personality","title":"Personality","week":"Week 3"},{"id":"attitudes","title":"Attitudes","week":"Week 4"},{"id":"emotions","title":"Emotions & Stress","week":"Week 5"},{"id":"motivation","title":"Motivation","week":"Week 6"},{"id":"interpersonal","title":"Interpersonal Behaviour","week":"Week 7"},{"id":"communication","title":"Communication","week":"Week 8"},{"id":"decision","title":"Decision Making","week":"Week 9"},{"id":"power","title":"Power & Leadership","week":"Week 10"},{"id":"groups","title":"Group Dynamics & Teams","week":"Week 11"},{"id":"culture","title":"Organizational Culture","week":"Week 11"},{"id":"structure","title":"Organizational Structure","week":"Week 12"},{"id":"change","title":"Organizational Change","week":"Week 12"}],"weeks":[{"id":0,"label":"Week 0","title":"Assignment 0 (orientation quiz)"},{"id":1,"label":"Week 1","title":"Introduction to OB"},{"id":2,"label":"Week 2","title":"Perception"},{"id":3,"label":"Week 3","title":"Personality"},{"id":4,"label":"Week 4","title":"Learning & Attitudes"},{"id":5,"label":"Week 5","title":"Emotions & Stress"},{"id":6,"label":"Week 6","title":"Motivation"},{"id":7,"label":"Week 7","title":"Interpersonal Behaviour"},{"id":8,"label":"Week 8","title":"Communication"},{"id":9,"label":"Week 9","title":"Decision Making"},{"id":10,"label":"Week 10","title":"Power & Leadership"},{"id":11,"label":"Week 11","title":"Group Dynamics & Culture"},{"id":12,"label":"Week 12","title":"Structure & Change"}],"assign":[{"id":"W0-1","week":0,"kind":"P","n":1,"q":"Which field can be called as the mother of Organizational behaviour?","opts":["Anthropology","Economics","Industrial Psychology","Law"],"key":2,"official":false,"keySrc":"duplicate","topic":"intro","concept":"ob-disciplines","diff":"E","exp":"Industrial psychology (applying psychological techniques in industry - Munsterberg, Scott, Strong) is the historical root of OB. Anthropology, economics and law contribute to OB but are not its 'mother' discipline.","tip":"Industrial Psychology = Mother of OB.","type":"mcq","flag":""},{"id":"W0-2","week":0,"kind":"P","n":2,"q":"Which of the following are core aspects of Organizational Behaviour?","opts":["Individual Behavioural Dynamics","Interpersonal and Group Dynamics","Organizational Dynamics","All of the above"],"key":3,"official":false,"keySrc":"slides","topic":"intro","concept":"ob-levels","diff":"E","exp":"OB studies three levels: individual behavioural dynamics (perception, learning, personality, attitudes, motivation), interpersonal and group dynamics, and organizational dynamics (structure, culture, change). All three are core aspects, so 'All of the above'.","tip":"Individual - Group - Organization.","type":"mcq","flag":""},{"id":"W0-3","week":0,"kind":"P","n":3,"q":"Who are the potential beneficiaries of a course in Organizational Behaviour?","opts":["HR Professionals","Management Students","Psychology students","All of the above"],"key":3,"official":false,"keySrc":"slides","topic":"intro","concept":"ob-why","diff":"E","exp":"OB is multidisciplinary and useful to anyone who manages or studies people at work: HR professionals, management students and psychology students all benefit, so each single option is incomplete.","tip":"OB is for anyone who works with people.","type":"mcq","flag":""},{"id":"W0-4","week":0,"kind":"P","n":4,"q":"It is important to understand human behaviour in general to understand their behaviour in workplace.","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"intro","concept":"ob-why","diff":"E","exp":"Workplace behaviour is human behaviour in an organizational setting; the same needs, perceptions and emotions operate there, so understanding general human behaviour is the foundation for understanding behaviour at work.","tip":"Work behaviour = human behaviour at work.","type":"tf","flag":""},{"id":"W0-5","week":0,"kind":"P","n":5,"q":"Perception, learning and personality are attributes of Individual Behavioural Dynamics.","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"intro","concept":"ob-levels","diff":"E","exp":"Perception, learning, personality (plus attitudes, emotions, motivation) are the individual-level processes, i.e. Individual Behavioural Dynamics.","tip":"Individual processes: perception, personality, attitudes, motivation.","type":"tf","flag":""},{"id":"W0-6","week":0,"kind":"P","n":6,"q":"The process of giving meaning to sensory stimuli through organizing and interpreting is called:","opts":["Sensation","Perception","Sublimation","Organization"],"key":1,"official":false,"keySrc":"duplicate","topic":"perception","concept":"perception-def","diff":"E","exp":"Perception is the process of giving meaning to sensory stimuli by organizing and interpreting them. Sensation is only the raw reception of stimuli; sublimation is a Freudian defence mechanism; 'organization' is only one sub-step.","tip":"Sensation = receive; Perception = organize + interpret.","type":"mcq","flag":""},{"id":"W0-7","week":0,"kind":"P","n":7,"q":"Organizational structure is a part of Interpersonal and Group dynamics.","opts":["True","False"],"key":1,"official":false,"keySrc":"slides","topic":"intro","concept":"ob-levels","diff":"M","exp":"False. Organizational structure belongs to organizational dynamics (like culture and change). Interpersonal and group dynamics cover trust, conflict, communication, decision making, power/leadership and teams.","tip":"Structure = organization level, not group level.","type":"tf","flag":""},{"id":"W0-8","week":0,"kind":"P","n":8,"q":"People differ in their level of trustworthiness.","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"interpersonal","concept":"trust","diff":"E","exp":"People do differ in trustworthiness; this is why trust is treated as something to be built and why trustworthiness is called a virtue and building trust a skill.","tip":"Trustworthiness varies from person to person.","type":"tf","flag":""},{"id":"W0-9","week":0,"kind":"P","n":9,"q":"Perception is highly objective.","opts":["True","False"],"key":1,"official":false,"keySrc":"duplicate","topic":"perception","concept":"subjectivity","diff":"E","exp":"False. Perception is an individual's view of reality and is highly SUBJECTIVE, so two people can perceive the same stimulus differently.","tip":"Perception = subjective, not objective.","type":"tf","flag":""},{"id":"W0-10","week":0,"kind":"P","n":10,"q":"More output for less input or being able to provide optimal output for a given input is called:","opts":["Effectiveness","Productivity","Efficiency","Motivation"],"key":2,"official":false,"keySrc":"duplicate","topic":"intro","concept":"productivity-efficiency","diff":"E","exp":"Efficiency means more output for less input (optimal output for a given input). Effectiveness is achieving the goal, productivity is the output/input ratio in general, motivation is the force behind effort.","tip":"Efficiency = doing things right with least input.","type":"mcq","flag":""},{"id":"W1N-1","week":1,"kind":"N","n":1,"q":"Out of the following which one is a behaviour","opts":["Thinking","Sneezing","dreaming","all of the above"],"key":3,"official":false,"keySrc":"slides","topic":"intro","concept":"behaviour-def","diff":"M","exp":"Behaviour is any response of an organism to internal or external stimuli - conscious or subconscious, overt or covert, voluntary or involuntary. Thinking (covert), sneezing (involuntary) and dreaming (subconscious) are all behaviours.","tip":"Behaviour includes involuntary and covert responses.","type":"mcq","flag":""},{"id":"W1N-2","week":1,"kind":"N","n":2,"q":"The major contribution of psychology in the world wars is in the area of","opts":["War strategy","Mass recruitment of soldiers","Weapons training","None of the above"],"key":1,"official":false,"keySrc":"slides","topic":"intro","concept":"hist-industrial-psych","diff":"M","exp":"In the World Wars psychology contributed mainly through psychological testing used for mass selection and placement (recruitment) of soldiers, not through strategy or weapons training. Key is an unofficial inference from the slide topic 'World Wars and Industrial Psychology'.","tip":"WWs: psychology helped pick the right soldiers.","type":"mcq","flag":""},{"id":"W1N-3","week":1,"kind":"N","n":3,"q":"The Major criticism on the Scientific Management Theory was","opts":["Treating humans as machines","doing experiments on humans","Complicated theory","all of the above"],"key":0,"official":false,"keySrc":"slides","topic":"intro","concept":"sci-mgmt","diff":"M","exp":"The main criticism of Taylor's scientific management was that it treated workers like machines (cogs in a production process), ignoring social and psychological needs. This criticism paved the way for the human relations movement.","tip":"Taylorism = humans as machines.","type":"mcq","flag":""},{"id":"W1N-4","week":1,"kind":"N","n":4,"q":"The first set of Hawthorne studies was conducted to understand","opts":["The Effect of duration of work hours on employee performance","The effect of lighting on employee performance","The effect of ventilation on employee performance","None of the above"],"key":1,"official":false,"keySrc":"slides","topic":"intro","concept":"hawthorne","diff":"E","exp":"The first set of Hawthorne studies (1924-27) were the illumination studies: the effect of lighting on productivity. Relay assembly room (1927-32) and bank wiring room (1931-32) came later.","tip":"Hawthorne 1st = lighting (illumination).","type":"mcq","flag":""},{"id":"W1N-5","week":1,"kind":"N","n":5,"q":"The key limitation with time and motion studies are:","opts":["They are done under ideal conditions which cannot be generalized","The methodology adopted is no valid","It is unethical to conduct research on humans","None of the above"],"key":0,"official":false,"keySrc":"slides","topic":"intro","concept":"time-motion","diff":"M","exp":"A key limitation of time and motion studies is that they are conducted under ideal/controlled conditions and the standards may not generalize to real workplaces. Key is unofficial; the methodology itself is valid and the studies are not unethical per se.","tip":"Ideal conditions = poor generalizability.","type":"mcq","flag":""},{"id":"W1G-1","week":1,"kind":"G","n":1,"q":"Response of the organism or system to various stimuli or inputs, whether internal or external, conscious or subconscious, overt or covert, voluntary or involuntary is called:","opts":["Organization","Behaviour","Resource","Productivity"],"key":1,"official":true,"keySrc":"official","topic":"intro","concept":"behaviour-def","diff":"E","exp":"Behaviour is the response of an organism or system to stimuli, whether internal or external, conscious or subconscious, overt or covert, voluntary or involuntary. Organization, resource and productivity are not definitions of a response.","tip":"Behaviour = response to stimuli.","type":"mcq","flag":""},{"id":"W1G-2","week":1,"kind":"G","n":2,"q":"Hawthorne experiments were a set of experiments conducted to study the impact of assembly line on the health of the workers.","opts":["True","False"],"key":1,"official":true,"keySrc":"official","topic":"intro","concept":"hawthorne","diff":"E","exp":"False. The Hawthorne experiments studied the effect of work conditions (illumination, rest pauses, group norms) on productivity - not the effect of the assembly line on health.","tip":"Hawthorne = lighting, relay room, bank wiring.","type":"tf","flag":""},{"id":"W1G-3","week":1,"kind":"G","n":3,"q":"The social expectation on an individual is called:","opts":["Role","Designation","Job","Task"],"key":0,"official":true,"keySrc":"official","topic":"intro","concept":"role","diff":"E","exp":"A role is the set of social expectations placed on an individual in a position. A designation is a title, a job is a set of tasks, and a task is a single unit of work.","tip":"Role = social expectation.","type":"mcq","flag":""},{"id":"W1G-4","week":1,"kind":"G","n":4,"q":"Which of the following is not an organization?","opts":["TATA Steels","UNICEF","Facebook Inc.","Germany"],"key":3,"official":true,"keySrc":"official","topic":"intro","concept":"org-def","diff":"E","exp":"An organization is a consciously coordinated social entity with an identifiable boundary and common goals. TATA Steel, UNICEF and Facebook qualify; a country (Germany) is not a deliberately arranged organization with such a boundary and goal set.","tip":"Organization = coordinated + boundary + common goal.","type":"mcq","flag":""},{"id":"W1G-5","week":1,"kind":"G","n":5,"q":"More output for less input or being able to provide optimal output for a given input is called:","opts":["Effectiveness","Productivity","Efficiency","Motivation"],"key":2,"official":true,"keySrc":"official","topic":"intro","concept":"productivity-efficiency","diff":"E","exp":"Efficiency = more output for less input (optimal output for given input). Effectiveness is about goal attainment; productivity is the general output-to-input measure.","tip":"Efficiency = best use of inputs.","type":"mcq","flag":""},{"id":"W1G-6","week":1,"kind":"G","n":6,"q":"Which field can be called as the mother of Organizational behaviour?","opts":["Anthropology","Economics","Industrial Psychology","Law"],"key":2,"official":true,"keySrc":"official","topic":"intro","concept":"ob-disciplines","diff":"E","exp":"Industrial Psychology is regarded as the mother field of OB (Walter Dill Scott, Strong, Munsterberg). Anthropology, economics and law came later as contributing disciplines.","tip":"Industrial Psychology = Mother of OB.","type":"mcq","flag":""},{"id":"W1G-7","week":1,"kind":"G","n":7,"q":"In an experiment, the group in which you make no changes is called the:","opts":["Experimental Group","Focus Group","Control Group","Target Group"],"key":2,"official":true,"keySrc":"official","topic":"intro","concept":"control-group","diff":"E","exp":"In an experiment the group in which no change is made is the control group; the group receiving the intervention is the experimental group. It provides the baseline for comparison.","tip":"Control group = no change.","type":"mcq","flag":""},{"id":"W1G-8","week":1,"kind":"G","n":8,"q":"The assembly line of production was first introduced by Henry Ford.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"intro","concept":"assembly-line","diff":"E","exp":"True. Henry Ford introduced the moving assembly line of production.","tip":"Ford = assembly line.","type":"tf","flag":""},{"id":"W1G-9","week":1,"kind":"G","n":9,"q":"The scientific management movement was pioneered by:","opts":["Walter Dill Scott","Edward K Strong Jr.","Hugo Munsterberg","Frederick W Taylor"],"key":3,"official":true,"keySrc":"official","topic":"intro","concept":"sci-mgmt","diff":"E","exp":"Frederick W. Taylor pioneered scientific management. Scott (advertising), Strong (vocational guidance) and Munsterberg (industrial accidents, 'Psychology and Industrial Efficiency') belong to industrial psychology.","tip":"Taylor = Scientific Management.","type":"mcq","flag":""},{"id":"W1G-10","week":1,"kind":"G","n":10,"q":"The process of breaking down the entire job into specific tasks and see how each of these tasks are performed and how much time on an average a person will take to finish it is called:","opts":["Time and Motion Study","Workplace management","Job Profile","Productivity"],"key":0,"official":true,"keySrc":"official","topic":"intro","concept":"time-motion","diff":"E","exp":"Time and motion study breaks a job into specific tasks and measures how each is performed and how long it takes on average. It is Taylor's first principle: scientifically study each part of the job.","tip":"Time + motion = break job into tasks and time them.","type":"mcq","flag":""},{"id":"W2N-1","week":2,"kind":"N","n":1,"q":"All perceptions are subjective in nature","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"perception","concept":"subjectivity","diff":"E","exp":"True. Perception is an individual's view of reality and is highly subjective.","tip":"Perception = subjective.","type":"tf","flag":""},{"id":"W2N-2","week":2,"kind":"N","n":2,"q":"Prior Learning plays an important role in perceptual selection","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"perception","concept":"perceptual-selection","diff":"E","exp":"True. Learning is an internal factor in perceptual selection: past experience determines what we notice and how we interpret it (others: habit, motivation/interest, organizational role).","tip":"Internal: habit, motivation, learning, role.","type":"tf","flag":""},{"id":"W2N-3","week":2,"kind":"N","n":3,"q":"The social perception does not involve integrating information collected","opts":["True","False"],"key":1,"official":false,"keySrc":"slides","topic":"perception","concept":"social-perception","diff":"E","exp":"False. Social perception IS the process of combining, integrating and interpreting information about others to understand them.","tip":"Social perception = combine + integrate + interpret.","type":"tf","flag":""},{"id":"W2N-4","week":2,"kind":"N","n":4,"q":"According to the casual attribution theory, the extent to which other people behave in the same manner as the person we are judging is called as Consensus","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"perception","concept":"attribution-kelley","diff":"E","exp":"True. In Kelley's theory, consensus is the extent to which other people behave in the same way as the person being judged.","tip":"Consensus = what others do.","type":"tf","flag":""},{"id":"W2N-5","week":2,"kind":"N","n":5,"q":"A belief that all members of specific groups share similar traits and are prone to behave the same way is called as stereotyping","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"perception","concept":"stereotype","diff":"E","exp":"True. Stereotyping is the belief that all members of a group share similar traits and behave in the same way.","tip":"Stereotype = group = same traits.","type":"tf","flag":""},{"id":"W2G-1","week":2,"kind":"G","n":1,"q":"Perception is highly objective.","opts":["True","False"],"key":1,"official":true,"keySrc":"official","topic":"perception","concept":"subjectivity","diff":"E","exp":"False. Perception is highly subjective, not objective.","tip":"Perception = subjective.","type":"tf","flag":""},{"id":"W2G-2","week":2,"kind":"G","n":2,"q":"There are many women at the bottom and middle level management roles but only a very few make it to the top. This is due to:","opts":["Impression Management techniques","Golem effect","Pygmalion effect","Glass-ceiling effect"],"key":3,"official":true,"keySrc":"official","topic":"perception","concept":"glass-ceiling","diff":"M","exp":"The glass-ceiling effect is the invisible barrier that stops (often women) from reaching top positions despite strong representation at lower levels. Pygmalion and Golem effects are self-fulfilling prophecies (high vs low expectations); impression management is self-presentation.","tip":"Glass ceiling = invisible barrier to the top.","type":"mcq","flag":""},{"id":"W2G-3","week":2,"kind":"G","n":3,"q":"The process of giving meaning to sensory stimuli through organizing and interpreting is called:","opts":["Sensation","Perception","Sublimation","Organization"],"key":1,"official":true,"keySrc":"official","topic":"perception","concept":"perception-def","diff":"E","exp":"Perception = giving meaning to sensory stimuli by organizing and interpreting them. Sensation only receives; sublimation is a defence mechanism.","tip":"Perception = organize + interpret.","type":"mcq","flag":""},{"id":"W2G-4","week":2,"kind":"G","n":4,"q":"Which of the following is an internal factor that influence the principles of perceptual selection?","opts":["Contrast","Repetition","Motion","Habit"],"key":3,"official":true,"keySrc":"official","topic":"perception","concept":"perceptual-selection","diff":"E","exp":"Habit is an INTERNAL factor of perceptual selection. Contrast, repetition and motion are EXTERNAL factors (also intensity, size, novelty/familiarity).","tip":"Internal: habit, motivation, learning, role.","type":"mcq","flag":""},{"id":"W2G-5","week":2,"kind":"G","n":5,"q":"In the above picture, we tend to see columns of dots due to a perceptual grouping effect called:","opts":["Similarity","Proximity","Continuity","Symmetry"],"key":1,"official":true,"keySrc":"official","topic":"perception","concept":"perceptual-organization","diff":"M","exp":"Dots arranged closer together in columns are seen as columns because of the proximity principle of perceptual grouping (nearness). Similarity would group by likeness; continuity by smooth paths. (Picture-based question; image not reproduced.)","tip":"Near = together (proximity).","type":"mcq","flag":"Picture-based question: the original image is not available in the export. The answer follows the official key."},{"id":"W2G-6","week":2,"kind":"G","n":6,"q":"In the above image, one can still perceive the opening door to be of a rectangle shape due to:","opts":["Figure-Ground Perception","Optical Illusions","Perceptual Constancy","Social Perception"],"key":2,"official":true,"keySrc":"official","topic":"perception","concept":"perceptual-organization","diff":"M","exp":"Perceiving an opening door as still rectangular although the retinal image changes shape is perceptual constancy - objects are seen as stable in size, shape and colour despite changing viewing conditions. (Picture-based question.)","tip":"Constancy = stable object despite changing view.","type":"mcq","flag":"Picture-based question: the original image is not available in the export. The answer follows the official key."},{"id":"W2G-7","week":2,"kind":"G","n":7,"q":"The process through which individuals attempt to determine the causes behind others’ behaviour is called attribution.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"perception","concept":"attribution","diff":"E","exp":"True. Attribution is the process through which individuals try to determine the causes (internal vs external) behind others' behaviour.","tip":"Attribution = finding causes of behaviour.","type":"tf","flag":""},{"id":"W2G-8","week":2,"kind":"G","n":8,"q":"According to Kelley’s theory of causal attribution, the extent to which other people behave in the same manner as the person we are judging is called:","opts":["Consensus","Consistency","Distinctiveness","Identity"],"key":0,"official":true,"keySrc":"official","topic":"perception","concept":"attribution-kelley","diff":"E","exp":"Kelley's three dimensions: consensus (do others behave the same way?), consistency (does the person behave this way repeatedly in similar situations?), distinctiveness (does the person behave the same way in other contexts?). The description given is consensus.","tip":"Consensus = others; Consistency = time; Distinctiveness = situations.","type":"mcq","flag":""},{"id":"W2G-9","week":2,"kind":"G","n":9,"q":"The tendency to attribute others’ action to internal causes while largely ignoring external factors is called:","opts":["Halo effect","Team-Halo effect","Fundamental attribution error","Similar-to-me effect"],"key":2,"official":true,"keySrc":"official","topic":"perception","concept":"fae","diff":"E","exp":"The fundamental attribution error is the tendency to attribute others' actions to internal causes (personality) while underestimating external causes. Halo effect = general impression colouring specific judgments; team halo = crediting teams for success only; similar-to-me = favouring similar people.","tip":"FAE = blame the person, ignore the situation.","type":"mcq","flag":""},{"id":"W2G-10","week":2,"kind":"G","n":10,"q":"The word “Carpenter” immediately brings in to memory the image of a male individual rather than a female individual. This is an example of a job stereotype.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"perception","concept":"stereotype","diff":"E","exp":"True. Associating 'carpenter' with a man rather than a woman is a job (occupational) stereotype.","tip":"Job stereotype = occupation linked to a gender/group.","type":"tf","flag":""},{"id":"W3N-1","week":3,"kind":"N","n":1,"q":"According to psychology, personality has a strong influence on human behavior","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"personality","concept":"personality-def","diff":"E","exp":"True. Personality is defined as relatively stable characteristics that influence behaviour, attitudes, motivation and emotions; it is 'the key to understand an individual's behaviour'.","tip":"Personality drives behaviour.","type":"tf","flag":""},{"id":"W3N-2","week":3,"kind":"N","n":2,"q":"Psychoanalytic theory believes in the role of learning in the development of personality","opts":["True","False"],"key":1,"official":false,"keySrc":"slides","topic":"personality","concept":"freud","diff":"M","exp":"False. Role of learning in personality is emphasized by social learning theory (and behaviourists). Psychoanalytic theory focuses on unconscious drives and the Id-Ego-Superego.","tip":"Freud = unconscious; Bandura = learning.","type":"tf","flag":""},{"id":"W3N-3","week":3,"kind":"N","n":3,"q":"Employees with high self-esteem are very dominating over others","opts":["True","False"],"key":1,"official":false,"keySrc":"slides","topic":"personality","concept":"self-esteem","diff":"M","exp":"False. High self-esteem employees are happy, realistic, moderate risk takers and ready to take responsibility - not dominating over others. Self-esteem is about self-regard, not dominance.","tip":"High self-esteem = confident, not domineering.","type":"tf","flag":""},{"id":"W3N-4","week":3,"kind":"N","n":4,"q":"Personality styles can also be called as personality types","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"personality","concept":"type-trait","diff":"E","exp":"True. Personality types are also called personality styles; traits are individual characteristics.","tip":"Type = Style; Trait = characteristic.","type":"tf","flag":""},{"id":"W3N-5","week":3,"kind":"N","n":5,"q":"Machiavellianistic individuals willingly manipulate others for their own benefit","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"personality","concept":"mach","diff":"E","exp":"True. Machiavellianism is the willingness to manipulate others for one's own purpose (distrust, closed-mindedness, power-centred).","tip":"Mach = manipulate for own gain.","type":"tf","flag":""},{"id":"W3G-1","week":3,"kind":"G","n":1,"q":"In Johari’s Window model of self-awareness, the part of the self which is not known to ourselves, but others know is called:","opts":["Open","Blind","Hidden","Unknown"],"key":1,"official":true,"keySrc":"official","topic":"personality","concept":"johari","diff":"E","exp":"In Johari's Window the Blind area is unknown to self but known to others. Open = known to both; Hidden = known to self, not others; Unknown = known to neither.","tip":"Blind = others see it, you do not.","type":"mcq","flag":""},{"id":"W3G-2","week":3,"kind":"G","n":2,"q":"The meaning of the Latin word ‘Persona’ from which the word Personality arises is:","opts":["Behaviour","Mask","Thought","Person"],"key":1,"official":true,"keySrc":"official","topic":"personality","concept":"personality-def","diff":"E","exp":"Personality comes from the Latin 'persona', the mask worn by actors in plays (per + sonare: to sound through).","tip":"Persona = Mask.","type":"mcq","flag":""},{"id":"W3G-3","week":3,"kind":"G","n":3,"q":"Many psychologists argue that one’s personality can be changed over a period of time because those qualities are formed because of social factors.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"personality","concept":"personality-def","diff":"M","exp":"True. Many psychologists argue personality is shaped by social factors (learning, socialization, role models) and so can change over time, unlike the strict hereditary view.","tip":"Social factors = personality can change.","type":"tf","flag":""},{"id":"W3G-4","week":3,"kind":"G","n":4,"q":"According to Big Five Personality Theory, people who like to experiment and try and find out new things and are less judgmental about people of other cultures are high on:","opts":["Adjustment","Agreeableness","Conscientiousness","Intellectual Openness"],"key":3,"official":true,"keySrc":"official","topic":"personality","concept":"bigfive","diff":"E","exp":"Intellectual openness (openness to experience) describes curiosity, willingness to experiment and being less judgmental of other cultures. Adjustment = emotional stability, Agreeableness = cooperative/trusting, Conscientiousness = organized/dependable.","tip":"Openness = new things + open to cultures.","type":"mcq","flag":""},{"id":"W3G-5","week":3,"kind":"G","n":5,"q":"According to Sigmund Freud’s psychoanalytic theory, the deepest level of consciousness is:","opts":["Subconscious","Conscious state","Unconscious","Awareness"],"key":2,"official":true,"keySrc":"official","topic":"personality","concept":"freud","diff":"E","exp":"Freud's levels of consciousness: conscious, subconscious (preconscious) and the deepest, the unconscious.","tip":"Deepest = Unconscious.","type":"mcq","flag":""},{"id":"W3G-6","week":3,"kind":"G","n":6,"q":"According to Sigmund Freud, reality principle is followed by:","opts":["Id","Super Ego","Dream","Ego"],"key":3,"official":true,"keySrc":"official","topic":"personality","concept":"freud","diff":"E","exp":"The Ego follows the reality principle (balances the Id and Superego with practical reality). The Id follows the pleasure principle; the Superego the morality principle.","tip":"Id pleasure, Ego reality, Superego morality.","type":"mcq","flag":""},{"id":"W3G-7","week":3,"kind":"G","n":7,"q":"In social learning theory, the withdrawal of something which somebody likes to strengthen a behaviour is called:","opts":["Negative Reinforcement","Positive Reinforcement","Reward","Punishment"],"key":0,"official":true,"keySrc":"official","topic":"personality","concept":"reinforcement","diff":"M","exp":"Negative reinforcement strengthens a behaviour by withdrawing (or avoiding) something unpleasant. Positive reinforcement adds a reward; punishment weakens behaviour. NOTE: the official question says 'withdrawal of something which somebody likes' but the official key is Negative Reinforcement - follow the official key.","tip":"Negative reinforcement = remove aversive to strengthen.","type":"mcq","flag":""},{"id":"W3G-8","week":3,"kind":"G","n":8,"q":"The main proponent of Self Theory was:","opts":["Sigmund Freud","Albert Bandura","Carl Rogers","B.F. Skinner"],"key":2,"official":true,"keySrc":"official","topic":"personality","concept":"self-theory","diff":"E","exp":"Carl Rogers is the main proponent of Self Theory (free will, self-concept, self-esteem, unconditional acceptance). Freud = psychoanalytic, Bandura = social learning, Skinner = operant conditioning.","tip":"Rogers = Self theory.","type":"mcq","flag":""},{"id":"W3G-9","week":3,"kind":"G","n":9,"q":"Employees with high self-esteem are more ready to take responsibilities.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"personality","concept":"self-esteem","diff":"E","exp":"True. Employees with high self-esteem are happy, realistic, moderate risk takers, motivated, self-disciplined and ready to take responsibilities.","tip":"High self-esteem = takes responsibility.","type":"tf","flag":""},{"id":"W3G-10","week":3,"kind":"G","n":10,"q":"People with _______ locus of control believe that others control their life and whatever happens in their life is because of outside factors.","opts":["Internal","External"],"key":1,"official":true,"keySrc":"official-truncated","topic":"personality","concept":"locus","diff":"M","exp":"People with an EXTERNAL locus of control believe outside forces (others, luck, fate) control their lives. Internal locus = believing one controls one's own outcomes. (The portal export truncated the accepted answer; External is the only consistent option.)","tip":"External = outside controls me.","type":"mcq","flag":"The portal export truncated the accepted answer. \"External\" is the only option consistent with the question text; verify on the portal."},{"id":"W4N-1","week":4,"kind":"N","n":1,"q":"Learning involves change in behavior","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"learning","concept":"learning-def","diff":"E","exp":"True. Learning is a relatively permanent change in behaviour resulting from experience.","tip":"Learning = lasting behaviour change.","type":"tf","flag":""},{"id":"W4N-2","week":4,"kind":"N","n":2,"q":"According to the operant conditioning theory, punishment is a form of negative reinforcement","opts":["True","False"],"key":1,"official":false,"keySrc":"slides","topic":"learning","concept":"reinforcement","diff":"E","exp":"False. Punishment presents an unpleasant consequence to weaken behaviour; negative reinforcement removes/avoids an aversive stimulus to STRENGTHEN behaviour.","tip":"Negative reinforcement strengthens; punishment weakens.","type":"tf","flag":""},{"id":"W4N-3","week":4,"kind":"N","n":3,"q":"Cognitive maps are the internal representation of the external world","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"learning","concept":"cognitive-learning","diff":"E","exp":"True. A cognitive map is an internal perceptual representation of external environmental features and landmarks.","tip":"Cognitive map = mental map.","type":"tf","flag":""},{"id":"W4N-4","week":4,"kind":"N","n":4,"q":"Values are fewer in number than attitudes","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"attitudes","concept":"values-vs-attitudes","diff":"E","exp":"True. Values are fewer in number than attitudes, transcend specific objects/situations, are relatively permanent and central to the person.","tip":"Few values, many attitudes.","type":"tf","flag":""},{"id":"W4N-5","week":4,"kind":"N","n":5,"q":"Supportive colleagues can contribute to job satisfaction","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"attitudes","concept":"job-satisfaction","diff":"E","exp":"True. Supportive colleagues (along with challenging work, equitable rewards, supportive conditions, personality-job fit) are determinants of job satisfaction.","tip":"Colleagues matter for satisfaction.","type":"tf","flag":""},{"id":"W4G-1","week":4,"kind":"G","n":1,"q":"__________ are evaluative statements towards objects, people or events.","opts":["Learning","Attitudes","Memory","Personality"],"key":1,"official":true,"keySrc":"official","topic":"attitudes","concept":"attitude-def","diff":"E","exp":"Attitudes are evaluative statements towards objects, people or events - tendencies to react in a certain way, for or against something.","tip":"Attitude = evaluative statement.","type":"mcq","flag":""},{"id":"W4G-2","week":4,"kind":"G","n":2,"q":"A relatively permanent change in behaviour occurring as a result of experience is called:","opts":["Thinking","Sensation","Learning","Prejudice"],"key":2,"official":true,"keySrc":"official","topic":"learning","concept":"learning-def","diff":"E","exp":"Learning is a relatively permanent change in behaviour as a result of experience. Thinking, sensation and prejudice are not definitions of learning.","tip":"Learning = permanent change via experience.","type":"mcq","flag":""},{"id":"W4G-3","week":4,"kind":"G","n":3,"q":"Providing more information can lead to change in attitude.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"attitudes","concept":"attitude-change","diff":"E","exp":"True. Providing information is one way to change attitudes (others: reinforcing change, providing opportunities to explore new situations).","tip":"Information can change attitudes.","type":"tf","flag":""},{"id":"W4G-4","week":4,"kind":"G","n":4,"q":"In Pavlov’s Dog experiment, the food presented which makes the dog salivate is:","opts":["Unconditional stimulus","Unconditional response","Conditioned stimulus","Conditioned response"],"key":0,"official":true,"keySrc":"official","topic":"learning","concept":"classical","diff":"E","exp":"In Pavlov's experiment, food is the unconditioned (unconditional) stimulus: it naturally produces salivation (the unconditioned response). The bell becomes the conditioned stimulus; salivating to the bell is the conditioned response.","tip":"Food = US; salivation to food = UR.","type":"mcq","flag":""},{"id":"W4G-5","week":4,"kind":"G","n":5,"q":"In Operant conditioning, the process through which the responses that are no longer reinforced tend to gradually diminish in strength is called:","opts":["Positive reinforcement","Negative Reinforcement","Punishment","Extinction"],"key":3,"official":true,"keySrc":"official","topic":"learning","concept":"reinforcement","diff":"E","exp":"Extinction is the gradual weakening of a response that is no longer reinforced. Reinforcement strengthens; punishment adds an aversive consequence.","tip":"Extinction = no reinforcement -> fades.","type":"mcq","flag":""},{"id":"W4G-6","week":4,"kind":"G","n":6,"q":"After watching a Dance TV show, a kid starts to make dance moves. This is an example of:","opts":["Operant conditioning","Classical conditioning","Observational learning","Negative Reinforcement"],"key":2,"official":true,"keySrc":"official","topic":"learning","concept":"observational","diff":"E","exp":"Learning dance moves by watching a show is observational learning (modelling/vicarious learning): attention, retention, reproduction, motivation. No stimulus pairing (classical) or consequence (operant) is involved.","tip":"Watch -> copy = observational.","type":"mcq","flag":""},{"id":"W4G-7","week":4,"kind":"G","n":7,"q":"Opinion is primarily _______ in nature.","opts":["Affective","Cognitive","Behavioural","Unconscious"],"key":1,"official":true,"keySrc":"official","topic":"attitudes","concept":"opinion","diff":"E","exp":"An opinion is primarily cognitive (a specific belief/judgment), while attitudes have cognitive, affective and behavioural components and influence opinions.","tip":"Opinion = cognitive and specific.","type":"mcq","flag":""},{"id":"W4G-8","week":4,"kind":"G","n":8,"q":"The intensity of an attitude or the magnitude/degree of its favorableness is called","opts":["Multiplexity","Relation to need","Centrality","Valence"],"key":3,"official":true,"keySrc":"official","topic":"attitudes","concept":"attitude-char","diff":"E","exp":"Valence is the magnitude or degree of favourableness/unfavourableness. Multiplexity = number of elements, relation to needs = purpose served, centrality = importance of the object.","tip":"Valence = direction + intensity.","type":"mcq","flag":""},{"id":"W4G-9","week":4,"kind":"G","n":9,"q":"When people do not provide honest answers to certain questions because they feel that it is not right to give those answers, it is called:","opts":["Social Loafing","Fatigue","Social Desirability Effect","Sampling"],"key":2,"official":true,"keySrc":"official","topic":"attitudes","concept":"attitude-measure","diff":"E","exp":"The social desirability effect is giving answers one thinks are socially acceptable rather than honest ones - a key issue in attitude measurement. Social loafing is reduced effort in groups.","tip":"Social desirability = answering to look good.","type":"mcq","flag":""},{"id":"W4G-10","week":4,"kind":"G","n":10,"q":"Uncomfortable tension which comes from holding two conflicting thoughts in the mind at the same time is called Cognitive Dissonance.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"attitudes","concept":"dissonance","diff":"E","exp":"True. Cognitive dissonance is the uncomfortable tension from holding two conflicting thoughts at the same time; it can motivate attitude or behaviour change.","tip":"Dissonance = conflicting thoughts = tension.","type":"tf","flag":""},{"id":"W5N-1","week":5,"kind":"N","n":1,"q":"Feelings based on information external to themselves is called self-conscious emotions","opts":["True","False"],"key":1,"official":false,"keySrc":"slides","topic":"emotions","concept":"emotion-basics","diff":"M","exp":"False. Feelings based on information external to oneself are SOCIAL emotions (pity, envy, jealousy). Self-conscious emotions (shame, guilt, embarrassment, pride) stem from within.","tip":"Social = external info; self-conscious = from within.","type":"tf","flag":""},{"id":"W5N-2","week":5,"kind":"N","n":2,"q":"Emotional labour is part of most service sector jobs","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"emotions","concept":"emotional-labor","diff":"E","exp":"True. Emotional labour - regulating displayed emotions - is typical of service sector jobs (airline attendants, customer service).","tip":"Service jobs = emotional labour.","type":"tf","flag":""},{"id":"W5N-3","week":5,"kind":"N","n":3,"q":"Using aggression as a tool to achieve something is called threat based aggression","opts":["True","False"],"key":1,"official":false,"keySrc":"slides","topic":"emotions","concept":"aggression","diff":"E","exp":"False. Using aggression to get something is INSTRUMENTAL aggression; threat-based aggression is self-defence/fear.","tip":"Instrumental = aggression as a tool.","type":"tf","flag":""},{"id":"W5N-4","week":5,"kind":"N","n":4,"q":"Stress can also result due to positive life experiences","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"emotions","concept":"stress","diff":"E","exp":"True. Eustress is the positive form of stress arising from positive experiences (e.g. promotion, marriage).","tip":"Eustress = good stress.","type":"tf","flag":""},{"id":"W5N-5","week":5,"kind":"N","n":5,"q":"Low levels of stimulation can also lead to stress","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"emotions","concept":"stress","diff":"M","exp":"True. Hypo-stress (too little stimulation, boredom) is a type of stress, as is hyper work stress (overload).","tip":"Too little (hypo) or too much (hyper) both stress.","type":"tf","flag":""},{"id":"W5G-1","week":5,"kind":"G","n":1,"q":"The stress which happens because of positive incidences is called:","opts":["Distress","Eustress","Hypo-stress","Hyper work stress"],"key":1,"official":true,"keySrc":"official","topic":"emotions","concept":"stress","diff":"E","exp":"Eustress is stress from positive incidents. Distress is negative stress; hypo-stress is under-stimulation; hyper work stress is overload.","tip":"Eu = good.","type":"mcq","flag":""},{"id":"W5G-2","week":5,"kind":"G","n":2,"q":"An unfocused, relatively mild feeling that exists as background to our daily experience is called:","opts":["Behaviour","Perception","Mood","Envy"],"key":2,"official":true,"keySrc":"official","topic":"emotions","concept":"mood","diff":"E","exp":"A mood is an unfocused, relatively mild feeling that exists as a background to daily experience (unlike emotions, which usually have an object).","tip":"Mood = background, no object.","type":"mcq","flag":""},{"id":"W5G-3","week":5,"kind":"G","n":3,"q":"The psychological effort involved in holding back one’s true emotions is called:","opts":["Emotional dissonance","Emotional labor","Emotional Attachment","Temperament"],"key":1,"official":true,"keySrc":"official","topic":"emotions","concept":"emotional-labor","diff":"E","exp":"Emotional labour is the psychological effort of holding back one's true emotions. Emotional dissonance is the inconsistency between felt and expressed emotions.","tip":"Labour = effort; dissonance = mismatch.","type":"mcq","flag":""},{"id":"W5G-4","week":5,"kind":"G","n":4,"q":"When John failed his driving license test, he starts to remember how his friends used to tease him saying he was not a good driver. This is an example of:","opts":["Work-family spillover effect","Emotional dissonance","Empathy","Mood congruence effect"],"key":3,"official":true,"keySrc":"official","topic":"emotions","concept":"mood-congruence","diff":"E","exp":"Mood congruence is recalling things consistent with the current mood (bad mood -> recalling bad memories). Work-family spillover is carrying emotions between work and home.","tip":"Mood congruence = mood-matched memories.","type":"mcq","flag":""},{"id":"W5G-5","week":5,"kind":"G","n":5,"q":"Threat-based aggression can stem from both a real stimulus or a perceived stimulus.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"emotions","concept":"aggression","diff":"E","exp":"True. Threat-based aggression, a response to fear or self-defence, can arise from a real or merely perceived threat.","tip":"Threat can be real or perceived.","type":"tf","flag":""},{"id":"W5G-6","week":5,"kind":"G","n":6,"q":"___________ is when you have a goal and you are moving towards that goal and you feel that something or someone is stopping you from reaching that goal.","opts":["Threat-based aggression","Instrumental aggression","Irritable aggression","Frustration-based aggression"],"key":3,"official":true,"keySrc":"official","topic":"emotions","concept":"aggression","diff":"E","exp":"Frustration-based aggression occurs when goal-directed behaviour is blocked. Instrumental = used to get something; irritable = response to pain/irritation; threat-based = fear/self-defence.","tip":"Blocked goal = frustration aggression.","type":"mcq","flag":""},{"id":"W5G-7","week":5,"kind":"G","n":7,"q":"Fear of being rejected is one of the main reasons that make people non-assertive.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"emotions","concept":"assertive","diff":"E","exp":"True. Fear (of rejection, being taken for granted, vulnerability, humiliation, embarrassment) and insecurity make people non-assertive.","tip":"Fear + insecurity = non-assertive.","type":"tf","flag":""},{"id":"W5G-8","week":5,"kind":"G","n":8,"q":"The feeling of completely tired and exhausted when you are stressed for a very long time accompanied by lack of meaning is called:","opts":["Burnout","Absenteeism","Hypo stress","Alarm-reaction"],"key":0,"official":true,"keySrc":"official","topic":"emotions","concept":"burnout","diff":"M","exp":"Burnout is complete physical and emotional exhaustion after prolonged stress, with loss of meaning (the exhaustion stage of General Adaptation Syndrome leads here). Alarm reaction is only the first stage.","tip":"Burnout = exhausted + empty.","type":"mcq","flag":""},{"id":"W5G-9","week":5,"kind":"G","n":9,"q":"What are the behavioural symptoms of stress?","opts":["Low productivity","Interpersonal conflicts","Suicidal tendencies","All of the above"],"key":3,"official":true,"keySrc":"official","topic":"emotions","concept":"stress-symptoms","diff":"E","exp":"Low productivity, absenteeism, interpersonal conflict, suicidal tendencies and isolation are all behavioural symptoms of stress - so 'All of the above'.","tip":"Behavioural symptoms = all listed.","type":"mcq","flag":""},{"id":"W5G-10","week":5,"kind":"G","n":10,"q":"__________ is a mild form of hate.","opts":["Guilt","Humiliation","Resentment","Shame"],"key":2,"official":true,"keySrc":"official","topic":"emotions","concept":"emotions-types","diff":"E","exp":"Resentment is a mild form of hate. Shame = inadequacy, humiliation = reduced to lower position/disgrace, guilt = violating standards.","tip":"Resentment = mild hate.","type":"mcq","flag":""},{"id":"W6N-1","week":6,"kind":"N","n":1,"q":"Primary motives are physiological in nature","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"motivation","concept":"motives","diff":"E","exp":"True. Primary motives are unlearnt and physiological (hunger, thirst, sleep).","tip":"Primary = physiological.","type":"tf","flag":""},{"id":"W6N-2","week":6,"kind":"N","n":2,"q":"Employees are driven only by financial rewards","opts":["True","False"],"key":1,"official":false,"keySrc":"slides","topic":"motivation","concept":"money","diff":"E","exp":"False. Employees are motivated by many things besides money - nature of work, recognition, advancement, security, fairness.","tip":"Money is not the only motivator.","type":"tf","flag":""},{"id":"W6N-3","week":6,"kind":"N","n":3,"q":"According to Herzberg’s theory working conditions fall under motivators","opts":["True","False"],"key":1,"official":false,"keySrc":"slides","topic":"motivation","concept":"herzberg","diff":"E","exp":"False. Working conditions are HYGIENE factors in Herzberg's theory; motivators are intrinsic factors like the job itself, recognition, responsibility and growth.","tip":"Working conditions = hygiene.","type":"tf","flag":""},{"id":"W6N-4","week":6,"kind":"N","n":4,"q":"Sense of equity is a powerful motivator at work place","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"motivation","concept":"equity","diff":"E","exp":"True. Equity (fairness) is a powerful motivator - equity theory and organizational justice.","tip":"Fairness motivates.","type":"tf","flag":""},{"id":"W6N-5","week":6,"kind":"N","n":5,"q":"Motivation theories which describe the factors which motivate employees are called as content theories","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"motivation","concept":"content-process","diff":"E","exp":"True. Content theories describe WHAT motivates people (Maslow, Herzberg, ERG); process theories explain HOW (expectancy, equity).","tip":"Content = what; Process = how.","type":"tf","flag":""},{"id":"W6G-1","week":6,"kind":"G","n":1,"q":"___________ is the willingness of a person to put high levels of efforts to reach a goal.","opts":["Emotions","Motivation","Frustration","Incentives"],"key":1,"official":true,"keySrc":"official","topic":"motivation","concept":"motivation-def","diff":"E","exp":"Motivation is the willingness to exert high levels of effort to reach a goal. Frustration is a blocked goal; emotions and incentives are different concepts.","tip":"Motivation = willingness to put in effort.","type":"mcq","flag":""},{"id":"W6G-2","week":6,"kind":"G","n":2,"q":"The need to be part of a group is categorized as:","opts":["Achievement motive","Affiliation motive","Power motive","Role conflict"],"key":1,"official":true,"keySrc":"official","topic":"motivation","concept":"motives","diff":"E","exp":"The need to be part of a group is the affiliation motive. Achievement = moderate risk, feedback; power = desire to control others; role conflict is an intra-personal conflict.","tip":"Affiliation = belonging.","type":"mcq","flag":""},{"id":"W6G-3","week":6,"kind":"G","n":3,"q":"Money is a form of extrinsic motivation.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"motivation","concept":"money","diff":"E","exp":"True. Money is an extrinsic motivator - an external reward - rather than inherent in the work.","tip":"Money = extrinsic.","type":"tf","flag":""},{"id":"W6G-4","week":6,"kind":"G","n":4,"q":"According to Maslow’s hierarchy of needs, the highest level of needs one can achieve is:","opts":["Self-actualization","Social Needs","Esteem needs","Safety needs"],"key":0,"official":true,"keySrc":"official","topic":"motivation","concept":"maslow","diff":"E","exp":"Self-actualization is the highest level in Maslow's hierarchy (physiological, safety, social, esteem, self-actualization).","tip":"Top of pyramid = self-actualization.","type":"mcq","flag":""},{"id":"W6G-5","week":6,"kind":"G","n":5,"q":"According to Herzberg’s two-factor theory of motivation, pay and security provided by a job is a Motivator.","opts":["True","False"],"key":1,"official":true,"keySrc":"official","topic":"motivation","concept":"herzberg","diff":"E","exp":"False. Pay and job security are HYGIENE factors - their absence causes dissatisfaction but their presence does not truly motivate.","tip":"Pay, security = hygiene.","type":"tf","flag":""},{"id":"W6G-6","week":6,"kind":"G","n":6,"q":"In Alderfer’s ERG theory of motivation, R stands for","opts":["Reputation","Regression","Resilience","Relatedness"],"key":3,"official":true,"keySrc":"official","topic":"motivation","concept":"erg","diff":"E","exp":"ERG = Existence, Relatedness, Growth (Alderfer). R stands for Relatedness.","tip":"E-R-G: Existence, Relatedness, Growth.","type":"mcq","flag":""},{"id":"W6G-7","week":6,"kind":"G","n":7,"q":"____________ means that employees feel that the organization treats its employees in a fair manner and a just way.","opts":["Intra-personal conflict.","Self-esteem","Power motive","Organizational Justice Climate"],"key":3,"official":true,"keySrc":"official","topic":"motivation","concept":"equity","diff":"E","exp":"Organizational justice climate is employees' perception that the organization treats them in a fair and just manner (distributive, procedural, interactional justice).","tip":"Justice climate = fair treatment perceived.","type":"mcq","flag":""},{"id":"W6G-8","week":6,"kind":"G","n":8,"q":"__________ is when you are moving towards a certain goal, but certain barriers are stopping you from achieving that goal.","opts":["Goal conflict","Role conflict","Frustration","Satisfaction"],"key":2,"official":true,"keySrc":"official","topic":"motivation","concept":"frustration","diff":"E","exp":"Frustration arises when a goal-directed person is blocked by barriers. Goal conflict is a clash between competing goals; role conflict is a clash between role expectations.","tip":"Barrier to goal = frustration.","type":"mcq","flag":""},{"id":"W6G-9","week":6,"kind":"G","n":9,"q":"One of the drawbacks of using money as a motivator is that it can reduce extra-role performance.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"motivation","concept":"money","diff":"E","exp":"True. Money can restrict extra-role performance - people may do only what is paid for.","tip":"Pay can crowd out extra effort.","type":"tf","flag":""},{"id":"W6G-10","week":6,"kind":"G","n":10,"q":"John had applied for several jobs after graduation. One day he received a job offer from Tata Motors and Mahindra Group, both of which he loved to work. The conflict Mr. John is facing in selecting one job is called:","opts":["Role Conflict","Approach-avoidance conflict","Approach-approach conflict","Avoidance-avoidance conflict"],"key":2,"official":true,"keySrc":"official","topic":"motivation","concept":"goal-conflict","diff":"E","exp":"Two attractive alternatives (Tata Motors and Mahindra offers he loved) form an approach-approach conflict. Avoidance-avoidance = two unattractive options; approach-avoidance = one option with both pros and cons.","tip":"Two goods = approach-approach.","type":"mcq","flag":""},{"id":"W7N-1","week":7,"kind":"N","n":1,"q":"Treating the common resources responsibly is called civic virtue.","opts":["True","False"],"key":0,"official":false,"keySrc":"slides","topic":"interpersonal","concept":"ocb","diff":"E","exp":"True. Civic virtue in OCB means responsible participation in and care for the organization, including treating common resources responsibly (key is unofficial; mirrors the graded W7 item).","tip":"Civic virtue = good citizen of the organization.","type":"tf","flag":""},{"id":"W7G-1","week":7,"kind":"G","n":1,"q":"When each party involved in a task tries to maximize its own gains, often at the expense of others, it is called:","opts":["Cooperation","Interdependency","Competition","None of the above"],"key":2,"official":true,"keySrc":"official","topic":"interpersonal","concept":"cooperation-competition","diff":"E","exp":"Competition: each party tries to maximize its own gains, often at the expense of others. Cooperation involves working together toward shared goals for mutual benefit.","tip":"Competition = my gain, your loss.","type":"mcq","flag":""},{"id":"W7G-2","week":7,"kind":"G","n":2,"q":"The degree of confidence we have on others in a relationship is called:","opts":["Transactional contract","Relational contract","Trust","Norms"],"key":2,"official":true,"keySrc":"official","topic":"interpersonal","concept":"trust","diff":"E","exp":"Trust is the degree of confidence one has in others (it involves risk-taking). Transactional and relational contracts are types of psychological contracts.","tip":"Trust = confidence in others.","type":"mcq","flag":""},{"id":"W7G-3","week":7,"kind":"G","n":3,"q":"The kind of psychological contract that focuses on long-term interaction and a widely defined relationship is called relational contract.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"interpersonal","concept":"psych-contract","diff":"E","exp":"True. A relational psychological contract focuses on long-term, widely defined relationships; a transactional contract is primarily economic, brief and narrowly defined.","tip":"Relational = long-term; transactional = short economic.","type":"tf","flag":""},{"id":"W7G-4","week":7,"kind":"G","n":4,"q":"The type of trust that is established based on the credibility of a person, for e.g., trusting the doctor:","opts":["Trust based on familiarity","Swift trust","Trust based on similarity","Trust based on social networks"],"key":1,"official":true,"keySrc":"official","topic":"interpersonal","concept":"trust","diff":"H","exp":"Official key: swift trust - trust that forms quickly, based on role/credibility (as when we trust a doctor we have just met) without the history needed for familiarity-based trust. Familiarity = repeated interaction, similarity = shared traits, social networks = embeddedness/referrals.","tip":"Swift trust = instant trust from role/credibility.","type":"mcq","flag":"Official key retained as given on the portal."},{"id":"W7G-5","week":7,"kind":"G","n":5,"q":"The characteristic of being and respectful towards others is:","opts":["Conscientiousness","Sportsmanship","Civic virtue","Courtesy"],"key":3,"official":true,"keySrc":"official","topic":"interpersonal","concept":"ocb","diff":"E","exp":"Courtesy (being considerate and respectful toward others) is the OCB dimension. Conscientiousness = going beyond minimum requirements, sportsmanship = tolerating inconveniences without complaint, civic virtue = involvement in the organization. (Original question text is garbled.)","tip":"Courtesy = polite, respectful.","type":"mcq","flag":"The original question wording is garbled on the portal; the official key is shown."},{"id":"W7G-6","week":7,"kind":"G","n":6,"q":"Treating the common resources responsibly is called","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"interpersonal","concept":"ocb","diff":"E","exp":"Official key: True (the portal question text is incomplete - 'Treating the common resources responsibly is called ...' - and refers to civic virtue). Civic virtue = responsible participation and treatment of common resources.","tip":"Civic virtue = care for shared resources.","type":"tf","flag":"The original question wording is incomplete on the portal; the official key is shown."},{"id":"W7G-7","week":7,"kind":"G","n":7,"q":"__________ is helping without expecting anything in return.","opts":["Altruism","Competition","Cooperation","Conscientiousness"],"key":0,"official":true,"keySrc":"official","topic":"interpersonal","concept":"ocb","diff":"E","exp":"Altruism is helping others without expecting anything in return. Cooperation is working jointly; conscientiousness is doing more than the minimum.","tip":"Altruism = selfless helping.","type":"mcq","flag":""},{"id":"W7G-8","week":7,"kind":"G","n":8,"q":"Disagreements on strategy and sharing of responsibility and resources is called:","opts":["Relational conflict","Task conflict","Process conflict","Avoiding"],"key":2,"official":true,"keySrc":"official","topic":"interpersonal","concept":"conflict-types","diff":"E","exp":"Process conflict = disagreement on strategy and sharing of responsibilities and resources. Relational = personal/social issues; task = the work itself.","tip":"Process = who does what and how.","type":"mcq","flag":""},{"id":"W7G-9","week":7,"kind":"G","n":9,"q":"People who focus on maximizing the joint outcomes of everyone involved are called:","opts":["Competitors","Cooperators","Individualists","Equalizers"],"key":1,"official":true,"keySrc":"official","topic":"interpersonal","concept":"cooperation-competition","diff":"E","exp":"Cooperators maximize joint outcomes. Competitors want to do better than others, individualists maximize own gain, equalizers minimize differences.","tip":"Cooperators = joint outcomes.","type":"mcq","flag":""},{"id":"W7G-10","week":7,"kind":"G","n":10,"q":"Which conflict handling style is best for both the parties involved?","opts":["Competing","Avoiding","Accommodating","Collaborating"],"key":3,"official":true,"keySrc":"official","topic":"interpersonal","concept":"conflict-styles","diff":"E","exp":"Collaborating (win-win) addresses the concerns of both parties and is considered best for both. Competing is win-lose, accommodating is lose-win, avoiding is lose-lose.","tip":"Collaborate = win-win.","type":"mcq","flag":""},{"id":"W8G-1","week":8,"kind":"G","n":1,"q":"The communication style that is supportive and avoids change and confrontation is called:","opts":["Animated communication style","Driver communication style","Amiable communication style","Analytical communication style"],"key":2,"official":true,"keySrc":"official","topic":"communication","concept":"comm-styles","diff":"E","exp":"Amiable style = supportive, avoids change and confrontation. Driver = direct, task-oriented; animated = enthusiastic, relationship-oriented; analytical = accurate, detail-oriented.","tip":"Amiable = friendly, avoids conflict.","type":"mcq","flag":""},{"id":"W8G-2","week":8,"kind":"G","n":2,"q":"In communication, the process of converting a message into symbols is called:","opts":["Message","Channel","Decoding","Encoding"],"key":3,"official":true,"keySrc":"official","topic":"communication","concept":"comm-process","diff":"E","exp":"Encoding is converting a message into symbols. Decoding is the receiver translating the message; channel is the medium.","tip":"Encode = sender; decode = receiver.","type":"mcq","flag":""},{"id":"W8G-3","week":8,"kind":"G","n":3,"q":"Any disturbance that interfere with the transmission, receipt or feedback of a message is called noise.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"communication","concept":"comm-process","diff":"E","exp":"True. Noise is any disturbance that interferes with the transmission, receipt or feedback of a message.","tip":"Noise = interference.","type":"tf","flag":""},{"id":"W8G-4","week":8,"kind":"G","n":4,"q":"The level of openness which exists in an organization which gives a certain level of comfort to its members is called:","opts":["Common information effect","Hidden profile paradigm","Communication climate","Paralinguistic communication"],"key":2,"official":true,"keySrc":"official","topic":"communication","concept":"climate","diff":"E","exp":"Communication climate is the level of openness in an organization that gives members a certain comfort in communicating.","tip":"Climate = openness/comfort.","type":"mcq","flag":""},{"id":"W8G-5","week":8,"kind":"G","n":5,"q":"Which of the following is NOT a non-verbal mode of communication?","opts":["Facial expressions","Pupil dilation","Gestures","None of the above"],"key":3,"official":true,"keySrc":"official","topic":"communication","concept":"nonverbal","diff":"E","exp":"Facial expressions, pupil dilation and gestures are all non-verbal modes, so the NOT-non-verbal option is 'None of the above'.","tip":"All listed items are non-verbal.","type":"mcq","flag":""},{"id":"W8G-6","week":8,"kind":"G","n":6,"q":"The study of spatial inter-relationships is called:","opts":["Kinesics","Proxemics","Silence","Symbols"],"key":1,"official":true,"keySrc":"official","topic":"communication","concept":"nonverbal","diff":"E","exp":"Proxemics is the study of spatial interrelationships. Kinesics studies body movements (winking, shrugging); silence affects timing and turn-taking; symbols include clothing and artifacts.","tip":"Proxemics = space; Kinesics = body.","type":"mcq","flag":""},{"id":"W8G-7","week":8,"kind":"G","n":7,"q":"Maintaining and distributing minutes of the meeting is helpful in reducing miscommunication in team meetings.","opts":["True","False"],"key":0,"official":true,"keySrc":"official","topic":"communication","concept":"meetings","diff":"E","exp":"True. Recording, transforming and distributing meeting information reduces miscommunication and helps build the next agenda.","tip":"Minutes reduce miscommunication.","type":"tf","flag":""},{"id":"W8G-8","week":8,"kind":"G","n":8,"q":"When parts of some information are shared with the group members whereas other pieces of information are unshared, it gives rise to:","opts":["Hidden profile paradigm","Awareness","Trust building","Minimizing status difference"],"key":0,"official":true,"keySrc":"official","topic":"communication","concept":"hidden-profile","diff":"E","exp":"Hidden profile paradigm: some information is shared among members while other pieces are unshared; groups rarely discover the hidden profile and discuss more shared than unshared information.","tip":"Hidden profile = unique info stays hidden.","type":"mcq","flag":""},{"id":"W8G-9","week":8,"kind":"G","n":9,"q":"In information sharing scenario, the case that has to be avoided to reduce decision making problems is:","opts":["Fully shared case","Non-overlapping case","Distributed partial overlap",
