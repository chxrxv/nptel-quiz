ation","diff":"H","cat":"A","beyond":false,"q":"Which are formalization techniques?","exp":"Formalization techniques: selection, role requirements, rules/procedures/policies, training, rituals.","tip":"SRRTR.","opts":["Rituals","Training","Selection","Rules, procedures and policies","Role requirements"],"ans":[0,1,2,3,4]},{"id":"n4dc74c4b","sec":3,"type":"msq","topic":"structure","concept":"life-cycle","diff":"H","cat":"A","beyond":false,"q":"Which stages are part of the organizational life-cycle perspective in the course?","exp":"Five stages.","tip":"ECFED.","opts":["Entrepreneurial","Collectivity","Formalization-and-control","Decline","Elaboration-of-structure"],"ans":[0,1,2,3,4]},{"id":"nb341da30","sec":3,"type":"msq","topic":"change","concept":"resistance","diff":"H","cat":"B","beyond":false,"q":"Which are levels of resistance to change in the course?","exp":"Levels: organizational, functional, group, individual.","tip":"OFGI.","opts":["Group level","Organizational level","Functional level","Societal level","Individual level"],"ans":[0,1,2,4]},{"id":"nddae04dc","sec":3,"type":"msq","topic":"change","concept":"change-forces","diff":"M","cat":"B","beyond":false,"q":"Which are forces for change listed in the course?","exp":"Forces for change: competitive, economic/political/global, demographic/social, ethical.","tip":"CEDE.","opts":["Economic, political and global forces","Demographic and social forces","Hygiene forces","Competitive forces","Ethical forces"],"ans":[0,1,3,4]},{"id":"n09225abb","sec":3,"type":"msq","topic":"change","concept":"change-types","diff":"M","cat":"A","beyond":false,"q":"Which are TYPES of change listed in the course?","exp":"Types: evolutionary/revolutionary, reengineering, restructuring, innovation. Unfreezing is a step of the change process.","tip":"Types vs process.","opts":["Evolutionary vs revolutionary change","Unfreezing","Restructuring","Reengineering","Innovation"],"ans":[0,2,3,4]},{"id":"nd031e2f4","sec":4,"type":"tf","topic":"perception","concept":"perception-def","diff":"E","cat":"A","beyond":false,"q":"Sensation and perception mean the same thing: both refer to the process of interpreting stimuli.","exp":"Sensation is the reception of raw stimuli; perception is giving meaning to stimuli by organizing and interpreting them.","tip":"Sense -> then make sense = perceive.","opts":["True","False"],"ans":[1]},{"id":"n3cb66c6f","sec":4,"type":"tf","topic":"perception","concept":"attribution-kelley","diff":"M","cat":"A","beyond":false,"q":"According to Kelley, high consensus means that many other people behave the same way as the person being judged.","exp":"Consensus = extent to which other people behave in the same manner as the person we are judging.","tip":"Consensus = crowd agreement.","opts":["True","False"],"ans":[0]},{"id":"nb3f26e70","sec":4,"type":"tf","topic":"learning","concept":"reinforcement","diff":"M","cat":"A","beyond":false,"q":"Negative reinforcement and punishment are two names for the same process.","exp":"Negative reinforcement strengthens behaviour by removing/avoiding an aversive consequence; punishment presents an aversive consequence to weaken behaviour.","tip":"Negative reinforcement = strengthen.","opts":["True","False"],"ans":[1]},{"id":"nb05b15fe","sec":4,"type":"tf","topic":"learning","concept":"classical","diff":"M","cat":"A","beyond":false,"q":"In classical conditioning, the unconditioned response occurs naturally without learning.","exp":"The unconditioned stimulus naturally produces the unconditioned response (food -> salivation).","tip":"Unconditioned = natural.","opts":["True","False"],"ans":[0]},{"id":"n478bc86c","sec":4,"type":"tf","topic":"personality","concept":"freud","diff":"M","cat":"A","beyond":false,"q":"According to Freud, the Super ego follows the reality principle.","exp":"The Ego follows the reality principle; the Id pleasure; the Superego moral standards.","tip":"Ego = reality.","opts":["True","False"],"ans":[1]},{"id":"n07024fe2","sec":4,"type":"tf","topic":"attitudes","concept":"values-vs-attitudes","diff":"M","cat":"A","beyond":false,"q":"Values are generally more numerous and less stable than attitudes.","exp":"Values are fewer and relatively permanent.","tip":"Few & deep.","opts":["True","False"],"ans":[1]},{"id":"n00331d54","sec":4,"type":"tf","topic":"emotions","concept":"stress","diff":"M","cat":"A","beyond":false,"q":"Stress can result from both too much and too little stimulation.","exp":"Hyper work stress (overload) and hypo stress (under-stimulation) are both types of stress.","tip":"Hyper & hypo.","opts":["True","False"],"ans":[0]},{"id":"n1a09f7fc","sec":4,"type":"tf","topic":"motivation","concept":"herzberg","diff":"M","cat":"A","beyond":true,"q":"According to Herzberg's two-factor theory, improving hygiene factors eliminates dissatisfaction but does not necessarily create motivation.","exp":"Hygiene factors prevent dissatisfaction; motivators create satisfaction/motivation (standard two-factor interpretation).","tip":"Hygiene = prevent; motivator = drive.","opts":["True","False"],"ans":[0]},{"id":"n25695607","sec":4,"type":"tf","topic":"interpersonal","concept":"conflict-styles","diff":"M","cat":"A","beyond":false,"q":"Collaborating is a conflict handling style that tries to satisfy the concerns of both parties.","exp":"Collaborating is the win-win style, considered best for both parties in the course's assignment.","tip":"Collaborate = win-win.","opts":["True","False"],"ans":[0]},{"id":"nf32dda9d","sec":4,"type":"tf","topic":"decision","concept":"escalation","diff":"M","cat":"A","beyond":false,"q":"Rational decision makers should include sunk costs when evaluating whether to continue a failing project.","exp":"Sunk costs cannot be recovered and should be accepted, not used to justify further investment.","tip":"Ignore sunk costs.","opts":["True","False"],"ans":[1]},{"id":"n3a7c1078","sec":4,"type":"tf","topic":"power","concept":"leader-vs-manager","diff":"M","cat":"A","beyond":false,"q":"According to the course, managers do the right things while leaders do things right.","exp":"Reverse: managers do things right; leaders do the right things.","tip":"Manager = right way; leader = right thing.","opts":["True","False"],"ans":[1]},{"id":"n6f0b9063","sec":4,"type":"tf","topic":"groups","concept":"groupthink","diff":"M","cat":"A","beyond":false,"q":"Groupthink is characterized by self-censorship and an illusion of unanimity.","exp":"Both are characteristics of groupthink.","tip":"Silence = agreement illusion.","opts":["True","False"],"ans":[0]},{"id":"n894d764e","sec":4,"type":"tf","topic":"structure","concept":"centralization","diff":"M","cat":"A","beyond":false,"q":"Decentralization helps counter information overload and facilitates speedy response.","exp":"Listed benefits of decentralization.","tip":"Decentralize = faster.","opts":["True","False"],"ans":[0]},{"id":"n8021b454","sec":4,"type":"tf","topic":"culture","concept":"culture-source","diff":"M","cat":"A","beyond":false,"q":"The ultimate source of an organization's culture is its current employees' preferences.","exp":"The source of culture is the founders' vision, mission and attitudes; practices (selection, top management, socialization) keep it alive.","tip":"Founders create culture.","opts":["True","False"],"ans":[1]},{"id":"n129a6622","sec":4,"type":"tf","topic":"change","concept":"force-field","diff":"M","cat":"B","beyond":false,"q":"Force-field analysis is the analysis of driving and restraining forces for change.","exp":"Managing change slide: force-field analysis = analyzing driving and restraining forces.","tip":"Drive vs restrain.","opts":["True","False"],"ans":[0]},{"id":"nfbe8b638","sec":4,"type":"match","topic":"perception","concept":"perceptual-organization","diff":"M","cat":"A","beyond":false,"q":"Match each perceptual principle with its description.","exp":"Proximity groups near items; closure completes figures; constancy preserves object appearance; figure-ground separates an object from its background.","tip":"PCCF.","lefts":["Proximity","Closure","Perceptual constancy","Figure-ground"],"rights":["Objects look stable despite changing viewing conditions","Nearby elements are grouped together","Separating an object from its background","Gaps are filled to perceive a complete figure"],"ans":[1,3,0,2]},{"id":"nc2d0f4c6","sec":4,"type":"match","topic":"perception","concept":"perceptual-biases","diff":"H","cat":"B","beyond":false,"q":"Match each bias with its description.","exp":"Each is a perceptual bias in social perception.","tip":"Biases in social perception.","lefts":["Halo effect","Team halo effect","Similar-to-me effect","Fundamental attribution error"],"rights":["Overweighting internal causes for others' behaviour","Crediting teams for success but not holding them accountable for failure","Overall impression affects specific judgments","Favouring people who resemble us"],"ans":[2,1,3,0]},{"id":"nbcb9c0d1","sec":4,"type":"match","topic":"learning","concept":"schedules","diff":"H","cat":"B","beyond":false,"q":"Match each reinforcement schedule with its example.","exp":"Ratio schedules depend on the number of responses; interval schedules on time; fixed = predictable, variable = unpredictable.","tip":"Ratio = count; interval = time.","lefts":["Fixed ratio","Variable ratio","Fixed interval","Variable interval"],"rights":["Slot machine payouts","Surprise supervisor inspections","Monthly salary","Bonus after every 10 units produced"],"ans":[3,0,2,1]},{"id":"n06b30e94","sec":4,"type":"match","topic":"personality","concept":"researchers","diff":"M","cat":"B","beyond":true,"q":"Match each theorist with the approach associated with him.","exp":"Freud = psychoanalytic; Rogers = self theory; Bandura = social learning (standard attribution); Allport = pioneer.","tip":"Name -> theory.","lefts":["Sigmund Freud","Carl Rogers","Albert Bandura","Gordon Allport"],"rights":["Psychoanalytic theory","Social learning theory","Self theory","Pioneer of personality research"],"ans":[0,2,1,3]},{"id":"ne0c6d2e0","sec":4,"type":"match","topic":"intro","concept":"history","diff":"M","cat":"B","beyond":false,"q":"Match each person with their contribution.","exp":"Industrial psychology and scientific management pioneers.","tip":"Taylor = SM; Munsterberg = accidents.","lefts":["Frederick W. Taylor","Hugo Munsterberg","Walter Dill Scott","Edward K. Strong Jr."],"rights":["Scientific management","Research on industrial accidents","Vocational guidance and interest inventory","Psychology in advertisement and selling"],"ans":[0,1,3,2]},{"id":"n96394393","sec":4,"type":"match","topic":"motivation","concept":"theories","diff":"M","cat":"B","beyond":false,"q":"Match the theory with its key concept.","exp":"Each pairs a theorist with the central concepts.","tip":"Names -> models.","lefts":["Maslow","Alderfer","Vroom","Herzberg"],"rights":["Hygiene factors and motivators","Existence, relatedness, growth","Expectancy, instrumentality, valence","Hierarchy of needs"],"ans":[3,1,2,0]},{"id":"ne9b79499","sec":4,"type":"match","topic":"motivation","concept":"goal-conflict","diff":"M","cat":"A","beyond":false,"q":"Match each conflict situation with its type.","exp":"Goal conflicts and role conflict are intra-personal conflicts as a motive.","tip":"Two goods, two bads, mixed.","lefts":["Choosing between two equally attractive job offers","Choosing between demotion and dismissal","A promotion that needs relocation away from family","Boss's and spouse's incompatible expectations"],"rights":["Role conflict","Approach-avoidance conflict","Approach-approach conflict","Avoidance-avoidance conflict"],"ans":[2,3,1,0]},{"id":"n47d7c94c","sec":4,"type":"match","topic":"decision","concept":"dm-biases","diff":"H","cat":"A","beyond":false,"q":"Match each decision bias with its short description.","exp":"Each bias is listed in the course.","tip":"Anchor, available, representative, frame.","lefts":["Anchoring and adjustment","Availability","Representativeness","Framing"],"rights":["Over-reliance on stereotypes","Judging likelihood by ease of recall","Decisions change with the way a problem is presented","Influenced by an initial figure"],"ans":[3,1,0,2]},{"id":"nd2ec0718","sec":4,"type":"match","topic":"structure","concept":"differentiation","diff":"M","cat":"B","beyond":false,"q":"Match each type of differentiation with an example.","exp":"Horizontal = between units; vertical = hierarchy; spatial = geography.","tip":"H/V/S.","lefts":["Horizontal","Vertical","Spatial"],"rights":["Marketing, finance and HR as separate departments","Plants in four different cities","Ten levels from CEO to front line"],"ans":[0,2,1]},{"id":"n3be112df","sec":4,"type":"mcq","topic":"interpersonal","concept":"ocb","diff":"M","cat":"A","beyond":false,"q":"Assertion (A): An employee who voluntarily mentors new joiners is displaying organizational citizenship behaviour. Reason (R): OCB involves going beyond the formal job description.","exp":"Mentoring voluntarily is altruism (OCB); OCB = beyond formal job description, which explains A.","tip":"OCB = voluntary extra.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":[0],"ar":true},{"id":"n0482b2c4","sec":4,"type":"mcq","topic":"perception","concept":"self-fulfilling","diff":"H","cat":"B","beyond":false,"q":"Assertion (A): The Pygmalion effect can improve employee performance. Reason (R): High expectations of a manager can change how the manager treats the employee, which can in turn change the employee's performance.","exp":"Pygmalion is a self-fulfilling prophecy through changed treatment and expectations.","tip":"Expectation -> treatment -> performance.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":[0],"ar":true},{"id":"n5a4058db","sec":4,"type":"mcq","topic":"learning","concept":"operant","diff":"H","cat":"B","beyond":false,"q":"Assertion (A): Punishment is a reliable way to build long-lasting good behaviour. Reason (R): Punishment can create anxiety, aggression and hatred and is often badly administered.","exp":"The course warns that punishment is a lose-lose approach; A is false, R is true.","tip":"Punishment backfires.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":[3],"ar":true},{"id":"n3494b016","sec":4,"type":"mcq","topic":"motivation","concept":"herzberg","diff":"H","cat":"A","beyond":false,"q":"Assertion (A): Providing better pay and job security will always make employees highly motivated. Reason (R): Pay and job security are hygiene factors in Herzberg's theory.","exp":"Hygiene factors prevent dissatisfaction but do not by themselves motivate; so A is false, R is true.","tip":"Hygiene != motivation.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":[3],"ar":true},{"id":"n998c16ac","sec":4,"type":"mcq","topic":"decision","concept":"groupthink","diff":"H","cat":"A","beyond":false,"q":"Assertion (A): Appointing a devil's advocate can reduce groupthink. Reason (R): Groupthink involves pressure towards uniformity and self-censorship, which a dissenting role can counter.","exp":"A devil's advocate injects dissent against uniformity pressure.","tip":"Devil's advocate = dissent.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":[0],"ar":true},{"id":"n0769d0a9","sec":4,"type":"mcq","topic":"groups","concept":"social-loafing","diff":"H","cat":"A","beyond":false,"q":"Assertion (A): Increasing identifiability of individual contributions can reduce social loafing. Reason (R): Large teams and mundane tasks always eliminate social loafing.","exp":"A is true (weekly reporting, etc.); R is false - large teams and mundane tasks promote social loafing.","tip":"Identifiable = accountable.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":[2],"ar":true},{"id":"n89deca97","sec":4,"type":"mcq","topic":"structure","concept":"formalization","diff":"H","cat":"A","beyond":false,"q":"Assertion (A): A research lab is typically less formalized than a production line. Reason (R): Greater professionalization of a job reduces the likelihood of high formalization.","exp":"Production jobs are more formalized than research jobs; professional jobs are less formalized.","tip":"Professional = freedom.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":[0],"ar":true},{"id":"n713d1af6","sec":4,"type":"mcq","topic":"culture","concept":"culture-change","diff":"H","cat":"B","beyond":false,"q":"Assertion (A): Changing organizational culture is easier in a young, small organization with a weak culture. Reason (R): Employees there have fewer years of shared values and beliefs to unlearn.","exp":"Employees find it difficult to unlearn years of shared values; age, size and strength of culture matter.","tip":"Less history = easier change.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":[0],"ar":true},{"id":"naabe1dfc","sec":4,"type":"fill","topic":"intro","concept":"behaviour-def","diff":"E","cat":"A","beyond":false,"q":"Sneezing, thinking and dreaming are all examples of ______, as defined in OB.","exp":"Behaviour = response to stimuli.","tip":"Behaviour = response.","fills":["behaviour","behavior"]},{"id":"n6bf58bbd","sec":4,"type":"fill","topic":"perception","concept":"perceptual-organization","diff":"M","cat":"A","beyond":false,"q":"The perceptual principle by which a door still looks rectangular even when viewed at an angle is called perceptual ______.","exp":"Perceptual constancy.","tip":"Constancy = stability.","fills":["constancy"]},{"id":"n80484f89","sec":4,"type":"fill","topic":"learning","concept":"schedules","diff":"M","cat":"B","beyond":false,"q":"The pattern of administering rewards is called a schedule of ______.","exp":"Schedules of reinforcement: continuous or partial.","tip":"Rewards pattern = reinforcement schedule.","fills":["reinforcement"]},{"id":"nc8e39a6e","sec":4,"type":"fill","topic":"personality","concept":"freud","diff":"M","cat":"A","beyond":false,"q":"In Freud's theory the three elements of the mind are the Id, the Super ego and the ______.","exp":"Id, Ego, Super ego.","tip":"Id-Ego-Superego.","fills":["ego"]},{"id":"nb99c8532","sec":4,"type":"fill","topic":"attitudes","concept":"dissonance","diff":"M","cat":"A","beyond":false,"q":"The uncomfortable tension arising from holding two conflicting thoughts at once is called cognitive ______.","exp":"Cognitive dissonance.","tip":"Dissonance = clash.","fills":["dissonance"]},{"id":"n23defb67","sec":4,"type":"fill","topic":"emotions","concept":"stress","diff":"M","cat":"A","beyond":false,"q":"The three stages of the General Adaptation Syndrome are alarm reaction, stage of resistance and stage of ______.","exp":"Alarm -> resistance -> exhaustion.","tip":"A-R-E.","fills":["exhaustion"]},{"id":"n8ea0804b","sec":4,"type":"fill","topic":"motivation","concept":"erg","diff":"M","cat":"A","beyond":false,"q":"In Alderfer's ERG theory the letters stand for Existence, ______ and Growth.","exp":"E-R-G.","tip":"R = relatedness.","fills":["relatedness"]},{"id":"n19dafd0c","sec":4,"type":"fill","topic":"interpersonal","concept":"trust","diff":"M","cat":"A","beyond":false,"q":"The type of trust that forms rapidly in temporary teams based on role and credibility is called ______ trust.","exp":"Swift trust.","tip":"Swift = fast.","fills":["swift"]},{"id":"n5a9eadb3","sec":4,"type":"fill","topic":"communication","concept":"nonverbal","diff":"M","cat":"A","beyond":false,"q":"The study of spatial interrelationships in communication is called ______.","exp":"Proxemics (kinesics is body movements).","tip":"Proxemics = space.","fills":["proxemics"]},{"id":"n07f88410","sec":4,"type":"fill","topic":"decision","concept":"dm-biases","diff":"M","cat":"A","beyond":false,"q":"Describing a treatment as '90% of patients survive' rather than '10% of patients die' changes people's choices because of the ______ bias.","exp":"Framing.","tip":"Frame.","fills":["framing"]},{"id":"n2ec29829","sec":4,"type":"fill","topic":"power","concept":"power-sources","diff":"M","cat":"A","beyond":false,"q":"Power based on the capacity to administer punishment is called ______ power.","exp":"Coercive power.","tip":"Coercive = coerce.","fills":["coercive"]},{"id":"nf030b0ba","sec":4,"type":"fill","topic":"structure","concept":"life-cycle","diff":"H","cat":"A","beyond":false,"q":"In the life-cycle perspective, the first stage, characterised by ambiguous goals and high creativity, is the ______ stage.","exp":"Entrepreneurial stage.","tip":"Entrepreneur = start.","fills":["entrepreneurial"]},{"id":"nc22b23c1","sec":4,"type":"fill","topic":"groups","concept":"tuckman","diff":"M","cat":"A","beyond":false,"q":"In Tuckman and Jensen's model, the stage in which rules and social relationships are established is ______.","exp":"Norming = structure.","tip":"Norms.","fills":["norming"]},{"id":"n1843b57d","sec":4,"type":"short","topic":"perception","concept":"attribution-kelley","diff":"H","cat":"A","beyond":false,"q":"Explain Kelley's three dimensions of causal attribution and state when a manager would make a personal attribution.","exp":"Attribution theory identifies internal vs external causes via the three cues.","tip":"CCD: consensus, consistency, distinctiveness.","ref":"Kelley's theory uses consensus (do other people behave the same way?), consistency (does the person behave this way repeatedly in similar contexts?) and distinctiveness (does the person behave this way in other contexts?). A personal (internal) attribution is made when consensus is low, distinctiveness is low and consistency is high.","rubric":[{"t":"Defines consensus","kw":["consensus","others","same manner"]},{"t":"Defines consistency","kw":["consistency","consistently","similar context","repeatedly"]},{"t":"Defines distinctiveness","kw":["distinctiveness","other contexts","different situations"]},{"t":"States personal attribution pattern (low consensus, low distinctiveness, high consistency)","kw":["low consensus","low distinctiveness","high consistency"]}]},{"id":"n8e02a1a4","sec":4,"type":"short","topic":"learning","concept":"reinforcement","diff":"H","cat":"A","beyond":false,"q":"Distinguish between positive reinforcement, negative reinforcement, punishment and extinction in operant conditioning, with one workplace example for each.","exp":"Operant conditioning consequences.","tip":"Reinforce = more; punish = less.","ref":"Positive reinforcement adds a desirable consequence to strengthen behaviour (praise for good work). Negative reinforcement removes or avoids an unpleasant consequence to strengthen behaviour (coming on time to avoid reprimand). Punishment presents an undesirable consequence to weaken behaviour (pay deduction). Extinction is the gradual weakening of behaviour that is no longer reinforced (ignoring an attention-seeking joke).","rubric":[{"t":"Positive reinforcement strengthens behaviour with a reward","kw":["positive","reward","strengthen"]},{"t":"Negative reinforcement strengthens by removing/avoiding aversive consequence","kw":["negative","avoid","remov","aversive"]},{"t":"Punishment weakens behaviour with an undesirable consequence","kw":["punishment","weaken","undesirable","aversive"]},{"t":"Extinction as fading when no longer reinforced","kw":["extinction","no longer reinforced","diminish","fade"]}]},{"id":"n92cb8ae1","sec":4,"type":"short","topic":"motivation","concept":"equity","diff":"H","cat":"A","beyond":false,"q":"What is organizational justice climate? Name and briefly explain its three dimensions.","exp":"Organizational justice dimensions.","tip":"DPI.","ref":"Organizational justice climate is employees' perception that the organization treats them in a fair and just manner. Distributive justice = fairness of outcomes/rewards; procedural justice = fairness of the processes used to decide; interactional justice = fairness and respect in interpersonal treatment.","rubric":[{"t":"Defines justice climate as perceived fair treatment","kw":["fair","just","treats"]},{"t":"Distributive justice (fair outcomes)","kw":["distributive","outcome","reward"]},{"t":"Procedural justice (fair procedures)","kw":["procedural","procedure","process"]},{"t":"Interactional justice (fair interpersonal treatment)","kw":["interactional","treatment","respect","interpersonal"]}]},{"id":"n2949cc99","sec":4,"type":"short","topic":"decision","concept":"groupthink","diff":"H","cat":"A","beyond":false,"q":"Define groupthink, list any three of its characteristics and suggest two remedies.","exp":"Groupthink theory.","tip":"Groupthink = harmony > thinking.","ref":"Groupthink is a type of thought in which group members minimize conflict and reach consensus without critically testing, analysing and evaluating ideas. Characteristics: illusion of invulnerability, collective rationalization, unquestioned belief, stereotypical views, direct pressure, self-censorship, shared illusion of unanimity. Remedies: assign a devil's advocate, invite outsiders, use multiple groups, hold a second-chance meeting.","rubric":[{"t":"Definition: minimizing conflict/consensus without critical evaluation","kw":["conflict","consensus","critical","evaluat"]},{"t":"At least three characteristics","kw":["invulnerab","rationaliz","unquestion","stereotyp","pressure","censor","unanimity"]},{"t":"At least two remedies","kw":["devil","outsider","second chance","multiple groups","critical thinking"]}]},{"id":"n1ec978fd","sec":4,"type":"short","topic":"power","concept":"leader-vs-manager","diff":"M","cat":"A","beyond":false,"q":"Differentiate between a manager and a leader using at least three points from the course.","exp":"Leader vs manager.","tip":"Manage = right way; lead = right thing.","ref":"Managers administer and maintain, focus on systems and structure, rely on control, take a short-range view, ask how and when, accept the status quo, and do things right. Leaders innovate and develop, focus on people, inspire trust, take a long-range view, ask what and why, challenge the status quo, and do the right things.","rubric":[{"t":"Manager vs leader on control vs trust","kw":["control","trust"]},{"t":"Manager vs leader on status quo","kw":["status quo"]},{"t":"Manager vs leader on short vs long range / how-when vs what-why","kw":["short","long","how","why"]},{"t":"Manager 'do things right' vs leader 'do the right things'","kw":["right things","things right"]}]},{"id":"n1893cd46","sec":4,"type":"short","topic":"structure","concept":"centralization","diff":"H","cat":"A","beyond":false,"q":"Discuss any three reasons why decentralization may be preferable to centralization.","exp":"Centralization-decentralization issue.","tip":"Decentralize = speed + input + motivation.","ref":"Decentralization counters information overload, facilitates speedy action and response, provides more input into decision making, motivates employees and offers training opportunities for lower-level managers. (Centralization, however, may benefit the whole organization and some activities are more efficient when centralized.)","rubric":[{"t":"Information overload","kw":["overload"]},{"t":"Speedy action/response","kw":["speed","quick","fast","response"]},{"t":"Motivation or input or training","kw":["motivat","input","training"]}]},{"id":"na1a8323d","sec":4,"type":"short","topic":"culture","concept":"culture-sustain","diff":"H","cat":"B","beyond":false,"q":"How does an organization keep its culture alive, and how do employees learn it?","exp":"Keeping a culture alive.","tip":"Select - Signal - Socialize.","ref":"Culture is sustained through selection practices (for fit), actions of top management (signals), and socialization methods. Employees learn culture through common expressions: artifacts, language/jargon, stories and myths, ceremonies, routines and rituals, behavioural norms, shared beliefs and basic assumptions.","rubric":[{"t":"Selection, top management and socialization","kw":["selection","top management","socializ"]},{"t":"Employees learn through expressions of culture","kw":["artifact","language","jargon","stories","ritual","norms","ceremon"]}]},{"id":"n87f532bd","sec":4,"type":"short","topic":"change","concept":"resistance","diff":"H","cat":"B","beyond":false,"q":"Explain Lewin's three-step change process and give two sources of individual-level resistance.","exp":"Change process.","tip":"U-M-R.","ref":"Unfreezing prepares the organization by creating readiness to leave the status quo; moving implements the change; refreezing stabilizes the new state. Individual resistance arises from cognitive biases, uncertainty and insecurity, selective perception and habit.","rubric":[{"t":"Unfreezing, moving, refreezing","kw":["unfreez","moving","refreez"]},{"t":"Two individual-level sources","kw":["habit","uncertain","insecur","selective perception","cognitive bias"]}]},{"id":"ne85275bf","sec":4,"type":"mcq","topic":"motivation","concept":"jcm","diff":"M","cat":"B","beyond":false,"q":"A company wants jobs themselves to motivate employees by giving more variety, autonomy and feedback. Which approach is this?","exp":"The course summary stresses job as the motivator and job enrichment.","tip":"Enrich the job.","opts":["Increasing hygiene factors","Using punishment schedules","Job enlargement through longer hours","Job enrichment (job characteristics approach)"],"ans":[3]},{"id":"n8e1fe0d8","sec":4,"type":"mcq","topic":"decision","concept":"group-dm","diff":"H","cat":"A","beyond":false,"q":"A manager wants individual experts, separated geographically, to give independent forecasts through repeated anonymous questionnaires. Which technique is this?","exp":"Delphi = anonymous expert opinions over iterative rounds.","tip":"Delphi = distance + anonymity.","opts":["Delphi method","Nominal group technique","Majority rule","Groupthink"],"ans":[0]},{"id":"n96f09eff","sec":4,"type":"mcq","topic":"interpersonal","concept":"psych-contract","diff":"H","cat":"A","beyond":false,"q":"Which statement correctly contrasts transactional and relational psychological contracts?","exp":"Transactional = economic, brief, narrowly defined; relational = long-term and widely defined.","tip":"Transaction = short.","opts":["Transactional is long-term and widely defined; relational is brief and economic","Transactional is primarily economic and brief/narrow; relational is long-term and widely defined","Both are written legal contracts","Neither affects trust"],"ans":[1]},{"id":"na50b6794","sec":4,"type":"mcq","topic":"communication","concept":"hidden-profile","diff":"H","cat":"A","beyond":false,"q":"Which statement about the hidden profile paradigm is TRUE?","exp":"Shared information is more likely to be exchanged first and more frequently.","tip":"Shared dominates.","opts":["It occurs only when all information is shared","Groups discuss proportionally more shared than unshared information","Unshared information is exchanged first","Groups usually discover the hidden profile easily"],"ans":[1]},{"id":"ne7061177","sec":4,"type":"mcq","topic":"groups","concept":"free-riding","diff":"H","cat":"A","beyond":false,"q":"A team member thinks 'If I work harder, the others will exploit me, so I will reduce my effort.' This phenomenon is called:","exp":"Sucker aversion is reducing effort to avoid being exploited; free riding is exploiting others.","tip":"Sucker = exploited.","opts":["Groupthink","Deindividuation","Sucker aversion","Free riding"],"ans":[2]},{"id":"nf2da201a","sec":4,"type":"mcq","topic":"emotions","concept":"emotions-types","diff":"M","cat":"A","beyond":false,"q":"Which statement correctly matches the emotion?","exp":"Resentment is mild hate; shame = inadequacy; guilt = violating standards; humiliation = reduction in status/self-respect.","tip":"Resent = mild hate.","opts":["Guilt: arises from inadequacy","Shame: feeling bad for violating standards","Resentment: a mild form of hate","Humiliation: pride in one's position"],"ans":[2]},{"id":"nd50caa38","sec":4,"type":"msq","topic":"structure","concept":"systems","diff":"H","cat":"A","beyond":false,"q":"Which statements about systems are CORRECT?","exp":"Open systems interact with the environment.","tip":"Open = interacts.","opts":["A system is a set of interrelated and interdependent parts forming a unified whole","Systems contain subsystems within larger systems","Closed systems may differentiate too much from the larger system","Open systems have no interaction with the environment"],"ans":[0,1,2]},{"id":"nef14f935","sec":4,"type":"msq","topic":"motivation","concept":"content-process","diff":"H","cat":"A","beyond":false,"q":"Which statements are CORRECT?","exp":"Maslow is a content theory.","tip":"Content = what; process = how.","opts":["Expectancy theory is a process theory","Maslow's hierarchy is a process theory","Content theories ask what motivates people","Process theories ask how people get motivated"],"ans":[0,2,3]},{"id":"n6f08078c","sec":4,"type":"msq","topic":"power","concept":"politics","diff":"H","cat":"A","beyond":false,"q":"Select ALL correct statements about organizational politics.","exp":"Politics is the unauthorized use of power to enhance or protect self-interest.","tip":"Politics = self-interest.","opts":["Blaming and impression management are political behaviours","It involves unauthorized use of power","It is always formally sanctioned by the organization","Forming alliances based on shared language can be coalition building"],"ans":[0,1,3]},{"id":"nef96edc4","sec":4,"type":"msq","topic":"learning","concept":"cognitive-learning","diff":"H","cat":"A","beyond":false,"q":"Which statements about cognitive theories of learning are TRUE?","exp":"Cognitive theories emphasise internal representations and expectations; links are strengthened when choices are rewarded.","tip":"Cognition = mental maps.","opts":["Latent learning may not appear in behaviour at the time of learning","Cognitive theories deny any role of rewards","Cognitive maps are internal representations of environmental features","Links form between internal expectations and external rewards"],"ans":[0,2,3]},{"id":"n0715c5e3","sec":4,"type":"msq","topic":"emotions","concept":"aggression","diff":"H","cat":"A","beyond":false,"q":"Which are CORRECT descriptions of patterns of aggression?","exp":"Instrumental aggression uses aggression to get something.","tip":"Instrumental = a means to an end.","opts":["Irritable: response to pain or irritation","Frustration-based: when goal-oriented behaviour is blocked","Threat-based: self-defence aggression growing out of fear","Instrumental: involuntary response to pain"],"ans":[0,1,2]},{"id":"n090b249f","sec":4,"type":"msq","topic":"decision","concept":"dm-approaches","diff":"H","cat":"A","beyond":false,"q":"Which are NON-RATIONAL approaches to decision making?","exp":"Rational approach seeks the optimal decision; satisficing, incremental and garbage-can are non-rational.","tip":"Non-rational = three.","opts":["Incremental","Garbage-can","Rational approach","Satisficing"],"ans":[0,1,3]},{"id":"n15ffed33","sec":1,"type":"mcq","topic":"intro","concept":"assembly-line","diff":"E","cat":"A","beyond":false,"q":"The moving assembly line method of mass production in factories is credited to:","exp":"Henry Ford introduced the assembly line of production. Taylor is associated with scientific management and time-and-motion study.","tip":"Ford = assembly line.","opts":["Frederick W. Taylor","Hugo Munsterberg","Walter Dill Scott","Henry Ford"],"ans":[3]},{"id":"nc7a0cc06","sec":1,"type":"mcq","topic":"attitudes","concept":"attitude-def","diff":"M","cat":"A","beyond":false,"q":"Which of the following statements is the best example of an ATTITUDE (an evaluative statement)?","exp":"An attitude is an evaluative statement for or against an object, person or event. The other options are neutral facts.","tip":"Attitude = for/against.","opts":["The policy was published in March","I dislike the new overtime policy","The company has 450 employees","The shift begins at nine o'clock"],"ans":[1]},{"id":"n940b4473","sec":1,"type":"mcq","topic":"communication","concept":"climate","diff":"E","cat":"A","beyond":false,"q":"Employees in a firm feel comfortable raising concerns and sharing ideas without fear. This describes a positive:","exp":"Communication climate is the level of openness in an organization that gives members comfort in communicating.","tip":"Climate = openness.","opts":["Communication climate","Paralinguistic cue","Hidden profile","Common information effect"],"ans":[0]},{"id":"n3225218c","sec":1,"type":"mcq","topic":"intro","concept":"control-group","diff":"E","cat":"A","beyond":false,"q":"A firm tests a new training programme on one team while a second similar team continues as before for comparison. The second team is the:","exp":"The control group is the group in which no changes are made, giving a baseline for comparison with the experimental group.","tip":"Control = no change.","opts":["Focus group","Experimental group","Control group","Target group"],"ans":[2]},{"id":"n940e96ac","sec":1,"type":"mcq","topic":"motivation","concept":"frustration","diff":"M","cat":"A","beyond":false,"q":"An able employee's promotion is repeatedly blocked by a rigid seniority rule. The tension she experiences while pursuing the goal is best called:","exp":"Frustration arises when goal-directed behaviour is blocked by barriers.","tip":"Barrier = frustration.","opts":["Role conflict","Frustration","Approach-approach conflict","Achievement motive"],"ans":[1]},{"id":"n3510aa4e","sec":1,"type":"mcq","topic":"intro","concept":"ob-why","diff":"E","cat":"A","beyond":false,"q":"Which of the following is a reason given in the course for studying OB?","exp":"Why study OB: understand employee behaviour, predict employee reactions and plan effective interventions.","tip":"Understand - Predict - Plan.","opts":["To understand employee behaviour and predict employee reactions","To replace technology with people","To avoid all workplace conflict","To eliminate the need for HR managers"],"ans":[0]},{"id":"n907a1d7e","sec":1,"type":"mcq","topic":"perception","concept":"social-perception","diff":"E","cat":"A","beyond":false,"q":"Combining, integrating and interpreting information about others to gain an accurate understanding of them is called:","exp":"Social perception is the process of combining, integrating and interpreting information about others.","tip":"Social perception = understanding others.","opts":["Perceptual closure","Sensation","Selective perception","Social perception"],"ans":[3]},{"id":"n49209491","sec":1,"type":"mcq","topic":"structure","concept":"structure-def","diff":"E","cat":"A","beyond":false,"q":"Which phrase BEST describes organizational structure?","exp":"Structure = formal system of tasks and authority relationships. Shared values = culture.","tip":"Structure = formal tasks + authority.","opts":["The yearly profit and loss figures of each department","The formal system of task and authority relationships that controls coordination","The shared values and beliefs of employees","The informal friendships and social networks among employees"],"ans":[1]},{"id":"ne173fdae","sec":2,"type":"mcq","topic":"perception","concept":"attribution","diff":"H","cat":"A","beyond":false,"q":"A manager asks, 'Did Sunita miss the deadline because of her own working style, or because the client changed the requirements?' The manager is engaged in:","exp":"Attribution = determining causes (internal vs external) behind another's behaviour.","tip":"Attribution = cause finding.","opts":["Attribution","Impression management","Perceptual grouping","Stereotyping"],"ans":[0]},{"id":"n4b98a9bd","sec":2,"type":"mcq","topic":"emotions","concept":"burnout","diff":"H","cat":"A","beyond":false,"q":"After months of excessive workload an employee is exhausted, cynical and sees no meaning in her work. This is best described as:","exp":"Burnout is complete exhaustion after prolonged stress with a loss of meaning; the alarm reaction is only the first stage of the General Adaptation Syndrome.","tip":"Burnout = exhausted + meaningless.","opts":["Eustress","Mood congruence","Alarm reaction","Burnout"],"ans":[3]},{"id":"n8a81cd34","sec":2,"type":"mcq","topic":"emotions","concept":"mood","diff":"H","cat":"A","beyond":false,"q":"Which statement correctly distinguishes mood from emotion?","exp":"The course defines mood as unfocused and mild, existing as background to daily experience; emotions most of the time have an object.","tip":"Mood = background.","opts":["Mood is intense and has a clear object, emotion is diffuse","Mood and emotion are identical terms for the same short-lived feeling","Mood is an unfocused, mild background feeling, whereas emotions usually have an object","Mood is a social emotion based on information external to oneself"],"ans":[2]},{"id":"nc0458b39","sec":2,"type":"mcq","topic":"intro","concept":"org-def","diff":"H","cat":"A","beyond":false,"q":"Which of the following is NOT part of the course's definition of an organization?","exp":"Organizations pursue a common goal or set of goals, which need not be profit (e.g. UNICEF).","tip":"Goal(s), not only profit.","opts":["Functions on a relatively continuous basis","An identifiable boundary","A consciously coordinated social entity","Exists only to earn profit"],"ans":[3]},{"id":"ne20fd4f4","sec":2,"type":"mcq","topic":"intro","concept":"role","diff":"H","cat":"A","beyond":false,"q":"A woman's job title is 'Senior Manager - Finance'. Colleagues expect her to mentor juniors, approve budgets on time and represent the team. These expectations are her:","exp":"A role is the social expectation on an individual. A designation is the title, a job a set of tasks, and a task a single unit of work.","tip":"Role = expectations.","opts":["Task","Designation","Role","Job"],"ans":[2]},{"id":"na77d3911","sec":2,"type":"mcq","topic":"perception","concept":"subjectivity","diff":"H","cat":"A","beyond":false,"q":"Two employees read the same announcement of a merger. One sees an opportunity, the other a threat. Which statement best explains this?","exp":"The course stresses that perception is subjective: the same stimulus can be organized and interpreted differently.","tip":"Same stimulus, different meaning.","opts":["One of them must be mistaken, since perception is objective","The announcement was ambiguous only because of noise","Perception is an individual's view of reality and is highly subjective","Both used the same attribution pattern"],"ans":[2]},{"id":"na4356f59","sec":2,"type":"mcq","topic":"power","concept":"tacit-knowledge","diff":"H","cat":"A","beyond":false,"q":"A veteran technician can sense that a machine is about to fail but cannot write down the rule she uses. This know-how is best called:","exp":"Tacit knowledge is information or skill one possesses which cannot be recorded or measured easily.","tip":"Tacit = unwritten know-how.","opts":["Procedural justice","Tacit knowledge","Codified (explicit) knowledge","Referent power"],"ans":[1]},{"id":"n978efcda","sec":2,"type":"mcq","topic":"intro","concept":"time-motion","diff":"H","cat":"A","beyond":false,"q":"A consultant observes workers, notes every movement in an assembly task and calculates the average time each step takes. This is a:","exp":"Breaking a job into tasks and measuring the average time each takes is a time-and-motion study (Taylor's scientific management).","tip":"Time + motion = task timing.","opts":["Time and motion study","Bank wiring observation","Job enrichment programme","Hawthorne illumination study"],"ans":[0]},{"id":"n8d9fcaf3","sec":2,"type":"mcq","topic":"culture","concept":"culture-types","diff":"H","cat":"A","beyond":true,"q":"A hobby association whose members join mainly to belong and socialise is most likely to have a culture driven by which motive?","exp":"Affiliation motive = need to be part of a group; the assignment key linked club culture to affiliation. (Classification beyond the slides.)","tip":"Club = affiliation.","opts":["Power","Affiliation","Security","Achievement"],"ans":[1]},{"id":"nd99ff117","sec":3,"type":"msq","topic":"communication","concept":"common-info","diff":"M","cat":"A","beyond":false,"q":"Which of the following are cases discussed under the common information effect?","exp":"The course lists three cases: non-overlapping, distributed partial overlap and fully shared.","tip":"Three overlap cases.","opts":["Nominal-delphi case","Non-overlapping case","Fully shared case","Distributed partial overlap"],"ans":[1,2,3]},{"id":"n92ee0200","sec":3,"type":"msq","topic":"intro","concept":"ob-disciplines","diff":"M","cat":"A","beyond":false,"q":"Which disciplines are mentioned as making OB interdisciplinary in the late 20th century?","exp":"The course lists psychology, sociology, communication and anthropology.","tip":"PSCA.","opts":["Psychology","Communication","Anthropology","Sociology","Astronomy"],"ans":[0,1,2,3]},{"id":"n06a28652","sec":3,"type":"msq","topic":"personality","concept":"type-trait","diff":"M","cat":"A","beyond":false,"q":"Select ALL correct statements about personality types and traits.","exp":"Type = style (categories); traits are individual characteristics that differ in degree.","tip":"Type = category; trait = characteristic.","opts":["Personality types are also called personality styles","Trait theory sorts people into mutually exclusive categories","Types and traits are identical terms","Traits are individual characteristics"],"ans":[0,3]},{"id":"n0f2cd8ff","sec":3,"type":"msq","topic":"communication","concept":"nonverbal","diff":"M","cat":"A","beyond":false,"q":"Which TWO of these study non-verbal spatial or body aspects of communication?","exp":"Proxemics = space; kinesics = body movements. Encoding, decoding and noise are components of the communication process.","tip":"Space & body.","opts":["Noise","Proxemics","Decoding","Kinesics","Encoding"],"ans":[1,3]},{"id":"nc05e5eef","sec":3,"type":"msq","topic":"motivation","concept":"erg","diff":"M","cat":"A","beyond":false,"q":"Which statements correctly contrast Maslow's hierarchy with Alderfer's ERG?","exp":"Maslow = five levels; ERG = three categories.","tip":"5 vs 3.","opts":["ERG groups needs into existence, relatedness and growth","Maslow groups needs into three categories","ERG describes five levels of needs","Maslow describes five levels of needs"],"ans":[0,3]},{"id":"n20e48a47","sec":3,"type":"msq","topic":"emotions","concept":"stress","diff":"M","cat":"A","beyond":false,"q":"Which statements about the General Adaptation Syndrome are correct?","exp":"Order: alarm -> resistance -> exhaustion.","tip":"A-R-E.","opts":["The alarm reaction is the final stage","The alarm reaction involves adrenaline discharge and an increased heart rate","The stage of resistance occurs before the alarm reaction","The stage of exhaustion involves collapse and drop in energy levels"],"ans":[1,3]},{"id":"n109e14f5","sec":3,"type":"msq","topic":"power","concept":"leadership-styles","diff":"M","cat":"A","beyond":false,"q":"Which TWO are sub-styles of democratic leadership?","exp":"Within democratic leadership the course lists consultative (consult then decide) and persuasive (decide, then persuade).","tip":"Democratic = consultative + persuasive.","opts":["Laissez-faire","Charismatic","Autocratic","Consultative","Persuasive"],"ans":[3,4]},{"id":"nb9323e87","sec":3,"type":"msq","topic":"decision","concept":"escalation","diff":"M","cat":"A","beyond":false,"q":"Which TWO actions help avoid escalation of commitment?","exp":"Avoiding escalation: set limits, avoid ambiguity, external reviewers, accept sunk costs, manage emotions.","tip":"Limits + outsiders.","opts":["Use external reviewers","Rely on the group's cohesiveness","Increase personal commitment to the project","Set limits in advance","Keep goals ambiguous"],"ans":[0,3]},{"id":"ne57456b5","sec":3,"type":"msq","topic":"motivation","concept":"herzberg","diff":"M","cat":"A","beyond":false,"q":"Which TWO of the following are MOTIVATORS in Herzberg's theory?","exp":"Motivators come from the work itself (recognition, advancement, responsibility, growth). The others are hygiene factors.","tip":"Motivators = work content.","opts":["Recognition and appreciation for the work","Opportunity for advancement","Good working conditions","Job security","Company rules and policies"],"ans":[0,1]},{"id":"n06f284bc","sec":4,"type":"tf","topic":"intro","concept":"control-group","diff":"E","cat":"A","beyond":false,"q":"The control group is the group that receives the experimental change.","exp":"The control group is the group in which no changes are made; the experimental group receives the change.","tip":"Control = unchanged.","opts":["True","False"],"ans":[1]},{"id":"n0cc30541","sec":4,"type":"fill","topic":"emotions","concept":"burnout","diff":"M","cat":"A","beyond":false,"q":"Complete exhaustion after prolonged stress, accompanied by a feeling of lack of meaning, is called ______.","exp":"Burnout.","tip":"Burnout = exhausted.","fills":["burnout","burn out","burn-out"]},{"id":"nbbc7b5a6","sec":4,"type":"fill","topic":"intro","concept":"role","diff":"M","cat":"A","beyond":false,"q":"A role is the ______ expectation on an individual.","exp":"Role = social expectation.","tip":"Role = social expectation.","fills":["social"]},{"id":"n10f4d1de","sec":4,"type":"match","topic":"communication","concept":"comm-process","diff":"M","cat":"A","beyond":false,"q":"Match each communication-process term with its meaning.","exp":"Components of the communication process.","tip":"SMCRN.","lefts":["Encoding","Decoding","Channel","Noise"],"rights":["Translating the sender's message","Medium the message travels along","Disturbance interfering with transmission, receipt or feedback","Converting a message into symbols"],"ans":[3,0,1,2]},{"id":"n1bf265af","sec":4,"type":"tf","topic":"emotions","concept":"mood","diff":"M","cat":"A","beyond":false,"q":"Moods usually have a clear object, whereas emotions are diffuse background feelings.","exp":"Reverse: emotions most often have an object; a mood is an unfocused background feeling.","tip":"Mood = unfocused.","opts":["True","False"],"ans":[1]},{"id":"n5f75f617","sec":4,"type":"fill","topic":"decision","concept":"dm-biases","diff":"H","cat":"A","beyond":false,"q":"According to prospect theory, decision makers find the prospect of an actual ______ more painful than giving up the possibility of a gain.","exp":"Prospect theory: losses loom larger than gains.","tip":"Prospect: loss hurts.","fills":["loss"]},{"id":"n2d8c73c4","sec":4,"type":"short","topic":"structure","concept":"structure-def","diff":"M","cat":"A","beyond":false,"q":"Define organizational structure and briefly explain horizontal, vertical and spatial differentiation.","exp":"Complexity of structure.","tip":"H/V/S.","ref":"Organizational structure is the formal system of task and authority relationships that controls how people coordinate their actions and use resources to achieve goals. Horizontal differentiation is differentiation between units by orientation, task, education and training; vertical differentiation is the depth of the hierarchy (number of levels); spatial differentiation is the geographic dispersion of offices, plants and personnel.","rubric":[{"t":"Defines structure as formal system of task and authority relationships","kw":["formal","task","authority"]},{"t":"Horizontal differentiation","kw":["horizontal","units","departments"]},{"t":"Vertical differentiation","kw":["vertical","levels","hierarch"]},{"t":"Spatial differentiation","kw":["spatial","geograph","disper"]}]}],"revision":{"people":[["Frederick W. Taylor","Scientific management; time-and-motion study; four principles; incentives for productivity"],["Hugo Munsterberg","Industrial accidents research; book 'Psychology and Industrial Efficiency'"],["Walter Dill Scott","Applying psychology to advertisement and selling"],["Edward K. Strong Jr.","Vocational guidance; Strong-Campbell interest inventory"],["Henry Ford","Introduced the assembly line of production"],["Hawthorne studies","Illumination (1924-27), relay assembly test room (1927-32), bank wiring observation room (1931-32); Hawthorne effect"],["Harold Kelley","Causal attribution theory: consensus, consistency, distinctiveness"],["Thorndike","Law of effect (operant conditioning)"],["Pavlov","Classical conditioning (dog experiment)"],["Albert Bandura","Social learning theory / observational learning"],["Gordon Allport","Pioneer of personality theory (1937)"],["Sigmund Freud","Psychoanalytic theory: levels of consciousness; Id, Ego, Super ego"],["Carl Rogers","Self theory: free will, self-concept, self-esteem, unconditional acceptance"],["Abraham Maslow","Hierarchy of needs"],["Frederick Herzberg","Two-factor theory: hygiene factors and motivators"],["Clayton Alderfer","ERG theory: existence, relatedness, growth"],["Victor Vroom","Expectancy theory: expectancy, instrumentality, valence"],["Tuckman and Jensen (1977)","Group development: forming, storming, norming, performing, adjourning"],["Blake and Mouton","Managerial Grid (ideal = team leader 9,9)"],["Fiedler","Contingency model: task structure, leader-member relations, positional power"],["Hersey and Blanchard","Situational leadership: telling, selling, participating, delegating"],["Hofstede","Cultural dimensions; organizational culture as collective programming of the mind (1991)"],["Lewin","Change process: unfreezing, moving, refreezing (the course lists the three steps)"],["Viktor Frankl","'The last of the human freedoms is to choose one's attitude' (attitudes slide quote)"]],"confusable":[["Negative reinforcement vs punishment","Negative reinforcement REMOVES/AVOIDS an aversive consequence to STRENGTHEN behaviour. Punishment ADDS an aversive consequence to WEAKEN behaviour."],["Extinction vs punishment","Extinction: stop reinforcing and the response fades. Punishment: actively apply an unpleasant consequence."],["Halo effect vs team halo vs similar-to-me","Halo: one trait colours all judgments. Team halo: credit the team for success, not blame for failure. Similar-to-me: favour people like us."],["Pygmalion vs Golem vs Hawthorne effect","Pygmalion: high expectations -> better performance. Golem: low expectations -> poor performance. Hawthorne: behaviour changes because people are observed."],["Consensus vs consistency vs distinctiveness","Consensus = other people; Consistency = same person over time in similar context; Distinctiveness = same person in different contexts."],["Sensation vs perception","Sensation receives raw stimuli; perception organizes and interprets them."],["Id vs Ego vs Super ego","Id = pleasure principle; Ego = reality principle; Super ego = morality."],["Blind vs Hidden (Johari)","Blind = unknown to self, known to others. Hidden = known to self, unknown to others."],["Opinion vs attitude vs value vs belief","Opinion: specific, cognitive. Attitude: evaluative, 3 components. Value: few, permanent, central. Belief: a judgment, mostly emotionally neutral."],["Emotional labour vs emotional dissonance","Labour = the effort of holding back true emotions. Dissonance = the inconsistency between felt and expressed emotion."],["Mood vs emotion","Mood is unfocused and mild (background); emotions usually have an object."],["Self-conscious vs social emotions","Self-conscious (shame, guilt, embarrassment, pride) stem from within; social (pity, envy, jealousy) depend on information external to the self."],["Shame vs guilt vs humiliation vs resentment","Shame = inadequacy; guilt = violating standards; humiliation = reduced to lower position; resentment = mild hate."],["Eustress vs distress vs hyper vs hypo stress","Eustress = positive; distress = negative; hyper = overload; hypo = under-stimulation."],["Content vs process motivation theories","Content = WHAT motivates (Maslow, Herzberg, ERG). Process = HOW motivation occurs (Vroom, equity)."],["Hygiene vs motivators","Hygiene (pay, security, working conditions, policies, status, personal life, supervision) prevent dissatisfaction. Motivators (interesting job, recognition, advancement, responsibility, growth, achievement) motivate."],["Distributive vs procedural vs interactional justice","Outcomes vs process vs interpersonal treatment."],["Relational vs transactional psychological contract","Relational = long-term, wide; transactional = economic, brief, narrow."],["Altruism vs courtesy vs civic virtue vs sportsmanship vs conscientiousness","Altruism = helping without return; courtesy = respect/consideration; civic virtue = involvement in the organization and treating common resources responsibly; sportsmanship = no complaining; conscientiousness = going beyond minimum."],["Type of conflict vs level of conflict","Types: relational, task, process. Levels: intrapersonal, interpersonal, intra-group, inter-group."],["Competing vs collaborating vs compromising vs accommodating vs avoiding","Competing = win-lose; collaborating = win-win; compromising = each gives; accommodating = yield; avoiding = withdraw."],["Encoding vs decoding","Encoding = sender converts message to symbols; decoding = receiver translates the message."],["Proxemics vs kinesics","Proxemics = space; kinesics = body movements."],["Satisficing vs incremental vs rational vs garbage-can","Rational = optimal; satisficing = satisfactory; incremental = smallest tolerable response; garbage-can = near random."],["Groupthink vs Abilene paradox vs group polarization","Groupthink: conformity and harmony suppress critical thinking. Abilene: pluralistic ignorance - action nobody wanted. Polarization: group judgment more extreme than members' average."],["Free riding vs social loafing vs sucker aversion","Free riding: exploiting others' work and claiming credit. Social loafing: reduced effort in groups. Sucker aversion: lowering effort to avoid being exploited."],["Legitimate vs expert vs referent vs coercive vs reward power","Position vs skills vs being liked vs punishment vs rewards."],["Democratic vs laissez-faire vs paternalistic leadership","Democratic: many perspectives. Laissez-faire: responsibility shared by all ('let it be'). Paternalistic: father figure, decides but may consult."],["Horizontal vs vertical vs spatial differentiation","Between units by task vs depth of hierarchy vs geography."],["Formalization vs centralization","Formalization: standardized jobs through written rules. Centralization: where decision authority is concentrated."],["Reengineering vs restructuring vs innovation","Redesigning business processes vs changing structure (e.g. downsizing) vs new goods/services/operating systems."]],"topics":[{"id":"intro","defs":[["Organization","A consciously coordinated social entity with an identifiable boundary, functioning on a relatively continuous basis to achieve common goals."],["Behaviour","Response of the organism or system to internal or external stimuli - conscious or subconscious, overt or covert, voluntary or involuntary."],["Organizational Behaviour","Systematic study of human behaviour in organizational settings; multidisciplinary."],["Efficiency","More output for less input / optimal output for given input."],["Role","Social expectation on an individual."]],"points":["Basic assumptions: organizations consist of people; motivated people work effectively; disparity of organizational and individual goals; impact of policies on people not always predictable.","Fundamental ideas: each individual is different; multiple roles; motivation is the force behind; human dignity.","Levels: individual (perception, personality, attitudes, motivation) - group (teams, conflict, leadership, power, politics) - organization (change, culture, climate, structure).","History: industrial psychology -> scientific management -> human relations (Hawthorne) -> interdisciplinary OB.","Taylor's four principles: scientifically study jobs (time-and-motion), select and train, cooperate with workers, divide work and responsibility; incentives.","Emerging concerns: technology, globalization, diversity and teamwork, ethics and CSR."],"misconceptions":["Hawthorne did NOT study the assembly line's effect on health; first set = lighting.","A country is not an 'organization' in the course's example."],"memory":["Industrial Psychology = Mother of OB","Hawthorne: Light - Relay - Bank"]},{"id":"perception","defs":[["Perception","Process of giving meaning to sensory stimuli through organizing and interpreting; highly subjective."],["Social perception","Combining, integrating and interpreting information about others to understand them."],["Attribution","Process of determining the causes behind others' behaviour."],["Stereotyping","Belief that all members of a group share similar traits and behave the same way."],["Self-fulfilling prophecy","Expectations that cause themselves to come true: Pygmalion (positive) and Golem (negative)."]],"points":["Sub-processes: stimulus, registration, interpretation, feedback, consequence.","External selection factors: intensity, size, contrast, repetition, motion, novelty/familiarity. Internal: habit, motivation/interest, learning, organizational role.","Perceptual organization: grouping (proximity etc.), closure, figure-ground, perceptual constancy.","Kelley: Low consensus + low distinctiveness + high consistency = personal; high-high-high = stimulus; high consensus + low distinctiveness + low consistency = circumstance.","Biases: FAE, halo, team halo, similar-to-me, selective perception, first-impression error.","HR implications: impression management; bias and stereotyping in selection and appraisal; glass ceiling."],"misconceptions":["Perception is NOT objective.","FAE = underestimating external causes for OTHERS' behaviour."],"memory":["Personal attribution = Lonely behaviour (L-L-H)","Halo = one trait lights up everything"]},{"id":"learning","defs":[["Learning","Relatively permanent change in behaviour occurring as a result of experience."],["Operant conditioning","Instrumental conditioning: Antecedent - Behaviour - Consequence; law of effect (Thorndike)."],["Positive reinforcement","Reward that strengthens behaviour."],["Negative reinforcement","Avoidance of an undesirable consequence that strengthens behaviour."],["Punishment","Presenting an aversive consequence in response to unwanted behaviour."],["Extinction","Gradual diminishing of responses that are no longer reinforced."],["Latent learning","Learning not apparent at the time but manifest later when suitable motivation/circumstances appear."],["Cognitive map","Internal perceptual representation of environmental features and landmarks."]],"points":["Theories: behaviouristic (classical, operant), cognitive, social learning.","Schedules: continuous; partial = fixed/variable interval, fixed/variable ratio.","Hot-stove punishment: warn, prompt, consistent, impersonal.","Observational learning steps: attention, retention, behavioural reproduction, motivation.","Training: motivate participation, periodic programs, transfer opportunities, feedback, role models/mentoring."],"misconceptions":["Punishment is not negative reinforcement.","Punishment can increase negative behaviour by drawing attention."],"memory":["US -> UR (natural); CS -> CR (learned)","Reinforcement = more; punishment = less"]},{"id":"personality","defs":[["Personality","Relatively stable characteristics that influence behaviour, attitudes, motivations and emotions; persona = mask."],["Machiavellianism","Willingness to manipulate others for one's own purpose; low trust, closed minded, power centred."],["Locus of control","Internal = I control outcomes; external = others/outside factors control."],["Aptitude / skill / ability","Ability = capability; skill = learned ability; aptitude = natural or acquired potential for learning in an area."]],"points":["Determinants: heredity, brain functions, physical features, culture, early childhood, significant others, socialization, identification.","Theories: intra-psychic (Freud), type, trait (Big Five), social learning, self theory (Rogers).","Freud levels: conscious, subconscious, unconscious (deepest). Id (pleasure) - Ego (reality) - Super ego (morality).","Big Five (course list): adjustment, sociability, conscientiousness, agreeableness, intellectual openness.","High self-esteem: realistic, moderate risk takers, motivated, disciplined, ready to take responsibilities.","Johari: Open, Blind, Hidden, Unknown.","Measures: objective tests, projective tests."],"misconceptions":["High self-esteem is not domination.","Personality can change via social factors according to many psychologists."],"memory":["Blind = they see it, I do not","Rogers = Self; Freud = Psychoanalytic; Bandura = Social learning"]},{"id":"attitudes","defs":[["Attitude","Evaluative statement towards objects, people or events; tendency to react in a certain way."],["Value","Concept of the desirable; internalized standard; fewer than attitudes; permanent; central."],["Opinion","Specific and primarily cognitive; influenced by attitudes."],["Cognitive dissonance","Uncomfortable tension from holding two conflicting thoughts; a motivator for change."],["Organizational commitment","Belief in and acceptance of goals + willingness to exert effort + desire to remain."]],"points":["Components: cognitive, affective, behavioural.","Characteristics: valence, multiplexity, relation to needs, centrality.","Formation: experiences, association, family, peers/society, models, institutions.","Measurement: Thurstone, Likert, Bogardus, Guttman, projective tests; issues: social desirability, subjectivity, sampling, open vs closed questions.","Changing attitudes: information, reinforcement, opportunities to explore.","Job satisfaction determinants: challenging work, equitable rewards, supportive conditions and colleagues, personality-job fit.","Overcoming discrimination: diversity management, affirmative action, sensitivity training."],"misconceptions":["Values are fewer than attitudes.","Opinion is cognitive, not affective."],"memory":["ABC of attitudes: Affective, Behavioural, Cognitive"]},{"id":"emotions","defs":[["Mood","Unfocused, relatively mild background feeling."],["Emotional labour","Psychological effort involved in holding back one's true emotions."],["Emotional dissonance","Inconsistency between felt and expressed emotions."],["Mood congruence","Tendency to recall mood-consistent things."],["Eustress","Positive stress."],["Burnout","Exhaustion after prolonged stress with a sense of meaninglessness."]],"points":["Emotions: universal, culturally shaped in expression, usually have an object, contagious.","Self-conscious (shame, guilt, embarrassment, pride) vs social (pity, envy, jealousy).","Aggression: threat-based, irritable, frustration-based, instrumental.","Non-assertiveness: fear (rejection, vulnerability, humiliation, embarrassment) and insecurity.","General Adaptation Syndrome: alarm reaction, resistance, exhaustion.","Stressors: organizational, life (changes, daily, trauma), personal (ageing).","Symptoms: behavioural (low productivity, absenteeism, conflict, suicidal tendencies, isolation); psychosomatic (sleep disturbance, BP, diabetes, back ache, bowel irritation, sexual dysfunction).","Managing stress: self awareness, mindfulness, lifestyle changes, exercise, meditation."],"misconceptions":["Emotional labour is not the same as emotional dissonance.","Stress is not only caused by negative events."],"memory":["Resentment = mild hate","Alarm - Resist - Exhaust"]},{"id":"motivation","defs":[["Motivation","Willingness to exert high levels of effort to reach a goal."],["Motive","Force that pushes you toward a goal."],["Power motive","Desire to control others."],["Achievement motive","Moderate risk taking, immediate feedback, satisfaction, preoccupation with task."],["Affiliation motive","Need to be part of a group."],["Frustration","Goal-directed behaviour blocked by barriers."],["Organizational justice climate","Employees' perception that the organization treats them fairly."]],"points":["Motive types: primary (physiological), general (curiosity etc.), secondary (security, affiliation, achievement, status).","Needs: dominant need dominates; satisfied need stops influencing; never cease; recurrent.","Intra-personal conflict: role conflict; goal conflicts (approach-approach, avoidance-avoidance, approach-avoidance).","Money: extrinsic; can restrict extra-role performance; not always first choice.","Maslow: physiological, safety, social, esteem, self-actualization.","Herzberg: hygiene vs motivators. ERG: existence, relatedness, growth. Vroom: expectancy, valence, instrumentality. Equity theory; justice: distributive, procedural, interactional. Job characteristics model.","Summary: tailor-made rewards; job as the motivator; equity and fairness; job enrichment."],"misconceptions":["Pay and security are hygiene factors, not motivators.","Working conditions = hygiene."],"memory":["Content = what; Process = how","Two goods = approach-approach"]},{"id":"interpersonal","defs":[["Psychological contract","Perceptions and expectations about mutual obligations; unwritten."],["Trust","Degree of confidence in others; involves risk taking."],["OCB","Going beyond the formal job description; social lubricant."],["Cooperation","Working together toward shared goals for mutual benefit."],["Competition","Each party maximizes own gains, often at others' expense."],["Mixed-motive situation","Both competition and cooperation present."]],"points":["Spectrum: prosocial - cooperation - competition - conflict - deviant behaviour.","Trust types: incentive-based, familiarity, similarity, social networks, swift.","OCB dimensions: altruism, conscientiousness, civic virtue, sportsmanship, courtesy.","Personal orientations: competitors, individualists, cooperators, equalizers.","Conflict reasons: individual differences, incompatible needs, perceptions, values, beliefs, culture, job design.","Levels: intrapersonal, interpersonal, intra-group, inter-group. Types: relational, task, process.","Styles: competing, accommodating, collaborating, compromising, avoiding; style depends on personality, situation, other party's strength, stakes, attitude."],"misconceptions":["Level vs type of conflict are different classifications."],"memory":["Collaborate = win-win","OCB: ACCSC"]},{"id":"communication","defs":[["Encoding","Converting a message into symbols."],["Decoding","Translating a sender's message."],["Noise","Any disturbance interfering with transmission, receipt or feedback."],["Proxemics","Study of spatial interrelationships."],["Kinesics","Study of body movements in communication."],["Communication climate","Level of openness giving members comfort in communicating."],["Hidden profile paradigm","Some information shared, some unshared; groups discuss shared info more."]],"points":["Process: sender, receiver, message, encoding, channel, decoding, noise.","Styles: driver (direct, task), animated (enthusiastic, relationship), amiable (supportive, avoids conflict), analytical (accurate, detailed).","Non-verbal: body language, gestures, facial expressions, vocal cues, silence, symbols. Western cultures read silence as non-comprehension; eastern cultures comfortable with it.","Common information effect cases: non-overlapping, distributed partial overlap, fully shared.","Handling hidden profile: focus on unshared info, problem-solving approach, rank order, alternatives one at a time, awareness, suspend judgment, build trust, minimize status difference, communicate confidence.","Meetings: attendance, punctuality, recording and distributing information, agenda building."],"misconceptions":["Groups do not easily discover hidden profiles."],"memory":["Proxemics = space; Kinesics = movement"]},{"id":"decision","defs":[["Rational approach","Optimal decisions by gathering and analysing all information."],["Satisficing","Satisfactory rather than optimal solution."],["Incremental approach","Smallest possible response reducing the problem to a tolerable level."],["Garbage-can","Near-random decision pattern."],["Escalation of commitment","Investing more in an apparently losing proposition due to past investment."],["Sunk costs","Costs that cannot be recovered."],["Groupthink","Minimizing conflict and reaching consensus without critical evaluation."],["Abilene paradox","Pluralistic ignorance - adopting a position without challenging to avoid conflict."],["Group polarization","Group makes more extreme judgments than individuals' pooled views."]],"points":["Barriers: not accepting the problem, complacency, defensive avoidance (rationalization, procrastination, buck passing), panic, not deciding to decide.","Biases: framing, prospect theory (losses hurt more), representativeness, availability, anchoring and adjustment, overconfidence.","Team decision stages: orientation, discussion, decision making, implementation.","Group techniques: nominal group, Delphi, Ringi. Majority rule issues: varying preference, blocks creativity, coalitions.","Groupthink symptoms: overestimation, close-mindedness, pressure toward uniformity.","Avoiding escalation: set limits, avoid ambiguity, external reviewers, accept sunk costs, manage emotions."],"misconceptions":["Sunk costs cannot be recovered.","Incremental != satisficing."],"memory":["Anchor = first number sticks","Defensive avoidance = R-P-B"]},{"id":"power","defs":[["Power","Ability to influence others; capacity to change behaviour or attitudes."],["Organizational politics","Unauthorized use of power to enhance or protect self-interest."],["Leadership","Ability to persuade others to seek defined objectives enthusiastically; process of influencing a group toward goals."],["Tacit knowledge","Information or skills one possesses which cannot be recorded or measured."]],"points":["Sources: legitimate, coercive, reward, expert, referent.","Political behaviours: manipulating information flow, impression management, building coalitions, blaming, creating reciprocity.","Manager vs leader: control vs trust; short vs long range; how/when vs what/why; do things right vs do the right things.","Nature: non-coercive, goal-oriented, requires followers.","Approaches: trait (great person), behavioural (autocratic, democratic, laissez-faire, paternalistic), contingency (Fiedler; Hersey-Blanchard; path-goal), charismatic, servant.","Managerial grid: team leader (9,9) is the ideal."],"misconceptions":["Leadership needs followers."],"memory":["Legit = title; Expert = skills; Referent = admiration"]},{"id":"groups","defs":[["Group","People who share goals, communicate over time and are few enough to communicate person-to-person."],["Team","Special group working interdependently with accountability and synergy."],["Free riding","Taking advantage of others and claiming ownership of their work."],["Social loafing","Reduced effort when working in a group."],["Sucker aversion","Reducing effort to avoid being exploited."]],"points":["Team types: production, service, management, project (cross-functional), action/performing, advisory, self-managing.","Tuckman and Jensen: forming (orientation), storming (conflict), norming (structure), performing (work), adjourning (dissolution).","Reasons for free riding: diffusion of responsibility, deindividuation, sucker aversion.","Social loafing conditions: large size, low instrumentality, low trust, low valence, eager beaver, mundane task, cultural factors.","Tackling loafing: identifiability, involvement, rewards, cohesion, personal responsibility, team contracts, feedback, right size.","Groupthink characteristics and remedies (organizational, leader, member, process oriented)."],"misconceptions":["Teams are a special type of group, not a subset of cohesive groups."],"memory":["F-S-N-P-A"]},{"id":"culture","defs":[["Culture","Ways of thinking, behaving and believing shared by members of a social unit."],["Organizational culture","System of shared meaning and beliefs that determines how employees act; collective programming of the mind (Hofstede)."],["Strong culture","Key values intensely held and widely shared."],["Dominant culture / subculture","Core values shared by majority / additional values in departments."]],"points":["Hofstede dimensions: power distance, uncertainty avoidance, individualism-collectivism, masculinity-femininity, long-term orientation.","Organizational culture dimensions: attention to detail, outcome orientation, people orientation, team orientation, aggressiveness, stability, innovation and risk taking.","Strength: size, tenure, turnover, leadership.","Source: founders' vision. Sustained by selection, top management, socialization.","Expressions: artifacts, language/jargon, stories/myths, ceremonies, routines/rituals, norms, shared beliefs and values, basic assumptions.","Change easier with crisis, leadership turnover, young age, small size, weak culture, absence of subcultures."],"misconceptions":["Power distance is a national cultural dimension, not an organizational dimension in the course list."],"memory":["Founder creates, practices sustain"]},{"id":"structure","defs":[["Organizational structure","Formal system of task and authority relationships controlling coordination and resource use."],["Complexity","Degree of differentiation: horizontal, vertical, spatial."],["Formalization","Degree to which jobs are standardized (written rules, policies, job descriptions)."],["Centralization","Degree to which formal authority is concentrated at the top."],["System","Set of interrelated and interdependent parts producing a unified whole."]],"points":["Dimensions: administrative component, autonomy, centralization, complexity, delegation, differentiation, formalization, integration, span of control, standardization, vertical span.","Horizontal coordination: common resources, information systems, lateral relations (direct contact, liaison roles, task forces, integrators).","Vertical coordination: formalization, span of control, centralization, delegation, line and staff.","Smaller span = taller organization.","Formalization techniques: selection, role requirements, rules, training, rituals.","Centralization factors: size, geographic dispersion, technological complexity, environmental uncertainty.","Life cycle: entrepreneurial, collectivity, formalization-and-control, elaboration-of-structure, decline."],"misconceptions":["Greater professionalization means LESS formalization."],"memory":["Narrow span = tall hierarchy"]},{"id":"change","defs":[["Organizational change","Any alteration of the status quo; moving from present to desired future state to increase effectiveness."],["Reengineering","Redesigning business processes to increase effectiveness."],["Restructuring","Changes in structure (e.g. downsizing)."],["Innovation","Developing new goods/services or new production and operating systems."],["Force-field analysis","Analysing driving and restraining forces."]],"points":["Types: evolutionary vs revolutionary, reengineering, restructuring, innovati
