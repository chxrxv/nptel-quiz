2,"type":"mcq","topic":"personality","concept":"bigfive","diff":"H","cat":"A","beyond":false,"q":"Which Big Five trait BEST predicts that a person will be reliable, organized and hard-working?","exp":"Conscientiousness = dependable, organized, achievement-oriented. Agreeableness = cooperative/trusting; sociability = outgoing; openness = curiosity.","tip":"Conscientious = careful and consistent.","opts":["Conscientiousness","Intellectual openness","Sociability","Agreeableness"],"ans":[0]},{"id":"ndaf8850b","sec":2,"type":"mcq","topic":"personality","concept":"self-esteem","diff":"H","cat":"A","beyond":false,"q":"Which employee profile is MOST consistent with high self-esteem as described in the course?","exp":"High self-esteem employees: happy, realistic expectations, realistic understanding of self, moderate risk takers, friendly, motivated, self-disciplined, take responsibility.","tip":"High self-esteem = realistic and responsible.","opts":["Avoids responsibility and seeks constant approval","Realistic, takes moderate risks, takes responsibility and is motivated","Dominates colleagues to maintain status","Takes extreme risks, blames others, resists feedback"],"ans":[1]},{"id":"ne4ea2f0f","sec":2,"type":"mcq","topic":"personality","concept":"locus","diff":"H","cat":"A","beyond":false,"q":"After failing to get a promotion, Meera says 'The panel was biased; luck was not on my side.' This suggests a(n):","exp":"Attributing outcomes to outside factors (bias, luck) reflects external locus of control.","tip":"External = blame outside.","opts":["Machiavellian orientation","External locus of control","High self-esteem","Internal locus of control"],"ans":[1]},{"id":"n6dd5747c","sec":2,"type":"mcq","topic":"personality","concept":"abilities","diff":"H","cat":"B","beyond":false,"q":"Which statement correctly distinguishes ability, skill and aptitude?","exp":"Ability = capability to perform tasks; skill = learned ability; aptitude = capacity to learn/proficiency in a discipline (aptitude tests).","tip":"Skill = trained; Aptitude = potential.","opts":["All three are synonyms for personality traits that are measured by objective tests of temperament","Skill is a natural gift that cannot be trained, whereas aptitude is learned only through formal training","Ability is a capacity to perform; skill is an ability learned through training or experience; aptitude is potential for learning in a specific area","Aptitude is a learned ability, skill is potential for learning, and ability is always measured by projective tests"],"ans":[2]},{"id":"n0fa6e0a9","sec":2,"type":"mcq","topic":"attitudes","concept":"dissonance","diff":"H","cat":"A","beyond":false,"q":"A smoker who believes smoking is harmful says 'my grandfather smoked until 90' to justify continuing. This is MOST consistent with:","exp":"Holding two conflicting cognitions (smoking is harmful; I smoke) creates tension; the person reduces it by adding a justifying thought.","tip":"Dissonance -> reduce tension.","opts":["Reduction of cognitive dissonance","Halo effect","Social desirability effect","Mood congruence"],"ans":[0]},{"id":"n509212bd","sec":2,"type":"mcq","topic":"attitudes","concept":"attitude-components","diff":"H","cat":"B","beyond":false,"q":"'I think my manager is unfair (belief). I feel angry when he speaks (feeling). I plan to apply for a transfer (intention).' Which mapping of attitude components is CORRECT?","exp":"Cognitive = beliefs/knowledge; affective = emotion; behavioural = intention to act.","tip":"C-A-B = Think-Feel-Do.","opts":["Belief = behavioural; feeling = cognitive; intention = affective","Belief = cognitive; feeling = behavioural; intention = affective","Belief = affective; feeling = cognitive; intention = behavioural","Belief = cognitive; feeling = affective; intention = behavioural"],"ans":[3]},{"id":"n0ecdda20","sec":2,"type":"mcq","topic":"attitudes","concept":"opinion","diff":"H","cat":"A","beyond":false,"q":"Which statement distinguishes opinion from attitude correctly?","exp":"Opinion = specific, mostly cognitive; attitudes include affective and behavioural components and influence opinions.","tip":"Opinion is a thought; attitude is a stance.","opts":["Opinions are values that are central to the core of a person","Opinions are broader and more emotional than attitudes","Opinions are specific and primarily cognitive; attitudes influence opinions","Attitudes are always conscious and have only a cognitive component"],"ans":[2]},{"id":"n096f8c5c","sec":2,"type":"mcq","topic":"attitudes","concept":"values-vs-attitudes","diff":"H","cat":"A","beyond":false,"q":"Which statement about values is INCORRECT?","exp":"Values are FEWER than attitudes and transcend specific objects, situations and persons.","tip":"Values: few, deep, durable.","opts":["They are relatively permanent and resistant to change","They provide standards of competence and morality","They are central to the core of a person","They are more numerous than attitudes and specific to situations"],"ans":[3]},{"id":"nb46d8a7c","sec":2,"type":"mcq","topic":"attitudes","concept":"attitude-measure","diff":"H","cat":"A","beyond":false,"q":"A firm uses an anonymous online survey on 'attitude to overtime'. Results are extremely positive, but turnover is high. Which measurement issue most plausibly explains the mismatch?","exp":"Respondents may give socially acceptable rather than honest answers even in surveys; the slides list social desirability effect and subjectivity as key issues.","tip":"Say what looks good.","opts":["Social desirability effect and subjectivity in response","Sampling error only, because the survey was conducted online","Low centrality of the attitude object","The use of open ended rather than closed questions"],"ans":[0]},{"id":"n3ed4f4df","sec":2,"type":"mcq","topic":"attitudes","concept":"job-satisfaction","diff":"H","cat":"A","beyond":false,"q":"Which factor is NOT listed as a determinant of job satisfaction in the course?","exp":"Determinants: mentally challenging work, equitable rewards, supportive working conditions, supportive colleagues, personality-job fit, personal characteristics.","tip":"'Mentally challenging, equitable, supportive.'","opts":["Equitable rewards","Larger office space","Mentally challenging work","Supportive colleagues"],"ans":[1]},{"id":"n4ec1fb17","sec":2,"type":"mcq","topic":"attitudes","concept":"attitude-char","diff":"H","cat":"A","beyond":false,"q":"An employee strongly dislikes the new HR policy but the policy hardly matters to her job. Which characteristics of her attitude are high/low?","exp":"Valence = degree of (un)favourableness (strong dislike), centrality = importance of the object (low).","tip":"Valence = intensity; Centrality = importance.","opts":["Low valence, high centrality","High multiplexity, high centrality","Low valence, low centrality","High valence, low centrality"],"ans":[3]},{"id":"nb1a8be9d","sec":2,"type":"mcq","topic":"emotions","concept":"emotional-labor","diff":"H","cat":"A","beyond":false,"q":"A flight attendant stays smiling at a rude passenger while feeling angry. The effort of holding back real feelings is __ and the mismatch between felt and shown emotion is __.","exp":"Emotional labour = psychological effort in holding back one's true emotions; emotional dissonance = inconsistency between felt and expressed.","tip":"Labour = effort; Dissonance = gap.","opts":["mood congruence; emotional attachment","emotional labour; emotional dissonance","emotional dissonance; emotional labour","spillover; labour"],"ans":[1]},{"id":"nce6ec030","sec":2,"type":"mcq","topic":"emotions","concept":"mood-congruence","diff":"H","cat":"A","beyond":false,"q":"After an argument with her team lead, Anita recalls all the previous times she felt unfairly treated. This is MOST likely:","exp":"Mood congruence = recalling mood-consistent memories (bad mood -> negative memories). Spillover = emotions crossing between work and family domains.","tip":"Mood-matched memory.","opts":["Mood congruence","Emotional attachment","Work-family spillover","Instrumental aggression"],"ans":[0]},{"id":"n6fe557d3","sec":2,"type":"mcq","topic":"emotions","concept":"aggression","diff":"H","cat":"A","beyond":false,"q":"A manager shouts at a colleague to force him to reassign a task. Which aggression pattern is this?","exp":"Instrumental aggression = using aggression to get something.","tip":"Instrumental = a tool.","opts":["Threat-based","Frustration-based","Instrumental","Irritable"],"ans":[2]},{"id":"nc19db01f","sec":2,"type":"mcq","topic":"emotions","concept":"aggression","diff":"H","cat":"A","beyond":false,"q":"An employee blocked from completing a project by a slow approval process lashes out at the approver. The aggression is MOST accurately:","exp":"Goal-oriented behaviour is blocked = frustration-based aggression.","tip":"Blocked goal -> lash out.","opts":["Threat-based","Instrumental","Frustration-based","Irritable"],"ans":[2]},{"id":"n575a0335","sec":2,"type":"mcq","topic":"emotions","concept":"stress","diff":"H","cat":"A","beyond":false,"q":"Which statement about stress is CORRECT?","exp":"Types: eustress, distress, hyper work stress, hypo stress. GAS order: alarm -> resistance -> exhaustion.","tip":"Too much or too little.","opts":["Eustress is stress from negative events","Both overload and under-stimulation can lead to stress","Stress is always harmful","The stage of resistance occurs before the alarm reaction"],"ans":[1]},{"id":"n48b1ab18","sec":2,"type":"mcq","topic":"emotions","concept":"emotions-types","diff":"H","cat":"A","beyond":false,"q":"Which pair is correctly matched?","exp":"Shame = inadequacy/disreputable behaviour; guilt = violating standards; humiliation = reduced to lower position; resentment = a MILD form of hate.","tip":"Guilt = violation; Shame = inadequate.","opts":["Resentment - an intense, destructive and long-lasting form of hatred","Humiliation - feeling reduced to a lower position, an attack on self-respect","Guilt - feeling of inadequacy and disreputable behaviour","Shame - feeling bad because one has violated some standard or rule"],"ans":[1]},{"id":"n7a5a80a5","sec":2,"type":"mcq","topic":"emotions","concept":"assertive","diff":"H","cat":"A","beyond":false,"q":"Which response is MOST assertive in the sense used in the course?","exp":"Assertiveness = honest, caring, fair; clear case without being selfish, vindictive or sarcastic.","tip":"Assertive = honest + caring + fair.","opts":["Stating the case clearly while caring for the other person and being fair to oneself","Agreeing to every request without comment to avoid any embarrassment or conflict","Staying silent in the meeting to avoid rejection, and complaining about it afterwards","Sarcastically attacking the colleague's work in front of the team to make a point"],"ans":[0]},{"id":"nf1fc21bc","sec":2,"type":"mcq","topic":"motivation","concept":"herzberg","diff":"H","cat":"A","beyond":false,"q":"A company improves air-conditioning, canteen and parking but employee motivation barely changes. According to Herzberg this is because:","exp":"Working conditions and the like are hygiene factors: absence causes dissatisfaction, presence does not by itself motivate.","tip":"Hygiene removes dissatisfaction, not adds motivation.","opts":["Employee expectancy about effort leading to performance is low","Employees are in the self-actualization stage","These are motivators that should already have raised satisfaction","These are hygiene factors that only prevent dissatisfaction"],"ans":[3]},{"id":"n9b9f173d","sec":2,"type":"mcq","topic":"motivation","concept":"maslow","diff":"H","cat":"A","beyond":false,"q":"A software developer with stable income and job security still feels unfulfilled and seeks creative projects. According to Maslow, which need dominates now?","exp":"Satisfied lower needs cease to dominate; the desire for creative fulfilment signals self-actualization (the course notes satisfied needs cease to influence behaviour).","tip":"Satisfied need stops motivating.","opts":["Self-actualization","Safety","Physiological","Social"],"ans":[0]},{"id":"n423789d8","sec":2,"type":"mcq","topic":"motivation","concept":"erg","diff":"H","cat":"A","beyond":true,"q":"Alderfer's ERG theory differs from Maslow's hierarchy mainly because:","exp":"ERG = existence, relatedness, growth; if growth needs are frustrated a person may regress to relatedness (standard OB knowledge beyond slide).","tip":"ERG = 3 + regression.","opts":["It says that once a need is satisfied it never returns and never has to be addressed again","It groups needs into three and allows regression to lower needs when higher needs are blocked","It keeps five rigid levels arranged in a fixed order of satisfaction","It applies only to hygiene factors and treats motivators as irrelevant to behaviour at work"],"ans":[1]},{"id":"n165fa6c8","sec":2,"type":"mcq","topic":"motivation","concept":"expectancy","diff":"H","cat":"B","beyond":false,"q":"An employee believes extra effort will improve performance but doubts the company will reward good performance with promotion. Which Vroom component is LOW?","exp":"Instrumentality = belief that performance leads to rewards. Expectancy = effort -> performance; valence = value of the reward.","tip":"Instrumental = performance -> reward.","opts":["Valence","Equity","Expectancy","Instrumentality"],"ans":[3]},{"id":"n96f39765","sec":2,"type":"mcq","topic":"motivation","concept":"equity","diff":"H","cat":"A","beyond":false,"q":"Two colleagues do the same work. One discovers the other earns more and reduces her effort. Which theory BEST explains this?","exp":"Comparing input-outcome ratios with others: perceived inequity changes behaviour. The fairness of outcomes = distributive justice.","tip":"Compare with others -> equity.","opts":["Expectancy theory","Two-factor theory","Equity theory (distributive justice)","ERG theory"],"ans":[2]},{"id":"nb3f8aae0","sec":2,"type":"mcq","topic":"motivation","concept":"justice","diff":"H","cat":"B","beyond":false,"q":"Employees accept a pay freeze but are furious because the decision was made secretly, without explanation, and the manager spoke rudely. Which justice dimensions are MOST violated?","exp":"Secret process = procedural injustice; rude, unexplained treatment = interactional injustice.","tip":"Process + people treatment.","opts":["None; the outcome was fair","Distributive and relational","Procedural and interactional","Distributive only"],"ans":[2]},{"id":"n360ca4e5","sec":2,"type":"mcq","topic":"motivation","concept":"motives","diff":"H","cat":"A","beyond":false,"q":"A department head constantly seeks to control committees and decisions. Which psychological motive is dominant?","exp":"Power motive = desire to control others.","tip":"Power = control.","opts":["Achievement","Power","Security","Affiliation"],"ans":[1]},{"id":"nae8cafbc","sec":2,"type":"mcq","topic":"motivation","concept":"goal-conflict","diff":"H","cat":"A","beyond":false,"q":"Priya wants a promotion that requires relocating, but moving would separate her from her family. This is an:","exp":"One option with both attractive and unattractive features = approach-avoidance conflict.","tip":"One option, both good and bad.","opts":["Role conflict","Approach-approach conflict","Avoidance-avoidance conflict","Approach-avoidance conflict"],"ans":[3]},{"id":"nb2eac528","sec":2,"type":"mcq","topic":"motivation","concept":"motivation-def","diff":"H","cat":"A","beyond":false,"q":"Which statement about needs is consistent with the course?","exp":"Characteristics: dominant need dominates; satisfied needs cease to influence behaviour; needs never cease to exist; needs recur; all of us have needs.","tip":"Needs recur.","opts":["Needs are recurrent and a dominant need dominates behaviour","Only some people have needs","Needs cease to exist once satisfied for ever","A satisfied need continues to dominate behaviour"],"ans":[0]},{"id":"nf82700d9","sec":2,"type":"mcq","topic":"interpersonal","concept":"trust","diff":"H","cat":"A","beyond":false,"q":"Members of a temporary, multi-company project team trust each other from the first day because each is assigned a specialist role. This is MOST like:","exp":"Swift trust forms rapidly in temporary groups based on roles/credibility rather than history.","tip":"Swift = quick, temporary groups.","opts":["Swift trust","Trust based on similarity","Incentive-based trust","Trust based on familiarity"],"ans":[0]},{"id":"nede35135","sec":2,"type":"mcq","topic":"interpersonal","concept":"psych-contract","diff":"H","cat":"A","beyond":false,"q":"A firm that suddenly stops training and promotion promises to long-serving staff MOST directly violates the employees':","exp":"Long-term, widely defined expectations (training, career, security) form a relational contract; a violation damages trust.","tip":"Relational = long-term promises.","opts":["Spatial contract","Transactional contract only","Relational psychological contract","Legal contract only"],"ans":[2]},{"id":"ne45a8400","sec":2,"type":"mcq","topic":"interpersonal","concept":"ocb","diff":"H","cat":"A","beyond":false,"q":"Which employee behaviour is an example of OCB (and NOT part of the formal job description)?","exp":"Helping a new colleague voluntarily = altruism, a dimension of OCB.","tip":"OCB = voluntary extra.","opts":["Attending mandatory meetings only","Following safety rules required by law","Completing assigned reports","Voluntarily helping a new colleague learn the system"],"ans":[3]},{"id":"ncefea364","sec":2,"type":"mcq","topic":"interpersonal","concept":"ocb","diff":"H","cat":"A","beyond":false,"q":"An employee who never complains about minor inconveniences and keeps a positive attitude shows which OCB dimension?","exp":"Sportsmanship = tolerating less-than-ideal circumstances without complaining. Courtesy = respectful consideration of others; civic virtue = involvement in the organization.","tip":"Good sport = no complaints.","opts":["Civic virtue","Sportsmanship","Altruism","Courtesy"],"ans":[1]},{"id":"nec5f7118","sec":2,"type":"mcq","topic":"interpersonal","concept":"conflict-types","diff":"H","cat":"A","beyond":false,"q":"Two managers argue about who should control a shared budget and which team should handle a customer segment. This is MOST clearly:","exp":"Disagreement on strategy and sharing of responsibilities and resources = process conflict.","tip":"Process = who/how/resources.","opts":["Process conflict","Task conflict","Relational conflict","Intrapersonal conflict"],"ans":[0]},{"id":"na7bee4ba","sec":2,"type":"mcq","topic":"interpersonal","concept":"conflict-styles","diff":"H","cat":"A","beyond":false,"q":"Two peers each give up half their demands to settle quickly. This is which conflict handling style?","exp":"Compromising = each side gives up something (split the difference). Collaborating seeks a fully satisfying win-win solution.","tip":"Compromise = meet in the middle.","opts":["Avoiding","Collaborating","Compromising","Competing"],"ans":[2]},{"id":"ne7d4ba40","sec":2,"type":"mcq","topic":"interpersonal","concept":"cooperation-competition","diff":"H","cat":"A","beyond":false,"q":"In a sales team, Arjun wants to outperform his colleagues, Bela wants the whole team to do well and Chitra wants nobody to earn much more than others. Their orientations are, respectively:","exp":"Competitor = doing better than others; cooperator = maximizing joint outcomes; equalizer = minimizing differences.","tip":"Beat - Join - Level.","opts":["Cooperator, competitor, equalizer","Equalizer, competitor, individualist","Individualist, equalizer, cooperator","Competitor, cooperator, equalizer"],"ans":[3]},{"id":"nc3a1de5c","sec":2,"type":"mcq","topic":"communication","concept":"comm-styles","diff":"H","cat":"A","beyond":false,"q":"A colleague gives long detailed spreadsheets, checks every number twice and dislikes vague answers. Which style?","exp":"Analytical = accurate and detail oriented.","tip":"Analytical = analyse the detail.","opts":["Driver","Analytical","Amiable","Animated"],"ans":[1]},{"id":"n7daa719c","sec":2,"type":"mcq","topic":"communication","concept":"nonverbal","diff":"H","cat":"A","beyond":false,"q":"A manager from a culture comfortable with silence pauses for several seconds after asking a question; his western team members rush to fill the silence thinking he is displeased. Which concept BEST explains the misunderstanding?","exp":"Silence is interpreted differently: western cultures may read it as non-comprehension; many eastern cultures are comfortable with it.","tip":"Silence means different things.","opts":["Proxemics - differing use of personal space","The hidden profile paradigm of information sharing","Kinesics - differing use of body movements","Cultural differences in how silence is interpreted"],"ans":[3]},{"id":"nf15ab3d8","sec":2,"type":"mcq","topic":"communication","concept":"hidden-profile","diff":"H","cat":"A","beyond":false,"q":"A team of four reviews candidates. Each member holds some unique facts, but discussion centres on facts all four already know and the weakest candidate is selected. Which is the BEST remedy?","exp":"Remedies: focus on unshared/unique info, problem-solving rather than decision-making approach, rank order, consider alternatives one at a time, suspend initial judgment, build trust, minimize status difference.","tip":"Dig for the unshared.","opts":["Let the most senior member decide so that the discussion stays short","Encourage early consensus so that the group avoids open conflict","Focus on unshared information and consider alternatives one at a time","Make decisions faster so that long meetings and debates are avoided"],"ans":[2]},{"id":"n6ea69007","sec":2,"type":"mcq","topic":"communication","concept":"comm-process","diff":"H","cat":"A","beyond":false,"q":"A manager's instruction is distorted because of a noisy factory floor and the employee's misinterpretation of one word. Which components of the communication process failed?","exp":"Noise interferes with transmission; decoding is translating the message. Both are involved here.","tip":"Noise + decoding = misunderstanding.","opts":["Channel and sender only","Noise and decoding","Encoding and feedback only","Sender and message only"],"ans":[1]},{"id":"n0f92041a","sec":2,"type":"mcq","topic":"decision","concept":"dm-approaches","diff":"H","cat":"A","beyond":false,"q":"A manager reviews three vendor quotes and picks the first that meets all minimum requirements without checking the rest. This is:","exp":"Satisficing = a satisfactory (not optimal) solution.","tip":"Good enough = satisficing.","opts":["Satisficing approach","Garbage-can approach","Rational approach","Incremental approach"],"ans":[0]},{"id":"n979ddff6","sec":2,"type":"mcq","topic":"decision","concept":"dm-approaches","diff":"H","cat":"A","beyond":false,"q":"A department with falling morale makes only the smallest adjustment to bring the problem to a tolerable level and avoids any major restructuring. This is the:","exp":"Incremental approach = smallest response possible that reduces the problem to at least a tolerable level.","tip":"Incremental = inch by inch.","opts":["Satisficing approach","Incremental approach","Rational approach","Garbage-can approach"],"ans":[1]},{"id":"n14137dd5","sec":2,"type":"mcq","topic":"decision","concept":"dm-barriers","diff":"H","cat":"A","beyond":false,"q":"Which scenario best illustrates DEFENSIVE AVOIDANCE by rationalization?","exp":"Rationalization (a form of defensive avoidance) explains away the problem. Believing everything is fine = complacency; hurried decision = panic.","tip":"Rationalization = excuses.","opts":["A manager never even decides whether the problem requires a decision","A manager makes a hurried decision in a state of panic","A manager keeps believing that everything is fine despite clear warning signs","A manager says 'the complaints are not real problems; they come from unusual users'"],"ans":[3]},{"id":"n14b3e448","sec":2,"type":"mcq","topic":"decision","concept":"dm-biases","diff":"H","cat":"A","beyond":false,"q":"Before a salary negotiation, the recruiter casually mentions that 'the last person in this role earned Rs 90,000'. The candidate, who had planned to ask for Rs 70,000, ends up asking for Rs 85,000 although the figure is irrelevant to her skills. This is MOST like:","exp":"An initial figure influenced the judgment even though it was largely irrelevant: anchoring and adjustment.","tip":"Anchor sticks.","opts":["Anchoring and adjustment","Representativeness","Availability bias","Overconfidence"],"ans":[0]},{"id":"n1f61db6d","sec":2,"type":"mcq","topic":"decision","concept":"dm-biases","diff":"H","cat":"A","beyond":false,"q":"Two groups are told about a drug: one is told '90% survive', the other '10% die'. The first group is far more positive. This illustrates:","exp":"Same facts, different presentation -> different decisions = framing.","tip":"Framing = the picture frame.","opts":["Anchoring","Availability","Framing","Overconfidence"],"ans":[2]},{"id":"n5c7cf712","sec":2,"type":"mcq","topic":"decision","concept":"dm-biases","diff":"H","cat":"A","beyond":false,"q":"A recruiter assumes a candidate wearing glasses and carrying books will be good at maths because 'that is what such people are like'. Which bias?","exp":"Representativeness = being overly influenced by stereotypes when judging likelihood.","tip":"Looks like -> must be.","opts":["Availability","Representativeness","Overconfidence","Anchoring"],"ans":[1]},{"id":"n7a5c05f0","sec":2,"type":"mcq","topic":"decision","concept":"escalation","diff":"H","cat":"A","beyond":false,"q":"A company has spent Rs 5 crore on a failing product and approves another Rs 2 crore 'so that the earlier money is not wasted'. Which concept?","exp":"Investing more in a losing proposition because of past investment = escalation of commitment; sunk costs cannot be recovered and should be ignored.","tip":"Sunk cost = gone.","opts":["Group polarization towards extreme judgments","Satisficing, accepting a good-enough solution","The Abilene paradox of pluralistic ignorance","Escalation of commitment driven by sunk costs"],"ans":[3]},{"id":"nf5a23498","sec":2,"type":"mcq","topic":"decision","concept":"abilene","diff":"H","cat":"B","beyond":false,"q":"Everyone on a family trip drives 80 km to a restaurant nobody really wanted to go to because each assumed the others wanted it. This is the:","exp":"Abilene paradox = pluralistic ignorance: adopting a position without challenging to avoid conflict or reach consensus.","tip":"Abilene = nobody wanted it.","opts":["Abilene paradox","Delphi method","Groupthink","Group polarization"],"ans":[0]},{"id":"n21f579c4","sec":2,"type":"mcq","topic":"decision","concept":"groupthink","diff":"H","cat":"A","beyond":false,"q":"Which action is LEAST likely to reduce groupthink?","exp":"Leader-preferred solutions early increase pressure toward uniformity. Remedies include devil's advocate, outsiders, second-chance meeting.","tip":"Leader speaks last.","opts":["Inviting outsiders to evaluate the group's ideas critically","Assigning a member to act as a devil's advocate","Having the leader announce a preferred solution at the start","Holding a second-chance meeting before the final decision"],"ans":[2]},{"id":"n8d0dc786","sec":2,"type":"mcq","topic":"decision","concept":"polarization","diff":"H","cat":"B","beyond":false,"q":"A committee in which individuals moderately favour a risky investment ends up approving an extremely risky one. This is best explained by:","exp":"Groups can make more extreme judgments than the average of individual views.","tip":"Groups push to extremes.","opts":["Group polarization","Reinforcement","Satisficing","Anchoring"],"ans":[0]},{"id":"n8330912a","sec":2,"type":"mcq","topic":"power","concept":"power-sources","diff":"H","cat":"A","beyond":false,"q":"A newly appointed junior doctor is hugely respected by nurses because of her unparalleled diagnostic skills, although she has no formal authority over them. Her power is:","exp":"Based on skills and abilities = expert power. Referent = liked and admired.","tip":"Expert = knows.","opts":["Legitimate","Expert","Coercive","Referent"],"ans":[1]},{"id":"nf1f0a186","sec":2,"type":"mcq","topic":"power","concept":"power-sources","diff":"H","cat":"A","beyond":false,"q":"An influential engineer is followed because colleagues like and admire him, even though he has neither the rank nor special expertise. His power is:","exp":"Referent power rests on liking/admiration.","tip":"Referent = role model.","opts":["Coercive","Legitimate","Reward","Referent"],"ans":[3]},{"id":"n10e6838c","sec":2,"type":"mcq","topic":"power","concept":"politics","diff":"H","cat":"A","beyond":false,"q":"An employee 'forgets' to share important data with a rival colleague so the colleague looks unprepared. This is MOST closely:","exp":"Manipulating information flow is a political behaviour.","tip":"Control info = control power.","opts":["Building coalitions","Creating reciprocity","Manipulating information flow","Impression management"],"ans":[2]},{"id":"nd73c106f","sec":2,"type":"mcq","topic":"power","concept":"politics","diff":"H","cat":"A","beyond":false,"q":"An employee praises every decision of a senior manager and highlights only her own successes in public. Which political behaviour?","exp":"Impression management = managing how others perceive oneself.","tip":"Impression = how I look.","opts":["Blaming","Impression management","Reciprocity","Coalition building"],"ans":[1]},{"id":"n221e100a","sec":2,"type":"mcq","topic":"power","concept":"leadership-def","diff":"H","cat":"A","beyond":false,"q":"Which statement about leadership is INCORRECT per the course?","exp":"The nature of leadership: non-coercive influence, goal oriented, and it requires followers.","tip":"No followers, no leader.","opts":["Leadership influence is goal oriented","Leadership involves non-coercive influence","Leadership is the process of influencing a group toward achieving goals","Leadership does not require followers"],"ans":[3]},{"id":"n7695ad57","sec":2,"type":"mcq","topic":"power","concept":"grid","diff":"H","cat":"A","beyond":false,"q":"A leader with maximum concern for production but minimal concern for people is located at which point on the Blake-Mouton Managerial Grid?","exp":"Convention: (concern for production, concern for people). 9,1 = high production, low people.","tip":"Grid: (production, people).","opts":["1,1 Impoverished (low concern for both)","9,9 Team leader (high concern for both)","9,1 Produce or perish (high production, low people)","1,9 Country club (high people, low production)"],"ans":[2]},{"id":"n1bd88327","sec":2,"type":"mcq","topic":"power","concept":"contingency","diff":"H","cat":"B","beyond":true,"q":"A new team lacks skills and confidence but is eager. A situational leadership approach would suggest the leader use which style first?","exp":"In Hersey and Blanchard's model, low readiness calls for telling (high task, low relationship); as readiness grows: selling -> participating -> delegating (standard model detail).","tip":"Low readiness -> tell.","opts":["Telling (directive)","Delegating","Laissez-faire","Participating"],"ans":[0]},{"id":"nf1fbad40","sec":2,"type":"mcq","topic":"power","concept":"path-goal","diff":"H","cat":"A","beyond":false,"q":"Which statement about path-goal theory is MOST accurate?","exp":"Path-goal is a contingency theory about the leader clearing the path for subordinates' goals.","tip":"Path-goal = leader as guide.","opts":["Leader effectiveness depends only on task structure and not on followers' goals","The best leader is always democratic, whatever the task or the followers","Leaders motivate only to the extent they are seen as helping subordinates reach their goals","Effective leaders are born, not made, and follow a fixed set of inherited traits"],"ans":[2]},{"id":"nab0bcb07","sec":2,"type":"mcq","topic":"power","concept":"trait-approach","diff":"H","cat":"B","beyond":false,"q":"The 'great person theory' claims that:","exp":"The trait approach/great person theory seeks characteristics of great leaders (leadership motivation, flexibility, morality, energy, self-confidence, knowledge, multiple intelligences).","tip":"Trait = born leader.","opts":["Situations determine leaders","Followers choose leaders democratically","Leaders can be made by training alone","Leaders possess special inborn traits that distinguish them"],"ans":[3]},{"id":"n9be8464c","sec":2,"type":"mcq","topic":"culture","concept":"culture-dimensions","diff":"H","cat":"B","beyond":true,"q":"A company where employees expect obedience to seniors, and bosses are rarely questioned has high:","exp":"Power distance = acceptance of unequal distribution of power in hierarchy (standard Hofstede detail).","tip":"Power distance = respect for rank.","opts":["Power distance","Uncertainty avoidance","Individualism","Long-term orientation"],"ans":[0]},{"id":"n5a78e0f4","sec":2,"type":"mcq","topic":"culture","concept":"org-culture-dims","diff":"H","cat":"B","beyond":false,"q":"A technology start-up rewards experimentation and tolerates failure. Which organizational culture dimension is HIGH?","exp":"Innovation and risk taking = degree to which employees are encouraged to be innovative and take risks. The course lists: attention to detail, outcome orientation, people orientation, team orientation, aggressiveness, stability, innovation and risk taking.","tip":"Start-up = innovation.","opts":["Outcome orientation only","Innovation and risk taking","Stability","Attention to detail"],"ans":[1]},{"id":"nf19a9809","sec":2,"type":"mcq","topic":"culture","concept":"culture-expression","diff":"H","cat":"B","beyond":false,"q":"A new employee quickly picks up the unique jargon, acronyms and the unwritten way to address seniors in meetings. Which expressions of culture is he mainly learning?","exp":"Unique jargons/acronyms and behavioural norms (towards seniors, in meetings) are expressions of culture transmitted to new members through socialization.","tip":"Learn the language and norms.","opts":["Basic assumptions and physical artifacts","Language/jargon and behavioural norms","Stories, myths and legends","Ceremonies and celebrations"],"ans":[1]},{"id":"n0689a5eb","sec":2,"type":"mcq","topic":"culture","concept":"culture-change","diff":"H","cat":"B","beyond":false,"q":"Which situation makes organizational culture easiest to change?","exp":"Situational factors favour change: dramatic crisis, leadership turnover, life-cycle stage, young age, small size, weak culture, absence of subcultures.","tip":"Crisis + new boss + young + small.","opts":["An old, large, stable organization with no external pressure","A strong culture with many well-established subcultures in a mature firm","An absence of any crisis in a stable, comfortable market","A dramatic crisis with leadership turnover in a young, small organization"],"ans":[3]},{"id":"nf505d469","sec":2,"type":"mcq","topic":"culture","concept":"subcultures","diff":"H","cat":"B","beyond":false,"q":"A large hospital has a research department with its own special values in addition to the hospital's core values. This is a:","exp":"Subcultures include the core values of the dominant culture plus values unique to the department.","tip":"Sub = core + extra.","opts":["Counterculture","National culture","Subculture","Dominant culture"],"ans":[2]},{"id":"n88aedb3b","sec":2,"type":"mcq","topic":"groups","concept":"tuckman","diff":"H","cat":"A","beyond":false,"q":"A newly formed project team spends its first meetings arguing about who leads and how reporting should work. Which stage?","exp":"Conflict about roles and procedures = storming.","tip":"Storming = fight for roles.","opts":["Storming","Performing","Forming","Norming"],"ans":[0]},{"id":"n034df2d2","sec":2,"type":"mcq","topic":"groups","concept":"free-riding","diff":"H","cat":"A","beyond":false,"q":"Which scenario is a FREE RIDER, not just a social loafer?","exp":"Free riding = taking advantage of others and claiming ownership for their work. Large size, sucker aversion and mundane tasks are loafing conditions.","tip":"Free rider = ride on others.","opts":["A member refuses to over-work because others slack (sucker aversion)","A member works less because the group is large","A member is bored by a mundane task","A member contributes nothing but claims credit for the group's work"],"ans":[3]},{"id":"nd116f079","sec":2,"type":"mcq","topic":"groups","concept":"social-loafing","diff":"H","cat":"A","beyond":false,"q":"Which team design would MOST likely reduce social loafing?","exp":"Remedies: identifiability, involvement, rewards, cohesion, personal responsibility, contracts, feedback, right size.","tip":"Visible, accountable, small.","opts":["A small team with individual reporting, contracts and symbolic rewards","A team with low trust among members and no internal feedback reviews","A very large team where only a single joint score is reported","A team doing only mundane, repetitive tasks that nobody finds interesting"],"ans":[0]},{"id":"n35f67b38","sec":2,"type":"mcq","topic":"groups","concept":"group-vs-team","diff":"H","cat":"A","beyond":false,"q":"Which statement about teams versus groups is MOST consistent with the course?","exp":"Distinction is not clear-cut; teams are structured work groups with interdependence, accountability, synergy, roles, limited size.","tip":"Teams = structured groups.","opts":["The distinction is always clear-cut and every group is automatically a team","Groups always have more synergy and accountability than teams","The distinction is not clear-cut, but teams usually have more accountability and synergy","Teams are never part of larger organizations and never have specific assigned roles"],"ans":[2]},{"id":"n6c878200","sec":2,"type":"mcq","topic":"structure","concept":"complexity","diff":"H","cat":"A","beyond":false,"q":"A multinational with offices in 30 countries, many departments and 10 hierarchical levels has high:","exp":"Complexity = degree of differentiation: horizontal, vertical, spatial.","tip":"Complexity = differentiation.","opts":["A wide span of control only, because managers supervise many people","Complexity (horizontal, vertical and spatial differentiation)","High centralization only, because decisions are made at the top","High formalization only, because it has many written rules"],"ans":[1]},{"id":"n6cacb98a","sec":2,"type":"mcq","topic":"structure","concept":"span-of-control","diff":"H","cat":"B","beyond":false,"q":"If the span of control narrows (each manager supervises fewer people) while the organization size is constant, the organization generally becomes:","exp":"Smaller the span, taller the organization.","tip":"Narrow span = tall.","opts":["More decentralized by definition","Flatter","Less formalized by definition","Taller"],"ans":[3]},{"id":"n76d3f52f","sec":2,"type":"mcq","topic":"structure","concept":"formalization","diff":"H","cat":"A","beyond":false,"q":"Which statement about formalization is INCORRECT?","exp":"Greater professionalization = LESS formalization. The other statements are correct.","tip":"Professional = less formal.","opts":["Individual discretion is inversely proportional to formalization","Greater professionalization of the job increases the likelihood of high formalization","Production jobs are typically more formalized than research jobs","Formalization tends to be lower at higher levels"],"ans":[1]},{"id":"n3288e5d6","sec":2,"type":"mcq","topic":"structure","concept":"centralization","diff":"H","cat":"A","beyond":false,"q":"Which is NOT an advantage of decentralization noted in the course?","exp":"The benefit of serving the whole organization, not special-interest groups, is listed as an advantage of CENTRALIZATION.","tip":"Centralization = whole-organization view.","opts":["Counters information overload at the top of the hierarchy","Motivates employees by giving them more say in decisions","Serves the whole organization rather than special-interest groups","Facilitates speedy action and response at lower levels"],"ans":[2]},{"id":"n4f95ff24","sec":2,"type":"mcq","topic":"structure","concept":"life-cycle","diff":"H","cat":"A","beyond":false,"q":"A firm shrinking in market share with centralized decision making, rising turnover and more conflicts is in which stage?","exp":"Decline: shrinking markets, new leadership, increased competition, turnover, conflict, centralized decision making.","tip":"Decline = shrink + conflict + centralize.","opts":["Decline","Collectivity","Formalization-and-control","Elaboration of structure"],"ans":[0]},{"id":"n59689a1b","sec":2,"type":"mcq","topic":"structure","concept":"systems","diff":"H","cat":"A","beyond":false,"q":"An organization that ignores its environment and has too little integration with the larger system is best described as:","exp":"Closed systems differentiate too much from the larger system and develop their own identity.","tip":"Closed = isolated.","opts":["A closed system","A formal system","An open system","A decentralized system"],"ans":[0]},{"id":"n9857987a","sec":2,"type":"mcq","topic":"change","concept":"change-types","diff":"H","cat":"A","beyond":false,"q":"A bank replaces its entire loan approval workflow with a new end-to-end process to improve effectiveness. This is:","exp":"Reengineering = redesigning business processes (e.g. TQM). Restructuring = changing the structure (e.g. downsizing).","tip":"Re-engineer processes.","opts":["Restructuring","Reengineering","Innovation","Evolutionary change"],"ans":[1]},{"id":"nb4987db7","sec":2,"type":"mcq","topic":"change","concept":"resistance","diff":"H","cat":"B","beyond":false,"q":"Employees resist a new software because 'we have always done it this way'. At which level and form does this resistance operate?","exp":"Habit is an individual-level source of resistance.","tip":"Habit = individual.","opts":["Group level: cohesiveness","Functional level: power","Organizational level: strategy","Individual level: habit"],"ans":[3]},{"id":"nfe3eb789","sec":2,"type":"mcq","topic":"change","concept":"lewin","diff":"H","cat":"B","beyond":false,"q":"Which sequence correctly pairs Lewin's steps with activities?","exp":"Unfreeze, move, refreeze.","tip":"Melt - Shape - Freeze.","opts":["Refreezing - implementing; Moving - creating readiness; Unfreezing - stabilizing","Unfreezing - stabilizing; Moving - creating readiness; Refreezing - implementing","Unfreezing - creating readiness; Moving - implementing; Refreezing - stabilizing the new state","Moving - creating readiness; Unfreezing - implementing; Refreezing - stabilizing"],"ans":[2]},{"id":"n115f8bf0","sec":2,"type":"mcq","topic":"intro","concept":"hawthorne","diff":"H","cat":"A","beyond":false,"q":"Workers in a call centre improve productivity merely because a research team is observing them. This is called:","exp":"The Hawthorne effect = behaviour change due to attention/being observed.","tip":"Observed = improved.","opts":["The Hawthorne effect","The Golem effect","The Pygmalion effect","Social loafing"],"ans":[0]},{"id":"nd6dd1173","sec":2,"type":"mcq","topic":"intro","concept":"sci-mgmt","diff":"H","cat":"A","beyond":false,"q":"A factory engineer times each task of an assembly job to set a standard 'one best way'. Which historical movement does this reflect?","exp":"Time-and-motion study is the first principle of Taylor's scientific management.","tip":"Taylor = timing tasks.","opts":["Human relations","Scientific management","Contingency theory","Industrial psychology only"],"ans":[1]},{"id":"n8505b407","sec":2,"type":"mcq","topic":"intro","concept":"productivity-efficiency","diff":"H","cat":"A","beyond":false,"q":"A plant produces the same output as last year using 20% fewer inputs. Which term MOST precisely describes this improvement?","exp":"More output for less input = efficiency.","tip":"Efficiency = less input.","opts":["Motivation","Effectiveness","Role clarity","Efficiency"],"ans":[3]},{"id":"n52b3cf6c","sec":2,"type":"mcq","topic":"intro","concept":"ob-levels","diff":"H","cat":"A","beyond":false,"q":"Which topic does NOT belong to the INDIVIDUAL level of OB?","exp":"Organizational culture is an organizational-level process; perception, personality, attitudes and motivation are individual.","tip":"Culture = organization.","opts":["Motivation","Attitudes","Organizational culture","Perception"],"ans":[2]},{"id":"n4a06cb92","sec":3,"type":"msq","topic":"intro","concept":"sci-mgmt","diff":"M","cat":"A","beyond":false,"q":"Select ALL statements that correctly describe Frederick W. Taylor's scientific management.","exp":"Taylor: scientific study of each job (time-and-motion), selecting/training workers, cooperation and division of work, incentives. Criticized for treating humans as machines. Informal group norms and the Hawthorne Works belong to the human relations movement.","tip":"Taylor = efficiency + incentives; Hawthorne = people.","opts":["It offered incentives for increased productivity","It assumed informal group norms were the main determinant of output","It was developed at the Hawthorne Works","It used time-and-motion study to find the best method for each part of a job","It was criticized for treating humans as machines"],"ans":[0,3,4]},{"id":"nbb38b091","sec":3,"type":"msq","topic":"intro","concept":"ob-levels","diff":"M","cat":"A","beyond":false,"q":"Which of the following are INDIVIDUAL-level processes of OB?","exp":"Individual processes: perception, personality, attitudes, motivation. Team dynamics = group; culture = organizational.","tip":"Individual = inside the person.","opts":["Team dynamics","Personality","Attitudes","Organizational culture","Perception"],"ans":[1,2,4]},{"id":"na2ec33df","sec":3,"type":"msq","topic":"intro","concept":"hawthorne","diff":"M","cat":"A","beyond":false,"q":"Select ALL true statements about the Hawthorne studies.","exp":"Three phases: illumination, relay assembly test room, bank wiring observation room. They gave rise to the Hawthorne effect and the human relations movement.","tip":"L-R-B.","opts":["The first set (1924-27) investigated illumination","The second set used a relay assembly test room","They were designed by Taylor to prove scientific management","They showed that lighting was the sole determinant of productivity","The third set used a bank wiring observation room"],"ans":[0,1,4]},{"id":"n452520f7","sec":3,"type":"msq","topic":"intro","concept":"ob-assumptions","diff":"M","cat":"B","beyond":false,"q":"Which of these are listed among the basic assumptions or fundamental ideas of OB?","exp":"Basic assumptions: organizations consist of people, motivated people work effectively, disparity of goals, unpredictable impact of policies. Fundamental ideas: individual differences, multiple roles, motivation, human dignity.","tip":"OB = people differ, dignity matters.","opts":["Human dignity matters","Organizations consist of people","Policies always produce predictable effects on people","All employees share the same goals as the organization","Each individual is different"],"ans":[0,1,4]},{"id":"n2f9ae515","sec":3,"type":"msq","topic":"perception","concept":"perceptual-selection","diff":"M","cat":"A","beyond":false,"q":"Which are EXTERNAL factors influencing perceptual selection?","exp":"External: intensity, size, contrast, repetition, motion, novelty/familiarity. Internal: habit, motivation/interest, learning, organizational role.","tip":"External = stimulus features.","opts":["Intensity","Motion","Contrast","Repetition","Habit"],"ans":[0,1,2,3]},{"id":"n5e041f31","sec":3,"type":"msq","topic":"perception","concept":"perceptual-selection","diff":"H","cat":"A","beyond":false,"q":"Select ALL INTERNAL factors of perceptual selection.","exp":"Internal: habit, motivation and interest, learning, organizational role and specialization. Size and novelty/familiarity are external.","tip":"Internal = in the perceiver.","opts":["Learning","Size","Motivation and interest","Novelty","Habit"],"ans":[0,2,4]},{"id":"n434d3971","sec":3,"type":"msq","topic":"perception","concept":"perceptual-organization","diff":"M","cat":"A","beyond":false,"q":"Which are principles of perceptual organization?","exp":"Perceptual organization: grouping, closure, figure-ground, perceptual constancy. Attribution is part of social perception.","tip":"GCFC.","opts":["Attribution","Perceptual constancy","Grouping","Closure","Figure-ground"],"ans":[1,2,3,4]},{"id":"nb6e4ada5","sec":3,"type":"msq","topic":"perception","concept":"attribution-kelley","diff":"H","cat":"A","beyond":false,"q":"Select ALL correct statements about Kelley's attribution theory.","exp":"Kelley's theory distinguishes internal vs external causes using consensus, consistency and distinctiveness. Personal attribution = low consensus, low distinctiveness, high consistency.","tip":"Kelley = 3 informational cues.","opts":["High consensus, low distinctiveness and high consistency always means personal attribution","Consensus: how others behave in the same situation","It focuses on identifying the person's personality traits","Distinctiveness: whether the person behaves the same way in other contexts","Consistency: how consistently the person behaves in similar contexts"],"ans":[1,3,4]},{"id":"nc8ea6e13","sec":3,"type":"msq","topic":"perception","concept":"perceptual-biases","diff":"H","cat":"B","beyond":false,"q":"Which of the following are perceptual biases in social perception?","exp":"Biases listed: FAE, halo, team halo, similar-to-me, selective perception, first-impression error. Closure is perceptual organization.","tip":"Biases are social, closure is not.","opts":["Fundamental attribution error","Similar-to-me effect","Halo effect","First-impression error","Closure"],"ans":[0,1,2,3]},{"id":"n51a08792","sec":3,"type":"msq","topic":"perception","concept":"self-fulfilling","diff":"M","cat":"B","beyond":false,"q":"Select ALL true statements about self-fulfilling prophecies.","exp":"Pygmalion (positive) and Golem (negative) are self-fulfilling prophecy effects and apply in organizations too.","tip":"Expectations create reality.","opts":["The Pygmalion effect links high expectations to better performance","The Golem effect links low expectations to poorer performance","The Golem effect improves performance of the target","The Pygmalion effect only occurs in schools, never in workplaces"],"ans":[0,1]},{"id":"nd3bda425","sec":3,"type":"msq","topic":"perception","concept":"stereotype","diff":"M","cat":"A","beyond":false,"q":"Which are NEGATIVE impacts of stereotyping highlighted in the course?","exp":"Stereotyping's negative impacts include selective perception, bias and prejudice, and distorted selection and appraisal.","tip":"Stereotype blinds.","opts":["Accurate individual assessment","Bias and prejudice","Improved diversity","Selective perception"],"ans":[1,3]},{"id":"n99825ef5","sec":3,"type":"msq","topic":"learning","concept":"reinforcement","diff":"M","cat":"A","beyond":false,"q":"Which of the following STRENGTHEN a behaviour (increase its likelihood)?","exp":"Both positive and negative reinforcement strengthen behaviour; punishment and extinction weaken it.","tip":"Reinforcement = more.","opts":["Punishment","Extinction","Negative reinforcement","Positive reinforcement"],"ans":[2,3]},{"id":"ncb26ab9a","sec":3,"type":"msq","topic":"learning","concept":"reinforcement","diff":"H","cat":"A","beyond":false,"q":"Select ALL statements that are true about punishment in operant conditioning.","exp":"Punishment is complex, most used, least understood and often badly administered; it is not negative reinforcement.","tip":"Punishment hurts.","opts":["It is often badly administered","It is the same as negative reinforcement","It is the most reliable long-term method according to the course","It can cause anxiety or aggression","It presents an aversive consequence in response to unwanted behaviour"],"ans":[0,3,4]},{"id":"ncbc379d7","sec":3,"type":"msq","topic":"learning","concept":"learning-def","diff":"M","cat":"A","beyond":false,"q":"Which statements about the definition of learning are correct?","exp":"Learning = relatively permanent behaviour change from experience; temporary changes are not learning.","tip":"Permanent + experience.","opts":["It is a relatively permanent change in behaviour","It includes temporary changes due to fatigue","It is limited to classroom settings","It occurs as a result of experience"],"ans":[0,3]},{"id":"nb72e4427","sec":3,"type":"msq","topic":"learning","concept":"schedules","diff":"H","cat":"B","beyond":false,"q":"Which are PARTIAL reinforcement schedules?","exp":"Partial reinforcement: FI, VI, FR, VR. Continuous = every response.","tip":"Partial = F/V x I/R.","opts":["Variable ratio","Continuous","Fixed interval","Variable interval","Fixed ratio"],"ans":[0,2,3,4]},{"id":"n5035ae26","sec":3,"type":"msq","topic":"learning","concept":"observational","diff":"M","cat":"A","beyond":false,"q":"Which are steps in observational learning?","exp":"A-R-R-M.","tip":"ARRM.","opts":["Retention","Behavioural reproduction","Motivation","Extinction","Paying attention"],"ans":[0,1,2,4]},{"id":"nfde4fb38","sec":3,"type":"msq","topic":"learning","concept":"training","diff":"M","cat":"B","beyond":false,"q":"Which practices help apply learning principles in training?","exp":"Using learning principles: motivate participation, periodic programs, transfer opportunities, feedback, role models and mentoring.","tip":"Learn -> practise -> feedback.","opts":["Avoid periodic training","Discourage participation","Offer role models and mentoring","Provide opportunities to transfer knowledge","Provide feedback"],"ans":[2,3,4]},{"id":"n6a0aa316","sec":3,"type":"msq","topic":"personality","concept":"freud","diff":"M","cat":"A","beyond":false,"q":"Which are components/levels in Freud's psychoanalytic theory?","exp":"Freud: levels of consciousness (conscious, subconscious, unconscious) and structure of mind (id, ego, superego).","tip":"Levels + structure.","opts":["Id, Ego and Super ego","Subconscious","Locus of control","Conscious","Unconscious"],"ans":[0,1,3,4]},{"id":"n38246b49","sec":3,"type":"msq","topic":"personality","concept":"personality-def","diff":"M","cat":"A","beyond":false,"q":"Select ALL true statements about personality.","exp":"Determinants include heredity, culture, early childhood experiences and significant others; personality is influenced by multiple factors.","tip":"Personality = nature + nurture.","opts":["The word comes from the Latin 'persona' meaning a mask","Gordon Allport was a pioneer of personality theory","It cannot be influenced by culture","It is determined solely by heredity","It consists of relatively stable characteristics that influence behaviour"],"ans":[0,1,4]},{"id":"n61fbe024","sec":3,"type":"msq","topic":"personality","concept":"personality-det","diff":"M","cat":"B","beyond":false,"q":"Which are determinants of personality listed in the course?","exp":"Determinants include heredity/brain/physical features, culture, early childhood experiences, significant others, socialization, identification.","tip":"Biology + culture + childhood.","opts":["Early childhood experiences","Role of significant others","Heredity","Reinforcement schedules","Cultural norms"],"ans":[0,1,2,4]},{"id":"nce52f92c","sec":3,"type":"msq","topic":"personality","concept":"self-esteem","diff":"H","cat":"A","beyond":false,"q":"Which characteristics are described for employees with HIGH self-esteem?","exp":"High self-esteem employees are happy and satisfied, realistic, moderate risk takers, friendly, motivated, disciplined and responsible; they are not necessarily dominating.","tip":"High self-esteem = balanced.","opts":["Moderate risk taking","Ready to take responsibilities","Highly motivated and self-disciplined","Realistic expectations","Very dominating over others"],"ans":[0,1,2,3]},{"id":"nc1e6ad89","sec":3,"type":"msq","topic":"personality","concept":"mach","diff":"M","cat":"A","beyond":false,"q":"Which describe a high Machiavellian orientation?","exp":"Mach: lack of trust, closed-minded, authoritative, power centred, manipulative.","tip":"Mach = power + manipulate.","opts":["Lack of trust","Unconditional acceptance of others","Power-centred","Willingness to manipulate others for own purpose"],"ans":[0,2,3]},{"id":"n300cc4e2","sec":3,"type":"msq","topic":"personality","concept":"johari","diff":"H","cat":"A","beyond":false,"q":"Select ALL true statements about Johari's Window.","exp":"Unknown = unknown to BOTH self and others. Blind = known to others only.","tip":"Four windows by self/other knowledge.","opts":["The Blind area is unknown to self but known to others","The Hidden area is known to self but not to others","The Unknown area is known to others but not to self","The Open area is known to both self and others"],"ans":[0,1,3]},{"id":"n9e18dd9b","sec":3,"type":"msq","topic":"attitudes","concept":"attitude-components","diff":"M","cat":"B","beyond":false,"q":"Which are components of attitudes?","exp":"Attitude components: cognitive, affective, behavioural.","tip":"ABC.","opts":["Cognitive","Affective","Projective","Perceptual","Behavioural"],"ans":[0,1,4]},{"id":"n3ed5dfec","sec":3,"type":"msq","topic":"attitudes","concept":"attitude-measure","diff":"M","cat":"A","beyond":false,"q":"Which are attitude measurement scales/tools listed in the course?","exp":"The listed scales are Thurstone, Likert, Bogardus and Guttman, plus projective tests.","tip":"TLBG.","opts":["Thurstone's scale","Likert's scale","Johari's scale","Bogardus's social distance scale","Guttman's scale"],"ans":[0,1,3,4]},{"id":"n49090721","sec":3,"type":"msq","topic":"attitudes","concept":"attitude-formation","diff":"M","cat":"B","beyond":false,"q":"Which are sources of attitude formation?","exp":"Sources: personal experiences, association, family, peer group and society, models and institutional factors.","tip":"Attitudes are learned.","opts":["Models","Personal experiences","Family","Peer group and society","Genetic coding alone"],"ans":[0,1,2,3]},{"id":"n46a813e7","sec":3,"type":"msq","topic":"attitudes","concept":"job-satisfaction","diff":"M","cat":"A","beyond":false,"q":"Which are determinants of job satisfaction?","exp":"Determinants: mentally challenging work, equitable rewards, supportive working conditions, supportive colleagues, personality-job fit, personal characteristics.","tip":"Challenge, fairness, support, fit.","opts":["Longer working hours","Supportive colleagues","Mentally challenging work","Equitable rewards","Personality-job fit"],"ans":[1,2,3,4]},{"id":"nec46a46d","sec":3,"type":"msq","topic":"attitudes","concept":"attitude-change","diff":"M","cat":"A","beyond":false,"q":"Which approaches can change attitudes according to the course?","exp":"Changing attitudes: providing information, reinforcing change, providing opportunities. Cognitive dissonance can also motivate change.","tip":"Inform - Reinforce - Explore.","opts":["Providing opportunities to explore new situations","Providing information","Ignoring the attitude completely","Reinforcing attitudinal change"],"ans":[0,1,3]},{"id":"n95fdc36d","sec":3,"type":"msq","topic":"attitudes","concept":"overcoming-discrimination","diff":"M","cat":"B","beyond":false,"q":"Which are listed as ways of overcoming discrimination?","exp":"The course lists diversity management, affirmative action plans and sensitivity training.","tip":"DAS.","opts":["Increasing prejudgment","Sensitivity training","Affirmative action plans","Diversity management"],"ans":[1,2,3]},{"id":"n1efb8a79","sec":3,"type":"msq","topic":"emotions","concept":"emotion-basics","diff":"M","cat":"A","beyond":false,"q":"Select ALL true statements about emotions as described in the course.","exp":"Emotions are universal, influenced by culture in expression, usually have an object and are contagious. Mood is unfocused and diffuse.","tip":"Emotion has object; mood does not.","opts":["Emotions are contagious","Culture influences emotional expression","Moods always have a clear object","Emotions are universal","Emotions most of the time have an object"],"ans":[0,1,3,4]},{"id":"n637a3c85","sec":3,"type":"msq","topic":"emotions","concept":"emotions-types","diff":"M","cat":"A","beyond":false,"q":"Which emotions are SOCIAL emotions in the course classification?","exp":"Social emotions: pity, envy, jealousy. Self-conscious: shame, guilt, embarrassment, pride.","tip":"Social = external.","opts":["Jealousy","Envy","Shame","Pride","Pity"],"ans":[0,1,4]},{"id":"nc40860b3","sec":3,"type":"msq","topic":"emotions","concept":"aggression","diff":"M","cat":"A","beyond":false,"q":"Which are patterns of aggression described in the course?","exp":"The four patterns: threat-based, irritable, frustration-based and instrumental. (Passive aggression is mentioned as 'aggression can be passive' but is not one of the four patterns listed.)","tip":"TIFI.","opts":["Frustration-based","Threat-based","Instrumental","Passive-submissive","Irritable"],"ans":[0,1,2,4]},{"id":"n9aa690a3","sec":3,"type":"msq","topic":"emotions","concept":"stress","diff":"M","cat":"A","beyond":false,"q":"Which are types of stress listed in the course?","exp":"Types: eustress, distress, hyper work stress, hypo stress.","tip":"Eu, Dis, Hyper, Hypo.","opts":["Hypo stress","Eu-distress","Eustress","Distress","Hyper work stress"],"ans":[0,2,3,4]},{"id":"n6975bf32","sec":3,"type":"msq","topic":"emotions","concept":"stress-symptoms","diff":"H","cat":"A","beyond":false,"q":"Which are BEHAVIOURAL symptoms of stress?","exp":"Back ache is psychosomatic. Behavioural symptoms: low productivity, absenteeism, interpersonal conflict, suicidal tendencies, isolation.","tip":"Behaviour at work vs body.","opts":["Isolation","Low productivity","Back ache","Interpersonal conflict","Absenteeism"],"ans":[0,1,3,4]},{"id":"n319845be","sec":3,"type":"msq","topic":"emotions","concept":"stress-management","diff":"M","cat":"B","beyond":false,"q":"Which strategies help in managing stress?","exp":"Course strategies: self awareness, mindfulness, lifestyle changes, exercise and meditation.","tip":"Aware, mindful, healthy.","opts":["Exercise and meditation","Self awareness","Lifestyle changes","Suppressing emotions entirely","Mindfulness"],"ans":[0,1,2,4]},{"id":"n7e05a6ec","sec":3,"type":"msq","topic":"emotions","concept":"stressors","diff":"H","cat":"B","beyond":false,"q":"Which are classified as LIFE stressors?","exp":"Life stressors: life changes, daily stressors, life trauma. Ageing = personal stressor; job/organizational = organizational stressors.","tip":"Life stressors: changes, dailies, trauma.","opts":["Life trauma","Daily stressors","Life changes","Ageing","Job and organizational factors"],"ans":[0,1,2]},{"id":"n25a0a65c","sec":3,"type":"msq","topic":"motivation","concept":"motives","diff":"M","cat":"A","beyond":false,"q":"Which are PSYCHOLOGICAL (secondary) motives discussed in the course?","exp":"Psychological motives: power, achievement, affiliation. Primary motives are physiological.","tip":"PAA.","opts":["Primary physiological motive","Power motive","Achievement motive","Affiliation motive"],"ans":[1,2,3]},{"id":"n30f221e1","sec":3,"type":"msq","topic":"motivation","concept":"motives","diff":"M","cat":"A","beyond":false,"q":"Select ALL characteristics of the achievement motive.","exp":"Achievement: moderate risk taking, need for immediate feedback, satisfaction, preoccupation. Power = control; affiliation = group.","tip":"Achievement = risk + feedback.","opts":["Desire to control others","Preoccupation with the task","Moderate risk taking","Need for immediate feedback","Need to be part of a group"],"ans":[1,2,3]},{"id":"n2b6b795e","sec":3,"type":"msq","topic":"motivation","concept":"goal-conflict","diff":"M","cat":"A","beyond":false,"q":"Which are types of goal conflict?","exp":"Goal conflicts: approach-approach, avoidance-avoidance, approach-avoidance. Role conflict is a separate intra-personal conflict.","tip":"AA, VV, AV.","opts":["Role-role","Approach-approach","Approach-avoidance","Avoidance-avoidance"],"ans":[1,2,3]},{"id":"ncc06dbec","sec":3,"type":"msq","topic":"motivation","concept":"herzberg","diff":"H","cat":"A","beyond":false,"q":"In Herzberg's two-factor theory (course scoring), which are HYGIENE factors?","exp":"Hygiene factors (course scoring: items 2, 5, 6, 8, 9, 12) are a good boss, satisfying personal life, prestigious/status job, good working conditions, sensible company rules and job security. Opportunity to grow and job responsibility are motivators (items 10 and 7).","tip":"Hygiene = context; Motivators = content.","opts":["Opportunity to grow through learning new things","A satisfying personal life","Job security","Job responsibility","Good working conditions","Sensible company rules and policies"],"ans":[1,2,4,5]},{"id":"n6a76ff7e","sec":3,"type":"msq","topic":"motivation","concept":"content-process","diff":"H","cat":"A","beyond":false,"q":"Which theories are CONTENT theories?","exp":"Content theories = what motivates (Maslow, Herzberg, ERG). Process = how (expectancy, equity).","tip":"Content = needs; Process = thinking.","opts":["Herzberg's two-factor theory","Vroom's expectancy theory","Maslow's hierarchy of needs","ERG theory","Equity theory"],"ans":[0,2,3]},{"id":"nee9a33d2","sec":3,"type":"msq","topic":"motivation","concept":"justice","diff":"M","cat":"B","beyond":false,"q":"Which are dimensions of organizational justice?","exp":"Three dimensions: distributive, procedural, interactional.","tip":"DPI.","opts":["Procedural justice","Distributive justice","Interactional justice","Instrumental justice"],"ans":[0,1,2]},{"id":"ne40b5ec4","sec":3,"type":"msq","topic":"motivation","concept":"money","diff":"M","cat":"A","beyond":false,"q":"Which statements about money as a motivator are consistent with the course?","exp":"The nature of work matters, and employees are motivated by multiple factors.","tip":"Money matters but is not everything.","opts":["Money is not always the first choice","Money can restrict extra-role performance","Money is the only factor motivating employees","Profit sharing and performance bonuses can be used"],"ans":[0,1,3]},{"id":"nda62212b","sec":3,"type":"msq","topic":"interpersonal","concept":"trust","diff":"M","cat":"A","beyond":false,"q":"Which are types of trust discussed in the course?","exp":"Types: incentive-based, familiarity, similarity, social networks (social embeddedness), swift trust.","tip":"IFSNS.","opts":["Incentive-based trust","Swift trust","Trust based on familiarity","Trust based on punishment","Trust based on similarity"],"ans":[0,1,2,4]},{"id":"n9f429473","sec":3,"type":"msq","topic":"interpersonal","concept":"ocb","diff":"M","cat":"A","beyond":false,"q":"Which are dimensions of organizational citizenship behaviour (OCB)?","exp":"OCB dimensions: altruism, conscientiousness, civic virtue, sportsmanship, courtesy.","tip":"ACCSC.","opts":["Conscientiousness","Sportsmanship","Altruism","Civic virtue","Courtesy"],"ans":[0,1,2,3,4]},{"id":"n3765b5af","sec":3,"type":"msq","topic":"interpersonal","concept":"conflict-types","diff":"M","cat":"A","beyond":false,"q":"Which are TYPES of conflict (by content) in the course?","exp":"Types: relational, task, process. Inter-group is a LEVEL of conflict (intrapersonal, interpersonal, intra-group, inter-group).","tip":"Type vs level.","opts":["Inter-group conflict","Relational conflict","Process conflict","Task conflict"],"ans":[1,2,3]},{"id":"n165f2076","sec":3,"type":"msq","topic":"interpersonal","concept":"conflict-levels","diff":"M","cat":"B","beyond":false,"q":"Which are LEVELS of conflict in organizations?","exp":"Levels: intrapersonal, interpersonal, intra-group, inter-group. Process is a type.","tip":"Levels vs types.","opts":["Process","Intra-group","Interpersonal","Intrapersonal","Inter-group"],"ans":[1,2,3,4]},{"id":"na3b1d13b","sec":3,"type":"msq","topic":"interpersonal","concept":"conflict-styles","diff":"M","cat":"A","beyond":false,"q":"Select ALL basic conflict handling styles.","exp":"These are the five styles.","tip":"Five styles.","opts":["Avoiding","Competing","Collaborating","Compromising","Accommodating"],"ans":[0,1,2,3,4]},{"id":"n33be0d83","sec":3,"type":"msq","topic":"interpersonal","concept":"cooperation-competition","diff":"H","cat":"A","beyond":false,"q":"Which are personal orientations in cooperation/competition situations?","exp":"Competitors, individualists, cooperators, equalizers.","tip":"CICE.","opts":["Cooperators","Competitors","Avoiders","Individualists","Equalizers"],"ans":[0,1,3,4]},{"id":"n509c5870","sec":3,"type":"msq","topic":"communication","concept":"comm-process","diff":"M","cat":"A","beyond":false,"q":"Which are components of the communication process?","exp":"Components: sender/receiver, message, encoding, channel, decoding, noise (and feedback).","tip":"SMCRDN.","opts":["Encoding and decoding","Sender and receiver","Channel","Noise","Valence"],"ans":[0,1,2,3]},{"id":"nd8e3e06f","sec":3,"type":"msq","topic":"communication","concept":"nonverbal","diff":"M","cat":"A","beyond":false,"q":"Which are examples of non-verbal communication?","exp":"Non-verbal: proxemics, kinesics, silence, symbols. Encoding is part of the process.","tip":"PKSS.","opts":["Kinesics","Silence","Proxemics","Symbols (clothing, artifacts)","Encoding"],"ans":[0,1,2,3]},{"id":"n97f1bded","sec":3,"type":"msq","topic":"communication","concept":"hidden-profile","diff":"H","cat":"A","beyond":false,"q":"Which approaches help handle the hidden profile paradigm?","exp":"Remedies include focus on unshared info, problem-solving approach, rank order, one alternative at a time, create awareness, suspend initial judgment, build trust, minimize status difference, communicate confidence.","tip":"Share the unshared.","opts":["Consider alternatives one at a time","Suspend initial judgment","Discourage trust building","Focus on unshared/unique information","Minimize status differences"],"ans":[0,1,3,4]},{"id":"nb2348193","sec":3,"type":"msq","topic":"communication","concept":"comm-styles","diff":"M","cat":"A","beyond":false,"q":"Which are communication styles?","exp":"The four styles are driver, animated, amiable and analytical.","tip":"DAAA.","opts":["Analytical","Amiable","Autocratic","Animated","Driver"],"ans":[0,1,3,4]},{"id":"n717f11a8","sec":3,"type":"msq","topic":"decision","concept":"dm-barriers","diff":"H","cat":"A","beyond":false,"q":"Which are forms of DEFENSIVE AVOIDANCE?","exp":"Defensive avoidance: rationalization, procrastination, buck passing. Complacency and panic are separate barriers.","tip":"Defensive avoidance = R-P-B.","opts":["Complacency","Panic","Procrastination","Buck passing","Rationalization"],"ans":[2,3,4]},{"id":"n01b7cd2d","sec":3,"type":"msq","topic":"decision","concept":"dm-biases","diff":"M","cat":"A","beyond":false,"q":"Which are decision-making biases in the course?","exp":"All are listed biases (plus prospect theory).","tip":"FRAAO.","opts":["Framing","Anchoring and adjustment","Representativeness","Overconfidence","Availability"],"ans":[0,1,2,3,4]},{"id":"nfe2fe230","sec":3,"type":"msq","topic":"decision","concept":"groupthink","diff":"H","cat":"A","beyond":false,"q":"Which are symptoms/characteristics of groupthink?","exp":"Groupthink characteristics: invulnerability, rationalization, unquestioned belief, stereotypical views, direct pressure, self-censorship, illusion of unanimity.","tip":"Groupthink = harmony over thought.","opts":["Illusions of invulnerability","Shared illusion of unanimity","Critical evaluation by a devil's advocate","Collective rationalization","Self-censorship"],"ans":[0,1,3,4]},{"id":"n621d4105","sec":3,"type":"msq","topic":"decision","concept":"escalation","diff":"H","cat":"A","beyond":false,"q":"Which statements about escalation of commitment are correct?","exp":"Avoiding escalation: set limits, avoid ambiguity, external reviewers, accept sunk costs, manage emotions.","tip":"Accept sunk costs.","opts":["Accepting sunk costs makes it worse","Sunk costs cannot be recovered","Ambiguity reduces it","It is influenced by effort, money and time already invested","Setting limits and using external reviewers help avoid it"],"ans":[1,3,4]},{"id":"n365be603","sec":3,"type":"msq","topic":"decision","concept":"group-dm","diff":"M","cat":"A","beyond":false,"q":"Which are GROUP decision-making techniques listed in the course?","exp":"Techniques: nominal group, Delphi, Ringi. Satisficing is an individual decision approach.","tip":"NDR.","opts":["Delphi method","Nominal group technique","Satisficing","Ringi technique"],"ans":[0,1,3]},{"id":"n72beebc4","sec":3,"type":"msq","topic":"power","concept":"power-sources","diff":"M","cat":"A","beyond":false,"q":"Which are sources of power (French and Raven bases as in the course)?","exp":"All five sources are listed.","tip":"LCRER.","opts":["Legitimate","Referent","Expert","Coercive","Reward"],"ans":[0,1,2,3,4]},{"id":"nd30f0e90","sec":3,"type":"msq","topic":"power","concept":"politics","diff":"M","cat":"A","beyond":false,"q":"Which are forms of political behaviour in organizations?","exp":"All five forms are listed.","tip":"MIBBC.","opts":["Impression management","Creating and using reciprocity","Building coalitions","Blaming","Manipulating information flow"],"ans":[0,1,2,3,4]},{"id":"n5496009b","sec":3,"type":"msq","topic":"power","concept":"leader-vs-manager","diff":"H","cat":"A","beyond":false,"q":"Which statements describe LEADERS (rather than managers) in the course?","exp":"Leaders: innovation, develop, focus on people, inspire trust, long-range view, ask what and why, challenge the status quo, do the right things.","tip":"Leaders lead change.","opts":["Inspire trust","Take a long-range view","Rely on control","Challenge the status quo","Focus on people","Accept the status quo"],"ans":[0,1,3,4]},{"id":"n68b58722","sec":3,"type":"msq","topic":"power","concept":"leadership-styles","diff":"M","cat":"A","beyond":false,"q":"Which are leadership styles in the behavioural approach?","exp":"Behavioural styles: autocratic, democratic, laissez-faire. Telling is a situational style.","tip":"ADL.","opts":["Autocratic","Telling","Democratic","Laissez-faire"],"ans":[0,2,3]},{"id":"nb88f0ed1","sec":3,"type":"msq","topic":"power","concept":"contingency","diff":"H","cat":"B","beyond":false,"q":"Which are contingency theories of leadership?","exp":"Contingency theories: Fiedler, Hersey-Blanchard, path-goal. Great person is trait approach.","tip":"Contingency = depends on situation.","opts":["Great person theory","Fiedler's model","Hersey and Blanchard's situational leadership","Path-goal theory"],"ans":[1,2,3]},{"id":"n42380ecb","sec":3,"type":"msq","topic":"power","concept":"trait-approach","diff":"H","cat":"B","beyond":false,"q":"Which are characteristics of a great leader in the trait approach?","exp":"Traits: leadership motivation, flexibility, focus on morality, high energy, self-confidence, role-specific knowledge, multiple domains of intelligence.","tip":"Traits = energetic and capable.","opts":["Multiple domains of intelligence","Leadership motivation","Flexibility","Low energy level","Self-confidence"],"ans":[0,1,2,4]},{"id":"na12110c7","sec":3,"type":"msq","topic":"culture","concept":"culture-dimensions","diff":"M","cat":"B","beyond":false,"q":"Which are Hofstede's cultural dimensions in the course?","exp":"Five dimensions listed.","tip":"PUIML.","opts":["Uncertainty avoidance","Masculinity-femininity","Power distance","Long term orientation","Individualism-collectivism"],"ans":[0,1,2,3,4]},{"id":"n8c1bda74","sec":3,"type":"msq","topic":"culture","concept":"org-culture-dims","diff":"M","cat":"B","beyond":false,"q":"Which are dimensions of ORGANIZATIONAL culture in the course?","exp":"Organizational culture dimensions: attention to detail, outcome orientation, people orientation, team orientation, aggressiveness, stability, innovation and risk taking. Power distance is a national cultural dimension.","tip":"Org dims vs national dims.","opts":["Innovation and risk taking","Attention to detail","Outcome orientation","People orientation","Power distance"],"ans":[0,1,2,3]},{"id":"nf6541362","sec":3,"type":"msq","topic":"culture","concept":"culture-expression","diff":"M","cat":"B","beyond":false,"q":"Which are common expressions of organizational culture?","exp":"Expressions: artifacts, language, stories, ceremonies, routines/rites, behavioural norms, shared beliefs/values, basic assumptions.","tip":"Culture shows in symbols, stories, rituals.","opts":["Stories, myths and legends","Language, jargons and metaphors","Span of control","Ceremonies and celebrations","Physical artifacts"],"ans":[0,1,3,4]},{"id":"n16e16466","sec":3,"type":"msq","topic":"culture","concept":"strong-culture","diff":"H","cat":"B","beyond":false,"q":"Which factors influence the strength of a culture?","exp":"Factors: size, tenure, turnover, leadership.","tip":"STTL.","opts":["Tenure","Logo design","Organizational size","Leadership","Employee turnover"],"ans":[0,2,3,4]},{"id":"n4a3a46aa","sec":3,"type":"msq","topic":"groups","concept":"tuckman","diff":"M","cat":"A","beyond":false,"q":"Which are stages in the Tuckman and Jensen model?","exp":"Five stages.","tip":"FSNPA.","opts":["Forming","Storming","Performing","Adjourning","Norming"],"ans":[0,1,2,3,4]},{"id":"n093940e2","sec":3,"type":"msq","topic":"groups","concept":"team-types","diff":"M","cat":"A","beyond":false,"q":"Which are types of teams in the course?","exp":"All listed.","tip":"Production, service, management, project, action, advisory, self-managing.","opts":["Production groups","Project teams","Advisory teams","Self-managing teams","Service groups"],"ans":[0,1,2,3,4]},{"id":"nb6a014c3","sec":3,"type":"msq","topic":"groups","concept":"social-loafing","diff":"H","cat":"A","beyond":false,"q":"Which are conditions for social loafing?","exp":"Social loafing conditions: large size, low instrumentality, low trust, low valence, eager beaver, mundane tasks, cultural factors. High identifiability reduces loafing.","tip":"Big, boring, untrusted.","opts":["Perceived low instrumentality","Large team size","High identifiability","Low trust","Mundane task"],"ans":[0,1,3,4]},{"id":"n2036631f","sec":3,"type":"msq","topic":"groups","concept":"groupthink-remedies","diff":"H","cat":"B","beyond":false,"q":"Which are remedies to overcome groupthink?","exp":"Remedies: organizational (multiple groups, training), leader (critical thinking, outsiders, devil's advocate, objectivity), member (evaluate all ideas, share with outsiders), process (subgroups, compare solutions, second chance meeting).","tip":"Seek dissent.","opts":["Hold a second chance meeting","Leader states a preferred solution first","Assign a devil's advocate","Multiple groups examining the same issue","Use outsiders to evaluate ideas critically"],"ans":[0,2,3,4]},{"id":"n43154820","sec":3,"type":"msq","topic":"structure","concept":"dimensions","diff":"M","cat":"B","beyond":false,"q":"Which are dimensions of organizational structure listed in the course?","exp":"Dimensions include administrative component, autonomy, centralization, complexity, delegation, differentiation, formalization, integration, span of control, standardization, vertical span.","tip":"Structure dims.","opts":["Centralization","Formalization","Span of control","Complexity","Self-actualization"],"ans":[0,1,2,3]},{"id":"n90be6be7","sec":3,"type":"msq","topic":"structure","concept":"coordination","diff":"H","cat":"B","beyond":false,"q":"Which are methods of VERTICAL coordination?","exp":"Vertical: formalization, span of control, centralization of power, delegation, line and staff. Liaison roles = horizontal.","tip":"Vertical = up-down.","opts":["Span of control","Formalization","Line and staff positions","Delegation","Liaison roles"],"ans":[0,1,2,3]},{"id":"n9607ef65","sec":3,"type":"msq","topic":"structure","concept":"formaliz
