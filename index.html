on.","Forces for change: competitive, economic/political/global, demographic/social, ethical.","Resistance: organizational (structure, culture, strategy), functional (orientation, power and conflict), group (norms, cohesiveness, groupthink, escalation), individual (cognitive biases, uncertainty, selective perception, habit).","Change process: unfreezing, moving, refreezing."],"misconceptions":["Revolutionary change is NOT slow."],"memory":["Unfreeze - Move - Refreeze"]}]},"seed":20261021};

/* ===== CORE: question model, grading, state, selection logic (no DOM access) ===== */
const OB = (function () {
  'use strict';
  const LS_KEY = 'nptelOBsim.v1';
  const DAY = 86400000;
  const CATS = { asg: 'Original NPTEL assignment questions', newA: 'New questions on assignment concepts', newB: 'New questions on other syllabus concepts' };
  const DIFFN = { E: 'Easy', M: 'Moderate', H: 'Difficult' };
  const TYPEN = { mcq: 'Single answer', tf: 'True / False', msq: 'Multiple answer', match: 'Match the following', fill: 'Fill in the blank', short: 'Short answer', ar: 'Assertion-Reason' };
  const SECN = { 0: 'Assignment', 1: 'Section 1 - Standard MCQs', 2: 'Section 2 - Twisted / application MCQs', 3: 'Section 3 - Multiple-answer', 4: 'Section 4 - Mixed formats' };

  /* ---------- question registry ---------- */
  const Q = {};
  const ASG = [];
  const NEW = [];
  const TOPIC = {};
  DATA.topics.forEach(t => (TOPIC[t.id] = t));
  DATA.assign.forEach(a => {
    const q = {
      id: a.id, src: 'asg', cat: 'asg', sec: 0, type: a.type, topic: a.topic, concept: a.concept, diff: a.diff,
      q: a.q, opts: a.opts, ans: a.key == null ? null : [a.key], official: a.official, keySrc: a.keySrc,
      exp: a.exp, tip: a.tip, week: a.week, kind: a.kind, n: a.n, flag: a.flag || ''
    };
    Q[q.id] = q; ASG.push(q);
  });
  DATA.qs.forEach(d => {
    const q = Object.assign({}, d, { src: 'new', cat: d.cat === 'A' ? 'newA' : 'newB', official: true });
    q.kind2 = q.ar ? 'ar' : q.type;
    Q[q.id] = q; NEW.push(q);
  });
  const ALL = ASG.concat(NEW);
  const qtypeLabel = q => TYPEN[q.ar ? 'ar' : q.type];

  /* ---------- text helpers ---------- */
  function norm(s) {
    return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9\s-]/g, ' ').replace(/-/g, ' ').replace(/\s+/g, ' ').trim().replace(/^(the|a|an)\s+/, '');
  }
  function lev(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, i) => i);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[n];
  }
  function fillOK(q, a) {
    const n = norm(a);
    if (!n) return false;
    const n2 = n.replace(/\s+(stage|power|effect|bias|trust|theory|approach|conflict|style|motive)$/, '');
    return q.fills.some(f => {
      const g = norm(f);
      if (n === g || n2 === g) return true;
      if (g.length >= 6 && lev(n, g) <= (g.length >= 12 ? 2 : 1)) return true;
      return false;
    });
  }
  function rubricSuggest(q, text) {
    const t = String(text || '').toLowerCase();
    return q.rubric.map(r => {
      const hits = r.kw.filter(k => t.includes(k)).length;
      let need = 1;
      const m = r.t.match(/^at least (two|three)|^(two|three)\b/i);
      if (m) need = /two/i.test(m[0]) ? 2 : 3;
      return hits >= need;
    });
  }

  /* ---------- grading ---------- */
  // st: 'c' correct, 'w' wrong, 'p' partial, 'u' unanswered, 'r' needs manual review
  function isAnswered(a) {
    if (a == null) return false;
    if (Array.isArray(a)) return a.some(x => x != null && x !== '' && x !== -1);
    if (typeof a === 'string') return a.trim() !== '';
    return true;
  }
  function grade(q, a, cfg) {
    cfg = cfg || {};
    if (!isAnswered(a)) return { st: 'u', m: 0 };
    switch (q.type) {

function optionsHtml(q, s, reveal) {
  const id = q.id, a = s.ans[id], lock = reveal ? ' data-locked="1"' : '';
  if (q.type === 'mcq' || q.type === 'tf') {
    return `<div class="opts" role="radiogroup" aria-label="Answer options">` + q.opts.map((o, i) => {
      const sel = a === i, ok = q.ans && q.ans[0] === i;
      let cls = 'opt' + (sel ? ' sel' : '');
      if (reveal) { if (ok) cls += ' ok'; else if (sel) cls += ' bad'; }
      return `<button type="button" class="${cls}" role="radio" aria-checked="${sel}" data-act="pick" data-i="${i}"${lock}><span class="ltr">${LET[i]}</span><span class="otxt">${esc(o)}</span>${reveal && ok ? '<span class="tag ok">Correct answer</span>' : ''}${reveal && sel && !ok ? '<span class="tag bad">Your answer</span>' : ''}</button>`;
    }).join('') + '</div>';
  }
  if (q.type === 'msq') {
    const A = Array.isArray(a) ? a : [];
    return `<div class="opts" role="group" aria-label="Answer options (select all that apply)">` + q.opts.map((o, i) => {
      const sel = A.includes(i), ok = q.ans.includes(i);
      let cls = 'opt chk' + (sel ? ' sel' : '');
      if (reveal) { if (ok) cls += ' ok'; else if (sel) cls += ' bad'; }
      return `<button type="button" class="${cls}" role="checkbox" aria-checked="${sel}" data-act="pick" data-i="${i}"${lock}><span class="ltr">${sel ? '&#10003;' : LET[i]}</span><span class="otxt">${esc(o)}</span>${reveal && ok ? '<span class="tag ok">Correct option</span>' : ''}${reveal && sel && !ok ? '<span class="tag bad">Selected - incorrect</span>' : ''}${reveal && ok && !sel ? '<span class="tag bad">Missed</span>' : ''}</button>`;
    }).join('') + '</div>';
  }
  if (q.type === 'match') {
    const A = Array.isArray(a) ? a : [];
    return `<div class="match">` + q.lefts.map((l, i) => {
      const ok = reveal && A[i] === q.ans[i];
      return `<div class="mrow"><div class="ml">${esc(l)}</div><select data-act="match" data-i="${i}" aria-label="Match for ${esc(l)}"${reveal ? ' disabled' : ''}><option value="-1">- choose -</option>${q.rights.map((r, j) => `<option value="${j}"${A[i] === j ? ' selected' : ''}>${esc(r)}</option>`).join('')}</select>${reveal ? (ok ? '<span class="tag ok">Correct</span>' : `<span class="tag bad">Correct: ${esc(q.rights[q.ans[i]])}</span>`) : ''}</div>`;
    }).join('') + '</div>';
  }
  if (q.type === 'fill') {
    return `<input type="text" class="txt" data-act="fill" value="${esc(a || '')}" ${reveal ? 'readonly' : ''} autocomplete="off" spellcheck="false" aria-label="Type your answer" placeholder="Type your answer here">` +
      (reveal ? `<p class="expect"><b>Accepted answer(s):</b> ${esc(q.fills.join(' / '))}</p>` : '');
  }
  if (q.type === 'short') {
    return `<textarea class="txt" rows="7" data-act="short" ${reveal ? 'readonly' : ''} aria-label="Type your answer" placeholder="Write your answer in your own words...">${esc(a || '')}</textarea>`;
  }
  return '';
}
function rubricHtml(q, s, mode) {
  // self-review checklist for descriptive answers
  const id = q.id;
  const sug = OB.rubricSuggest(q, s.ans[id]);
  const cur = s.rev ? s.rev[id] : null;
  const done = cur && s.checked && s.checked[id] && s.checked[id].reviewed;
  const checks = cur || sug;
  return `<div class="rubric"><p class="expect"><b>Reference answer:</b> ${esc(q.ref)}</p>
  <p><b>Self-review rubric</b> - tick each point your answer covered (pre-ticked where keywords were detected; adjust honestly). 60% or more counts as correct.</p>
  <ul class="rub">${q.rubric.map((r, i) => `<li><label><input type="checkbox" data-rub="${i}" ${checks[i] ? 'checked' : ''} ${done ? 'disabled' : ''}> ${esc(r.t)}</label></li>`).join('')}</ul>
  ${done ? `<p class="note">Review saved: ${(cur || []).filter(Boolean).length} of ${q.rubric.length} points.</p>` : `<button class="btn primary" data-act="saveRubric" data-id="${id}">Save self-review</button>`}</div>`;
}
function explainHtml(q, extra) {
  const keyNote = q.src === 'asg'
    ? (q.official ? '<span class="tag ok">Official portal key</span>' : (q.keySrc === 'duplicate' ? '<span class="tag warn">Key from identical graded question</span>' : '<span class="tag warn">Unofficial answer (derived from lecture slides) - no official key in your export</span>'))
    : (q.beyond ? '<span class="tag warn">Uses textbook OB knowledge beyond the slides</span>' : '');
  return `<div class="explain" aria-live="polite">
    <div class="meta"><span class="pill">Concept: ${esc(conceptName(q.concept))}</span><span class="pill">${esc(topicTitle(q.topic))}</span><span class="pill">${OB.DIFFN[q.diff]}</span><span class="pill">${esc(OB.qtypeLabel(q))}</span> ${keyNote}</div>
    <p><b>Answer:</b> ${esc(OB.correctText(q)).replace(/\n/g, '<br>')}</p>
    <p><b>Explanation:</b> ${esc(q.exp)}</p>
    ${q.tip ? `<p class="memo"><b>Memory aid:</b> ${esc(q.tip)}</p>` : ''}
    ${q.flag ? `<p class="note">${esc(q.flag)}</p>` : ''}
    <p class="src">Source: ${esc(qSource(q))}</p>${extra || ''}</div>`;
}
function hint(q) {
  if (q.type === 'msq') return 'Multiple-answer question: select ALL options that are correct.';
  if (q.type === 'match') return 'Match every item on the left with one option from its drop-down list.';
  if (q.type === 'fill') return 'Type a short answer (capitalisation and extra spaces are ignored).';
  if (q.type === 'short') return 'Descriptive question: you will self-review it against a rubric. It is not auto-graded.';
  if (q.type === 'tf') return 'True / False.';
  return 'Single-answer question: choose ONE option.';
}

/* ---------- play view ---------- */
function paletteHtml() {
  const s = sess; const exam = s.mode === 'exam';
  let out = '';
  const groups = s.secs ? s.secs : [s.qids.length];
  let off = 0;
  groups.forEach((n, gi) => {
    if (s.secs) out += `<h4>${esc(OB.SECN[gi + 1])}</h4>`;
    out += '<div class="pal">';
    for (let i = off; i < off + n; i++) {
      const id = s.qids[i]; const ans = OB.isAnswered(s.ans[id]);
      let cls = 'pb';
      if (i === s.idx) cls += ' cur';
      if (s.mode !== 'learn') {
        if (!exam && s.checked[id]) cls += s.checked[id].st === 'c' ? ' good' : (s.checked[id].st === 'r' ? ' ans' : ' badd');
        else if (ans) cls += ' ans';
      }
      if (s.marked[id]) cls += ' mk';
      out += `<button class="${cls}" data-act="goto" data-i="${i}" aria-label="Question ${i + 1}${ans ? ', answered' : ''}${s.marked[id] ? ', marked for review' : ''}">${i + 1}</button>`;
    }
    out += '</div>'; off += n;
  });
  const answered = s.qids.filter(id => OB.isAnswered(s.ans[id])).length;
  out += `<p class="legend"><span class="pb ans">&nbsp;</span> answered <span class="pb mk">&nbsp;</span> marked${exam ? '' : ' <span class="pb good">&nbsp;</span> correct <span class="pb badd">&nbsp;</span> wrong'}</p>`;
  if (s.mode !== 'learn') out += `<p class="small">${answered} of ${s.qids.length} answered</p>`;
  return out;
}

/* ---------- results ---------- */
function resultStatusChip(st, reviewed) {
  const m = { c: ['Correct', 'good'], w: ['Incorrect', 'bad'], p: ['Partial', 'warn'], u: ['Unanswered', 'none'], r: ['Needs review', 'warn'] }[st];
  return `<span class="chip rs-${m[1]}">${m[0]}${reviewed ? ' (self-reviewed)' : ''}</span>`;
}
function breakdownTable(title, obj, labelFn, order) {
  const keys = (order || Object.keys(obj)).filter(k => obj[k]);
  if (!keys.length) return '';
  return `<h3>${esc(title)}</h3><div class="tscroll"><table class="tbl"><tr><th></th><th>Questions</th><th>Correct</th><th>Incorrect</th><th>Unanswered</th><th>Needs review</th><th>Marks</th><th>Accuracy</th></tr>` +
    keys.map(k => { const o = obj[k]; const acc = o.scored ? o.m / o.scored : null; return `<tr><td>${esc(labelFn(k))}</td><td>${o.n}</td><td>${o.c}</td><td>${o.w}</td><td>${o.u}</td><td>${o.r}</td><td>${(Math.round(o.m * 100) / 100)}</td><td>${pct(acc)}</td></tr>`; }).join('') + '</table></div>';
}
function viewResults() {

  const pending = test.items.filter(i => i.st === 'r');

     <div class="stats"><div><b>${sm.correct}</b>Correct</div><div><b>${sm.wrong}</b>Incorrect</div><div><b>${sm.unanswered}</b>Unanswered</div><div><b>${sm.review}</b>Need review</div></div>
   </div>

   ${target}

   ${pending.length ? `<div class="card"><h2>Self-review required</h2><p>Descriptive answers cannot be graded reliably by a program. Compare with the reference answer and tick the rubric points you covered.</p>${pending.map(it => { const q = Q[it.id]; const s2 = { ans: { [q.id]: it.a }, rev: {}, checked: {} }; return `<div class="rv" data-qid="${q.id}"><h4>${esc(q.q)}</h4><p><b>Your answer:</b> ${esc(it.a || '(blank)')}</p>${rubricHtml(q, s2)}</div>`; }).join('')}</div>` : ''}
   <div class="card"><h2>Performance breakdown</h2>

    ${items.length ? items.map(it => {

    return `<details class="qrow st-${it.st}" ${f !== 'all' ? 'open' : ''}><summary><span class="no">${it.no}</span>${resultStatusChip(it.st, it.reviewed)}<span class="qs">${esc(q.q.length > 150 ? q.q.slice(0, 150) + '...' : q.q)}</span></summary>
      <div class="qbody"><p class="qfull">${esc(q.q)}</p>${imgHtml(q)}${showOpts ? optionsHtml(q, s2, true) : yours}${why}${q.type === 'short' && it.st !== 'r' ? `<p class="expect"><b>Reference answer:</b> ${esc(q.ref)}</p>` : ''}${explainHtml(q)}

  }).join('') : '<p class="small">No questions in this filter.</p>'}
   </div></section>`;
}

  <details class="card" open><summary><h2 class="inl">Researchers and their theories</h2></summary><table class="tbl">${R.people.map(p => `<tr><td><b>${esc(p[0])}</b></td><td>${esc(p[1])}</td></tr>`).join('')}</table></details>
  <details class="card"><summary><h2 class="inl">Frequently confused terms</h2></summary><table class="tbl">${R.confusable.map(p => `<tr><td><b>${esc(p[0])}</b></td><td>${esc(p[1])}</td></tr>`).join('')}</table></details>
  ${R.topics.map(t => `<details class="card"><summary><h2 class="inl">${esc(topicTitle(t.id))}</h2> <span class="small">${esc(OB.TOPIC[t.id].week)}</span></summary>
    <h3>Key definitions</h3><dl>${t.defs.map(d => `<dt>${esc(d[0])}</dt><dd>${esc(d[1])}</dd>`).join('')}</dl>
    <h3>Key points and models</h3><ul>${t.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
    <h3>Common misconceptions</h3><ul>${t.misconceptions.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
    <h3>Memory aids</h3><ul>${t.memory.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
    <button class="btn sm" data-act="topic-practice" data-t="${t.id}">Practise this topic</button></details>`).join('')}</section>`;
}

/* ---------- settings / backup ---------- */
function viewSettings() {
  const st = S().settings;
  app.innerHTML = `<section><h1>Backup &amp; settings</h1>
  ${flash ? `<div class="banner info" role="status">${esc(flash)}</div>` : ''}
  <div class="banner warn"><b>Where is my progress stored?</b> Only in this browser on this computer (localStorage). It is <b>not</b> synced to the cloud or other devices, and it can be lost if you clear site data, use private mode, or change browsers or file location. Export a backup regularly.</div>
  ${!OB.storageOK ? '<div class="banner bad">Local storage is unavailable in this browser window; progress is not being saved.</div>' : ''}
  <div class="card"><h2>Backup</h2><div class="row wrap"><button class="btn primary" data-act="export">Export progress (JSON)</button><label class="btn">Import progress<input type="file" id="impfile" accept=".json,application/json" hidden></label><button class="btn" data-act="csv">Export results (CSV)</button></div>
   <p class="small">Import validates the file first and asks before replacing anything. Importing does not restore an unfinished session.</p></div>
  <div class="card"><h2>Exam settings</h2>
   <label class="cb">Default mock time limit (minutes, 0 = untimed) <input type="number" min="0" max="600" class="numin" data-set="timerMin" value="${st.timerMin}"></label>
   <label class="cb"><input type="checkbox" data-set="partial" ${st.partial ? 'checked' : ''}> Enable partial credit for multiple-answer and match questions</label>
   <p class="small">Partial credit formula (only when enabled): multiple-answer marks = max(0, (correct options selected - incorrect options selected) / total correct options); match-the-following = correct pairs / total pairs. Full marks always need the exact set. Partially correct answers still count as incorrect for mastery and the wrong-answer list. Default: OFF.</p>
   <p class="small">Marks per question = 1, no negative marking. If you obtain NPTEL's official scheme, edit <code>marks</code> logic in the file or treat these as practice defaults.</p></div>
  <div class="card danger-zone"><h2>Reset</h2><p>Deletes all saved progress (mistakes, mastery, bookmarks, attempts).</p><button class="btn danger" data-act="reset">Reset all progress...</button></div>
  <div class="card"><h2>About this file</h2><p class="small">Self-contained offline file: no internet, server or external libraries. The answer key is inside the file's code (as with any offline quiz), but is never shown in the interface until you submit an answer or finish an exam.</p></div></section>`;
}

/* ---------- router / render ---------- */
const VIEWS = { home: viewHome, assign: viewAssign, asgweek: viewAsgWeek, practice: viewPractice, mock: viewMock, retry: viewRetry, bookmarks: viewBookmarks, progress: viewProgress, revision: viewRevision, settings: viewSettings, play: viewPlay, results: viewResults };
function render() {
  if (view.name === 'play' && !sess) view = { name: 'home' };
  renderHeader();
  (VIEWS[view.name] || viewHome)();
  const t = $('#timer'); if (t && sess && sess.endsAt) tickTimer();
}
function tickTimer() {
  if (!sess || !sess.endsAt) return;
  const left = sess.endsAt - Date.now();
  const t = $('#timer');
  if (t) { t.textContent = fmtClock(left); t.classList.toggle('low', left < 300000); }
  if (left <= 0 && view.name === 'play' && !sess.done) { toast('Time is up - your exam was submitted automatically.'); submitSession(true); }
}
setInterval(tickTimer, 1000);

/* ---------- events ---------- */
function curQ() { return Q[sess.qids[sess.idx]]; }
function afterAnswer() { OB.save(); render(); }
function readChecks(root) { return Array.from(root.querySelectorAll('input[data-rub]')).map(i => i.checked); }
function scheduleAdvance(ms) {
  clearTimeout(autoT); clearInterval(autoI);
  const end = Date.now() + ms;
  const upd = () => { const e = $('#cd'); if (e) e.textContent = Math.max(0, Math.ceil((end - Date.now()) / 1000)); };
  upd(); autoI = setInterval(upd, 250);
  autoT = setTimeout(() => {
    cancelAuto();
    if (!sess || view.name !== 'play') return;
    if (sess.idx < sess.qids.length - 1) { sess.idx++; OB.save(); render(); window.scrollTo(0, 0); } else submitSession(false);
  }, ms);
}
async function onClick(e) {
  const goBtn = e.target.closest('[data-go]');
  if (goBtn) { menuOpen = false; e.preventDefault(); if (view.name === 'play' && sess && sess.mode === 'exam') OB.save(); go(goBtn.dataset.go); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act; const d = el.dataset;
  if (act !== 'pick') cancelAuto();
  if (act === 'stay') { render(); return; }
  switch (act) {
    case 'menu': menuOpen = !menuOpen; renderHeader(); break;
    case 'pick': {
      if (el.dataset.locked) return; const q = curQ(); const i = +d.i;
      if (sess.mode === 'practice' && (q.type === 'mcq' || q.type === 'tf') && !sess.checked[q.id]) {
        sess.ans[q.id] = i; const g = OB.checkAnswer(sess, q.id); OB.save();
        autoWait = g.st !== 'c'; render(); scheduleAdvance(g.st === 'c' ? 300 : 10000); break;
      }
      if (q.type === 'msq') { const a = Array.isArray(sess.ans[q.id]) ? sess.ans[q.id].slice() : []; const k = a.indexOf(i); if (k >= 0) a.splice(k, 1); else a.push(i); a.sort((x, y) => x - y); sess.ans[q.id] = a; }
      else sess.ans[q.id] = i;
      afterAnswer(); break;
    }
    case 'goto': sess.idx = +d.i; OB.save(); render(); break;
    case 'prev': if (sess.idx > 0) { sess.idx--; OB.save(); render(); window.scrollTo(0, 0); } break;
    case 'next': if (sess.idx < sess.qids.length - 1) { sess.idx++; OB.save(); render(); window.scrollTo(0, 0); } break;
    case 'mark': { const id = curQ().id; if (sess.marked[id]) delete sess.marked[id]; else sess.marked[id] = 1; OB.save(); render(); break; }
    case 'bookmark': { const r = OB.R(curQ().id); r.bm = r.bm ? 0 : 1; OB.save(); render(); break; }
    case 'needrev': { const r = OB.R(curQ().id); r.fl = r.fl ? 0 : 1; OB.save(); render(); break; }
    case 'clear': delete sess.ans[curQ().id]; afterAnswer(); break;
    case 'check': { const id = curQ().id; if (!OB.isAnswered(sess.ans[id])) { const m = $('#chkmsg'); if (m) m.textContent = 'Please select or type an answer first.'; break; } const g = OB.checkAnswer(sess, id); OB.save(); autoWait = g.st === 'w' || g.st === 'p'; render(); if (g.st === 'c') scheduleAdvance(600); else if (autoWait) scheduleAdvance(10000); break; }
    case 'saveRubric': {
      const checks = readChecks(el.closest('.rubric')); const id = d.id;
      if (view.name === 'results') { const t = S().tests.find(x => x.id === view.id); OB.reviewInResults(t, id, checks); OB.save(); render(); }
      else { OB.reviewShort(sess, id, checks); OB.save(); render(); }
      break;
    }
    case 'exit': exitSession(); break;
    case 'resume': sess = S().current; if (sess.endsAt && sess.endsAt < Date.now()) { toast('Time expired while you were away - exam submitted.'); submitSession(true); } else go('play'); break;
    case 'discard': if (await askConfirm('Discard the unfinished session? Its answers will not be saved.', 'Discard', true)) { discardSession(); render(); } break;
    case 'review-submit': sess.confirm = true; OB.save(); render(); break;
    case 'back-to-exam': sess.confirm = false; OB.save(); render(); break;
    case 'goto-from-confirm': sess.confirm = false; sess.idx = +d.i; OB.save(); render(); break;
    case 'submit-final': submitSession(false); break;
    case 'finish-practice': {
      const un = sess.qids.filter(id => !sess.checked[id]).length;
      if (un && !(await askConfirm(`${un} question(s) were not checked and will count as unanswered. Finish anyway?`, 'Finish'))) break;
      submitSession(false); break;
    }
    case 'rfilter': view.filter = d.f; render(); break;
    case 'home': go('home'); break;
    case 'open-result': go('results', { id: d.id, filter: 'all' }); break;
    case 'open-week': go('asgweek', { week: +d.w }); break;
    case 'asg-learn': { const ids = OB.ASG.filter(q => q.week === +d.w).map(q => q.id); startLearn(ids, 0, 'Learn: ' + weekLabel(+d.w)); break; }
    case 'learn-from': { const ids = OB.ASG.filter(q => q.week === +d.w).map(q => q.id); startLearn(ids, +d.i, 'Learn: ' + weekLabel(+d.w)); break; }
    case 'asg-practice': { const ids = OB.ASG.filter(q => q.week === +d.w).map(q => q.id); startPractice(OB.shuffle(ids), 'Practice: ' + weekLabel(+d.w), 'asgpractice', { week: +d.w }); break; }
    case 'asg-practice-new': { const ids = OB.ASG.filter(q => q.week === +d.w && OB.status(q.id) === 'new').map(q => q.id); if (!ids.length) { toast('Every question in this assignment has been attempted.'); render(); break; } startPractice(OB.shuffle(ids), 'Practice (unattempted): ' + weekLabel(+d.w), 'asgpractice', { week: +d.w }); break; }
    case 'asg-retry': { const ids = OB.retryList({ week: +d.w }); startPractice(OB.shuffle(ids), 'Retry mistakes: ' + weekLabel(+d.w), 'retry'); break; }
    case 'asg-test': {
      const w = +d.w; const ids = OB.ASG.filter(q => q.week === w).map(q => q.id);
      if (!(await askConfirm(`Start the ${weekLabel(w)} mastery test? All ${ids.length} questions are shown without answers. Your target is 90% or more.`, 'Start test'))) break;
      startSession({ kind: 'asgtest', label: 'Assignment mastery test: ' + weekLabel(w), mode: 'exam', qids: OB.shuffle(ids), week: w, partial: S().settings.partial }); break;
    }
    case 'pf-all': pf.topics = OB.DATA.topics.map(t => t.id); render(); break;
    case 'pf-none': pf.topics = []; render(); break;
    case 'pf-start': { const pool = OB.filterPool({ cats: pf.cats, topics: pf.topics, diffs: pf.diffs, types: pf.types, status: pf.status }); const ids = OB.shuffle(pool).slice(0, pf.n).map(q => q.id); startPractice(ids, 'Practice: new questions', 'practice'); break; }
    case 'smart': { const ids = OB.smartPractice(pf.n); startPractice(ids, 'Smart adaptive practice', 'practice'); break; }
    case 'topic-practice': { pf.topics = [d.t]; pf.cats = ['newA', 'newB']; pf.diffs = []; pf.types = []; pf.status = 'all'; go('practice'); break; }
    case 'concept': startConcept(d.c); break;
    case 'difficult': { const pool = OB.filterPool({ cats: ['newA', 'newB'], diffs: ['H'], status: 'notmastered' }); const ids = OB.shuffle(pool).slice(0, pf.n).map(q => q.id); startPractice(ids, 'Difficult questions', 'practice'); break; }
    case 'mock-start': {
      const mins = Math.max(0, Math.min(600, parseInt($('#mocktime').value, 10) || 0));
      S().settings.timerMin = mins;
      const secs = OB.buildMockIds(); const flat = secs.flat();
      flat.forEach(id => { S().mockUse[id] = (S().mockUse[id] || 0) + 1; });
      S().mockCount++;
      startSession({ kind: 'mock', label: 'Full mock exam #' + S().mockCount, mode: 'exam', qids: flat, secs: secs.map(s => s.length), timerMin: mins, partial: S().settings.partial });
      break;
    }
    case 'retry-start': {
      const ids = OB.retryList({ src: rf.src || undefined, topic: rf.topic || undefined, week: rf.week === '' ? undefined : +rf.week, recent: rf.scope === 'recent', n: rf.n });
      startPractice(OB.shuffle(ids), 'Retry wrong answers', 'retry'); break;
    }
    case 'retry-from-test': { const t = S().tests.find(x => x.id === d.id); const ids = t.items.filter(i => i.st === 'w' || i.st === 'p').map(i => i.id); startPractice(ids, 'Retry mistakes from ' + t.label, 'retry'); break; }
    case 'bookmark-q': { const r = OB.R(d.id); r.bm = r.bm ? 0 : 1; OB.save(); render(); break; }
    case 'learn-one': startLearn([d.id], 0, 'Revisit question'); break;
    case 'bm-learn': startLearn(OB.ALL.filter(q => S().q[q.id] && S().q[q.id].bm).map(q => q.id), 0, 'Learn: bookmarked'); break;
    case 'bm-practice': startPractice(OB.shuffle(OB.ALL.filter(q => S().q[q.id] && S().q[q.id].bm).map(q => q.id)), 'Practice: bookmarked', 'practice'); break;
    case 'export': download('nptel-ob-progress-' + new Date().toISOString().slice(0, 10) + '.json', OB.exportJSON(), 'application/json'); toast('Progress file downloaded. Keep it somewhere safe.'); render(); break;
    case 'csv': download('nptel-ob-results-' + new Date().toISOString().slice(0, 10) + '.csv', OB.exportCSV(), 'text/csv'); break;
    case 'reset':
      if (await askConfirm('<b>Reset ALL progress?</b><br>This permanently deletes your wrong-answer list, mastery, bookmarks and every saved attempt from this browser. Export a backup first if you might need it.', 'Delete everything', true)) { OB.resetAll(); sess = null; toast('All progress was reset.'); go('settings'); }
      break;
  }
}
function onChange(e) {
  const t = e.target;
  if (t.matches('select[data-act="match"]')) {
    const q = curQ(); const a = Array.isArray(sess.ans[q.id]) ? sess.ans[q.id].slice() : new Array(q.lefts.length).fill(-1);
    a[+t.dataset.i] = +t.value; sess.ans[q.id] = a.every(x => x === -1) ? null : a; OB.save(); const p = $('#pal'); if (p) p.innerHTML = paletteHtml(); return;
  }
  if (t.dataset.pf) {
    const g = t.dataset.pf;
    if (g === 'status') pf.status = t.value;
    else if (g === 'n') pf.n = Math.max(1, Math.min(100, parseInt(t.value, 10) || 20));
    else { const arr = pf[g]; const k = arr.indexOf(t.value); if (t.checked && k < 0) arr.push(t.value); if (!t.checked && k >= 0) arr.splice(k, 1); }
    render(); return;
  }
  if (t.dataset.rf) { rf[t.dataset.rf] = t.dataset.rf === 'n' ? Math.max(1, parseInt(t.value, 10) || 20) : t.value; render(); return; }
  if (t.dataset.set) {
    const st = S().settings;
    if (t.dataset.set === 'partial') st.partial = t.checked; else st.timerMin = Math.max(0, Math.min(600, parseInt(t.value, 10) || 0));
    OB.save(); render(); return;
  }
  if (t.id === 'impfile') {
    const f = t.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = async () => {
      const r = OB.parseImport(String(rd.result));
      if (!r.ok) { toast('Import failed: ' + r.err + ' Nothing was changed.'); render(); return; }
      const ok = await askConfirm(`Replace your current progress with this file?<br>It contains ${r.nq} question records and ${r.nt} stored test(s)${r.dropped ? ` (${r.dropped} unknown record(s) ignored)` : ''}. Your current progress will be overwritten.`, 'Replace progress', true);
      if (ok) { OB.applyImport(r.state); sess = null; toast('Progress imported successfully.'); }
      render();
    };
    rd.onerror = () => { toast('Could not read that file.'); render(); };
    rd.readAsText(f); t.value = '';
  }
}
function onInput(e) {
  const t = e.target;
  if (!sess || view.name !== 'play') return;
  if (t.matches('input[data-act="fill"], textarea[data-act="short"]')) {
    const q = curQ(); sess.ans[q.id] = t.value; OB.save(); const p = $('#pal'); if (p) p.innerHTML = paletteHtml();
  }
}
function onKey(e) {
  if (view.name !== 'play' || !sess || sess.confirm) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'ArrowRight') { if (sess.idx < sess.qids.length - 1) { sess.idx++; OB.save(); render(); } }
  else if (e.key === 'ArrowLeft') { if (sess.idx > 0) { sess.idx--; OB.save(); render(); } }
  else if (/^[1-6]$/.test(e.key)) { const b = document.querySelector(`#opts [data-act="pick"][data-i="${+e.key - 1}"]`); if (b) b.click(); }
  else if (e.key === 'm' || e.key === 'M') { const b = document.querySelector('[data-act="mark"]'); if (b) b.click(); }
}
app.addEventListener('click', onClick);
document.getElementById('hdr').addEventListener('click', onClick);
app.addEventListener('change', onChange);
app.addEventListener('input', onInput);
document.addEventListener('keydown', onKey);
window.addEventListener('hashchange', () => {
  if (suppressHash) { suppressHash = false; return; }
  const n = location.hash.replace(/^#\/?/, '') || 'home';
  if (n === 'play' && sess) view = { name: 'play' };
  else if (VIEWS[n] && !['results', 'asgweek', 'play'].includes(n)) view = { name: n };
  else view = { name: 'home' };
  render();
});

/* ---------- visitor counter (counts one visit per browser per day; needs internet, fails silently offline) ---------- */
let visitCount = null;
(function countVisit() {
  if (!/^https?:$/.test(location.protocol)) return;
  let today = new Date().toISOString().slice(0, 10), seen = null;
  try { seen = localStorage.getItem('ob_visit_day'); } catch (e) { }
  const url = 'https://abacus.jasoncameron.dev/' + (seen === today ? 'get' : 'hit') + '/chxrxv-nptel-quiz/visits';
  fetch(url).then(r => r.json()).then(j => {
    if (typeof j.value !== 'number') return;
    visitCount = j.value; try { localStorage.setItem('ob_visit_day', today); } catch (e) { }
    const el = $('#vis'); if (el) el.textContent = visitCount;
  }).catch(() => { });
})();

/* ---------- init ---------- */
(function init() {
  const cur = S().current;
  if (cur) {
    sess = cur;
    if (sess.endsAt && sess.endsAt < Date.now() && sess.mode === 'exam') { toast('Time expired while the file was closed - your unfinished exam was submitted.'); submitSession(true); return; }
    if (sess.mode === 'learn') { discardSession(); }
  }
  view = { name: 'home' };
  render();
  window.__OBUI = { go, startSession, get sess() { return sess; }, get view() { return view; }, render, pf, rf };
})();

})();
</script>
