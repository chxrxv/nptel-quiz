<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OB Quiz</title>
<style>

:root{--bg:#f4f5f8;--card:#fff;--ink:#16181d;--mute:#5d6572;--line:#d8dce3;--acc:#2f5fd0;--accbg:#e8eefc;--ok:#146c43;--okbg:#e1f4e9;--bad:#b3261e;--badbg:#fbe6e4}
@media (prefers-color-scheme:dark){:root{--bg:#121418;--card:#1c1f25;--ink:#eceef2;--mute:#9aa2ae;--line:#343a45;--acc:#8aabff;--accbg:#232c45;--ok:#62d69c;--okbg:#14382a;--bad:#ff8f86;--badbg:#44211f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,Arial,sans-serif}
#app{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 4px}h2{font-size:1.15rem;margin:18px 0 8px}
.mute{color:var(--mute);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--acc)}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.9rem;color:var(--mute)}
.chip{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--accbg);color:var(--acc);margin:0 6px 8px 0}
.stem{font-size:1.1rem;font-weight:600;margin-bottom:12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt b{min-width:1.4em}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
button.main{font:inherit;font-weight:600;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;margin:6px 8px 6px 0}
@media (prefers-color-scheme:dark){button.main{color:#10131a}}
button.alt{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
select,input{font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px;width:100%;margin:4px 0 12px}
label{font-size:.9rem;color:var(--mute)}
.fb{margin-top:10px;font-weight:600}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.big{font-size:2.4rem;font-weight:700;margin:4px 0}
.wrongitem{border-top:1px solid var(--line);padding:10px 0}
.wrongitem:first-child{border-top:0}
.wrongitem .ans{color:var(--ok);font-weight:600}
.tag{font-size:.8rem;color:var(--mute)}
@media print{button,.top,.bar{display:none!important}body{background:#fff;color:#000}.card{border:0}}
.opt.sel{border-color:var(--acc);background:var(--accbg)}.note{font-size:.85rem;color:var(--mute);margin:6px 0}.fb.part{color:#c98a00}.exp{margin-top:8px;font-size:.92rem;color:var(--mute)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const Q = [{"id":"W0P1","part":"A","week":0,"topic":"Introduction to OB","stem":"Which field can be called as the mother of Organizational behaviour?","opts":["Anthropology","Economics","Industrial Psychology","Law"],"ans":2,"x":"Industrial psychology (applying psychological techniques in industry - Munsterberg, Scott, Strong) is the historical root of OB. Anthropology, economics and law contribute to OB but are not its 'mother' discipline.","inf":true},{"id":"W0P2","part":"A","week":0,"topic":"Introduction to OB","stem":"Which of the following are core aspects of Organizational Behaviour?","opts":["Individual Behavioural Dynamics","Interpersonal and Group Dynamics","Organizational Dynamics","All of the above"],"ans":3,"x":"OB studies three levels: individual behavioural dynamics (perception, learning, personality, attitudes, motivation), interpersonal and group dynamics, and organizational dynamics (structure, culture, change). All three are core aspects, so 'All of the above'.","inf":true},{"id":"W0P3","part":"A","week":0,"topic":"Introduction to OB","stem":"Who are the potential beneficiaries of a course in Organizational Behaviour?","opts":["HR Professionals","Management Students","Psychology students","All of the above"],"ans":3,"x":"OB is multidisciplinary and useful to anyone who manages or studies people at work: HR professionals, management students and psychology students all benefit, so each single option is incomplete.","inf":true},{"id":"W0P4","part":"A","week":0,"topic":"Introduction to OB","stem":"It is important to understand human behaviour in general to understand their behaviour in workplace.","opts":["True","False"],"ans":0,"x":"Workplace behaviour is human behaviour in an organizational setting; the same needs, perceptions and emotions operate there, so understanding general human behaviour is the foundation for understanding behaviour at work.","ns":true,"inf":true},{"id":"W0P5","part":"A","week":0,"topic":"Introduction to OB","stem":"Perception, learning and personality are attributes of Individual Behavioural Dynamics.","opts":["True","False"],"ans":0,"x":"Perception, learning, personality (plus attitudes, emotions, motivation) are the individual-level processes, i.e. Individual Behavioural Dynamics.","ns":true,"inf":true},{"id":"W0P6","part":"A","week":0,"topic":"Perception","stem":"The process of giving meaning to sensory stimuli through organizing and interpreting is called:","opts":["Sensation","Perception","Sublimation","Organization"],"ans":1,"x":"Perception is the process of giving meaning to sensory stimuli by organizing and interpreting them. Sensation is only the raw reception of stimuli; sublimation is a Freudian defence mechanism; 'organization' is only one sub-step.","inf":true},{"id":"W0P7","part":"A","week":0,"topic":"Introduction to OB","stem":"Organizational structure is a part of Interpersonal and Group dynamics.","opts":["True","False"],"ans":1,"x":"False. Organizational structure belongs to organizational dynamics (like culture and change). Interpersonal and group dynamics cover trust, conflict, communication, decision making, power/leadership and teams.","ns":true,"inf":true},{"id":"W0P8","part":"A","week":0,"topic":"Interpersonal Behaviour","stem":"People differ in their level of trustworthiness.","opts":["True","False"],"ans":0,"x":"People do differ in trustworthiness; this is why trust is treated as something to be built and why trustworthiness is called a virtue and building trust a skill.","ns":true,"inf":true},{"id":"W0P9","part":"A","week":0,"topic":"Perception","stem":"Perception is highly objective.","opts":["True","False"],"ans":1,"x":"False. Perception is an individual's view of reality and is highly SUBJECTIVE, so two people can perceive the same stimulus differently.","ns":true,"inf":true},{"id":"W0P10","part":"A","week":0,"topic":"Introduction to OB","stem":"More output for less input or being able to provide optimal output for a given input is called:","opts":["Effectiveness","Productivity","Efficiency","Motivation"],"ans":2,"x":"Efficiency means more output for less input (optimal output for a given input). Effectiveness is achieving the goal, productivity is the output/input ratio in general, motivation is the force behind effort.","inf":true},{"id":"W1N1","part":"A","week":1,"topic":"Introduction to OB","stem":"Out of the following which one is a behaviour","opts":["Thinking","Sneezing","dreaming","all of the above"],"ans":3,"x":"Behaviour is any response of an organism to internal or external stimuli - conscious or subconscious, overt or covert, voluntary or involuntary. Thinking (covert), sneezing (involuntary) and dreaming (subconscious) are all behaviours.","inf":true},{"id":"W1N2","part":"A","week":1,"topic":"Introduction to OB","stem":"The major contribution of psychology in the world wars is in the area of","opts":["War strategy","Mass recruitment of soldiers","Weapons training","None of the above"],"ans":1,"x":"In the World Wars psychology contributed mainly through psychological testing used for mass selection and placement (recruitment) of soldiers, not through strategy or weapons training. Key is an unofficial inference from the slide topic 'World Wars and Industrial Psychology'.","inf":true},{"id":"W1N3","part":"A","week":1,"topic":"Introduction to OB","stem":"The Major criticism on the Scientific Management Theory was","opts":["Treating humans as machines","doing experiments on humans","Complicated theory","all of the above"],"ans":0,"x":"The main criticism of Taylor's scientific management was that it treated workers like machines (cogs in a production process), ignoring social and psychological needs. This criticism paved the way for the human relations movement.","inf":true},{"id":"W1N4","part":"A","week":1,"topic":"Introduction to OB","stem":"The first set of Hawthorne studies was conducted to understand","opts":["The Effect of duration of work hours on employee performance","The effect of lighting on employee performance","The effect of ventilation on employee performance","None of the above"],"ans":1,"x":"The first set of Hawthorne studies (1924-27) were the illumination studies: the effect of lighting on productivity. Relay assembly room (1927-32) and bank wiring room (1931-32) came later.","inf":true},{"id":"W1N5","part":"A","week":1,"topic":"Introduction to OB","stem":"The key limitation with time and motion studies are:","opts":["They are done under ideal conditions which cannot be generalized","The methodology adopted is no valid","It is unethical to conduct research on humans","None of the above"],"ans":0,"x":"A key limitation of time and motion studies is that they are conducted under ideal/controlled conditions and the standards may not generalize to real workplaces. Key is unofficial; the methodology itself is valid and the studies are not unethical per se.","inf":true},{"id":"W1G1","part":"A","week":1,"topic":"Introduction to OB","stem":"Response of the organism or system to various stimuli or inputs, whether internal or external, conscious or subconscious, overt or covert, voluntary or involuntary is called:","opts":["Organization","Behaviour","Resource","Productivity"],"ans":1,"x":"Behaviour is the response of an organism or system to stimuli, whether internal or external, conscious or subconscious, overt or covert, voluntary or involuntary. Organization, resource and productivity are not definitions of a response."},{"id":"W1G2","part":"A","week":1,"topic":"Introduction to OB","stem":"Hawthorne experiments were a set of experiments conducted to study the impact of assembly line on the health of the workers.","opts":["True","False"],"ans":1,"x":"False. The Hawthorne experiments studied the effect of work conditions (illumination, rest pauses, group norms) on productivity - not the effect of the assembly line on health.","ns":true},{"id":"W1G3","part":"A","week":1,"topic":"Introduction to OB","stem":"The social expectation on an individual is called:","opts":["Role","Designation","Job","Task"],"ans":0,"x":"A role is the set of social expectations placed on an individual in a position. A designation is a title, a job is a set of tasks, and a task is a single unit of work."},{"id":"W1G4","part":"A","week":1,"topic":"Introduction to OB","stem":"Which of the following is not an organization?","opts":["TATA Steels","UNICEF","Facebook Inc.","Germany"],"ans":3,"x":"An organization is a consciously coordinated social entity with an identifiable boundary and common goals. TATA Steel, UNICEF and Facebook qualify; a country (Germany) is not a deliberately arranged organization with such a boundary and goal set."},{"id":"W1G5","part":"A","week":1,"topic":"Introduction to OB","stem":"More output for less input or being able to provide optimal output for a given input is called:","opts":["Effectiveness","Productivity","Efficiency","Motivation"],"ans":2,"x":"Efficiency = more output for less input (optimal output for given input). Effectiveness is about goal attainment; productivity is the general output-to-input measure."},{"id":"W1G6","part":"A","week":1,"topic":"Introduction to OB","stem":"Which field can be called as the mother of Organizational behaviour?","opts":["Anthropology","Economics","Industrial Psychology","Law"],"ans":2,"x":"Industrial Psychology is regarded as the mother field of OB (Walter Dill Scott, Strong, Munsterberg). Anthropology, economics and law came later as contributing disciplines."},{"id":"W1G7","part":"A","week":1,"topic":"Introduction to OB","stem":"In an experiment, the group in which you make no changes is called the:","opts":["Experimental Group","Focus Group","Control Group","Target Group"],"ans":2,"x":"In an experiment the group in which no change is made is the control group; the group receiving the intervention is the experimental group. It provides the baseline for comparison."},{"id":"W1G8","part":"A","week":1,"topic":"Introduction to OB","stem":"The assembly line of production was first introduced by Henry Ford.","opts":["True","False"],"ans":0,"x":"True. Henry Ford introduced the moving assembly line of production.","ns":true},{"id":"W1G9","part":"A","week":1,"topic":"Introduction to OB","stem":"The scientific management movement was pioneered by:","opts":["Walter Dill Scott","Edward K Strong Jr.","Hugo Munsterberg","Frederick W Taylor"],"ans":3,"x":"Frederick W. Taylor pioneered scientific management. Scott (advertising), Strong (vocational guidance) and Munsterberg (industrial accidents, 'Psychology and Industrial Efficiency') belong to industrial psychology."},{"id":"W1G10","part":"A","week":1,"topic":"Introduction to OB","stem":"The process of breaking down the entire job into specific tasks and see how each of these tasks are performed and how much time on an average a person will take to finish it is called:","opts":["Time and Motion Study","Workplace management","Job Profile","Productivity"],"ans":0,"x":"Time and motion study breaks a job into specific tasks and measures how each is performed and how long it takes on average. It is Taylor's first principle: scientifically study each part of the job."},{"id":"W2N1","part":"A","week":2,"topic":"Perception","stem":"All perceptions are subjective in nature","opts":["True","False"],"ans":0,"x":"True. Perception is an individual's view of reality and is highly subjective.","ns":true,"inf":true},{"id":"W2N2","part":"A","week":2,"topic":"Perception","stem":"Prior Learning plays an important role in perceptual selection","opts":["True","False"],"ans":0,"x":"True. Learning is an internal factor in perceptual selection: past experience determines what we notice and how we interpret it (others: habit, motivation/interest, organizational role).","ns":true,"inf":true},{"id":"W2N3","part":"A","week":2,"topic":"Perception","stem":"The social perception does not involve integrating information collected","opts":["True","False"],"ans":1,"x":"False. Social perception IS the process of combining, integrating and interpreting information about others to understand them.","ns":true,"inf":true},{"id":"W2N4","part":"A","week":2,"topic":"Perception","stem":"According to the casual attribution theory, the extent to which other people behave in the same manner as the person we are judging is called as Consensus","opts":["True","False"],"ans":0,"x":"True. In Kelley's theory, consensus is the extent to which other people behave in the same way as the person being judged.","ns":true,"inf":true},{"id":"W2N5","part":"A","week":2,"topic":"Perception","stem":"A belief that all members of specific groups share similar traits and are prone to behave the same way is called as stereotyping","opts":["True","False"],"ans":0,"x":"True. Stereotyping is the belief that all members of a group share similar traits and behave in the same way.","ns":true,"inf":true},{"id":"W2G1","part":"A","week":2,"topic":"Perception","stem":"Perception is highly objective.","opts":["True","False"],"ans":1,"x":"False. Perception is highly subjective, not objective.","ns":true},{"id":"W2G2","part":"A","week":2,"topic":"Perception","stem":"There are many women at the bottom and middle level management roles but only a very few make it to the top. This is due to:","opts":["Impression Management techniques","Golem effect","Pygmalion effect","Glass-ceiling effect"],"ans":3,"x":"The glass-ceiling effect is the invisible barrier that stops (often women) from reaching top positions despite strong representation at lower levels. Pygmalion and Golem effects are self-fulfilling prophecies (high vs low expectations); impression management is self-presentation."},{"id":"W2G3","part":"A","week":2,"topic":"Perception","stem":"The process of giving meaning to sensory stimuli through organizing and interpreting is called:","opts":["Sensation","Perception","Sublimation","Organization"],"ans":1,"x":"Perception = giving meaning to sensory stimuli by organizing and interpreting them. Sensation only receives; sublimation is a defence mechanism."},{"id":"W2G4","part":"A","week":2,"topic":"Perception","stem":"Which of the following is an internal factor that influence the principles of perceptual selection?","opts":["Contrast","Repetition","Motion","Habit"],"ans":3,"x":"Habit is an INTERNAL factor of perceptual selection. Contrast, repetition and motion are EXTERNAL factors (also intensity, size, novelty/familiarity)."},{"id":"W2G5","part":"A","week":2,"topic":"Perception","stem":"In the above picture, we tend to see columns of dots due to a perceptual grouping effect called:","opts":["Similarity","Proximity","Continuity","Symmetry"],"ans":1,"x":"Dots arranged closer together in columns are seen as columns because of the proximity principle of perceptual grouping (nearness). Similarity would group by likeness; continuity by smooth paths. (Picture-based question; image not reproduced.)","img":"iVBORw0KGgoAAAANSUhEUgAAARgAAADcCAIAAAAk4inNAABXZUlEQVR42u292XNb15E/jn3f94UEQHDfJJHURsuWZccqL1GSiSeeqpmqpGrmJVXzV+Rp/oGZt6mah0mmnPLUJFPOKI6SsmVLkSyJlESKi7gAJEFi39eLHfw+9E+nju8FIRAXvBf+Fc6DSyaJi9P3nO7T3af78+EeHx9z+qM/+oPe4PVfQX/0R1+R+qM/+orUH/3RV6T+6I/+6CtSf/RHX5H6oz/6itQf/dFXpP7oj54YvXb/KaDz4UajAfJwudzj4+Pj42PuqwGiot/yeDwkeb1e5/P56F2gv+/sbXb82dd+vF6vI9F4PF6j0cCnin+20WhQxUQvhMfjNd0Enc2c/mePj49BFjRnWEf4Cf4rJAWPx4P/Re8EX2gGFgt9Fk2+0WigWZFWAf1l069G69jO/NufMy1FwncVh8OBHQPfjStJo9EAIf+/Q/C7u430qN4xeKQlQVsK/QG+JPA3uJi9WTKCrBsSEF8LZAvQr0jvgWQs2Br4zKnmGF8F6kZt+m+WXTvSGrx2/Zpa097ccGgxSNNDUlDlwv+Nm+0elK6p49DUODa1cayLRl0UNE9ci3BZSEvT9V3H67pspFnim6yp2vTmVqMuGHIkSDuv9Vndy4oEhyrJIDa12bi8yINicfL4KXSSUcAdVKrad33+XXDtSPbs+Pi4VqvVarX6q4FccC6Xy+fzRSIRn8/nvRpN/V32kzA8Hu5zHx8fV6vVarUKopHCP6FQyOfzBQKBUCjs/SJgWItGo1HHBqwR/EogEPD5fKFQKBAIkKNO8vfY0iV07KANg35yfHxcr9er1Sr8Aw/8+Hw+LBCfzz+j41TQFdlQdAQyEATx8uXLcDgcDocjkUi9Xq/Vanw+X6FQ6PV6s9k8NjZmMpkUCgVkHXrftSsWi/v7+0dHR+FwOBaLFQqFWq3G5XLFYrFKpTKbzXa7fWhoyGq1crncer0ONqLrjni3FguMXaFQCAaDW1tb+Xw+FouVy2UwcyqVymAwjI6OulwuqVRKMvPU3AmLwR6eIGk0Gslk8ujoKJVK7ezsZLNZ0DeBQKBSqWw2m9PpHBgYUKlUZ+GdCugLg/63WCy he person behave the same way in other contexts?). The description given is consensus."},{"id":"W2G9","part":"A","week":2,"topic":"Perception","stem":"The tendency to attribute others’ action to internal causes while largely ignoring external factors is called:","opts":["Halo effect","Team-Halo effect","Fundamental attribution error","Similar-to-me effect"],"ans":2,"x":"The fundamental attribution error is the tendency to attribute others' actions to internal causes (personality) while underestimating external causes. Halo effect = general impression colouring specific judgments; team halo = crediting teams for success only; similar-to-me = favouring similar people."},{"id":"W2G10","part":"A","week":2,"topic":"Perception","stem":"The word “Carpenter” immediately brings in to memory the image of a male individual rather than a female individual. This is an example of a job stereotype.","opts":["True","False"],"ans":0,"x":"True. Associating 'carpenter' with a man rather than a woman is a job (occupational) stereotype.","ns":true},{"id":"W3N1","part":"A","week":3,"topic":"Personality","stem":"According to psychology, personality has a strong influence on human behavior","opts":["True","False"],"ans":0,"x":"True. Personality is defined as relatively stable characteristics that influence behaviour, attitudes, motivation and emotions; it is 'the key to understand an individual's behaviour'.","ns":true,"inf":true},{"id":"W3N2","part":"A","week":3,"topic":"Personality","stem":"Psychoanalytic theory believes in the role of learning in the development of personality","opts":["True","False"],"ans":1,"x":"False. Role of learning in personality is emphasized by social learning theory (and behaviourists). Psychoanalytic theory focuses on unconscious drives and the Id-Ego-Superego.","ns":true,"inf":true},{"id":"W3N3","part":"A","week":3,"topic":"Personality","stem":"Employees with high self-esteem are very dominating over others","opts":["True","False"],"ans":1,"x":"False. High self-esteem employees are happy, realistic, moderate risk takers and ready to take responsibility - not dominating over others. Self-esteem is about self-regard, not dominance.","ns":true,"inf":true},{"id":"W3N4","part":"A","week":3,"topic":"Personality","stem":"Personality styles can also be called as personality types","opts":["True","False"],"ans":0,"x":"True. Personality types are also called personality styles; traits are individual characteristics.","ns":true,"inf":true},{"id":"W3N5","part":"A","week":3,"topic":"Personality","stem":"Machiavellianistic individuals willingly manipulate others for their own benefit","opts":["True","False"],"ans":0,"x":"True. Machiavellianism is the willingness to manipulate others for one's own purpose (distrust, closed-mindedness, power-centred).","ns":true,"inf":true},{"id":"W3G1","part":"A","week":3,"topic":"Personality","stem":"In Johari’s Window model of self-awareness, the part of the self which is not known to ourselves, but others know is called:","opts":["Open","Blind","Hidden","Unknown"],"ans":1,"x":"In Johari's Window the Blind area is unknown to self but known to others. Open = known to both; Hidden = known to self, not others; Unknown = known to neither."},{"id":"W3G2","part":"A","week":3,"topic":"Personality","stem":"The meaning of the Latin word ‘Persona’ from which the word Personality arises is:","opts":["Behaviour","Mask","Thought","Person"],"ans":1,"x":"Personality comes from the Latin 'persona', the mask worn by actors in plays (per + sonare: to sound through)."},{"id":"W3G3","part":"A","week":3,"topic":"Personality","stem":"Many psychologists argue that one’s personality can be changed over a period of time because those qualities are formed because of social factors.","opts":["True","False"],"ans":0,"x":"True. Many psychologists argue personality is shaped by social factors (learning, socialization, role models) and so can change over time, unlike the strict hereditary view.","ns":true},{"id":"W3G4","part":"A","week":3,"topic":"Personality","stem":"According to Big Five Personality Theory, people who like to experiment and try and find out new things and are less judgmental about people of other cultures are high on:","opts":["Adjustment","Agreeableness","Conscientiousness","Intellectual Openness"],"ans":3,"x":"Intellectual openness (openness to experience) describes curiosity, willingness to experiment and being less judgmental of other cultures. Adjustment = emotional stability, Agreeableness = cooperative/trusting, Conscientiousness = organized/dependable."},{"id":"W3G5","part":"A","week":3,"topic":"Personality","stem":"According to Sigmund Freud’s psychoanalytic theory, the deepest level of consciousness is:","opts":["Subconscious","Conscious state","Unconscious","Awareness"],"ans":2,"x":"Freud's levels of consciousness: conscious, subconscious (preconscious) and the deepest, the unconscious."},{"id":"W3G6","part":"A","week":3,"topic":"Personality","stem":"According to Sigmund Freud, reality principle is followed by:","opts":["Id","Super Ego","Dream","Ego"],"ans":3,"x":"The Ego follows the reality principle (balances the Id and Superego with practical reality). The Id follows the pleasure principle; the Superego the morality principle."},{"id":"W3G7","part":"A","week":3,"topic":"Personality","stem":"In social learning theory, the withdrawal of something which somebody likes to strengthen a behaviour is called:","opts":["Negative Reinforcement","Positive Reinforcement","Reward","Punishment"],"ans":0,"x":"Negative reinforcement strengthens a behaviour by withdrawing (or avoiding) something unpleasant. Positive reinforcement adds a reward; punishment weakens behaviour. NOTE: the official question says 'withdrawal of something which somebody likes' but the official key is Negative Reinforcement - follow the official key."},{"id":"W3G8","part":"A","week":3,"topic":"Personality","stem":"The main proponent of Self Theory was:","opts":["Sigmund Freud","Albert Bandura","Carl Rogers","B.F. Skinner"],"ans":2,"x":"Carl Rogers is the main proponent of Self Theory (free will, self-concept, self-esteem, unconditional acceptance). Freud = psychoanalytic, Bandura = social learning, Skinner = operant conditioning."},{"id":"W3G9","part":"A","week":3,"topic":"Personality","stem":"Employees with high self-esteem are more ready to take responsibilities.","opts":["True","False"],"ans":0,"x":"True. Employees with high self-esteem are happy, realistic, moderate risk takers, motivated, self-disciplined and ready to take responsibilities.","ns":true},{"id":"W3G10","part":"A","week":3,"topic":"Personality","stem":"People with _______ locus of control believe that others control their life and whatever happens in their life is because of outside factors.","opts":["Internal","External"],"ans":1,"x":"People with an EXTERNAL locus of control believe outside forces (others, luck, fate) control their lives. Internal locus = believing one controls one's own outcomes. (The portal export truncated the accepted answer; External is the only consistent option.)"},{"id":"W4N1","part":"A","week":4,"topic":"Learning","stem":"Learning involves change in behavior","opts":["True","False"],"ans":0,"x":"True. Learning is a relatively permanent change in behaviour resulting from experience.","ns":true,"inf":true},{"id":"W4N2","part":"A","week":4,"topic":"Learning","stem":"According to the operant conditioning theory, punishment is a form of negative reinforcement","opts":["True","False"],"ans":1,"x":"False. Punishment presents an unpleasant consequence to weaken behaviour; negative reinforcement removes/avoids an aversive stimulus to STRENGTHEN behaviour.","ns":true,"inf":true},{"id":"W4N3","part":"A","week":4,"topic":"Learning","stem":"Cognitive maps are the internal representation of the external world","opts":["True","False"],"ans":0,"x":"True. A cognitive map is an internal perceptual representation of external environmental features and landmarks.","ns":true,"inf":true},{"id":"W4N4","part":"A","week":4,"topic":"Attitudes","stem":"Values are fewer in number than attitudes","opts":["True","False"],"ans":0,"x":"True. Values are fewer in number than attitudes, transcend specific objects/situations, are relatively permanent and central to the person.","ns":true,"inf":true},{"id":"W4N5","part":"A","week":4,"topic":"Attitudes","stem":"Supportive colleagues can contribute to job satisfaction","opts":["True","False"],"ans":0,"x":"True. Supportive colleagues (along with challenging work, equitable rewards, supportive conditions, personality-job fit) are determinants of job satisfaction.","ns":true,"inf":true},{"id":"W4G1","part":"A","week":4,"topic":"Attitudes","stem":"__________ are evaluative statements towards objects, people or events.","opts":["Learning","Attitudes","Memory","Personality"],"ans":1,"x":"Attitudes are evaluative statements towards objects, people or events - tendencies to react in a certain way, for or against something."},{"id":"W4G2","part":"A","week":4,"topic":"Learning","stem":"A relatively permanent change in behaviour occurring as a result of experience is called:","opts":["Thinking","Sensation","Learning","Prejudice"],"ans":2,"x":"Learning is a relatively permanent change in behaviour as a result of experience. Thinking, sensation and prejudice are not definitions of learning."},{"id":"W4G3","part":"A","week":4,"topic":"Attitudes","stem":"Providing more information can lead to change in attitude.","opts":["True","False"],"ans":0,"x":"True. Providing information is one way to change attitudes (others: reinforcing change, providing opportunities to explore new situations).","ns":true},{"id":"W4G4","part":"A","week":4,"topic":"Learning","stem":"In Pavlov’s Dog experiment, the food presented which makes the dog salivate is:","opts":["Unconditional stimulus","Unconditional response","Conditioned stimulus","Conditioned response"],"ans":0,"x":"In Pavlov's experiment, food is the unconditioned (unconditional) stimulus: it naturally produces salivation (the unconditioned response). The bell becomes the conditioned stimulus; salivating to the bell is the conditioned response."},{"id":"W4G5","part":"A","week":4,"topic":"Learning","stem":"In Operant conditioning, the process through which the responses that are no longer reinforced tend to gradually diminish in strength is called:","opts":["Positive reinforcement","Negative Reinforcement","Punishment","Extinction"],"ans":3,"x":"Extinction is the gradual weakening of a response that is no longer reinforced. Reinforcement strengthens; punishment adds an aversive consequence."},{"id":"W4G6","part":"A","week":4,"topic":"Learning","stem":"After watching a Dance TV show, a kid starts to make dance moves. This is an example of:","opts":["Operant conditioning","Classical conditioning","Observational learning","Negative Reinforcement"],"ans":2,"x":"Learning dance moves by watching a show is observational learning (modelling/vicarious learning): attention, retention, reproduction, motivation. No stimulus pairing (classical) or consequence (operant) is involved."},{"id":"W4G7","part":"A","week":4,"topic":"Attitudes","stem":"Opinion is primarily _______ in nature.","opts":["Affective","Cognitive","Behavioural","Unconscious"],"ans":1,"x":"An opinion is primarily cognitive (a specific belief/judgment), while attitudes have cognitive, affective and behavioural components and influence opinions."},{"id":"W4G8","part":"A","week":4,"topic":"Attitudes","stem":"The intensity of an attitude or the magnitude/degree of its favorableness is called","opts":["Multiplexity","Relation to need","Centrality","Valence"],"ans":3,"x":"Valence is the magnitude or degree of favourableness/unfavourableness. Multiplexity = number of elements, relation to needs = purpose served, centrality = importance of the object."},{"id":"W4G9","part":"A","week":4,"topic":"Attitudes","stem":"When people do not provide honest answers to certain questions because they feel that it is not right to give those answers, it is called:","opts":["Social Loafing","Fatigue","Social Desirability Effect","Sampling"],"ans":2,"x":"The social desirability effect is giving answers one thinks are socially acceptable rather than honest ones - a key issue in attitude measurement. Social loafing is reduced effort in groups."},{"id":"W4G10","part":"A","week":4,"topic":"Attitudes","stem":"Uncomfortable tension which comes from holding two conflicting thoughts in the mind at the same time is called Cognitive Dissonance.","opts":["True","False"],"ans":0,"x":"True. Cognitive dissonance is the uncomfortable tension from holding two conflicting thoughts at the same time; it can motivate attitude or behaviour change.","ns":true},{"id":"W5N1","part":"A","week":5,"topic":"Emotions & Stress","stem":"Feelings based on information external to themselves is called self-conscious emotions","opts":["True","False"],"ans":1,"x":"False. Feelings based on information external to oneself are SOCIAL emotions (pity, envy, jealousy). Self-conscious emotions (shame, guilt, embarrassment, pride) stem from within.","ns":true,"inf":true},{"id":"W5N2","part":"A","week":5,"topic":"Emotions & Stress","stem":"Emotional labour is part of most service sector jobs","opts":["True","False"],"ans":0,"x":"True. Emotional labour - regulating displayed emotions - is typical of service sector jobs (airline attendants, customer service).","ns":true,"inf":true},{"id":"W5N3","part":"A","week":5,"topic":"Emotions & Stress","stem":"Using aggression as a tool to achieve something is called threat based aggression","opts":["True","False"],"ans":1,"x":"False. Using aggression to get something is INSTRUMENTAL aggression; threat-based aggression is self-defence/fear.","ns":true,"inf":true},{"id":"W5N4","part":"A","week":5,"topic":"Emotions & Stress","stem":"Stress can also result due to positive life experiences","opts":["True","False"],"ans":0,"x":"True. Eustress is the positive form of stress arising from positive experiences (e.g. promotion, marriage).","ns":true,"inf":true},{"id":"W5N5","part":"A","week":5,"topic":"Emotions & Stress","stem":"Low levels of stimulation can also lead to stress","opts":["True","False"],"ans":0,"x":"True. Hypo-stress (too little stimulation, boredom) is a type of stress, as is hyper work stress (overload).","ns":true,"inf":true},{"id":"W5G1","part":"A","week":5,"topic":"Emotions & Stress","stem":"The stress which happens because of positive incidences is called:","opts":["Distress","Eustress","Hypo-stress","Hyper work stress"],"ans":1,"x":"Eustress is stress from positive incidents. Distress is negative stress; hypo-stress is under-stimulation; hyper work stress is overload."},{"id":"W5G2","part":"A","week":5,"topic":"Emotions & Stress","stem":"An unfocused, relatively mild feeling that exists as background to our daily experience is called:","opts":["Behaviour","Perception","Mood","Envy"],"ans":2,"x":"A mood is an unfocused, relatively mild feeling that exists as a background to daily experience (unlike emotions, which usually have an object)."},{"id":"W5G3","part":"A","week":5,"topic":"Emotions & Stress","stem":"The psychological effort involved in holding back one’s true emotions is called:","opts":["Emotional dissonance","Emotional labor","Emotional Attachment","Temperament"],"ans":1,"x":"Emotional labour is the psychological effort of holding back one's true emotions. Emotional dissonance is the inconsistency between felt and expressed emotions."},{"id":"W5G4","part":"A","week":5,"topic":"Emotions & Stress","stem":"When John failed his driving license test, he starts to remember how his friends used to tease him saying he was not a good driver. This is an example of:","opts":["Work-family spillover effect","Emotional dissonance","Empathy","Mood congruence effect"],"ans":3,"x":"Mood congruence is recalling things consistent with the current mood (bad mood -> recalling bad memories). Work-family spillover is carrying emotions between work and home."},{"id":"W5G5","part":"A","week":5,"topic":"Emotions & Stress","stem":"Threat-based aggression can stem from both a real stimulus or a perceived stimulus.","opts":["True","False"],"ans":0,"x":"True. Threat-based aggression, a response to fear or self-defence, can arise from a real or merely perceived threat.","ns":true},{"id":"W5G6","part":"A","week":5,"topic":"Emotions & Stress","stem":"___________ is when you have a goal and you are moving towards that goal and you feel that something or someone is stopping you from reaching that goal.","opts":["Threat-based aggression","Instrumental aggression","Irritable aggression","Frustration-based aggression"],"ans":3,"x":"Frustration-based aggression occurs when goal-directed behaviour is blocked. Instrumental = used to get something; irritable = response to pain/irritation; threat-based = fear/self-defence."},{"id":"W5G7","part":"A","week":5,"topic":"Emotions & Stress","stem":"Fear of being rejected is one of the main reasons that make people non-assertive.","opts":["True","False"],"ans":0,"x":"True. Fear (of rejection, being taken for granted, vulnerability, humiliation, embarrassment) and insecurity make people non-assertive.","ns":true},{"id":"W5G8","part":"A","week":5,"topic":"Emotions & Stress","stem":"The feeling of completely tired and exhausted when you are stressed for a very long time accompanied by lack of meaning is called:","opts":["Burnout","Absenteeism","Hypo stress","Alarm-reaction"],"ans":0,"x":"Burnout is complete physical and emotional exhaustion after prolonged stress, with loss of meaning (the exhaustion stage of General Adaptation Syndrome leads here). Alarm reaction is only the first stage."},{"id":"W5G9","part":"A","week":5,"topic":"Emotions & Stress","stem":"What are the behavioural symptoms of stress?","opts":["Low productivity","Interpersonal conflicts","Suicidal tendencies","All of the above"],"ans":3,"x":"Low productivity, absenteeism, interpersonal conflict, suicidal tendencies and isolation are all behavioural symptoms of stress - so 'All of the above'."},{"id":"W5G10","part":"A","week":5,"topic":"Emotions & Stress","stem":"__________ is a mild form of hate.","opts":["Guilt","Humiliation","Resentment","Shame"],"ans":2,"x":"Resentment is a mild form of hate. Shame = inadequacy, humiliation = reduced to lower position/disgrace, guilt = violating standards."},{"id":"W6N1","part":"A","week":6,"topic":"Motivation","stem":"Primary motives are physiological in nature","opts":["True","False"],"ans":0,"x":"True. Primary motives are unlearnt and physiological (hunger, thirst, sleep).","ns":true,"inf":true},{"id":"W6N2","part":"A","week":6,"topic":"Motivation","stem":"Employees are driven only by financial rewards","opts":["True","False"],"ans":1,"x":"False. Employees are motivated by many things besides money - nature of work, recognition, advancement, security, fairness.","ns":true,"inf":true},{"id":"W6N3","part":"A","week":6,"topic":"Motivation","stem":"According to Herzberg’s theory working conditions fall under motivators","opts":["True","False"],"ans":1,"x":"False. Working conditions are HYGIENE factors in Herzberg's theory; motivators are intrinsic factors like the job itself, recognition, responsibility and growth.","ns":true,"inf":true},{"id":"W6N4","part":"A","week":6,"topic":"Motivation","stem":"Sense of equity is a powerful motivator at work place","opts":["True","False"],"ans":0,"x":"True. Equity (fairness) is a powerful motivator - equity theory and organizational justice.","ns":true,"inf":true},{"id":"W6N5","part":"A","week":6,"topic":"Motivation","stem":"Motivation theories which describe the factors which motivate employees are called as content theories","opts":["True","False"],"ans":0,"x":"True. Content theories describe WHAT motivates people (Maslow, Herzberg, ERG); process theories explain HOW (expectancy, equity).","ns":true,"inf":true},{"id":"W6G1","part":"A","week":6,"topic":"Motivation","stem":"___________ is the willingness of a person to put high levels of efforts to reach a goal.","opts":["Emotions","Motivation","Frustration","Incentives"],"ans":1,"x":"Motivation is the willingness to exert high levels of effort to reach a goal. Frustration is a blocked goal; emotions and incentives are different concepts."},{"id":"W6G2","part":"A","week":6,"topic":"Motivation","stem":"The need to be part of a group is categorized as:","opts":["Achievement motive","Affiliation motive","Power motive","Role conflict"],"ans":1,"x":"The need to be part of a group is the affiliation motive. Achievement = moderate risk, feedback; power = desire to control others; role conflict is an intra-personal conflict."},{"id":"W6G3","part":"A","week":6,"topic":"Motivation","stem":"Money is a form of extrinsic motivation.","opts":["True","False"],"ans":0,"x":"True. Money is an extrinsic motivator - an external reward - rather than inherent in the work.","ns":true},{"id":"W6G4","part":"A","week":6,"topic":"Motivation","stem":"According to Maslow’s hierarchy of needs, the highest level of needs one can achieve is:","opts":["Self-actualization","Social Needs","Esteem needs","Safety needs"],"ans":0,"x":"Self-actualization is the highest level in Maslow's hierarchy (physiological, safety, social, esteem, self-actualization)."},{"id":"W6G5","part":"A","week":6,"topic":"Motivation","stem":"According to Herzberg’s two-factor theory of motivation, pay and security provided by a job is a Motivator.","opts":["True","False"],"ans":1,"x":"False. Pay and job security are HYGIENE factors - their absence causes dissatisfaction but their presence does not truly motivate.","ns":true},{"id":"W6G6","part":"A","week":6,"topic":"Motivation","stem":"In Alderfer’s ERG theory of motivation, R stands for","opts":["Reputation","Regression","Resilience","Relatedness"],"ans":3,"x":"ERG = Existence, Relatedness, Growth (Alderfer). R stands for Relatedness."},{"id":"W6G7","part":"A","week":6,"topic":"Motivation","stem":"____________ means that employees feel that the organization treats its employees in a fair manner and a just way.","opts":["Intra-personal conflict.","Self-esteem","Power motive","Organizational Justice Climate"],"ans":3,"x":"Organizational justice climate is employees' perception that the organization treats them in a fair and just manner (distributive, procedural, interactional justice)."},{"id":"W6G8","part":"A","week":6,"topic":"Motivation","stem":"__________ is when you are moving towards a certain goal, but certain barriers are stopping you from achieving that goal.","opts":["Goal conflict","Role conflict","Frustration","Satisfaction"],"ans":2,"x":"Frustration arises when a goal-directed person is blocked by barriers. Goal conflict is a clash between competing goals; role conflict is a clash between role expectations."},{"id":"W6G9","part":"A","week":6,"topic":"Motivation","stem":"One of the drawbacks of using money as a motivator is that it can reduce extra-role performance.","opts":["True","False"],"ans":0,"x":"True. Money can restrict extra-role performance - people may do only what is paid for.","ns":true},{"id":"W6G10","part":"A","week":6,"topic":"Motivation","stem":"John had applied for several jobs after graduation. One day he received a job offer from Tata Motors and Mahindra Group, both of which he loved to work. The conflict Mr. John is facing in selecting one job is called:","opts":["Role Conflict","Approach-avoidance conflict","Approach-approach conflict","Avoidance-avoidance conflict"],"ans":2,"x":"Two attractive alternatives (Tata Motors and Mahindra offers he loved) form an approach-approach conflict. Avoidance-avoidance = two unattractive options; approach-avoidance = one option with both pros and cons."},{"id":"W7N1","part":"A","week":7,"topic":"Interpersonal Behaviour","stem":"Treating the common resources responsibly is called civic virtue.","opts":["True","False"],"ans":0,"x":"True. Civic virtue in OCB means responsible participation in and care for the organization, including treating common resources responsibly (key is unofficial; mirrors the graded W7 item).","ns":true,"inf":true},{"id":"W7G1","part":"A","week":7,"topic":"Interpersonal Behaviour","stem":"When each party involved in a task tries to maximize its own gains, often at the expense of others, it is called:","opts":["Cooperation","Interdependency","Competition","None of the above"],"ans":2,"x":"Competition: each party tries to maximize its own gains, often at the expense of others. Cooperation involves working together toward shared goals for mutual benefit."},{"id":"W7G2","part":"A","week":7,"topic":"Interpersonal Behaviour","stem":"The degree of confidence we have on others in a relationship is called:","opts":["Transactional contract","Relational contract","Trust","Norms"],"ans":2,"x":"Trust is the degree of confidence one has in others (it involves risk-taking). Transactional and relational contracts are types of psychological contracts."},{"id":"W7G3","part":"A","week":7,"topic":"Interpersonal Behaviour","stem":"The kind of psychological contract that focuses on long-term interaction and a widely defined relationship is called relational contract.","opts":["True","False"],"ans":0,"x":"True. A relational psychological contract focuses on long-term, widely defined relationships; a transactional contract is primarily economic, brief and narrowly defined.","ns":true},{"id":"W7G4","part":"A","week":7,"topic":"Interpersonal Behaviour","stem":"The type of trust that is established based on the credibility of a person, for e.g., trusting the doctor:","opts":["Trust based on familiarity","Swift trust","Trust based on similarity","Trust based on social networks"],"ans":1,"x":"Official key: swift trust - trust that forms quickly, based on role/credibility (as when we trust a doctor we have just met) without the history needed for familiarity-based trust. Familiarity = repeated interaction, similarity = shared traits, social networks = embeddedness/referrals."},{"id":"W7G5","part":"A","week":7,"topic":"Interpersonal Behaviour","stem":"The characteristic of being and respectful towards others is:","opts":["Conscientiousness","Sportsmanship","Civic virtue","Courtesy"],"ans":3,"x":"Courtesy (being considerate and respectful toward others) is the OCB dimension. Conscientiousness = going beyond minimum requirements, sportsmanship = tolerating inconveniences without complaint, civic virtue = involvement in the organization. (Original question text is garbled.)"},{"id":"W7G6","part":"A","week":7,"topic":"Interpersonal Behaviour","stem":"Treating the common resources responsibly is called","opts":["True","False"],"ans":0,"x":"Official key: True (the portal question text is incomplete - 'Treating the common resources responsibly is called ...' - and refers to civic virtue). Civic virtue = responsible participation and treatment of common resources.","ns":true},{"id":"W7G7","part":"A","week":7,"topic":"Interpersonal Behaviour","stem":"__________ is helping without expecting anything in return.","opts":["Altruism","Competition","Cooperation","Conscientiousness"],"ans":0,"x":"Altruism is helping others without expecting anything in return. Cooperation is working jointly; conscientiousness is doing more than the minimum."},{"id":"W7G8","part":"A","week":7,"topic":"Interpersonal Behaviour","stem":"Disagreements on strategy and sharing of responsibility and resources is called:","opts":["Relational conflict","Task conflict","Process conflict","Avoiding"],"ans":2,"x":"Process conflict = disagreement on strategy and sharing of responsibilities and resources. Relational = personal/social issues; task = the work itself."},{"id":"W7G9","part":"A","week":7,"topic":"Interpersonal Behaviour","stem":"People who focus on maximizing the joint outcomes of everyone involved are called:","opts":["Competitors","Cooperators","Individualists","Equalizers"],"ans":1,"x":"Cooperators maximize joint outcomes. Competitors want to do better than others, individualists maximize own gain, equalizers minimize differences."},{"id":"W7G10","part":"A","week":7,"topic":"Interpersonal Behaviour","stem":"Which conflict handling style is best for both the parties involved?","opts":["Competing","Avoiding","Accommodating","Collaborating"],"ans":3,"x":"Collaborating (win-win) addresses the concerns of both parties and is considered best for both. Competing is win-lose, accommodating is lose-win, avoiding is lose-lose."},{"id":"W8G1","part":"A","week":8,"topic":"Communication","stem":"The communication style that is supportive and avoids change and confrontation is called:","opts":["Animated communication style","Driver communication style","Amiable communication style","Analytical communication style"],"ans":2,"x":"Amiable style = supportive, avoids change and confrontation. Driver = direct, task-oriented; animated = enthusiastic, relationship-oriented; analytical = accurate, detail-oriented."},{"id":"W8G2","part":"A","week":8,"topic":"Communication","stem":"In communication, the process of converting a message into symbols is called:","opts":["Message","Channel","Decoding","Encoding"],"ans":3,"x":"Encoding is converting a message into symbols. Decoding is the receiver translating the message; channel is the medium."},{"id":"W8G3","part":"A","week":8,"topic":"Communication","stem":"Any disturbance that interfere with the transmission, receipt or feedback of a message is called noise.","opts":["True","False"],"ans":0,"x":"True. Noise is any disturbance that interferes with the transmission, receipt or feedback of a message.","ns":true},{"id":"W8G4","part":"A","week":8,"topic":"Communication","stem":"The level of openness which exists in an organization which gives a certain level of comfort to its members is called:","opts":["Common information effect","Hidden profile paradigm","Communication climate","Paralinguistic communication"],"ans":2,"x":"Communication climate is the level of openness in an organization that gives members a certain comfort in communicating."},{"id":"W8G5","part":"A","week":8,"topic":"Communication","stem":"Which of the following is NOT a non-verbal mode of communication?","opts":["Facial expressions","Pupil dilation","Gestures","None of the above"],"ans":3,"x":"Facial expressions, pupil dilation and gestures are all non-verbal modes, so the NOT-non-verbal option is 'None of the above'."},{"id":"W8G6","part":"A","week":8,"topic":"Communication","stem":"The study of spatial inter-relationships is called:","opts":["Kinesics","Proxemics","Silence","Symbols"],"ans":1,"x":"Proxemics is the study of spatial interrelationships. Kinesics studies body movements (winking, shrugging); silence affects timing and turn-taking; symbols include clothing and artifacts."},{"id":"W8G7","part":"A","week":8,"topic":"Communication","stem":"Maintaining and distributing minutes of the meeting is helpful in reducing miscommunication in team meetings.","opts":["True","False"],"ans":0,"x":"True. Recording, transforming and distributing meeting information reduces miscommunication and helps build the next agenda.","ns":true},{"id":"W8G8","part":"A","week":8,"topic":"Communication","stem":"When parts of some information are shared with the group members whereas other pieces of information are unshared, it gives rise to:","opts":["Hidden profile paradigm","Awareness","Trust building","Minimizing status difference"],"ans":0,"x":"Hidden profile paradigm: some information is shared among members while other pieces are unshared; groups rarely discover the hidden profile and discuss more shared than unshared information."},{"id":"W8G9","part":"A","week":8,"topic":"Communication","stem":"In information sharing scenario, the case that has to be avoided to reduce decision making problems is:","opts":["Fully shared case","Non-overlapping case","Distributed partial overlap","All of the above"],"ans":2,"x":"Official key: distributed partial overlap. In this case some information is held by several members and some by one, so the group tends to discuss the commonly known information and the unique pieces never surface - the problem to avoid. In the fully shared case everyone already has everything; in the non-overlapping case each member must contribute unique information. (This item was marked incorrect on your portal attempt - study it.)"},{"id":"W8G10","part":"A","week":8,"topic":"Communication","stem":"Most eastern cultures are comfortable with silence between conversations.","opts":["True","False"],"ans":0,"x":"True. Most eastern cultures are comfortable with silence in conversation, whereas in western cultures it is often read as non-comprehension.","ns":true},{"id":"W9G1","part":"A","week":9,"topic":"Decision Making","stem":"The step in team decision making where the problem is defined and a consensus is arrived about what the problem is:","opts":["Discussion","Implementation","Representativeness","Orientation"],"ans":3,"x":"Orientation is the first step in team decision making: define the problem, set goals and plan the process. Then discussion, decision making and implementation. Representativeness is a bias, not a step."},{"id":"W9G2","part":"A","week":9,"topic":"Decision Making","stem":"Making the smallest response possible that will reduce the problem to at least a tolerable level is called __________ to decision making.","opts":["Satisficing approach","Rational Approach","Incremental approach","Garbage-can approach"],"ans":2,"x":"The incremental approach makes the smallest possible response that reduces the problem to a tolerable level. Satisficing seeks a satisfactory (good enough) solution; rational seeks the optimal one; garbage-can is random. (Marked incorrect on your portal attempt.)"},{"id":"W9G3","part":"A","week":9,"topic":"Decision Making","stem":"Having a false sense of satisfaction even when problems start to show up is called:","opts":["Complacency","Procrastination","Defensive avoidance","Panic"],"ans":0,"x":"Complacency is a false sense of satisfaction even as problems begin to show up. Defensive avoidance includes rationalization, procrastination and buck passing; panic is an emotional overreaction."},{"id":"W9G4","part":"A","week":9,"topic":"Decision Making","stem":"Trying to put the responsibility for decision making on somebody else is called buck passing.","opts":["True","False"],"ans":0,"x":"True. Buck passing is trying to put the responsibility for the decision on somebody else (a form of defensive avoidance).","ns":true},{"id":"W9G5","part":"A","week":9,"topic":"Decision Making","stem":"The tendency to be influenced by an initial figure, even when the information is largely irrelevant is called:","opts":["Availability bias","Overconfidence","Anchoring and adjustment bias","Representativeness"],"ans":2,"x":"Anchoring and adjustment: being influenced by an initial figure even when it is largely irrelevant. Availability = ease of recall, representativeness = stereotypes, overconfidence = excess certainty."},{"id":"W9G6","part":"A","week":9,"topic":"Decision Making","stem":"The group’s emphasis on harmony and conformity leading to a wrong decision is called:","opts":["Majority rule","Synergy","Risk taking in groups","Groupthink"],"ans":3,"x":"Groupthink is the group's emphasis on harmony and conformity leading to poor decisions. Majority rule is a voting method; synergy is combined effect; risk taking in groups is a different group-decision issue."},{"id":"W9G7","part":"A","week":9,"topic":"Decision Making","stem":"Sunk costs can be recovered.","opts":["True","False"],"ans":1,"x":"False. Sunk costs are costs that CANNOT be recovered once incurred.","ns":true},{"id":"W9G8","part":"A","week":9,"topic":"Decision Making","stem":"Tendency to invest additional resources in an apparently losing proposition, influenced by effort, money and time already invested:","opts":["Abilene Paradox","Delphi method","Escalation of commitment","Groupthink"],"ans":2,"x":"Escalation of commitment is investing additional resources in an apparently losing proposition because of effort, money and time already invested."},{"id":"W9G9","part":"A","week":9,"topic":"Decision Making","stem":"The tendency to make different decisions depending on how a problem is presented:","opts":["Framing","Prospect theory","Representativeness","Bounded rationality"],"ans":0,"x":"Framing is making different decisions depending on how the problem is presented. Prospect theory says losses hurt more than equivalent gains please."},{"id":"W9G10","part":"A","week":9,"topic":"Decision Making","stem":"Finding a solution which is satisfactory than optimal is called satisficing approach to decision making.","opts":["True","False"],"ans":0,"x":"True. Satisficing means finding a solution that is satisfactory rather than optimal (a non-rational approach under bounded rationality).","ns":true},{"id":"W10G1","part":"A","week":10,"topic":"Power & Leadership","stem":"_________ is the ability to persuade others to seek defined objectives enthusiastically.","opts":["Coercion","Behavioural change","Leadership","Authority"],"ans":2,"x":"Leadership is the ability to persuade others to seek defined objectives enthusiastically; it uses non-coercive influence. Coercion and authority rely on force or position."},{"id":"W10G2","part":"A","week":10,"topic":"Power & Leadership","stem":"The theory which states that the subordinates will be motivated to follow the leader only when they perceive that the leader can help them to fulfil their goals:","opts":["Path-goal theory","Fiedler’s model","Hersey and Blanchard’s situational leadership theory","Trait theory"],"ans":0,"x":"Path-goal theory: subordinates are motivated by a leader only to the extent they perceive the leader as helping them attain their goals. Fiedler = task structure, leader-member relations, position power; Hersey-Blanchard = telling, selling, participating, delegating."},{"id":"W10G3","part":"A","week":10,"topic":"Power & Leadership","stem":"The source of power which is based on the capacity to administer punishment to others:","opts":["Legitimate","Reward","Coercive","Expert"],"ans":2,"x":"Coercive power is based on the capacity to administer punishment. Reward power - capacity to give rewards; legitimate - formal position; expert - skills."},{"id":"W10G4","part":"A","week":10,"topic":"Power & Leadership","stem":"Expert power is when you have certain abilities which nobody else has or is very rare.","opts":["True","False"],"ans":0,"x":"True. Expert power rests on skills and abilities that are scarce or valued.","ns":true},{"id":"W10G5","part":"A","week":10,"topic":"Power & Leadership","stem":"Information or skills one possesses, which cannot be recorded or measured is called:","opts":["Empowerment","Referent power","Gossiping","Tacit knowledge"],"ans":3,"x":"Tacit knowledge is the information or skill one possesses that cannot be easily recorded or measured (know-how). Referent power is based on being liked/admired; empowerment is sharing power."},{"id":"W10G6","part":"A","week":10,"topic":"Power & Leadership","stem":"The form of political behaviour exhibited when employees try to form a group based on common language they speak is:","opts":["Impression management","Building coalitions","Blaming","Manipulating information flow"],"ans":1,"x":"Forming a group around a common language is building coalitions - one of the forms of political behaviour (others: manipulating information, impression management, blaming, reciprocity)."},{"id":"W10G7","part":"A","week":10,"topic":"Power & Leadership","stem":"While managers rely on control, leaders _________.","opts":["Ask how and when","Focus on systems and structure","Accept status quo","Inspire trust"],"ans":3,"x":"Managers rely on control; leaders inspire trust. The other options (ask how and when, systems and structure, accept status quo) describe managers."},{"id":"W10G8","part":"A","week":10,"topic":"Power & Leadership","stem":"The leadership style where the responsibilities are shared by all and can be very useful in businesses where creative ideas are very important:","opts":["Autocratic","Laissez-Faire","Charismatic","Paternalistic"],"ans":1,"x":"Laissez-faire ('let it be'): leadership responsibilities shared by all; very useful where creative ideas matter but can cause coordination problems."},{"id":"W10G9","part":"A","week":10,"topic":"Power & Leadership","stem":"Democratic leadership style encourages decision making from different perspectives.","opts":["True","False"],"ans":0,"x":"True. Democratic leadership encourages decision making from different perspectives (consultative, persuasive); it improves involvement but can delay decisions.","ns":true},{"id":"W10G10","part":"A","week":10,"topic":"Power & Leadership","stem":"The ideal case in Blake Mouton Managerial Grid of Leadership style is:","opts":["Country club","Impoverished","Produce or perish","Team Leader"],"ans":3,"x":"In the Blake-Mouton Managerial Grid the ideal is Team Leader (9,9) - high concern for both production and people. Country club (1,9), impoverished (1,1), produce-or-perish/authority (9,1)."},{"id":"W11G1","part":"A","week":11,"topic":"Group Dynamics & Teams","stem":"A type of thought exhibited by group members who try to minimize conflict and reach consensus without critically testing, analyzing and evaluating ideas.","opts":["Groupthink","Instrumentality","Mundane task","Team cohesion"],"ans":0,"x":"Groupthink is group members minimizing conflict and reaching consensus without critically testing, analysing and evaluating ideas."},{"id":"W11G2","part":"A","week":11,"topic":"Group Dynamics & Teams","stem":"Airline attendant teams are an example of:","opts":["Production teams","Service teams","Advisory teams","Management teams"],"ans":1,"x":"Airline attendant teams are service teams (also maintenance groups, customer service/sales teams). Production groups make goods; management and advisory teams do management/advice work."},{"id":"W11G3","part":"A","week":11,"topic":"Group Dynamics & Teams","stem":"Groups are more cohesive than teams and groups are a subset of teams.","opts":["True","False"],"ans":1,"x":"False. Teams are structured groups with more accountability, synergy and specific roles - a team is a special type of group, so groups are not more cohesive subsets of teams.","ns":true},{"id":"W11G4","part":"A","week":11,"topic":"Organizational Culture","stem":"Which of the following is the source of organizational culture?","opts":["Selection practices","Actions of top management","Socialization methods","Founder’s vision/mission/attitudes"],"ans":3,"x":"Source of organizational culture: the founders' vision, mission and attitudes. Selection, top management actions and socialization methods KEEP the culture alive (sustaining), they are not the original source."},{"id":"W11G5","part":"A","week":11,"topic":"Group Dynamics & Teams","stem":"The stage of group development at which unwritten rules for teams are established:","opts":["Norming","Storming","Forming","Adjourning"],"ans":0,"x":"Norming is when structure emerges: rules and social relationships (unwritten norms) are established. Storming = conflict, forming = orientation, adjourning = dissolution."},{"id":"W11G6","part":"A","week":11,"topic":"Group Dynamics & Teams","stem":"Taking advantage of other members in a group and claiming ownership for their work is called:","opts":["Altruism","Groupthink","Freeriding","Synergy"],"ans":2,"x":"Free riding is taking advantage of other members' work and claiming ownership. Social loafing is reduced effort; synergy is combined output."},{"id":"W11G7","part":"A","week":11,"topic":"Group Dynamics & Teams","stem":"Sometimes in teams, people may think that if they work more, other people will take advantage of them and give all the responsibilities to them. So it is better to decrease their performance. This phenomenon is called:","opts":["De-individualization","Social loafing","Freeriding","Sucker aversion"],"ans":3,"x":"Sucker aversion is reducing one's own effort to avoid being exploited ('the sucker') by others. Deindividuation is losing identity in the group; social loafing is the general effort reduction; free riding is exploiting others."},{"id":"W11G8","part":"A","week":11,"topic":"Group Dynamics & Teams","stem":"Low trust among the team members can often lead to social loafing.","opts":["True","False"],"ans":0,"x":"True. Low trust among members is a condition for social loafing (others: large team size, low perceived instrumentality, mundane tasks, eager beaver).","ns":true},{"id":"W11G9","part":"A","week":11,"topic":"Organizational Culture","stem":"Culture influences both the conscious and unconscious level of the mind.","opts":["True","False"],"ans":0,"x":"True. Culture influences both the conscious and unconscious levels of the mind; cultural norms strongly influence behaviour and values.","ns":true},{"id":"W11G10","part":"A","week":11,"topic":"Organizational Culture","stem":"An organization in which its culture is driven by the motive for affiliation:","opts":["Bureaucracy","Industrial Organization","Clubs","Educational Institutions"],"ans":2,"x":"Official key: Clubs - the culture driven by the affiliation motive (belonging, networking). This question draws on organization-type classification from the lecture (not detailed on the slides)."},{"id":"W12N1","part":"A","week":12,"topic":"Organizational Structure","stem":"An important feature of life-cycle perspective is that it sees organization as an organism","opts":["True","False"],"ans":0,"x":"True. The life-cycle perspective views organizations as organisms that are born, grow, mature and decline (key unofficial, same as graded item).","ns":true,"inf":true},{"id":"W12G1","part":"A","week":12,"topic":"Organizational Structure","stem":"A set of interrelated and interdependent parts arranged in a manner that produces a unified whole is called:","opts":["System","Training","Rituals","Span of control"],"ans":0,"x":"A system is a set of interrelated and interdependent parts arranged to produce a unified whole (societies, automobiles, plants, human bodies)."},{"id":"W12G2","part":"A","week":12,"topic":"Organizational Change","stem":"Revolutionary change happens slowly in an organization and on its own.","opts":["True","False"],"ans":1,"x":"False. Revolutionary change is sudden and drastic; evolutionary change is slow and gradual.","ns":true},{"id":"W12G3","part":"A","week":12,"topic":"Organizational Structure","stem":"The formal system of task and authority relationships that control how people coordinate their actions and use resources to achieve organizational goals is called:","opts":["Organizational structure","Organizational change","Cognitive biases","Resource allocation"],"ans":0,"x":"Organizational structure is the formal system of task and authority relationships controlling how people coordinate actions and use resources to achieve goals."},{"id":"W12G4","part":"A","week":12,"topic":"Organizational Structure","stem":"Indian Railways having different zones of operation like Southern Railways, Central Railway etc. is an example of:","opts":["Horizontal differentiation","Vertical differentiation","Spatial differentiation","None of the above"],"ans":2,"x":"Zones spread geographically illustrate spatial differentiation (geographical dispersion of offices, plants, personnel). Horizontal differentiation is between units by tasks/orientation; vertical is depth of hierarchy."},{"id":"W12G5","part":"A","week":12,"topic":"Organizational Structure","stem":"Defining employees’ roles through formal documentation is a part of formalization.","opts":["True","False"],"ans":0,"x":"True. Formalization is the degree to which jobs are standardized, through written policies, rules, procedures and job descriptions that define roles.","ns":true},{"id":"W12G6","part":"A","week":12,"topic":"Organizational Structure","stem":"___________ can provide more inputs into decision making and will help in reducing information overload.","opts":["Centralization","Decentralization","Environmental uncertainty","None of the above"],"ans":1,"x":"Decentralization provides more input into decisions, counters information overload, speeds response, motivates employees and trains lower-level managers."},{"id":"W12G7","part":"A","week":12,"topic":"Organizational Structure","stem":"According to life-cycle perspective, the stage of organizational life cycle where the goals are ambiguous but there is a lot of creativity is called:","opts":["Formalization-and-control stage","Collectivity stage","Elaboration-of-structure stage","Entrepreneurial stage"],"ans":3,"x":"The entrepreneurial stage: formation, ambiguous goals, high creativity, need for steady resources. Collectivity = clarified mission and informal structure; formalization-and-control = rules; elaboration = diversification."},{"id":"W12G8","part":"A","week":12,"topic":"Organizational Structure","stem":"The life-cycle perspective sees the organization as an organism.","opts":["True","False"],"ans":0,"x":"True. The life-cycle perspective sees the organization as an organism passing through stages.","ns":true},{"id":"W12G9","part":"A","week":12,"topic":"Organizational Change","stem":"Redesigning business processes to increase organizational effectiveness is called:","opts":["Restructuring","Reengineering","Organizational Ethics","Downsizing"],"ans":1,"x":"Reengineering is redesigning business processes to increase organizational effectiveness (e.g. TQM). Restructuring changes the structure (e.g. downsizing)."},{"id":"W12G10","part":"A","week":12,"topic":"Organizational Structure","stem":"Closed systems differentiate too much from the larger system and have their own identity.","opts":["True","False"],"ans":0,"x":"True. Closed systems isolate themselves from the larger system with their own identity (too much differentiation, too little integration); open systems interact with their environment.","ns":true},{"id":"N1","part":"B","week":0,"topic":"Introduction to OB","stem":"Which statement best describes Organizational Behaviour (OB)?","opts":["The study of financial performance of firms","The systematic study of human behaviour in organizational settings","The study of only the formal rules of an organization","The study of how organizations are legally registered and governed"],"ans":1,"x":"OB is the systematic, multidisciplinary study of human behaviour at work (individual, interpersonal, group and organizational levels). Legal, financial and rule-based descriptions cover only slices of an organization."},{"id":"N2","part":"B","week":0,"topic":"Introduction to OB","stem":"Which of the following is NOT one of the basic assumptions of OB listed in the course?","opts":["Organizational and individual goals are always perfectly aligned","Motivated people work effectively","The impact of policies and procedures on people is not always predictable","Organizations consist of people"],"ans":0,"x":"The basic assumptions acknowledge a DISPARITY between organizational and individual goals; goals are not assumed to be perfectly aligned."},{"id":"N3","part":"B","week":0,"topic":"Introduction to OB","stem":"Team dynamics, conflict, leadership, power and politics are studied at which level of OB?","opts":["Organizational processes","Individual processes","Group processes","Societal processes"],"ans":2,"x":"Group processes cover team dynamics, conflict, leadership, power and politics. Individual processes include perception, personality, attitudes and motivation; organizational processes include change management, culture and climate."},{"id":"N4","part":"B","week":0,"topic":"Introduction to OB","stem":"Which is NOT one of Taylor's four principles of scientific management?","opts":["Divide work and responsibility among management and workers","Select and train workers using scientifically developed methods","Scientifically study each part of the job to find the best method","Give workers complete freedom to choose their own work methods"],"ans":3,"x":"Taylor wanted the scientifically developed 'one best way' to be followed; workers cooperate with management in using the proper method, not choose freely."},{"id":"N5","part":"B","week":0,"topic":"Introduction to OB","stem":"The Hawthorne studies are conducted in which chronological order?","opts":["Illumination studies, relay assembly test room, bank wiring observation room","Bank wiring room, relay assembly room, illumination studies","Illumination studies, bank wiring observation room, relay assembly test room","Relay assembly test room, illumination studies, bank wiring observation room"],"ans":0,"x":"Hawthorne: illumination (1924-27), relay assembly (1927-32), bank wiring observation room (1931-32)."},{"id":"N6","part":"B","week":0,"topic":"Introduction to OB","stem":"Which researcher wrote 'Psychology and Industrial Efficiency' and studied industrial accidents?","opts":["Edward K. Strong Jr.","Frederick W. Taylor","Hugo Munsterberg","Walter Dill Scott"],"ans":2,"x":"Munsterberg (1863-1916) researched industrial accidents and wrote the book. Scott applied psychology to advertising/selling; Strong worked on vocational guidance (Strong-Campbell interest inventory); Taylor founded scientific management."},{"id":"N7","part":"B","week":0,"topic":"Perception","stem":"Which of the following is an EXTERNAL factor of perceptual selection?","opts":["Habit","Novelty and familiarity","Learning","Motivation and interest"],"ans":1,"x":"External factors: intensity, size, contrast, repetition, motion, novelty/familiarity. Habit, learning, motivation/interest and organizational role are internal."},{"id":"N8","part":"B","week":0,"topic":"Perception","stem":"Seeing an incomplete circle as a complete circle illustrates which perceptual organization principle?","opts":["Perceptual constancy","Grouping by proximity","Figure-ground","Closure"],"ans":3,"x":"Closure is filling in gaps to perceive a complete figure. Proximity groups nearby items; figure-ground separates object from background; constancy keeps objects stable despite changing views."},{"id":"N9","part":"B","week":0,"topic":"Perception","stem":"In Kelley's attribution theory, 'how consistently the person exhibits the behaviour in similar contexts over time' is called:","opts":["Consistency","Distinctiveness","Identity","Consensus"],"ans":0,"x":"Consistency is about the person repeating the behaviour in similar contexts. Consensus compares with other people; distinctiveness compares across different situations."},{"id":"N10","part":"B","week":0,"topic":"Perception","stem":"Kelley's theory predicts a PERSONAL (internal) attribution when the behaviour shows:","opts":["High consensus, high distinctiveness, high consistency","High consensus, low distinctiveness, low consistency","Low consensus, low distinctiveness, high consistency","High consensus, high distinctiveness, low consistency"],"ans":2,"x":"Personal attribution = low consensus + low distinctiveness + high consistency (only this person, in every situation, repeatedly). High-high-high gives stimulus attribution and high consensus/low distinctiveness/low consistency gives circumstance attribution."},{"id":"N11","part":"B","week":0,"topic":"Perception","stem":"A manager rates an employee highly on every dimension because the employee is exceptionally punctual. This is the:","opts":["Golem effect","Fundamental attribution error","Similar-to-me effect","Halo effect"],"ans":3,"x":"The halo effect is a single overall impression (here punctuality) influencing specific judgments. FAE concerns causes of behaviour; similar-to-me concerns similarity; Golem is low expectations producing poor performance."},{"id":"N12","part":"B","week":0,"topic":"Perception","stem":"When high expectations from a manager lead an employee to perform better, the phenomenon is called the:","opts":["Hawthorne effect","Pygmalion effect","Halo effect","Golem effect"],"ans":1,"x":"Pygmalion = positive self-fulfilling prophecy. Golem = low expectations lead to poor performance. Hawthorne effect is about behaviour changing due to being observed."},{"id":"N13","part":"B","week":0,"topic":"Learning","stem":"In classical conditioning, the learned response to the previously neutral stimulus is the:","opts":["Conditioned stimulus","Conditioned response","Unconditioned stimulus","Unconditioned response"],"ans":1,"x":"After pairing, the neutral stimulus becomes the conditioned stimulus, and the response it produces is the conditioned response. The unconditioned pair (US, UR) occurs naturally."},{"id":"N14","part":"B","week":0,"topic":"Learning","stem":"The 'law of effect' that behaviours followed by desirable consequences are strengthened is associated with:","opts":["Pavlov","Bandura","Thorndike","Rogers"],"ans":2,"x":"Thorndike's law of effect underlies operant conditioning. Pavlov = classical conditioning; Bandura = social/observational learning; Rogers = self theory."},{"id":"N15","part":"B","week":0,"topic":"Learning","stem":"An employee starts coming on time to avoid his supervisor's reprimand. This is an example of:","opts":["Negative reinforcement","Punishment","Extinction","Positive reinforcement"],"ans":0,"x":"Behaviour (punctuality) is strengthened by avoiding an undesirable consequence = negative reinforcement. Punishment would be the reprimand applied after lateness to weaken it."},{"id":"N16","part":"B","week":0,"topic":"Learning","stem":"Which of the following is a PARTIAL reinforcement schedule?","opts":["Continuous reinforcement","Extinction schedule","Law of effect","Variable ratio schedule"],"ans":3,"x":"Partial schedules: fixed interval, variable interval, fixed ratio, variable ratio. Continuous reinforcement rewards every desired behaviour."},{"id":"N17","part":"B","week":0,"topic":"Learning","stem":"Learning that is not apparent at the time but shows up later when motivation and circumstances arise is called:","opts":["Operant learning","Latent learning","Observational learning","Extinction"],"ans":1,"x":"Latent learning is hidden learning that manifests later. Observational learning is learning from others; extinction is fading of unreinforced responses."},{"id":"N18","part":"B","week":0,"topic":"Learning","stem":"Which is NOT a step in observational learning?","opts":["Paying attention","Good retention","Punishment of the model","Behavioural reproduction"],"ans":2,"x":"Steps: attention, retention, behavioural reproduction, motivation. Punishment of the model is not a step."},{"id":"N19","part":"B","week":0,"topic":"Personality","stem":"Who is considered the pioneer of personality theory and research (1937)?","opts":["Albert Bandura","Carl Rogers","Sigmund Freud","Gordon Allport"],"ans":3,"x":"The course names Gordon Allport (1937) as the pioneer in personality theory and research."},{"id":"N20","part":"B","week":0,"topic":"Personality","stem":"In Freud's psychoanalytic theory, which element follows the pleasure principle?","opts":["Id","Ego","Conscious mind","Super ego"],"ans":0,"x":"The Id seeks immediate gratification (pleasure principle); Ego follows the reality principle; Superego the morality principle."},{"id":"N21","part":"B","week":0,"topic":"Personality","stem":"The Johari Window area that is known to oneself but NOT to others is:","opts":["Blind","Open","Unknown","Hidden"],"ans":3,"x":"Hidden (façade) = known to self, unknown to others. Blind = unknown to self, known to others; Unknown = unknown to both."},{"id":"N22","part":"B","week":0,"topic":"Personality","stem":"Which of these is NOT one of the five traits listed in the course's trait-theory slide?","opts":["Conscientiousness","Sociability","Hostility","Adjustment"],"ans":2,"x":"The slide lists adjustment, sociability, conscientiousness, agreeableness and intellectual openness."},{"id":"N23","part":"B","week":0,"topic":"Personality","stem":"Which characteristic is associated with a high Machiavellian personality?","opts":["High trust in others and a strong belief in fairness","Willingness to manipulat
