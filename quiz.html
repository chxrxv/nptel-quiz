e others for own purpose","Unconditional acceptance of every colleague's views","Open-mindedness and flexibility in views"],"ans":1,"x":"Machs are low in trust, closed-minded, power-centred and willing to manipulate others."},{"id":"N24","part":"B","week":0,"topic":"Personality","stem":"A person who believes that his career outcomes depend on his own efforts has a(n):","opts":["Internal locus of control","Low self-esteem","External locus of control","Authoritarian personality"],"ans":0,"x":"Believing one controls one's outcomes = internal locus of control."},{"id":"N25","part":"B","week":0,"topic":"Personality","stem":"An ability that has been learned through training or experience is called a(n):","opts":["Trait","Aptitude","Skill","Instinct"],"ans":2,"x":"Skill is a learned ability. Aptitude is acquired or natural ability for learning in a specific area (measurable by aptitude tests)."},{"id":"N26","part":"B","week":0,"topic":"Attitudes","stem":"Which component of attitude refers to emotions or feelings toward an object?","opts":["Evaluative","Affective","Cognitive","Behavioural"],"ans":1,"x":"Attitude components: cognitive (beliefs), affective (feelings), behavioural (intentions)."},{"id":"N27","part":"B","week":0,"topic":"Attitudes","stem":"Compared with attitudes, values are:","opts":["Specific to objects and situations","Primarily cognitive opinions","More numerous and easily changed","Fewer in number and relatively permanent"],"ans":3,"x":"Values are fewer, transcend objects and situations, are relatively permanent and central to the person."},{"id":"N28","part":"B","week":0,"topic":"Attitudes","stem":"Which of the following is a scale used for attitude measurement in the course?","opts":["Likert scale","Johari scale","Tuckman scale","Kelley scale"],"ans":0,"x":"Thurstone, Likert, Bogardus social distance and Guttman scales are attitude scales."},{"id":"N29","part":"B","week":0,"topic":"Attitudes","stem":"Which of the following is NOT part of the definition of organizational commitment given in the course?","opts":["Desire to remain within the organization","Preference for a higher salary elsewhere","Belief in and acceptance of the organization's goals","Willingness to exert considerable effort for the organization"],"ans":1,"x":"Commitment = belief/acceptance of goals + willingness to exert effort + desire to stay."},{"id":"N30","part":"B","week":0,"topic":"Attitudes","stem":"Prejudice is best described as:","opts":["A skill acquired through training","A type of motivation","A well-researched conclusion","A prejudgment about a person or group"],"ans":3,"x":"Prejudice = prejudgment; when acted upon it becomes discrimination."},{"id":"N31","part":"B","week":0,"topic":"Emotions & Stress","stem":"Which of these is a SELF-CONSCIOUS emotion?","opts":["Guilt","Pity","Envy","Jealousy"],"ans":0,"x":"Self-conscious emotions: shame, guilt, embarrassment, pride. Social emotions: pity, envy, jealousy."},{"id":"N32","part":"B","week":0,"topic":"Emotions & Stress","stem":"The inconsistency between felt emotions and expressed emotions is called:","opts":["Emotional attachment","Mood congruence","Emotional dissonance","Emotional labour"],"ans":2,"x":"Emotional dissonance = felt vs expressed mismatch; emotional labour is the effort of holding back true emotions."},{"id":"N33","part":"B","week":0,"topic":"Emotions & Stress","stem":"The three stages of the General Adaptation Syndrome are, in order:","opts":["Exhaustion, resistance, alarm","Alarm reaction, exhaustion, resistance","Resistance, alarm, exhaustion","Alarm reaction, resistance, exhaustion"],"ans":3,"x":"GAS: alarm reaction (adrenaline, increased heart rate) -> stage of resistance -> stage of exhaustion (collapse)."},{"id":"N34","part":"B","week":0,"topic":"Emotions & Stress","stem":"Which of the following is a PERSONAL stressor according to the course?","opts":["Daily hassles","Life trauma","Ageing","Job and organizational factors"],"ans":2,"x":"Types: organizational stressors (job/organization related), life stressors (life changes, daily stressors, life trauma) and personal stressors (ageing)."},{"id":"N35","part":"B","week":0,"topic":"Emotions & Stress","stem":"Which of the following is a PSYCHOSOMATIC symptom of stress?","opts":["High blood pressure","Isolation","Absenteeism","Interpersonal conflict"],"ans":0,"x":"Psychosomatic: sleep disturbance, high blood pressure, stress diabetes, back ache, bowel irritation, sexual dysfunction. Absenteeism, conflict and isolation are behavioural."},{"id":"N36","part":"B","week":0,"topic":"Emotions & Stress","stem":"Which is a strategy for managing stress mentioned in the course?","opts":["Suppressing emotions completely","Mindfulness","Working longer hours","Avoiding all feedback"],"ans":1,"x":"Stress management: self awareness, mindfulness, lifestyle changes, exercise and meditation."},{"id":"N37","part":"B","week":0,"topic":"Motivation","stem":"In Maslow's hierarchy, which need lies immediately above safety needs?","opts":["Physiological","Social (belongingness)","Esteem","Self-actualization"],"ans":1,"x":"Order: physiological -> safety -> social -> esteem -> self-actualization."},{"id":"N38","part":"B","week":0,"topic":"Motivation","stem":"Which of the following is a MOTIVATOR (not a hygiene factor) in Herzberg's two-factor theory?","opts":["Company policies and administration","Good working conditions and equipment","Job security and a stable salary","Recognition and appreciation for the work"],"ans":3,"x":"Motivators: interesting job, recognition, advancement, responsibility, growth, achievement. Hygiene: policies, working conditions, security, pay, personal life, status, relations."},{"id":"N39","part":"B","week":0,"topic":"Motivation","stem":"The three components of Vroom's expectancy theory are:","opts":["Distributive, procedural, interactional","Existence, relatedness, growth","Expectancy, instrumentality, valence","Autonomy, feedback, task identity"],"ans":2,"x":"Vroom = expectancy (effort->performance), instrumentality (performance->reward), valence (value of reward). The other options are ERG, justice types and job characteristics."},{"id":"N40","part":"B","week":0,"topic":"Motivation","stem":"Perceived fairness in the procedures used to decide outcomes is called:","opts":["Procedural justice","Relational justice","Interactional justice","Distributive justice"],"ans":0,"x":"Distributive = fairness of outcomes; procedural = fairness of process; interactional = fairness in treatment during implementation."},{"id":"N41","part":"B","week":0,"topic":"Motivation","stem":"A person who prefers moderate risks, wants immediate feedback and is preoccupied with the task is high in:","opts":["Security motive","Affiliation motive","Power motive","Achievement motive"],"ans":3,"x":"Achievement motive: moderate risk taking, need for immediate feedback, satisfaction, preoccupation with the task."},{"id":"N42","part":"B","week":0,"topic":"Motivation","stem":"Which statement about money as a motivator is consistent with the course?","opts":["Money motivates equally in all jobs","Money can restrict extra-role performance","Money is always the first choice of employees","Money has no effect on motivation"],"ans":1,"x":"The course notes money is not always the first choice, can restrict extra-role performance, and that nature of work matters; profit sharing and performance bonuses can help."},{"id":"N43","part":"B","week":0,"topic":"Motivation","stem":"Which theory proposes that the job itself can be the motivator through its design?","opts":["Job characteristics model","Equity theory","Maslow's hierarchy","Path-goal theory"],"ans":0,"x":"The course summary stresses 'Job as the motivator' and 'role of job enrichment' - the job characteristics model."},{"id":"N44","part":"B","week":0,"topic":"Interpersonal Behaviour","stem":"Organizational citizenship behaviour (OCB) is best described as:","opts":["Behaviour following the psychological contract's economic terms","Deviant behaviour at work","Going beyond the formal job description, acting as a social lubricant","Behaviour required by the job description"],"ans":2,"x":"OCB = discretionary prosocial behaviour beyond formal duties; dimensions: altruism, conscientiousness, civic virtue, sportsmanship, courtesy."},{"id":"N45","part":"B","week":0,"topic":"Interpersonal Behaviour","stem":"A psychological contract is:","opts":["A written employment contract signed at joining","A legal agreement between organizations","A trade union agreement on pay and hours","Unwritten expectations and obligations in a relationship"],"ans":3,"x":"Psychological contract = perceptions and expectations about mutual obligations; it is unwritten."},{"id":"N46","part":"B","week":0,"topic":"Interpersonal Behaviour","stem":"Which is NOT one of the five basic conflict handling styles?","opts":["Competing","Retaliating","Avoiding","Compromising"],"ans":1,"x":"The five: competing, accommodating, collaborating, compromising, avoiding."},{"id":"N47","part":"B","week":0,"topic":"Interpersonal Behaviour","stem":"Conflict between two departments is classified as:","opts":["Intra-group conflict","Interpersonal conflict","Inter-group conflict","Intrapersonal conflict"],"ans":2,"x":"Levels: intrapersonal, interpersonal, intra-group, inter-group."},{"id":"N48","part":"B","week":0,"topic":"Interpersonal Behaviour","stem":"Which type of trust arises from shared background and traits?","opts":["Trust based on similarity","Incentive-based trust","Trust based on familiarity","Swift trust"],"ans":0,"x":"Similarity-based trust comes from perceived likeness; familiarity-based from repeated interaction; incentive-based from contracts/bonuses."},{"id":"N49","part":"B","week":0,"topic":"Communication","stem":"The medium through which a message travels is the:","opts":["Decoder","Channel","Noise","Encoder"],"ans":1,"x":"Channel = medium. Encoding converts the message to symbols, decoding translates it, noise disrupts it."},{"id":"N50","part":"B","week":0,"topic":"Communication","stem":"A communicator who is direct and task-oriented has which style?","opts":["Driver","Analytical","Animated","Amiable"],"ans":0,"x":"Driver = direct, task-oriented; animated = enthusiastic, relationship-oriented; amiable = supportive; analytical = accurate, detail-oriented."},{"id":"N51","part":"B","week":0,"topic":"Communication","stem":"Winking and shrugging are studied under:","opts":["Hidden profile","Paralinguistics","Proxemics","Kinesics"],"ans":3,"x":"Kinesics = body movements. Proxemics = spatial relationships. Paralinguistics = vocal cues (tone, pauses)."},{"id":"N52","part":"B","week":0,"topic":"Communication","stem":"In the hidden profile paradigm, groups typically:","opts":["Quickly discover the hidden profile","Discuss more unshared than shared information","Discuss more shared than unshared information","Avoid all information sharing"],"ans":2,"x":"Groups rarely find the hidden profile; shared information is discussed more and exchanged earlier."},{"id":"N53","part":"B","week":0,"topic":"Communication","stem":"Which of the following helps manage team meetings effectively?","opts":["Treating attendance as optional for most members","Keeping no agenda to save preparation time","Recording and distributing meeting information","Discouraging punctuality to keep things relaxed"],"ans":2,"x":"Course tips: attendance as a team value, punctuality, recording/distributing information, building next agenda."},{"id":"N54","part":"B","week":0,"topic":"Decision Making","stem":"Making decisions by gathering all possible information and analysing it to find the optimal choice is the:","opts":["Garbage-can approach","Incremental approach","Satisficing approach","Rational approach"],"ans":3,"x":"Rational approach = optimal decision with full analysis. Others are non-rational approaches (satisficing, incremental, garbage can)."},{"id":"N55","part":"B","week":0,"topic":"Decision Making","stem":"Which of these is a form of DEFENSIVE AVOIDANCE?","opts":["Procrastination","Complacency","Not accepting the problem","Panic"],"ans":0,"x":"Defensive avoidance includes rationalization, procrastination and buck passing."},{"id":"N56","part":"B","week":0,"topic":"Decision Making","stem":"Judging the likelihood of an event by how easily similar instances can be recalled is the:","opts":["Overconfidence bias","Availability bias","Anchoring bias","Representativeness bias"],"ans":1,"x":"Availability = ease of recall. Representativeness = stereotype-driven judgment; anchoring = initial figure."},{"id":"N57","part":"B","week":0,"topic":"Decision Making","stem":"Which group decision technique collects anonymous expert opinions through successive questionnaire rounds?","opts":["Nominal group technique","Delphi method","Majority rule","Ringi technique"],"ans":1,"x":"The Delphi method gathers anonymous opinions over rounds. (The course lists NGT, Delphi and Ringi; Delphi detail is standard OB knowledge.)"},{"id":"N58","part":"B","week":0,"topic":"Decision Making","stem":"The tendency of a group to make more extreme judgments than the average of individuals' views is:","opts":["Satisficing","Groupthink","Group polarization","Abilene paradox"],"ans":2,"x":"Group polarization = more extreme group judgment. Groupthink = harmony over critical thinking; Abilene = agreeing to something nobody wants."},{"id":"N59","part":"B","week":0,"topic":"Power & Leadership","stem":"A manager's power derived from her formal position is:","opts":["Legitimate","Reward","Referent","Expert"],"ans":0,"x":"Legitimate power = formal position. Referent = being liked and admired; expert = skills; reward = ability to give rewards."},{"id":"N60","part":"B","week":0,"topic":"Power & Leadership","stem":"Referent power is based on:","opts":["The ability to administer punishment","Formal authority attached to a position","Rare skills and abilities that others lack","The degree to which one is liked and admired"],"ans":3,"x":"Referent power = liking/admiration."},{"id":"N61","part":"B","week":0,"topic":"Power & Leadership","stem":"Organizational politics is best defined as:","opts":["Unauthorized use of power to enhance or protect self-interest","Formal decision making through proper channels","A leadership style based on trust","Authorized use of power for organizational goals"],"ans":0,"x":"Politics = unauthorized use of power to enhance or protect self-interest."},{"id":"N62","part":"B","week":0,"topic":"Power & Leadership","stem":"Which statement describes a LEADER (rather than a manager)?","opts":["Accepts the status quo","Does things right","Relies on control","Does the right things"],"ans":3,"x":"Leaders do the right things, challenge the status quo, focus on people and ask what and why."},{"id":"N63","part":"B","week":0,"topic":"Power & Leadership","stem":"A leader who makes the decision himself and then tries to persuade others that it is correct is using which sub-style?","opts":["Laissez-faire","Servant","Persuasive democratic","Consultative democratic"],"ans":2,"x":"Within democratic leadership: consultative = consult before deciding; persuasive = leader decides then persuades."},{"id":"N64","part":"B","week":0,"topic":"Power & Leadership","stem":"Which of these are the four styles of Hersey and Blanchard's situational leadership?","opts":["Task, relations, position, power","Telling, selling, participating, delegating","Country club, impoverished, authority, team","Autocratic, democratic, laissez-faire, paternalistic"],"ans":1,"x":"Situational leadership: telling, selling, participating, delegating."},{"id":"N65","part":"B","week":0,"topic":"Power & Leadership","stem":"Which are the three situational variables in Fiedler's model?","opts":["Task, people, structure","Consensus, consistency, distinctiveness","Expectancy, instrumentality, valence","Task structure, leader-member relations, positional power"],"ans":3,"x":"Fiedler's situational favourableness depends on task structure, leader-member relations and positional power."},{"id":"N66","part":"B","week":0,"topic":"Organizational Culture","stem":"Hofstede (1991) defined organizational culture as:","opts":["A set of written rules and policies that employees must follow","The total number of employees working at all locations","The collective programming of the mind distinguishing one organization's members from another's","The physical layout and decor of its offices"],"ans":2,"x":"The course quotes Hofstede's definition."},{"id":"N67","part":"B","week":0,"topic":"Organizational Culture","stem":"Which is NOT one of Hofstede's cultural dimensions listed in the course?","opts":["Power distance","Outcome orientation","Individualism-Collectivism","Uncertainty avoidance"],"ans":1,"x":"Hofstede dimensions: power distance, uncertainty avoidance, individualism-collectivism, masculinity-femininity, long-term orientation. Outcome orientation is an organizational culture dimension."},{"id":"N68","part":"B","week":0,"topic":"Organizational Culture","stem":"Staff meetings, appraisal forms and picnics are examples of:","opts":["Routines, rites and rituals","Stories and myths","Physical artifacts","Basic assumptions"],"ans":0,"x":"Routines, rites and rituals include meetings, training programmes, appraisal forms and annual visits."},{"id":"N69","part":"B","week":0,"topic":"Organizational Culture","stem":"A strong culture is one in which key values are:","opts":["Held only by top management","Different in every department","Written but rarely followed","Intensely held and widely shared"],"ans":3,"x":"Strong cultures = key values intensely held and widely shared."},{"id":"N70","part":"B","week":0,"topic":"Organizational Culture","stem":"Which is a way of keeping a culture alive?","opts":["Selection practices","Ignoring top management signals","Frequent random hiring","Eliminating socialization"],"ans":0,"x":"Culture is sustained through selection (fit), top management actions and socialization methods."},{"id":"N71","part":"B","week":0,"topic":"Group Dynamics & Teams","stem":"Which statement distinguishes a team from a general group?","opts":["Teams never exceed two people in any organization","Teams have no assigned roles and no common goal","Teams work interdependently with more accountability and synergy","Teams have no common goal but share an office"],"ans":2,"x":"Teams are a special type of group with interdependence, accountability, synergy, assigned roles and limited size."},{"id":"N72","part":"B","week":0,"topic":"Group Dynamics & Teams","stem":"In Tuckman and Jensen's model, the stage characterized by conflict over roles and procedures is:","opts":["Forming","Storming","Performing","Norming"],"ans":1,"x":"Storming = conflict; forming = orientation; norming = structure; performing = work; adjourning = dissolution."},{"id":"N73","part":"B","week":0,"topic":"Group Dynamics & Teams","stem":"A cross-functional team formed for a specific assignment is typically a:","opts":["Project team","Production group","Service group","Advisory team"],"ans":0,"x":"Project teams are usually cross-functional."},{"id":"N74","part":"B","week":0,"topic":"Group Dynamics & Teams","stem":"Which is a recommended way to tackle social loafing?","opts":["Remove individual goals and report only team output","Assign only mundane tasks to keep things simple","Increase identifiability, for example through weekly reporting","Increase team size so that the work is spread out"],"ans":2,"x":"Increase identifiability, involvement, rewards, cohesion, personal responsibility, team contracts, feedback, right size."},{"id":"N75","part":"B","week":0,"topic":"Group Dynamics & Teams","stem":"Which of the following is a characteristic of groupthink?","opts":["Free flow of critical ideas","Devil's advocate","Use of outside experts","Illusions of invulnerability"],"ans":3,"x":"Characteristics: illusions of invulnerability, collective rationalization, unquestioned belief, stereotypical views, direct pressure, self-censorship, shared illusion of unanimity."},{"id":"N76","part":"B","week":0,"topic":"Organizational Structure","stem":"The number of levels in the authority hierarchy is the focus of which kind of differentiation?","opts":["Cultural","Vertical","Horizontal","Spatial"],"ans":1,"x":"Vertical differentiation = depth of hierarchy; horizontal = between units by task; spatial = geographic dispersion."},{"id":"N77","part":"B","week":0,"topic":"Organizational Structure","stem":"Which is a method of HORIZONTAL coordination?","opts":["Centralization of power","Delegation","Liaison roles","Formalization"],"ans":2,"x":"Horizontal: common resources, information systems, lateral relations (direct contact, liaison, task forces, integrators). The others are vertical methods."},{"id":"N78","part":"B","week":0,"topic":"Organizational Structure","stem":"Which factor affects centralization?","opts":["Colour of the logo","Environmental uncertainty","Brand name","Number of holidays"],"ans":1,"x":"Factors: size, geographical dispersion, technological complexity, environmental uncertainty."},{"id":"N79","part":"B","week":0,"topic":"Organizational Structure","stem":"Which life-cycle stage involves product diversification and more complex, decentralized structure?","opts":["Collectivity","Entrepreneurial","Formalization-and-control","Elaboration-of-structure"],"ans":3,"x":"Elaboration of structure: diversification, growth opportunities, complex structure and decentralization."},{"id":"N80","part":"B","week":0,"topic":"Organizational Change","stem":"Organizational change is defined as:","opts":["Any alteration of the status quo","The process by which organizations move from present state to desired future state to increase effectiveness","Both of the above","None of the above"],"ans":2,"x":"Both statements appear in the course's definition of organizational change."},{"id":"N81","part":"B","week":0,"topic":"Organizational Change","stem":"The three steps in the change process are:","opts":["Unfreezing, moving, refreezing","Alarm, resistance, exhaustion","Forming, storming, norming","Planning, doing, checking"],"ans":0,"x":"Lewin's change process: unfreezing -> moving -> refreezing."},{"id":"N82","part":"B","week":0,"topic":"Organizational Change","stem":"Force-field analysis examines:","opts":["Driving and restraining forces","Only employee attitudes","Leadership traits","Only the costs of change"],"ans":0,"x":"Force-field analysis analyses driving (for change) and restraining (against change) forces."},{"id":"N83","part":"B","week":0,"topic":"Organizational Change","stem":"Cognitive biases, uncertainty, selective perception and habit belong to which level of resistance to change?","opts":["Functional","Group","Organizational","Individual"],"ans":3,"x":"Individual-level resistance: cognitive biases, uncertainty and insecurity, selective perception, habit."},{"id":"N84","part":"B","week":0,"topic":"Introduction to OB","stem":"Which is an emerging concern for OB mentioned in the course?","opts":["Reduction of research","Elimination of all technology","Globalization and cultural diversity","Return to scientific management"],"ans":2,"x":"Emerging concerns: technological changes, globalization, cultural diversity and teamwork, ethical management/CSR."},{"id":"N85","part":"B","week":0,"topic":"Learning","stem":"The 'red-hot-stove' approach to punishment advises that it be:","opts":["Delayed and tailored to each person's feelings","Warned, prompt, consistent and impersonal","Random in timing and severe in size","Public, loud and emotional"],"ans":1,"x":"Hot stove: warn, prompt, consistent, impersonal."},{"id":"N86","part":"B","week":0,"topic":"Attitudes","stem":"Which is NOT a source of attitude formation in the course?","opts":["Peer group and society","Personal experience","Family","Genetic code"],"ans":3,"x":"Sources: personal experiences, association, family, peer group/society, models, institutional factors."},{"id":"N87","part":"B","week":0,"topic":"Emotions & Stress","stem":"A response to pain or irritation is which pattern of aggression?","opts":["Irritable","Threat-based","Frustration-based","Instrumental"],"ans":0,"x":"Irritable aggression = response to pain/irritation."},{"id":"N88","part":"B","week":0,"topic":"Motivation","stem":"Choosing between two undesirable options is a(n):","opts":["Role conflict","Avoidance-avoidance conflict","Approach-avoidance conflict","Approach-approach conflict"],"ans":1,"x":"Avoidance-avoidance = both options unattractive."},{"id":"N89","part":"B","week":0,"topic":"Interpersonal Behaviour","stem":"A situation in which both competition and cooperation prevail is called a:","opts":["Deviant situation","Free-rider situation","Mixed-motive situation","Zero-sum situation"],"ans":2,"x":"Mixed-motive situations combine competition and cooperation."},{"id":"N90","part":"B","week":0,"topic":"Power & Leadership","stem":"The course describes empowerment as treating power as:","opts":["An individual possession only","A source of coercion","A fixed quantity","A cooperative concept"],"ans":3,"x":"Empowerment: power as a cooperative concept with benefits."},{"id":"N91","part":"B","week":0,"topic":"Perception","stem":"Ravi was late to the meeting. Colleagues note that nobody else was late today (low consensus), Ravi is late for most other meetings too (low distinctiveness) and he has been late every week this year (high consistency). The manager will most likely attribute the lateness to:","opts":["The nature of the meeting (stimulus)","Ravi's own disposition (personal)","Random chance","The traffic situation (circumstance)"],"ans":1,"x":"Low consensus + low distinctiveness + high consistency = personal (internal) attribution. Stimulus attribution needs high distinctiveness and consensus; circumstance attribution needs low consistency."},{"id":"N92","part":"B","week":0,"topic":"Perception","stem":"A sales manager blames a colleague's missed target on 'laziness' without checking the supply disruption that affected the whole region. When his own target is missed he cites the supply issue. The bias in judging the colleague is best described as:","opts":["Halo effect","Selective perception","Fundamental attribution error","Team halo effect"],"ans":2,"x":"FAE: overweighting internal causes (laziness) and underweighting external causes (supply disruption) when judging OTHERS. (The self-serving contrast is a related bias, but the one named in the course for the colleague is FAE.)"},{"id":"N93","part":"B","week":0,"topic":"Perception","stem":"Which scenario is the clearest example of the TEAM halo effect rather than the individual halo effect?","opts":["A company credits the project team for a success but does not hold it accountable for a failure","A supervisor expects a new employee to fail, treats him coldly, and the employee eventually does","A manager gives a better appraisal to a subordinate who shares her alma mater and hobbies","An interviewer rates a candidate high on every trait because of one impressive first answer"],"ans":0,"x":"Team halo = crediting teams for success but not holding them accountable for failures. The handshake case = halo; same alma mater = similar-to-me; the last = Golem effect."},{"id":"N94","part":"B","week":0,"topic":"Perception","stem":"A principal tells teachers that a randomly chosen group of pupils are 'late bloomers'. Teachers give them more attention and the pupils indeed improve. Which statement is MOST accurate?","opts":["The pupils' improvement proves that they had higher innate ability than other pupils all along","The Hawthorne effect, because the pupils knew they were studied, is the only explanation","The Golem effect has operated, because the teachers expected poor performance from this group","A Pygmalion (self-fulfilling prophecy) effect operating through teacher expectations"],"ans":3,"x":"Expectations changed behaviour, which changed performance - Pygmalion effect. Because the pupils were random, ability does not explain the improvement."},{"id":"N95","part":"B","week":0,"topic":"Perception","stem":"A bank has 55% women at junior level but only 4% on its board. Interviews show that decision makers see 'leadership' as a masculine trait. Which pair of concepts BEST explains the pattern?","opts":["Closure and perceptual constancy","Stereotyping and the glass-ceiling effect","Halo effect and Pygmalion effect","Consensus and distinctiveness"],"ans":1,"x":"Gender stereotypes about leadership operate during selection/appraisal, producing the glass-ceiling effect (invisible barrier to the top)."},{"id":"N96","part":"B","week":0,"topic":"Perception","stem":"A newly hired accountant notices every typo in documents, while a new designer in the same office notices layout flaws first. Which factor of perceptual selection MOST directly explains the difference?","opts":["Organizational role and specialization","Motion","Intensity of stimulus","Repetition"],"ans":0,"x":"Internal factor: organizational role and specialization shapes what people select. Intensity, repetition and motion are external properties of the stimulus, which are the same for both."},{"id":"N97","part":"B","week":0,"topic":"Perception","stem":"Which statement is INCORRECT?","opts":["Perceptual constancy lets us see a closing door as still rectangular","Proximity groups nearby items together","Figure-ground perception means that we always see the same object as the figure","Closure lets us read a partially hidden word"],"ans":2,"x":"Figure-ground can reverse (e.g. vase/faces illusions); what is figure and what is ground depends on the perceiver. The other statements are correct."},{"id":"N98","part":"B","week":0,"topic":"Perception","stem":"An HR manager rejects a 52-year-old candidate because 'older people cannot learn new software', ignoring the candidate's recent certifications. This is best described as:","opts":["Self-fulfilling prophecy","Stereotyping combined with selective perception","Halo effect","Similar-to-me effect"],"ans":1,"x":"A group-level belief (older people) is applied to an individual and contradicting information (certifications) is ignored: stereotyping with selective perception."},{"id":"N99","part":"B","week":0,"topic":"Learning","stem":"A manager stops criticizing an employee once the employee submits reports on time; the employee therefore continues to submit on time. This is:","opts":["Punishment","Extinction","Positive reinforcement","Negative reinforcement"],"ans":3,"x":"Removing an aversive stimulus (criticism) after the desired behaviour strengthens it = negative reinforcement. Punishment would apply criticism to reduce a behaviour."},{"id":"N100","part":"B","week":0,"topic":"Learning","stem":"Which scenario is an example of PUNISHMENT (as defined in the course)?","opts":["A manager ignores a joke told in a meeting until the employee stops","A worker wears a helmet to avoid a fine","A worker is docked a day's pay for leaving a machine unattended","A supervisor praises a worker for safe behaviour"],"ans":2,"x":"Punishment = presenting an aversive consequence in response to an unwanted behaviour (loss of pay). Helmet to avoid fine = negative reinforcement; praise = positive reinforcement; ignoring = extinction."},{"id":"N101","part":"B","week":0,"topic":"Learning","stem":"Which reinforcement schedule is operating when a sales rep receives a bonus after every fifth sale?","opts":["Fixed ratio","Continuous","Fixed interval","Variable ratio"],"ans":0,"x":"A reward after a fixed NUMBER of responses = fixed ratio. Fixed interval depends on elapsed time; variable ratio varies the count; continuous rewards every response."},{"id":"N102","part":"B","week":0,"topic":"Learning","stem":"Which reinforcement schedule typically generates the highest and most persistent response rates, as in slot machines?","opts":["Fixed ratio","Variable ratio","Continuous","Fixed interval"],"ans":1,"x":"Variable ratio is unpredictable, producing high steady responding and resistance to extinction (standard OB/psychology knowledge)."},{"id":"N103","part":"B","week":0,"topic":"Learning","stem":"Why is punishment described in the course as 'a lose-lose approach'?","opts":["It rests on threat and fear and can cause anxiety, aggression and resentment","It reliably increases performance and builds loyalty among employees","It is cheap to administer and is therefore the preferred tool of good managers","It is the only method that changes behaviour without any side effects"],"ans":0,"x":"The slides warn punishment is most used, least understood, badly administered, can increase negative behaviour by drawing attention and produces negative emotions."},{"id":"N104","part":"B","week":0,"topic":"Learning","stem":"A junior engineer carefully watches how a mentor handles an angry client but does not try it for months. When she finally has a similar client, she reproduces the mentor's approach perfectly. Which concept(s) BEST explain this?","opts":["Classical conditioning","Negative reinforcement only","Operant extinction","Observational learning with latent learning"],"ans":3,"x":"She learned by observing (modelling); the learning stayed hidden until suitable motivation and circumstances arose = latent learning."},{"id":"N105","part":"B","week":0,"topic":"Learning","stem":"Which statement correctly contrasts behaviouristic and cognitive learning theories?","opts":["Behaviourists emphasise internal mental maps; cognitive theorists emphasise stimulus-response links","Behaviourists emphasise stimulus-response links and consequences; cognitive theorists emphasise internal representations such as cognitive maps","Both reject any role of experience and treat behaviour as purely inherited, differing only in method","Cognitive theories deny that learning changes behaviour and argue that only unobservable thoughts matter"],"ans":1,"x":"Behaviouristic (classical, operant) = observable behaviour and consequences; cognitive = internal expectations, cognitive maps, latent learning."},{"id":"N106","part":"B","week":0,"topic":"Personality","stem":"An employee knows he should report a colleague's fraud (moral duty) and also wants to keep a peaceful relationship, so he decides to raise it with the manager privately. Which Freudian element is primarily making this practical compromise?","opts":["Id","Superego","Ego","Unconscious"],"ans":2,"x":"The Ego mediates between the Id and Superego using reality (practical constraints). The superego provides moral demand; the id impulses."},{"id":"N107","part":"B","week":0,"topic":"Personality","stem":"Which approach would a Carl Rogers-inspired manager MOST likely adopt?","opts":["Use rewards and punishments to shape behaviour","Analyse employees' unconscious conflicts","Classify employees into fixed personality types","Offer unconditional acceptance and support employees' self-concept"],"ans":3,"x":"Rogers' self theory: self-concept, free will, self-esteem and unconditional acceptance."},{"id":"N108","part":"B","week":0,"topic":"Personality","stem":"Which of these combinations best characterizes a high Mach?","opts":["Unconditional acceptance and strong morality","High trust, open-minded, cooperative","Lack of trust, closed minded, power-centred and manipulative","Moderate risk-taking and need for feedback"],"ans":2,"x":"Mach profile in the course: lack of trust, closed minded, power centred and willing to manipulate others for one's own purpose. Moderate risk and need for feedback are features of the achievement motive."},{"id":"N109","part":"B","week":0,"topic":"Personality","stem":"Which Big Five trait BEST predicts that a person will be reliable, organized and hard-working?","opts":["Conscientiousness","Intellectual openness","Sociability","Agreeableness"],"ans":0,"x":"Conscientiousness = dependable, organized, achievement-oriented. Agreeableness = cooperative/trusting; sociability = outgoing; openness = curiosity."},{"id":"N110","part":"B","week":0,"topic":"Personality","stem":"Which employee profile is MOST consistent with high self-esteem as described in the course?","opts":["Avoids responsibility and seeks constant approval","Realistic, takes moderate risks, takes responsibility and is motivated","Dominates colleagues to maintain status","Takes extreme risks, blames others, resists feedback"],"ans":1,"x":"High self-esteem employees: happy, realistic expectations, realistic understanding of self, moderate risk takers, friendly, motivated, self-disciplined, take responsibility."},{"id":"N111","part":"B","week":0,"topic":"Personality","stem":"After failing to get a promotion, Meera says 'The panel was biased; luck was not on my side.' This suggests a(n):","opts":["Machiavellian orientation","External locus of control","High self-esteem","Internal locus of control"],"ans":1,"x":"Attributing outcomes to outside factors (bias, luck) reflects external locus of control."},{"id":"N112","part":"B","week":0,"topic":"Personality","stem":"Which statement correctly distinguishes ability, skill and aptitude?","opts":["All three are synonyms for personality traits that are measured by objective tests of temperament","Skill is a natural gift that cannot be trained, whereas aptitude is learned only through formal training","Ability is a capacity to perform; skill is an ability learned through training or experience; aptitude is potential for learning in a specific area","Aptitude is a learned ability, skill is potential for learning, and ability is always measured by projective tests"],"ans":2,"x":"Ability = capability to perform tasks; skill = learned ability; aptitude = capacity to learn/proficiency in a discipline (aptitude tests)."},{"id":"N113","part":"B","week":0,"topic":"Attitudes","stem":"A smoker who believes smoking is harmful says 'my grandfather smoked until 90' to justify continuing. This is MOST consistent with:","opts":["Reduction of cognitive dissonance","Halo effect","Social desirability effect","Mood congruence"],"ans":0,"x":"Holding two conflicting cognitions (smoking is harmful; I smoke) creates tension; the person reduces it by adding a justifying thought."},{"id":"N114","part":"B","week":0,"topic":"Attitudes","stem":"'I think my manager is unfair (belief). I feel angry when he speaks (feeling). I plan to apply for a transfer (intention).' Which mapping of attitude components is CORRECT?","opts":["Belief = behavioural; feeling = cognitive; intention = affective","Belief = cognitive; feeling = behavioural; intention = affective","Belief = affective; feeling = cognitive; intention = behavioural","Belief = cognitive; feeling = affective; intention = behavioural"],"ans":3,"x":"Cognitive = beliefs/knowledge; affective = emotion; behavioural = intention to act."},{"id":"N115","part":"B","week":0,"topic":"Attitudes","stem":"Which statement distinguishes opinion from attitude correctly?","opts":["Opinions are values that are central to the core of a person","Opinions are broader and more emotional than attitudes","Opinions are specific and primarily cognitive; attitudes influence opinions","Attitudes are always conscious and have only a cognitive component"],"ans":2,"x":"Opinion = specific, mostly cognitive; attitudes include affective and behavioural components and influence opinions."},{"id":"N116","part":"B","week":0,"topic":"Attitudes","stem":"Which statement about values is INCORRECT?","opts":["They are relatively permanent and resistant to change","They provide standards of competence and morality","They are central to the core of a person","They are more numerous than attitudes and specific to situations"],"ans":3,"x":"Values are FEWER than attitudes and transcend specific objects, situations and persons."},{"id":"N117","part":"B","week":0,"topic":"Attitudes","stem":"A firm uses an anonymous online survey on 'attitude to overtime'. Results are extremely positive, but turnover is high. Which measurement issue most plausibly explains the mismatch?","opts":["Social desirability effect and subjectivity in response","Sampling error only, because the survey was conducted online","Low centrality of the attitude object","The use of open ended rather than closed questions"],"ans":0,"x":"Respondents may give socially acceptable rather than honest answers even in surveys; the slides list social desirability effect and subjectivity as key issues."},{"id":"N118","part":"B","week":0,"topic":"Attitudes","stem":"Which factor is NOT listed as a determinant of job satisfaction in the course?","opts":["Equitable rewards","Larger office space","Mentally challenging work","Supportive colleagues"],"ans":1,"x":"Determinants: mentally challenging work, equitable rewards, supportive working conditions, supportive colleagues, personality-job fit, personal characteristics."},{"id":"N119","part":"B","week":0,"topic":"Attitudes","stem":"An employee strongly dislikes the new HR policy but the policy hardly matters to her job. Which characteristics of her attitude are high/low?","opts":["Low valence, high centrality","High multiplexity, high centrality","Low valence, low centrality","High valence, low centrality"],"ans":3,"x":"Valence = degree of (un)favourableness (strong dislike), centrality = importance of the object (low)."},{"id":"N120","part":"B","week":0,"topic":"Emotions & Stress","stem":"A flight attendant stays smiling at a rude passenger while feeling angry. The effort of holding back real feelings is __ and the mismatch between felt and shown emotion is __.","opts":["mood congruence; emotional attachment","emotional labour; emotional dissonance","emotional dissonance; emotional labour","spillover; labour"],"ans":1,"x":"Emotional labour = psychological effort in holding back one's true emotions; emotional dissonance = inconsistency between felt and expressed."},{"id":"N121","part":"B","week":0,"topic":"Emotions & Stress","stem":"After an argument with her team lead, Anita recalls all the previous times she felt unfairly treated. This is MOST likely:","opts":["Mood congruence","Emotional attachment","Work-family spillover","Instrumental aggression"],"ans":0,"x":"Mood congruence = recalling mood-consistent memories (bad mood -> negative memories). Spillover = emotions crossing between work and family domains."},{"id":"N122","part":"B","week":0,"topic":"Emotions & Stress","stem":"A manager shouts at a colleague to force him to reassign a task. Which aggression pattern is this?","opts":["Threat-based","Frustration-based","Instrumental","Irritable"],"ans":2,"x":"Instrumental aggression = using aggression to get something."},{"id":"N123","part":"B","week":0,"topic":"Emotions & Stress","stem":"An employee blocked from completing a project by a slow approval process lashes out at the approver. The aggression is MOST accurately:","opts":["Threat-based","Instrumental","Frustration-based","Irritable"],"ans":2,"x":"Goal-oriented behaviour is blocked = frustration-based aggression."},{"id":"N124","part":"B","week":0,"topic":"Emotions & Stress","stem":"Which statement about stress is CORRECT?","opts":["Eustress is stress from negative events","Both overload and under-stimulation can lead to stress","Stress is always harmful","The stage of resistance occurs before the alarm reaction"],"ans":1,"x":"Types: eustress, distress, hyper work stress, hypo stress. GAS order: alarm -> resistance -> exhaustion."},{"id":"N125","part":"B","week":0,"topic":"Emotions & Stress","stem":"Which pair is correctly matched?","opts":["Resentment - an intense, destructive and long-lasting form of hatred","Humiliation - feeling reduced to a lower position, an attack on self-respect","Guilt - feeling of inadequacy and disreputable behaviour","Shame - feeling bad because one has violated some standard or rule"],"ans":1,"x":"Shame = inadequacy/disreputable behaviour; guilt = violating standards; humiliation = reduced to lower position; resentment = a MILD form of hate."},{"id":"N126","part":"B","week":0,"topic":"Emotions & Stress","stem":"Which response is MOST assertive in the sense used in the course?","opts":["Stating the case clearly while caring for the other person and being fair to oneself","Agreeing to every request without comment to avoid any embarrassment or conflict","Staying silent in the meeting to avoid rejection, and complaining about it afterwards","Sarcastically attacking the colleague's work in front of the team to make a point"],"ans":0,"x":"Assertiveness = honest, caring, fair; clear case without being selfish, vindictive or sarcastic."},{"id":"N127","part":"B","week":0,"topic":"Motivation","stem":"A company improves air-conditioning, canteen and parking but employee motivation barely changes. According to Herzberg this is because:","opts":["Employee expectancy about effort leading to performance is low","Employees are in the self-actualization stage","These are motivators that should already have raised satisfaction","These are hygiene factors that only prevent dissatisfaction"],"ans":3,"x":"Working conditions and the like are hygiene factors: absence causes dissatisfaction, presence does not by itself motivate."},{"id":"N128","part":"B","week":0,"topic":"Motivation","stem":"A software developer with stable income and job security still feels unfulfilled and seeks creative projects. According to Maslow, which need dominates now?","opts":["Self-actualization","Safety","Physiological","Social"],"ans":0,"x":"Satisfied lower needs cease to dominate; the desire for creative fulfilment signals self-actualization (the course notes satisfied needs cease to influence behaviour)."},{"id":"N129","part":"B","week":0,"topic":"Motivation","stem":"Alderfer's ERG theory differs from Maslow's hierarchy mainly because:","opts":["It says that once a need is satisfied it never returns and never has to be addressed again","It groups needs into three and allows regression to lower needs when higher needs are blocked","It keeps five rigid levels arranged in a fixed order of satisfaction","It applies only to hygiene factors and treats motivators as irrelevant to behaviour at work"],"ans":1,"x":"ERG = existence, relatedness, growth; if growth needs are frustrated a person may regress to relatedness (standard OB knowledge beyond slide)."},{"id":"N130","part":"B","week":0,"topic":"Motivation","stem":"An employee believes extra effort will improve performance but doubts the company will reward good performance with promotion. Which Vroom component is LOW?","opts":["Valence","Equity","Expectancy","Instrumentality"],"ans":3,"x":"Instrumentality = belief that performance leads to rewards. Expectancy = effort -> performance; valence = value of the reward."},{"id":"N131","part":"B","week":0,"topic":"Motivation","stem":"Two colleagues do the same work. One discovers the other earns more and reduces her effort. Which theory BEST explains this?","opts":["Expectancy theory","Two-factor theory","Equity theory (distributive justice)","ERG theory"],"ans":2,"x":"Comparing input-outcome ratios with others: perceived inequity changes behaviour. The fairness of outcomes = distributive justice."},{"id":"N132","part":"B","week":0,"topic":"Motivation","stem":"Employees accept a pay freeze but are furious because the decision was made secretly, without explanation, and the manager spoke rudely. Which justice dimensions are MOST violated?","opts":["None; the outcome was fair","Distributive and relational","Procedural and interactional","Distributive only"],"ans":2,"x":"Secret process = procedural injustice; rude, unexplained treatment = interactional injustice."},{"id":"N133","part":"B","week":0,"topic":"Motivation","stem":"A department head constantly seeks to control committees and decisions. Which psychological motive is dominant?","opts":["Achievement","Power","Security","Affiliation"],"ans":1,"x":"Power motive = desire to control others."},{"id":"N134","part":"B","week":0,"topic":"Motivation","stem":"Priya wants a promotion that requires relocating, but moving would separate her from her family. This is an:","opts":["Role conflict","Approach-approach conflict","Avoidance-avoidance conflict","Approach-avoidance conflict"],"ans":3,"x":"One option with both attractive and unattractive features = approach-avoidance conflict."},{"id":"N135","part":"B","week":0,"topic":"Motivation","stem":"Which statement about needs is consistent with the course?","opts":["Needs are recurrent and a dominant need dominates behaviour","Only some people have needs","Needs cease to exist once satisfied for ever","A satisfied need continues to dominate behaviour"],"ans":0,"x":"Characteristics: dominant need dominates; satisfied needs cease to influence behaviour; needs never cease to exist; needs recur; all of us have needs."},{"id":"N136","part":"B","week":0,"topic":"Interpersonal Behaviour","stem":"Members of a temporary, multi-company project team trust each other from the first day because each is assigned a specialist role. This is MOST like:","opts":["Swift trust","Trust based on similarity","Incentive-based trust","Trust based on familiarity"],"ans":0,"x":"Swift trust forms rapidly in temporary groups based on roles/credibility rather than history."},{"id":"N137","part":"B","week":0,"topic":"Interpersonal Behaviour","stem":"A firm that suddenly stops training and promotion promises to long-serving staff MOST directly violates the employees':","opts":["Spatial contract","Transactional contract only","Relational psychological contract","Legal contract only"],"ans":2,"x":"Long-term, widely defined expectations (training, career, security) form a relational contract; a violation damages trust."},{"id":"N138","part":"B","week":0,"topic":"Interpersonal Behaviour","stem":"Which employee behaviour is an example of OCB (and NOT part of the formal job description)?","opts":["Attending mandatory meetings only","Following safety rules required by law","Completing assigned reports","Voluntarily helping a new colleague learn the system"],"ans":3,"x":"Helping a new colleague voluntarily = altruism, a dimension of OCB."},{"id":"N139","part":"B","week":0,"topic":"Interpersonal Behaviour","stem":"An employee who never complains about minor inconveniences and keeps a positive attitude shows which OCB dimension?","opts":["Civic virtue","Sportsmanship","Altruism","Courtesy"],"ans":1,"x":"Sportsmanship = tolerating less-than-ideal circumstances without complaining. Courtesy = respectful consideration of others; civic virtue = involvement in the organization."},{"id":"N140","part":"B","week":0,"topic":"Interpersonal Behaviour","stem":"Two managers argue about who should control a shared budget and which team should handle a customer segment. This is MOST clearly:","opts":["Process conflict","Task conflict","Relational conflict","Intrapersonal conflict"],"ans":0,"x":"Disagreement on strategy and sharing of responsibilities and resources = process conflict."},{"id":"N141","part":"B","week":0,"topic":"Interpersonal Behaviour","stem":"Two peers each give up half their demands to settle quickly. This is which conflict handling style?","opts":["Avoiding","Collaborating","Compromising","Competing"],"ans":2,"x":"Compromising = each side gives up something (split the difference). Collaborating seeks a fully satisfying win-win solution."},{"id":"N142","part":"B","week":0,"topic":"Interpersonal Behaviour","stem":"In a sales team, Arjun wants to outperform his colleagues, Bela wants the whole team to do well and Chitra wants nobody to earn much more than others. Their orientations are, respectively:","opts":["Cooperator, competitor, equalizer","Equalizer, competitor, individualist","Individualist, equalizer, cooperator","Competitor, cooperator, equalizer"],"ans":3,"x":"Competitor = doing better than others; cooperator = maximizing joint outcomes; equalizer = minimizing differences."},{"id":"N143","part":"B","week":0,"topic":"Communication","stem":"A colleague gives long detailed spreadsheets, checks every number twice and dislikes vague answers. Which style?","opts":["Driver","Analytical","Amiable","Animated"],"ans":1,"x":"Analytical = accurate and detail oriented."},{"id":"N144","part":"B","week":0,"topic":"Communication","stem":"A manager from a culture comfortable with silence pauses for several seconds after asking a question; his western team members rush to fill the silence thinking he is displeased. Which concept BEST explains the misunderstanding?","opts":["Proxemics - differing use of personal space","The hidden profile paradigm of information sharing","Kinesics - differing use of body movements","Cultural differences in how silence is interpreted"],"ans":3,"x":"Silence is interpreted differently: western cultures may read it as non-comprehension; many eastern cultures are comfortable with it."},{"id":"N145","part":"B","week":0,"topic":"Communication","stem":"A team of four reviews candidates. Each member holds some unique facts, but discussion centres on facts all four already know and the weakest candidate is selected. Which is the BEST remedy?","opts":["Let the most senior member decide so that the discussion stays short","Encourage early consensus so that the group avoids open conflict","Focus on unshared information and consider alternatives one at a time","Make decisions faster so that long meetings and debates are avoided"],"ans":2,"x":"Remedies: focus on unshared/unique info, problem-solving rather than decision-making approach, rank order, consider alternatives one at a time, suspend initial judgment, build trust, minimize status difference."},{"id":"N146","part":"B","week":0,"topic":"Communication","stem":"A manager's instruction is distorted because of a noisy factory floor and the employee's misinterpretation of one word. Which components of the communication process failed?","opts":["Channel and sender only","Noise and decoding","Encoding and feedback only","Sender and message only"],"ans":1,"x":"Noise interferes with transmission; decoding is translating the message. Both are involved here."},{"id":"N147","part":"B","week":0,"topic":"Decision Making","stem":"A manager reviews three vendor quotes and picks the first that meets all minimum requirements without checking the rest. This is:","opts":["Satisficing approach","Garbage-can approach","Rational approach","Incremental approach"],"ans":0,"x":"Satisficing = a satisfactory (not optimal) solution."},{"id":"N148","part":"B","week":0,"topic":"Decision Making","stem":"A department with falling morale makes only the smallest adjustment to bring the problem to a tolerable level and avoids any major restructuring. This is the:","opts":["Satisficing approach","Incremental approach","Rational approach","Garbage-can approach"],"ans":1,"x":"Incremental approach = smallest response possible that reduces the problem to at least a tolerable level."},{"id":"N149","part":"B","week":0,"topic":"Decision Making","stem":"Which scenario best illustrates DEFENSIVE AVOIDANCE by rationalization?","opts":["A manager never even decides whether the problem requires a decision","A manager makes a hurried decision in a state of panic","A manager keeps believing that everything is fine despite clear warning signs","A manager says 'the complaints are not real problems; they come from unusual users'"],"ans":3,"x":"Rationalization (a form of defensive avoidance) explains away the problem. Believing everything is fine = complacency; hurried decision = panic."},{"id":"N150","part":"B","week":0,"topic":"Decision Making","stem":"Before a salary negotiation, the recruiter casually mentions that 'the last person in this role earned Rs 90,000'. The candidate, who had planned to ask for Rs 70,000, ends up asking for Rs 85,000 although the figure is irrelevant to her skills. This is MOST like:","opts":["Anchoring and adjustment","Representativeness","Availability bias","Overconfidence"],"ans":0,"x":"An initial figure influenced the judgment even though it was largely irrelevant: anchoring and adjustment."},{"id":"N151","part":"B","week":0,"topic":"Decision Making","stem":"Two groups are told about a drug: one is told '90% survive', the other '10% die'. The first group is far more positive. This illustrates:","opts":["Anchoring","Availability","Framing","Overconfidence"],"ans":2,"x":"Same facts, different presentation -> different decisions = framing."},{"id":"N152","part":"B","week":0,"topic":"Decision Making","stem":"A recruiter assumes a candidate wearing glasses and carrying books will be good at maths because 'that is what such people are like'. Which bias?","opts":["Availability","Representativeness","Overconfidence","Anchoring"],"ans":1,"x":"Representativeness = being overly influenced by stereotypes when judging likelihood."},{"id":"N153","part":"B","week":0,"topic":"Decision Making","stem":"A company has spent Rs 5 crore on a failing product and approves another Rs 2 crore 'so that the earlier money is not wasted'. Which concept?","opts":["Group polarization towards extreme judgments","Satisficing, accepting a good-enough solution","The Abilene paradox of pluralistic ignorance","Escalation of commitment driven by sunk costs"],"ans":3,"x":"Investing more in a losing proposition because of past investment = escalation of commitment; sunk costs cannot be recovered and should be ignored."},{"id":"N154","part":"B","week":0,"topic":"Decision Making","stem":"Everyone on a family trip drives 80 km to a restaurant nobody really wanted to go to because each assumed the others wanted it. This is the:","opts":["Abilene paradox","Delphi method","Groupthink","Group polarization"],"ans":0,"x":"Abilene paradox = pluralistic ignorance: adopting a position without challenging to avoid conflict or reach consensus."},{"id":"N155","part":"B","week":0,"topic":"Decision Making","stem":"Which action is LEAST likely to reduce groupthink?","opts":["Inviting outsiders to evaluate the group's ideas critically","Assigning a member to act as a devil's advocate","Having the leader announce a preferred solution at the start","Holding a second-chance meeting before the final decision"],"ans":2,"x":"Leader-preferred solutions early increase pressure toward uniformity. Remedies include devil's advocate, outsiders, second-chance meeting."},{"id":"N156","part":"B","week":0,"topic":"Decision Making","stem":"A committee in which individuals moderately favour a risky investment ends up approving an extremely risky one. This is best explained by:","opts":["Group polarization","Reinforcement","Satisficing","Anchoring"],"ans":0,"x":"Groups can make more extreme judgments than the average of individual views."},{"id":"N157","part":"B","week":0,"topic":"Power & Leadership","stem":"A newly appointed junior doctor is hugely respected by nurses because of her unparalleled diagnostic skills, although she has no formal authority over them. Her power is:","opts":["Legitimate","Expert","Coercive","Referent"],"ans":1,"x":"Based on skills and abilities = expert power. Referent = liked and admired."},{"id":"N158","part":"B","week":0,"topic":"Power & Leadership","stem":"An influential engineer is followed because colleagues like and admire him, even though he has neither the rank nor special expertise. His power is:","opts":["Coercive","Legitimate","Reward","Referent"],"ans":3,"x":"Referent power rests on liking/admiration."},{"id":"N159","part":"B","week":0,"topic":"Power & Leadership","stem":"An employee 'forgets' to share important data with a rival colleague so the colleague looks unprepared. This is MOST closely:","opts":["Building coalitions","Creating reciprocity","Manipulating information flow","Impression management"],"ans":2,"x":"Manipulating information flow is a political behaviour."},{"id":"N160","part":"B","week":0,"topic":"Power & Leadership","stem":"An employee praises every decision of a senior manager and highlights only her own successes in public. Which political behaviour?","opts":["Blaming","Impression management","Reciprocity","Coalition building"],"ans":1,"x":"Impression management = managing how others perceive oneself."},{"id":"N161","part":"B","week":0,"topic":"Power & Leadership","stem":"Which statement about leadership is INCORRECT per the course?","opts":["Leadership influence is goal oriented","Leadership involves non-coercive influence","Leadership is the process of influencing a group toward achieving goals","Leadership does not require followers"],"ans":3,"x":"The nature of leadership: non-coercive influence, goal oriented, and it requires followers."},{"id":"N162","part":"B","week":0,"topic":"Power & Leadership","stem":"A leader with maximum concern for production but minimal concern for people is located at which point on the Blake-Mouton Managerial Grid?","opts":["1,1 Impoverished (low concern for both)","9,9 Team leader (high concern for both)","9,1 Produce or perish (high production, low people)","1,9 Country club (high people, low production)"],"ans":2,"x":"Convention: (concern for production, concern for people). 9,1 = high production, low people."},{"id":"N163","part":"B","week":0,"topic":"Power & Leadership","stem":"A new team lacks skills and confidence but is eager. A situational leadership approach would suggest the leader use which style first?","opts":["Telling (directive)","Delegating","Laissez-faire","Participating"],"ans":0,"x":"In Hersey and Blanchard's model, low readiness calls for telling (high task, low relationship); as readiness grows: selling -> participating -> delegating (standard model detail)."},{"id":"N164","part":"B","week":0,"topic":"Power & Leadership","stem":"Which statement about path-goal theory is MOST accurate?","opts":["Leader effectiveness depends only on task structure and not on followers' goals","The best leader is always democratic, whatever the task or the followers","Leaders motivate only to the extent they are seen as helping subordinates reach their goals","Effective leaders are born, not made, and follow a fixed set of inherited traits"],"ans":2,"x":"Path-goal is a contingency theory about the leader clearing the path for subordinates' goals."},{"id":"N165","part":"B","week":0,"topic":"Power & Leadership","stem":"The 'great person theory' claims that:","opts":["Situations determine leaders","Followers choose leaders democratically","Leaders can be made by training alone","Leaders possess special inborn traits that distinguish them"],"ans":3,"x":"The trait approach/great person theory seeks characteristics of great leaders (leadership motivation, flexibility, morality, energy, self-confidence, knowledge, multiple intelligences)."},{"id":"N166","part":"B","week":0,"topic":"Organizational Culture","stem":"A company where employees expect obedience to seniors, and bosses are rarely questioned has high:","opts":["Power distance","Uncertainty avoidance","Individualism","Long-term orientation"],"ans":0,"x":"Power distance = acceptance of unequal distribution of power in hierarchy (standard Hofstede detail)."},{"id":"N167","part":"B","week":0,"topic":"Organizational Culture","stem":"A technology start-up rewards experimentation and tolerates failure. Which organizational culture dimension is HIGH?","opts":["Outcome orientation only","Innovation and risk taking","Stability","Attention to detail"],"ans":1,"x":"Innovation and risk taking = degree to which employees are encouraged to be innovative and take risks. The course lists: attention to detail, outcome orientation, people orientation, team orientation, aggressiveness, stability, innovation and risk taking."},{"id":"N168","part":"B","week":0,"topic":"Organizational Culture","stem":"A new employee quickly picks up the unique jargon, acronyms and the unwritten way to address seniors in meetings. Which expressions of culture is he mainly learning?","opts":["Basic assumptions and physical artifacts","Language/jargon and behavioural norms","Stories, myths and legends","Ceremonies and celebrations"],"ans":1,"x":"Unique jargons/acronyms and behavioural norms (towards seniors, in meetings) are expressions of culture transmitted to new members through socialization."},{"id":"N169","part":"B","week":0,"topic":"Organizational Culture","stem":"Which situation makes organizational culture easiest to change?","opts":["An old, large, stable organization with no external pressure","A strong culture with many well-established subcultures in a mature firm","An absence of any crisis in a stable, comfortable market","A dramatic crisis with leadership turnover in a young, small organization"],"ans":3,"x":"Situational factors favour change: dramatic crisis, leadership turnover, life-cycle stage, young age, small size, weak culture, absence of subcultures."},{"id":"N170","part":"B","week":0,"topic":"Organizational Culture","stem":"A large hospital has a research department with its own special values in addition to the hospital's core values. This is a:","opts":["Counterculture","National culture","Subculture","Dominant culture"],"ans":2,"x":"Subcultures include the core values of the dominant culture plus values unique to the department."},{"id":"N171","part":"B","week":0,"topic":"Group Dynamics & Teams","stem":"A newly formed project team spends its first meetings arguing about who leads and how reporting should work. Which stage?","opts":["Storming","Performing","Forming","Norming"],"ans":0,"x":"Conflict about roles and procedures = storming."},{"id":"N172","part":"B","week":0,"topic":"Group Dynamics & Teams","stem":"Which scenario is a FREE RIDER, not just a social loafer?","opts":["A member refuses to over-work because others slack (sucker aversion)","A member works less because the group is large","A member is bored by a mundane task","A member contributes nothing but claims credit for the group's work"],"ans":3,"x":"Free riding = taking advantage of others and claiming ownership for their work. Large size, sucker aversion and mundane tasks are loafing conditions."},{"id":"N173","part":"B","week":0,"topic":"Group Dynamics & Teams","stem":"Which team design would MOST likely reduce social loafing?","opts":["A small team with individual reporting, contracts and symbolic rewards","A team with low trust among members and no internal feedback reviews","A very large team where only a single joint score is reported","A team doing only mundane, repetitive tasks that nobody finds interesting"],"ans":0,"x":"Remedies: identifiability, involvement, rewards, cohesion, personal responsibility, contracts, feedback, right size."},{"id":"N174","part":"B","week":0,"topic":"Group Dynamics & Teams","stem":"Which statement about teams versus groups is MOST consistent with the course?","opts":["The distinction is always clear-cut and every group is automatically a team","Groups always have more synergy and accountability than teams","The distinction is not clear-cut, but teams usually have more accountability and synergy","Teams are never part of larger organizations and never have specific assigned roles"],"ans":2,"x":"Distinction is not clear-cut; teams are structured work groups with interdependence, accountability, synergy, roles, limited size."},{"id":"N175","part":"B","week":0,"topic":"Organizational Structure","stem":"A multinational with offices in 30 countries, many departments and 10 hierarchical levels has high:","opts":["A wide span of control only, because managers supervise many people","Complexity (horizontal, vertical and spatial differentiation)","High centralization only, because decisions are made at the top","High formalization only, because it has many written rules"],"ans":1,"x":"Complexity = degree of differentiation: horizontal, vertical, spatial."},{"id":"N176","part":"B","week":0,"topic":"Organizational Structure","stem":"If the span of control narrows (each manager supervises fewer people) while the organization size is constant, the organization generally becomes:","opts":["More decentralized by definition","Flatter","Less formalized by definition","Taller"],"ans":3,"x":"Smaller the span, taller the organization."},{"id":"N177","part":"B","week":0,"topic":"Organizational Structure","stem":"Which rm MOST precisely describes this improvement?","opts":["Motivation","Effectiveness","Role clarity","Efficiency"],"ans":3,"x":"More output for less input = efficiency."},{"id":"N187","part":"B","week":0,"topic":"Introduction to OB","stem":"Which topic does NOT belong to the INDIVIDUAL level of OB?","opts":["Motivation","Attitudes","Organizational culture","Perception"],"ans":2,"x":"Organizational culture is an organizational-level process; perception, personality, attitudes and motivation are individual."},{"id":"N188","part":"B","week":0,"topic":"Perception","stem":"Sensation and perception mean the same thing: both refer to the process of interpreting stimuli.","opts":["True","False"],"ans":1,"x":"Sensation is the reception of raw stimuli; perception is giving meaning to stimuli by organizing and interpreting them.","ns":true},{"id":"N189","part":"B","week":0,"topic":"Perception","stem":"According to Kelley, high consensus means that many other people behave the same way as the person being judged.","opts":["True","False"],"ans":0,"x":"Consensus = extent to which other people behave in the same manner as the person we are judging.","ns":true},{"id":"N190","part":"B","week":0,"topic":"Learning","stem":"Negative reinforcement and punishment are two names for the same process.","opts":["True","False"],"ans":1,"x":"Negative reinforcement strengthens behaviour by removing/avoiding an aversive consequence; punishment presents an aversive consequence to weaken behaviour.","ns":true},{"id":"N191","part":"B","week":0,"topic":"Learning","stem":"In classical conditioning, the unconditioned response occurs naturally without learning.","opts":["True","False"],"ans":0,"x":"The unconditioned stimulus naturally produces the unconditioned response (food -> salivation).","ns":true},{"id":"N192","part":"B","week":0,"topic":"Personality","stem":"According to Freud, the Super ego follows the reality principle.","opts":["True","False"],"ans":1,"x":"The Ego follows the reality principle; "],"ans":0,"x":"Pygmalion is a self-fulfilling prophecy through changed treatment and expectations.","ns":true},{"id":"N205","part":"B","week":0,"topic":"Learning","stem":"Assertion (A): Punishment is a reliable way to build long-lasting good behaviour. Reason (R): Punishment can create anxiety, aggression and hatred and is often badly administered.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":3,"x":"The course warns that punishment is a lose-lose approach; A is false, R is true.","ns":true},{"id":"N206","part":"B","week":0,"topic":"Motivation","stem":"Assertion (A): Providing better pay and job security will always make employees highly motivated. Reason (R): Pay and job security are hygiene factors in Herzberg's theory.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":3,"x":"Hygiene factors prevent dissatisfaction but do not by themselves motivate; so A is false, R is true.","ns":true},{"id":"N207","part":"B","week":0,"topic":"Decision Making","stem":"Assertion (A): Appointing a devil's advocate can reduce groupthink. Reason (R): Groupthink involves pressure towards uniformity and self-censorship, which a dissenting role can counter.","opts":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is NOT the correct explanation of A","A is true but R is false","A is false but R is true"],"ans":0,"x":"A devil's advocate injects dissent against uniformity pressure.","ns":true},{"id":"N208","part":"B","week":0,"topic":"Group Dynamics & Teams","stem":"Assertion (A): Increasing identifiability of individual contributions can reduce social loafing. Reason (R): Large teams and mundane tasks always eliminate social loafing.","opts":["Both A en goal-directed behaviour is blocked by barriers."},{"id":"N222","part":"B","week":0,"topic":"Introduction to OB","stem":"Which of the following is a reason given in the course for studying OB?","opts":["To understand employee behaviour and predict employee reactions","To replace technology with people","To avoid all workplace conflict","To eliminate the need for HR managers"],"ans":0,"x":"Why study OB: understand employee behaviour, predict employee reactions and plan effective interventions."},{"id":"N223","part":"B","week":0,"topic":"Perception","stem":"Combining, integrating and interpreting information about others to gain an accurate understanding of them is called:","opts":["Perceptual closure","Sensation","Selective perception","Social perception"],"ans":3,"x":"Social perception is the process of combining, integrating and interpreting information about others."},{"id":"N224","part":"B","week":0,"topic":"Organizational Structure","stem":"Which phrase BEST describes organizational structure?","opts":["The yearly profit and loss figures of each department","The formal system of task and authority relationships that controls coordination","The shared values and beliefs of employees","The informal friendships and social networks among employees"],"ans":1,"x":"Structure = formal system of tasks and authority relationships. Shared values = culture."},{"id":"N225","part":"B","week":0,"topic":"Perception","stem":"A manager asks, 'Did Sunita miss the deadline because of her own working style, or because the client changed the requirements?' The manager is engaged in:","opts":["Attribution","Impression management","Perceptual grouping","Stereotyping"],"ans":0,"x":"Attribution = determining causes (internal vs external) behind another's behaviour."},{"id":"N226","part":"B","week":0,"topic":"Emotions & Stress","stem":"After months of excessive workload an employee is exhausted, cynical and sees no meaning in her work. This is best described as:","opts":["Eustress","Mood congruence","Alarm reaction","Burnout"],"ans":3,"x":"Burnout is complete exhaustion after prolonged stress with a loss of meaning; the alarm reaction is only the first stage of the General Adaptation Syndrome."},{"id":"N227","part":"B","week":0,"topic":"Emotions & Stress","stem":"Which statement correctly distinguishes mood from emotion?","opts":["Mood is intense and has a clear object, emotion is diffuse","Mood and emotion are identical terms for the same short-lived feeling","Mood is an unfocused, mild background feeling, whereas emotions usually have an object","Mood is a social emotion based on information external to oneself"],"ans":2,"x":"The course defines mood as unfocused and mild, existing as background to daily experience; emotions most of the time have an object."},{"id":"N228","part":"B","week":0,"topic":"Introduction to OB","stem":"Which of the following is NOT part of the course's definition of an organization?","opts":["Functions on a relatively continuous basis","An identifiable boundary","A consciously coordinated social entity","Exists only to earn profit"],"ans":3,"x":"Organizations pursue a common goal or set of goals, which need not be profit (e.g. UNICEF)."},{"id":"N229","part":"B","week":0,"topic":"Introduction to OB","stem":"A woman's job title is 'Senior Manager - Finance'. Colleagues expect her to mentor juniors, approve budgets on time and represent the team. These expectations are her:","opts":["Task","Designation","Role","Job"],"ans":2,"x":"A role is the social expectation on an individual. A designation is the title, a job a set of tasks, and a task a single unit of work."},{"id":"N230","part":"B","week":0,"topic":"Perception","stem":"Two employees read the same announcement of a merger. One sees an opportunity, the other a threat. Which statement best explains this?","opts":["One of them must be mistaken, since perception is objective","The announcement was ambiguous only because of noise","Perception is an individual's view of reality and is highly subjective","Both used the same attribution pattern"],"ans":2,"x":"The course stresses that perception is subjective: the same stimulus can be organized and interpreted differently."},{"id":"N231","part":"B","week":0,"topic":"Power & Leadership","stem":"A veteran technician can sense that a machine is about to fail but cannot write down the rule she uses. This know-how is best called:","opts":["Procedural justice","Tacit knowledge","Codified (explicit) knowledge","Referent power"],"ans":1,"x":"Tacit knowledge is information or skill one possesses which cannot be recorded or measured easily."},{"id":"N232","part":"B","week":0,"topic":"Introduction to OB","stem":"A consultant observes workers, notes every movement in an assembly task and calculates the average time each step takes. This is a:","opts":["Time and motion study","Bank wiring observation","Job enrichment programme","Hawthorne illumination study"],"ans":0,"x":"Breaking a job into tasks and measuring the average time each takes is a time-and-motion study (Taylor's scientific management)."},{"id":"N233","part":"B","week":0,"topic":"Organizational Culture","stem":"A hobby association whose members join mainly to belong and socialise is most likely to have a culture driven by which motive?","opts":["Power","Affiliation","Security","Achievement"],"ans":1,"x":"Affiliation motive = need to be part of a group; the assignment key linked club culture to affiliation. (Classification beyond the slides.)"},{"id":"N234","part":"B","week":0,"topic":"Introduction to OB","stem":"The control group is the group that receives the experimental change.","opts":["True","False"],"ans":1,"x":"The control group is the group in which no changes are made; the experimental group receives the change.","ns":true},{"id":"N235","part":"B","week":0,"topic":"Emotions & Stress","stem":"Moods usually have a clear object, whereas emotions are diffuse background feelings.","opts":["True","False"],"ans":1,"x":"Reverse: emotions const L = "ABCDEF";

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") e.className = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(x => { if (x == null) return; e.append(x.nodeType ? x : document.createTextNode(String(x))); });
  return e;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function draw(...nodes) { app.replaceChildren(...nodes); window.scrollTo(0, 0); }
const ansList = q => (q.multi ? q.ans : [q.ans]);
const ansText = q => ansList(q).map(a => L[a] + ") " + q.opts[a]).join("; ");
